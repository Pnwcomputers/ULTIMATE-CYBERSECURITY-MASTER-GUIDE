<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="360" viewBox="0 0 1080 360" role="img" aria-labelledby="title desc">
<title id="title">Hardware fit-check workflow</title>
<desc id="desc">Four stages: measure the real object, anchor dimensions to a datum, add clearance and keep-out envelopes, then print and test a small coupon before the full part.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526780"/></marker></defs>
<rect width="1080" height="360" rx="20" fill="#f4f7fb"/>
<text x="36" y="48" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#14324b">Prove fit before printing the full part</text>
<g font-family="Arial,sans-serif" fill="#18344d">
<g transform="translate(28 82)"><rect width="240" height="230" rx="16" fill="#fff" stroke="#b9c9d9" stroke-width="2"/><circle cx="34" cy="35" r="19" fill="#1d6fa5"/><text x="34" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">1</text><text x="64" y="42" font-size="19" font-weight="700">Measure the unit</text><rect x="68" y="92" width="104" height="72" rx="12" fill="#dce8f1" stroke="#45657f" stroke-width="3"/><path d="M58 82v92M182 82v92M58 87h124M58 169h124" stroke="#dc8b2b" stroke-width="3"/><path d="M62 82l-6 8h12zM178 82l-6 8h12zM62 174l-6-8h12zM178 174l-6-8h12z" fill="#dc8b2b"/><text x="120" y="204" text-anchor="middle" font-size="15">Repeat caliper readings;</text><text x="120" y="225" text-anchor="middle" font-size="15">record the largest.</text></g>
<path d="M273 197h34" stroke="#526780" stroke-width="3" marker-end="url(#arrow)"/>
<g transform="translate(310 82)"><rect width="240" height="230" rx="16" fill="#fff" stroke="#b9c9d9" stroke-width="2"/><circle cx="34" cy="35" r="19" fill="#1d6fa5"/><text x="34" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">2</text><text x="64" y="42" font-size="19" font-weight="700">Choose a datum</text><path d="M63 160h128M83 177V91" stroke="#425c73" stroke-width="3"/><path d="M83 160l95-48" stroke="#16837b" stroke-width="8" stroke-linecap="round"/><circle cx="83" cy="160" r="6" fill="#d87824"/><text x="68" y="193" font-size="14">Origin</text><text x="158" y="109" font-size="14">feature location</text><text x="120" y="219" text-anchor="middle" font-size="15">Measure positions from fixed</text><text x="120" y="239" text-anchor="middle" font-size="15">surfaces, not chained features.</text></g>
<path d="M555 197h34" stroke="#526780" stroke-width="3" marker-end="url(#arrow)"/>
<g transform="translate(592 82)"><rect width="240" height="230" rx="16" fill="#fff" stroke="#b9c9d9" stroke-width="2"/><circle cx="34" cy="35" r="19" fill="#1d6fa5"/><text x="34" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">3</text><text x="64" y="42" font-size="19" font-weight="700">Add clearance</text><rect x="68" y="101" width="104" height="58" rx="8" fill="#dce8f1" stroke="#45657f" stroke-width="2"/><rect x="55" y="88" width="130" height="84" rx="12" fill="none" stroke="#e29535" stroke-width="3" stroke-dasharray="7 5"/><text x="120" y="196" text-anchor="middle" font-size="15">Keep-out includes plugs,</text><text x="120" y="217" text-anchor="middle" font-size="15">cables, motion and tolerances.</text></g>
<path d="M837 197h34" stroke="#526780" stroke-width="3" marker-end="url(#arrow)"/>
<g transform="translate(874 82)"><rect width="178" height="230" rx="16" fill="#fff" stroke="#b9c9d9" stroke-width="2"/><circle cx="34" cy="35" r="19" fill="#1d6fa5"/><text x="34" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">4</text><text x="64" y="42" font-size="19" font-weight="700">Test coupon</text><path d="M53 121h72v40H53z" fill="#e6f2ec" stroke="#39815d" stroke-width="3"/><path d="M52 174h74" stroke="#39815d" stroke-width="5"/><text x="89" y="204" text-anchor="middle" font-size="14">Check the fit, then</text><text x="89" y="224" text-anchor="middle" font-size="14">print the full part.</text></g>
</g></svg>
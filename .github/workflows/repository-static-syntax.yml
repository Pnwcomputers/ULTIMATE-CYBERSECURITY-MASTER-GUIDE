name: Repository Static Syntax

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - '**/*.py'
      - '**/*.sh'
      - '**/*.ps1'
      - '**/*.json'
      - '**/*.xml'
      - '**/*.yaml'
      - '**/*.yml'
      - '**/*.go'
      - '**/*.js'
      - '**/*.rb'
      - '**/*.c'
      - '**/*.scad'
      - 'tools/audit_source_formats.py'
      - 'tools/repository_quality_audit.py'
      - '.github/workflows/repository-static-syntax.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maintained-source:
    name: Repository syntax (static only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Python AST & all shell script syntax (no execution)
        run: |
          python3 -B tools/repository_quality_audit.py --strict-syntax \
            --output "$RUNNER_TEMP/repository-static-syntax.md" --max-items 35
          cat "$RUNNER_TEMP/repository-static-syntax.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Parse remaining structured and source formats (no execution)
        run: |
          python3 -B -m unittest discover -s tools/tests -p 'test_source_formats.py' -v
          python3 -B tools/audit_source_formats.py --strict-maintained \
            --output "$RUNNER_TEMP/source-formats.json"

      - name: Archive complete format/syntax results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-format-census-${{ github.run_id }}
          path: ${{ runner.temp }}/source-formats.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Parse PowerShell scripts (no execution)
        shell: pwsh
        run: |
          $errorsFound = @()
          Get-ChildItem -Path Scripts -Filter '*.ps1' -Recurse | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$parseErrors
            ) | Out-Null
            foreach ($issue in $parseErrors) {
              $errorsFound += "$($_.FullName): $($issue.Message)"
            }
          }
          if ($errorsFound.Count -gt 0) {
            $errorsFound | Write-Error
            exit 1
          }
          Write-Host "PowerShell syntax parser passed; no scripts executed."

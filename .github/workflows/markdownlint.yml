name: Markdown Lint

on:
  pull_request:
    paths:
      - '**/*.md'
  workflow_dispatch:   # manual full-repo run

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    name: Lint changed Markdown
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine files to lint
        id: files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Only Markdown changed in this PR — enforce on new content,
            # don't retroactively block on legacy files.
            base="${{ github.event.pull_request.base.sha }}"
            files=$(git diff --name-only --diff-filter=d "$base" HEAD -- '*.md' | tr '\n' ' ')
          else
            files="**/*.md"   # manual dispatch = full repo
          fi
          echo "list=$files" >> "$GITHUB_OUTPUT"
          echo "Linting: ${files:-（none）}"

      - name: Run markdownlint-cli2
        if: steps.files.outputs.list != ''
        uses: DavidAnson/markdownlint-cli2-action@992badcdf24e3b8eb7e87ff9287fe931bcb00c6e # v20.0.0
        with:
          config: '.markdownlint.jsonc'
          globs: ${{ steps.files.outputs.list }}

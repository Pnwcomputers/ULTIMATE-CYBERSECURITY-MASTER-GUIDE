name: Link Check

on:
  pull_request:
    paths:
      - '**/*.md'
  push:
    branches: [main]
    paths:
      - '**/*.md'
  schedule:
    # Weekly full (online) sweep, Mondays 07:00 UTC
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  internal-links:
    # Fast, deterministic gate: checks only local/relative links (no network).
    # Runs on every PR and push so broken internal links block the merge.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Internal links (offline)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check relative/anchor links only
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline
            --include-fragments
            --no-progress
            './**/*.md'
          fail: true
          # Anchor checking (--include-fragments) is enabled: the TOC anchors
          # were audited and corrected to match GitHub's slugification
          # (github-slugger). lychee's slugifier agrees with GitHub - including
          # the leading '-' emoji headings produce and the triple '-' from a
          # literal ' - ' in a heading - so this now guards against regressions.

  external-links:
    # Full online sweep. Informational only (external hosts rate-limit / block
    # bots), so it never fails the build - review the summary in the run log.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: External links (online, informational)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check all links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --max-retries 2
            --accept 200,201,202,206,301,302,401,403,429
            './**/*.md'
          fail: false

name: Duplicate Markdown sections

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'tools/check_duplicate_sections.py'
      - '.github/workflows/duplicate-sections.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  duplicate-sections:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan every Markdown file for same-page repetition
        run: python3 -B tools/check_duplicate_sections.py

name: Guide tool and lab checks

on:
  push:
    paths:
      - 'HardwareTesting/py/full_hw_suite.py'
      - 'installer.sh'
      - 'Scripts/pnwc_install_tools.sh'
      - 'Scripts/**'
      - 'OSINT/Playbook/**'
      - 'IncidentResponse/SIEM/elk_stack.md'
      - 'tests/hardening/**'
      - 'SDR/nanovna/**'
      - 'Data-Engineering/Phase2/**'
      - 'Data-Engineering/Phase3/**'
      - 'tools/**'
      - '.github/workflows/guide-tests.yml'
  pull_request:
    paths:
      - 'HardwareTesting/py/full_hw_suite.py'
      - 'installer.sh'
      - 'Scripts/pnwc_install_tools.sh'
      - 'Scripts/**'
      - 'OSINT/Playbook/**'
      - 'IncidentResponse/SIEM/elk_stack.md'
      - 'tests/hardening/**'
      - 'SDR/nanovna/**'
      - 'Data-Engineering/Phase2/**'
      - 'Data-Engineering/Phase3/**'
      - 'tools/**'
      - '.github/workflows/guide-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Installer syntax
        run: |
          sh -n installer.sh
          bash -n Scripts/pnwc_install_tools.sh
          bash -n Scripts/lib/safe_install.sh
          bash -n OSINT/Playbook/install_dependencies.sh
          bash -n OSINT/Playbook/osint_investigator.sh
          for f in OSINT/Playbook/*.sh OSINT/Playbook/lib/*.sh OSINT/Playbook/scripts/*.sh; do bash -n "$f"; done
      - name: ShellCheck (warnings and above)
        # shellcheck is preinstalled on GitHub's ubuntu runners.
        run: |
          shellcheck -S warning \
            Scripts/lib/safe_install.sh \
            Scripts/pnwc_install_tools.sh \
            OSINT/Playbook/*.sh \
            OSINT/Playbook/lib/*.sh \
            OSINT/Playbook/scripts/*.sh
      - name: Installer, case-state and evidence regressions
        run: python3 -B -m unittest discover -s tests/hardening -v
      - name: Local failure regressions
        run: python3 -B -m unittest discover -s tools/tests -v
      - name: NanoVNA fixtures
        run: bash SDR/nanovna/testdata/run_tests.sh
      - name: Data-engineering labs
        run: python3 -B tools/run_data_labs.py

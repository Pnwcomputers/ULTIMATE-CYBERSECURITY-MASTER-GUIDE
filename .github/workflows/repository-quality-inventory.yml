name: Repository Quality Inventory

on:
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * 1'
  pull_request:
    paths:
      - '**/*.md'
      - '**/*.py'
      - '**/*.sh'
      - '**/*.ps1'
      - 'tools/repository_quality_audit.py'
      - '.github/workflows/repository-quality-inventory.yml'

permissions:
  contents: read

jobs:
  offline-audit:
    name: Offline syntax and completeness candidates (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate static candidate report
        run: |
          python3 -B tools/repository_quality_audit.py \
            --output "$RUNNER_TEMP/repository-quality-report.md" \
            --max-items 120
          cat "$RUNNER_TEMP/repository-quality-report.md" >> "$GITHUB_STEP_SUMMARY"

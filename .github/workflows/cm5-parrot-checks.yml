name: CM5 setup checks

on:
  push:
    paths:
      - 'uConsole/scripts/uconsole-cm5*.sh'
      - 'uConsole/tests/**'
      - '.github/workflows/cm5-parrot-checks.yml'
  pull_request:
    paths:
      - 'uConsole/scripts/uconsole-cm5*.sh'
      - 'uConsole/tests/**'
      - '.github/workflows/cm5-parrot-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check Bash syntax
        run: |
          bash -n uConsole/scripts/uconsole-cm5-setup.sh
          bash -n uConsole/scripts/uconsole-cm5-parrot-setup.sh
      - name: Run isolated regression tests
        run: python3 -B -m unittest discover -s uConsole/tests -v

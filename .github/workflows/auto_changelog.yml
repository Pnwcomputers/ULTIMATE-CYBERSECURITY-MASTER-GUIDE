name: Auto-Generate CHANGELOG

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'CHANGELOG.md'
      - 'DRAFT_CHANGELOG.md'
      - '.github/**'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-changelog:
    runs-on: ubuntu-latest
    name: Generate CHANGELOG.md pull request

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate CHANGELOG.md
        run: python generate_changelog.py --all --output CHANGELOG.md

      # `main` is protected by a repository ruleset, so this workflow cannot
      # push to it directly (GH013 "Cannot update this protected ref"). The
      # regenerated CHANGELOG.md lands as a pull request instead. Reusing a
      # fixed branch means repeat runs update the open PR rather than stacking
      # up new ones. No-ops are handled by the action - if CHANGELOG.md is
      # unchanged, no branch or PR is created.
      - name: Open pull request if changed
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: CHANGELOG.md
          branch: chore/auto-changelog
          delete-branch: true
          commit-message: 'chore: auto-update CHANGELOG.md'
          author: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          committer: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          title: 'chore: auto-update CHANGELOG.md'
          body: |
            Regenerated by the **Auto-Generate CHANGELOG** workflow
            (`python generate_changelog.py --all --output CHANGELOG.md`).

            `main` is protected by a repository ruleset, so the changelog is
            proposed here instead of being pushed directly.

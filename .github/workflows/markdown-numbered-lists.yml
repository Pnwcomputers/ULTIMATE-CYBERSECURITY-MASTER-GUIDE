name: Markdown numbered list integrity

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numbered-lists:
    name: Numbered lists
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit all Markdown numbered lists and navigation
        run: python3 -B tools/check_markdown_numbered_lists.py

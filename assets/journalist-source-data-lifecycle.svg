<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 746" role="img" aria-labelledby="title desc">
<title id="title">Journalist and confidential-source data protection lifecycle</title>
<desc id="desc">Risk-assess and minimize sensitive data before collecting it, securely handle and segregate copies during reporting, review retention and legal holds before any authorized disposal. If a person is under threat or a device is seized, prioritize safety, counsel and evidence preservation rather than panic deletion.</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#38bdf8"/></marker></defs>
<rect width="1280" height="746" rx="20" fill="#0b1223"/>
<g font-family="Arial,sans-serif">
<text x="40" y="55" fill="#f8fafc" font-size="32" font-weight="700">Journalist &amp; source-data protection lifecycle</text>
<text x="40" y="84" fill="#a7b9d4" font-size="17">Minimize before risk • protect source identities • preserve what must legally be retained</text>
<g fill="#183047" stroke="#5181a3" stroke-width="2">
<rect x="42" y="129" width="270" height="180" rx="15"/><rect x="351" y="129" width="270" height="180" rx="15"/><rect x="660" y="129" width="270" height="180" rx="15"/><rect x="969" y="129" width="270" height="180" rx="15"/>
</g>
<g fill="#f8fafc" font-size="22" font-weight="700">
<text x="66" y="167">1  Plan</text><text x="375" y="167">2  Collect</text><text x="684" y="167">3  Protect</text><text x="993" y="167">4  Review</text>
</g>
<g fill="#d1e3f2" font-size="17">
<text x="66" y="205">Threat model and</text><text x="66" y="230">source-safety plan</text><text x="66" y="255">Set collection limits</text>
<text x="375" y="205">Receive only needed</text><text x="375" y="230">data and metadata</text><text x="375" y="255">Use safe intake paths</text>
<text x="684" y="205">Encrypt and segregate</text><text x="684" y="230">Restrict access and sync</text><text x="684" y="255">Test recoverable backups</text>
<text x="993" y="205">Apply editorial schedule</text><text x="993" y="230">Check legal holds</text><text x="993" y="255">Approve disposition</text>
</g>
<g stroke="#38bdf8" stroke-width="3" fill="none" marker-end="url(#a)">
<path d="M312 219H345"/><path d="M621 219H654"/><path d="M930 219H963"/>
</g>
<text x="41" y="375" font-size="23" font-weight="700" fill="#7dd3fc">Disposition decision (after policy review)</text>
<path d="M640 325V389" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/>
<rect x="450" y="394" width="380" height="75" rx="13" fill="#1e3a57" stroke="#7dd3fc" stroke-width="2"/>
<text x="476" y="425" font-size="19" font-weight="700" fill="#fff">Legal hold or retention duty?</text>
<text x="476" y="450" font-size="16" fill="#d1e3f2">Escalate questions to qualified counsel</text>
<path d="M450 431H316V508" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/>
<path d="M830 431H968V508" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/>
<text x="318" y="419" fill="#fbbf24" font-size="17" font-weight="700">YES / uncertain</text><text x="848" y="419" fill="#86efac" font-size="17" font-weight="700">NO / approved</text>
<rect x="45" y="514" width="533" height="96" rx="14" fill="#3d3022" stroke="#fbbf24" stroke-width="2"/>
<text x="68" y="548" font-size="21" font-weight="700" fill="#fde68a">Preserve and restrict access</text>
<text x="68" y="579" font-size="17" fill="#fef3c7">Document custody and obtain legal advice</text>
<rect x="699" y="514" width="538" height="96" rx="14" fill="#193b32" stroke="#34d399" stroke-width="2"/>
<text x="722" y="548" font-size="21" font-weight="700" fill="#a7f3d0">Authorized lifecycle disposal</text>
<text x="722" y="579" font-size="17" fill="#d1fae5">Use appropriate method; verify and log outcome</text>
<rect x="40" y="646" width="1199" height="61" rx="14" fill="#49212f" stroke="#fb7185" stroke-width="2"/>
<text x="62" y="671" font-size="19" font-weight="700" fill="#fecdd3">If threatened, detained, or a device is seized:</text>
<text x="62" y="696" font-size="17" fill="#ffe4e6">Prioritize personal safety, contact counsel/editor, preserve required records; do not improvise a panic wipe.</text>
</g>
</svg>
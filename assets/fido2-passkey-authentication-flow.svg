<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" role="img" aria-labelledby="title desc">
<title id="title">FIDO2 and passkey registration and sign-in</title>
<desc id="desc">Three parties: relying party, browser and operating system, hardware authenticator. During registration the authenticator creates a private credential and returns a public key to the service. During authentication the service issues a new challenge and verifies the signed response. Origin binding, presence, and optional user verification are shown.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#38bdf8"/></marker></defs>
<rect width="1240" height="700" rx="20" fill="#0b1223"/>
<text x="40" y="55" font-size="32" font-weight="700" font-family="Arial,sans-serif" fill="#f8fafc">FIDO2 / WebAuthn • passkey lifecycle</text>
<text x="40" y="85" font-size="17" font-family="Arial,sans-serif" fill="#a7b9d4">Conceptual flow • keys are not general-purpose encrypted USB storage</text>
<g font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#e2e8f0">
<rect x="40" y="111" width="350" height="70" rx="14" fill="#1e3a57" stroke="#38bdf8"/><text x="64" y="154">1  Service (relying party)</text>
<rect x="445" y="111" width="350" height="70" rx="14" fill="#1e3a57" stroke="#38bdf8"/><text x="477" y="154">2  Browser / OS</text>
<rect x="850" y="111" width="350" height="70" rx="14" fill="#1e3a57" stroke="#38bdf8"/><text x="885" y="154">3  Security key</text>
</g>
<g font-family="Arial,sans-serif" fill="#e2e8f0">
<text x="42" y="226" font-size="25" font-weight="700" fill="#7dd3fc">A  Registration</text>
<rect x="40" y="243" width="350" height="116" rx="12" fill="#14253c" stroke="#3b5675"/>
<text x="60" y="275" font-size="19" font-weight="700">Requests a credential</text><text x="60" y="304" font-size="16">Receives public credential key</text><text x="60" y="330" font-size="16">Stores public key and credential ID</text>
<rect x="445" y="243" width="350" height="116" rx="12" fill="#14253c" stroke="#3b5675"/>
<text x="465" y="275" font-size="19" font-weight="700">Checks website origin</text><text x="465" y="304" font-size="16">Mediates RP ID and authenticator</text><text x="465" y="330" font-size="16">Returns registration response</text>
<rect x="850" y="243" width="350" height="116" rx="12" fill="#14253c" stroke="#3b5675"/>
<text x="870" y="275" font-size="19" font-weight="700">Creates credential</text><text x="870" y="304" font-size="16">Protects the private credential</text><text x="870" y="330" font-size="16">Exports public credential data</text>
<path d="M390 300H440" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M795 300H845" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
<text x="42" y="411" font-size="25" font-weight="700" fill="#7dd3fc">B  Sign-in</text>
<rect x="40" y="430" width="350" height="135" rx="12" fill="#14253c" stroke="#3b5675"/>
<text x="60" y="463" font-size="19" font-weight="700">Sends a fresh challenge</text><text x="60" y="494" font-size="16">Verifies signed response</text><text x="60" y="523" font-size="16">Checks RP and policy requirements</text>
<rect x="445" y="430" width="350" height="135" rx="12" fill="#14253c" stroke="#3b5675"/>
<text x="465" y="463" font-size="19" font-weight="700">Enforces origin binding</text><text x="465" y="494" font-size="16">Routes authenticator operation</text><text x="465" y="523" font-size="16">Returns signed assertion</text>
<rect x="850" y="430" width="350" height="135" rx="12" fill="#14253c" stroke="#3b5675"/>
<text x="870" y="463" font-size="19" font-weight="700">Signs the challenge</text><text x="870" y="494" font-size="16">Requires user presence</text><text x="870" y="523" font-size="16">PIN/biometric if UV required</text>
<path d="M390 496H440" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M795 496H845" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="40" y="603" width="1160" height="57" rx="12" fill="#19352f" stroke="#34d399"/>
<text x="60" y="626" font-size="17" font-weight="700" fill="#a7f3d0">Protection:</text><text x="175" y="626" font-size="17" fill="#d1fae5">Origin-bound asymmetric authentication; no reusable password-like shared secret at the service.</text>
<text x="60" y="648" font-size="15" fill="#d1fae5">Limit: compromised endpoints, weak account recovery, or stolen active sessions remain risks.</text>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
<title id="title">Autopsy and KAPE evidence workflows</title>
<desc id="desc">Two distinct forensic paths. A write-protected, authorized acquisition produces a verified disk image for Autopsy analysis. A live or mounted source can instead be selectively collected by KAPE, which may cause target writes and does not by itself create a full disk image; selected output can be parsed or added to Autopsy as logical files.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#9fb4cc"/></marker></defs>
<rect width="1440" height="760" rx="20" fill="#0b1223"/><g font-family="Arial,Helvetica,sans-serif">
<text x="42" y="56" fill="#f8fafc" font-size="32" font-weight="700">Two workflows, different evidence coverage</text>
<text x="42" y="91" fill="#b8cbe0" font-size="18">Choose the path that preserves the evidence needed for the question being investigated.</text>
<text x="42" y="151" fill="#93c5fd" font-size="21" font-weight="700">A. Disk-level acquisition and analysis</text>
<g fill="#172d41" stroke="#60a5fa" stroke-width="2">
<rect x="48" y="180" width="340" height="116" rx="14"/><rect x="548" y="180" width="340" height="116" rx="14"/><rect x="1048" y="180" width="340" height="116" rx="14"/>
</g>
<g fill="#f8fafc" font-size="18" font-weight="700">
<text x="73" y="221">Authorized source</text><text x="73" y="252" fill="#d1e1f0" font-size="16" font-weight="400">Write-protected workflow where</text><text x="73" y="275" fill="#d1e1f0" font-size="16" font-weight="400">appropriate; document conditions</text>
<text x="573" y="221">Forensic acquisition</text><text x="573" y="252" fill="#d1e1f0" font-size="16" font-weight="400">Use an appropriate imaging tool;</text><text x="573" y="275" fill="#d1e1f0" font-size="16" font-weight="400">record and verify hashes</text>
<text x="1073" y="221">Autopsy image case</text><text x="1073" y="252" fill="#d1e1f0" font-size="16" font-weight="400">Configure ingest; preserve the</text><text x="1073" y="275" fill="#d1e1f0" font-size="16" font-weight="400">source image and case context</text>
</g>
<g stroke="#9fb4cc" stroke-width="3" marker-end="url(#arrow)"><path d="M393 238h145"/><path d="M893 238h145"/></g>
<text x="42" y="362" fill="#c4b5fd" font-size="21" font-weight="700">B. Selective artifact triage and logical-file analysis</text>
<g fill="#211c3a" stroke="#a78bfa" stroke-width="2">
<rect x="48" y="390" width="300" height="112" rx="14"/><rect x="430" y="390" width="300" height="112" rx="14"/><rect x="812" y="390" width="260" height="112" rx="14"/><rect x="1150" y="390" width="238" height="112" rx="14"/>
</g>
<g fill="#f8fafc" font-size="17" font-weight="700">
<text x="72" y="430">Live or mounted source</text><text x="72" y="460" fill="#d1e1f0" font-size="15" font-weight="400">Choose targets; account for</text><text x="72" y="482" fill="#d1e1f0" font-size="15" font-weight="400">collection gaps and side effects</text>
<text x="454" y="430">KAPE collection</text><text x="454" y="460" fill="#d1e1f0" font-size="15" font-weight="400">Selected artifacts only;</text><text x="454" y="482" fill="#d1e1f0" font-size="15" font-weight="400">not a full disk image</text>
<text x="836" y="430">KAPE modules</text><text x="836" y="460" fill="#d1e1f0" font-size="15" font-weight="400">Process collected</text><text x="836" y="482" fill="#d1e1f0" font-size="15" font-weight="400">artifacts if needed</text>
<text x="1170" y="430">Autopsy logical files</text><text x="1170" y="460" fill="#d1e1f0" font-size="15" font-weight="400">Analyze collected files;</text><text x="1170" y="482" fill="#d1e1f0" font-size="15" font-weight="400">no unallocated space</text>
</g>
<g stroke="#9fb4cc" stroke-width="3" marker-end="url(#arrow)"><path d="M353 446h68"/><path d="M735 446h69"/><path d="M1077 446h65"/></g>
<rect x="48" y="548" width="1340" height="145" rx="14" fill="#34251a" stroke="#fbbf24" stroke-width="2"/>
<text x="76" y="588" fill="#fcd34d" font-size="20" font-weight="700">Coverage and preservation limits</text>
<text x="76" y="622" fill="#f1f5f9" font-size="17">• KAPE targets and modules define selected artifacts; omissions are possible.</text>
<text x="76" y="651" fill="#f1f5f9" font-size="17">• Live collection may write to the target depending on how the workflow is configured.</text>
<text x="76" y="680" fill="#f1f5f9" font-size="17">• Autopsy results depend on source type and configured ingest modules; logical collections do not include unallocated space.</text>
</g></svg>
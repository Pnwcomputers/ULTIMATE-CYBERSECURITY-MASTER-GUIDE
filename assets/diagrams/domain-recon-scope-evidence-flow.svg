<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 650" role="img" aria-labelledby="title desc">
<title id="title">Domain reconnaissance scope and source evidence flow</title>
<desc id="desc">A human confirms one exact domain is in written scope. Queries to certificate transparency, registration, DNS, and reverse-IP providers may disclose the domain and return incomplete leads. Results are minimized and labeled with provider, timestamp, and confidence. An active HTTP header request is a separate step and runs only after explicit approval for the exact host. An analyst verifies ownership and decides whether any follow-up is separately in scope. No output establishes a complete attack surface or vulnerability.</desc>
<defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#17324d}.title{font-size:30px;font-weight:700}.sub{font-size:18px;fill:#435a72}.gate{fill:#eef5ff;stroke:#4e78a3;stroke-width:2}.source{fill:#f3f0ff;stroke:#7763a5;stroke-width:2}.data{fill:#fff7e8;stroke:#c39339;stroke-width:2}.active{fill:#ffefee;stroke:#c45a53;stroke-width:2}.verify{fill:#eaf7f0;stroke:#548d68;stroke-width:2}.human{fill:#eff5fa;stroke:#496982;stroke-width:2}.step{font-size:13px;font-weight:700;letter-spacing:1px;fill:#5d7083}.head{font-size:18px;font-weight:700}.body{font-size:14px}.arrow{stroke:#486883;stroke-width:3;fill:none;marker-end:url(#arrow)}.branch{stroke:#a14a43;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#arrowRed)}.foot{font-size:16px;font-weight:700;fill:#fff}</style><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#486883"/></marker><marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a14a43"/></marker></defs>
<rect width="1450" height="650" fill="#f5f8fc"/>
<text x="725" y="48" text-anchor="middle" class="title">DomainRecon: scope first, leads with provenance</text>
<text x="725" y="78" text-anchor="middle" class="sub">Public-source results are incomplete leads; an HTTP request is a separate active check.</text>
<rect x="28" y="145" width="220" height="255" rx="16" class="gate"/><text x="48" y="177" class="step">1 · SCOPE</text><text x="48" y="215" class="head">Confirm one domain</text><text x="48" y="250" class="body"><tspan x="48">Human checks written scope</tspan><tspan x="48" dy="21">and source permissions.</tspan><tspan x="48" dy="31">Do not expand targets from</tspan><tspan x="48" dy="21">discovered names.</tspan></text>
<path d="M248 273H276" class="arrow"/>
<rect x="284" y="145" width="245" height="255" rx="16" class="source"/><text x="304" y="177" class="step">2 · PUBLIC-SOURCE LOOKUPS</text><text x="304" y="215" class="head">CT / registration / DNS</text><text x="304" y="250" class="body"><tspan x="304">Provider may receive the</tspan><tspan x="304" dy="21">queried domain.</tspan><tspan x="304" dy="31">Coverage varies; reverse-IP</tspan><tspan x="304" dy="21">may show shared hosting.</tspan></text>
<path d="M529 273H557" class="arrow"/>
<rect x="565" y="145" width="220" height="255" rx="16" class="data"/><text x="585" y="177" class="step">3 · LABEL RESULTS</text><text x="585" y="215" class="head">Preserve provenance</text><text x="585" y="250" class="body"><tspan x="585">Source, query time,</tspan><tspan x="585" dy="21">observation and limits.</tspan><tspan x="585" dy="31">Names and addresses are</tspan><tspan x="585" dy="21">unverified leads.</tspan></text>
<path d="M785 273H813" class="arrow"/>
<rect x="821" y="145" width="220" height="255" rx="16" class="verify"/><text x="841" y="177" class="step">4 · HUMAN CHECK</text><text x="841" y="215" class="head">Verify ownership</text><text x="841" y="250" class="body"><tspan x="841">Compare each exact host</tspan><tspan x="841" dy="21">with scope and owner records.</tspan><tspan x="841" dy="31">No claim of complete</tspan><tspan x="841" dy="21">inventory or vulnerability.</tspan></text>
<path d="M1041 273H1069" class="branch"/>
<rect x="1077" y="145" width="345" height="115" rx="16" class="active"/><text x="1097" y="177" class="step">OPTIONAL · ACTIVE HTTP CHECK</text><text x="1097" y="211" class="body"><tspan x="1097">Only after separate approval for the exact host;</tspan><tspan x="1097" dy="21">may be logged by the host or service provider.</tspan></text>
<path d="M1249 260V300" class="branch"/>
<rect x="1077" y="310" width="345" height="90" rx="16" class="human"/><text x="1097" y="343" class="head">Analyst decides follow-up</text><text x="1097" y="373" class="body">Any new test needs its own written scope.</text>
<rect x="28" y="465" width="1394" height="92" rx="15" fill="#16324d"/><text x="725" y="504" text-anchor="middle" class="foot">Do not treat CT records, reverse-IP results, WHOIS/RDAP data, or headers as proof of ownership or risk.</text><text x="725" y="533" text-anchor="middle" class="foot">Do not rank development or administrative hosts as targets; do not scan, test, or expand scope from discovery alone.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Receive, preserve, then interpret the signal</title>
<desc id="desc">A matching RF frontend produces complex IQ samples. Preserve the samples and format metadata, filter and demodulate a working copy, then infer symbols and packets. A file suffix does not specify the sample representation.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
<path d="M0 0 L10 5 L0 10Z" fill="#337b98"/>
</marker>
</defs>
<rect width="1200" height="600" fill="#f4f7fa"/>
<text x="40" y="54" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#16354b">Receive, preserve, then interpret the signal</text>
<text x="40" y="89" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Conceptual IQ workflow • receive path only • no transmit sink</text>
<rect x="40" y="158" width="250" height="216" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/>
<text x="58" y="192" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16354b">RF frontend</text>
<text x="58" y="230" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Band / antenna match</text>
<text x="58" y="260" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Supported bandwidth</text>
<path d="M298 265 L319 265" stroke="#337b98" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
<rect x="330" y="158" width="250" height="216" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/>
<text x="348" y="192" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16354b">IQ recording</text>
<text x="348" y="230" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">I and Q sample stream</text>
<text x="348" y="260" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Format + rate + gains</text>
<path d="M588 265 L609 265" stroke="#337b98" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
<rect x="620" y="158" width="250" height="216" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/>
<text x="638" y="192" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16354b">DSP working copy</text>
<text x="638" y="230" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Filter / decimate</text>
<text x="638" y="260" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Demodulate</text>
<path d="M878 265 L899 265" stroke="#337b98" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
<rect x="910" y="158" width="250" height="216" rx="16" fill="#fff3d7" stroke="#b5cbd7" stroke-width="2"/>
<text x="928" y="192" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16354b">Interpretation</text>
<text x="928" y="230" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Symbols → candidate fields</text>
<text x="928" y="260" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Validate hypotheses</text>
<rect x="40" y="480" width="1120" height="86" rx="12" fill="#e0ebf1"/>
<text x="58" y="510" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">hackrf_transfer writes signed 8-bit IQ; a GNU Radio complex File Sink commonly writes complex float32.</text>
<text x="58" y="539" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Record the actual data type and I/Q layout. Renaming a file does not convert its samples.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc"><title id="title">Active Directory: Ticket Trust &amp; Recovery</title><desc id="desc">Kerberos ticket use depends on KDC signing/encryption keys and service tickets. Forged TGT risk arises from compromise of KRBTGT material; recovery requires coordinated key rotation and detection review.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#80d7f7"/></marker></defs><rect width="1440" height="810" rx="19" fill="#0d1a2b"/><g font-family="Arial,Helvetica,sans-serif"><text x="36" y="56" font-size="29" font-weight="700" fill="#f8fcff">Active Directory: Ticket Trust &amp; Recovery</text><text x="36" y="90" font-size="18" fill="#c2d7e6">Defensive conceptual trust map: not a ticket-forging procedure.</text><path d="M36 118H1404" stroke="#354f69" stroke-width="2"/><rect x="48" y="157" width="364" height="170" rx="14" fill="#1a3049" stroke="#80d7f7" stroke-width="2.3"/><text x="66" y="199" font-size="21" font-weight="700" fill="#f9fdff">Domain account</text><text x="66" y="241" font-size="17" fill="#d8e9f4">Legitimate authentication</text><text x="66" y="274" font-size="17" fill="#d8e9f4">Requests ticket from KDC</text><rect x="524" y="157" width="390" height="170" rx="14" fill="#1a3049" stroke="#a8aafa" stroke-width="2.3"/><text x="542" y="199" font-size="21" font-weight="700" fill="#f9fdff">Domain controller / KDC</text><text x="542" y="241" font-size="17" fill="#d8e9f4">KRBTGT secures TGT issuance</text><text x="542" y="274" font-size="17" fill="#d8e9f4">Service-account keys protect TGS</text><rect x="1022" y="157" width="366" height="170" rx="14" fill="#1a3049" stroke="#71dfb8" stroke-width="2.3"/><text x="1040" y="199" font-size="21" font-weight="700" fill="#f9fdff">Service endpoint</text><text x="1040" y="241" font-size="17" fill="#d8e9f4">Receives service ticket</text><text x="1040" y="274" font-size="17" fill="#d8e9f4">Enforces authorization too</text><path d="M413 244H516" fill="none" stroke="#80d7f7" stroke-width="3" marker-end="url(#arr)"/><path d="M915 244H1013" fill="none" stroke="#80d7f7" stroke-width="3" marker-end="url(#arr)"/><rect x="90" y="407" width="596" height="158" rx="14" fill="#1a3049" stroke="#edc787" stroke-width="2.3"/><text x="108" y="449" font-size="21" font-weight="700" fill="#f9fdff">Detection &amp; scope</text><text x="108" y="491" font-size="17" fill="#d8e9f4">Review privileged secret exposure</text><text x="108" y="524" font-size="17" fill="#d8e9f4">Correlate DC and endpoint events</text><rect x="754" y="407" width="596" height="158" rx="14" fill="#1a3049" stroke="#71dfb8" stroke-width="2.3"/><text x="772" y="449" font-size="21" font-weight="700" fill="#f9fdff">Key recovery &amp; verification</text><text x="772" y="491" font-size="17" fill="#d8e9f4">Rotate KRBTGT safely as directed</text><text x="772" y="524" font-size="17" fill="#d8e9f4">Recheck tickets, sessions and alerts</text><path d="M718 327V374H385V399" fill="none" stroke="#80d7f7" stroke-width="3" marker-end="url(#arr)"/><path d="M718 327V374H1051V399" fill="none" stroke="#80d7f7" stroke-width="3" marker-end="url(#arr)"/><rect x="36" y="646" width="1368" height="89" rx="12" fill="#3b3126" stroke="#ecc37d" stroke-width="2"/><text x="55" y="680" font-size="21" font-weight="700" fill="#ffebc2">Golden Ticket is not 'unkillable' by definition</text><text x="55" y="712" font-size="17" fill="#f3e3c7">Protect privileged secrets, coordinate double KRBTGT rotation with Microsoft guidance and retest.</text><text x="39" y="785" font-size="15" fill="#b8cdde">Conceptual Kerberos trust graph. Other AD abuse techniques have separate prerequisites and telemetry.</text></g></svg>
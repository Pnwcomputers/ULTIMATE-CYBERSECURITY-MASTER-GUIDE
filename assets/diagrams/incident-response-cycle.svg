<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 565" role="img" aria-labelledby="title desc"><title id="title">Incident response decision cycle</title><desc id="desc">Triage, contain, eradicate and restore with accountable evidence handling. Prepare: Assets and owners: Baseline telemetry: Response contacts; Detect: Monitor alerts: Validate indicators: Build chronology; Contain: Assess impact: Restrict spread: Preserve evidence; Recover: Remediate cause: Verify systems: Monitor recurrence; Improve: Lessons learned: Update controls: Practice playbooks. Containment may affect operations; document decision authority and preserve evidence before destructive changes.</desc><defs><marker id="arr" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#d6edfb"/></marker></defs><rect width="1240" height="565" rx="20" fill="#0b1223"/><g font-family="Arial,Helvetica,sans-serif"><text x="35" y="58" font-size="31" font-weight="700" fill="#f8fafc">Incident response decision cycle</text><text x="35" y="92" font-size="17" fill="#b8cbe0">Triage, contain, eradicate and restore with accountable evidence handling</text><rect x="35" y="158" width="219.6" height="258" rx="15" fill="#172d41" stroke="#fb7185" stroke-opacity=".7" stroke-width="2"/><circle cx="64" cy="191" r="18" fill="#fb7185"/><text x="64" y="197" font-size="18" font-weight="700" fill="#051320" text-anchor="middle">1</text><text x="51" y="240" font-size="18" font-weight="700" fill="#f8fafc">Prepare</text><text x="51" y="280" font-size="15" fill="#d1e1f0">Assets and owners</text><text x="51" y="312" font-size="15" fill="#d1e1f0">Baseline telemetry</text><text x="51" y="344" font-size="15" fill="#d1e1f0">Response contacts</text><path d="M255.6 292h13" stroke="#d6edfb" stroke-width="2.5" marker-end="url(#arr)"/><rect x="272.6" y="158" width="219.6" height="258" rx="15" fill="#172d41" stroke="#fb7185" stroke-opacity=".7" stroke-width="2"/><circle cx="301.6" cy="191" r="18" fill="#fb7185"/><text x="301.6" y="197" font-size="18" font-weight="700" fill="#051320" text-anchor="middle">2</text><text x="288.6" y="240" font-size="18" font-weight="700" fill="#f8fafc">Detect</text><text x="288.6" y="280" font-size="15" fill="#d1e1f0">Monitor alerts</text><text x="288.6" y="312" font-size="15" fill="#d1e1f0">Validate indicators</text><text x="288.6" y="344" font-size="15" fill="#d1e1f0">Build chronology</text><path d="M493.20000000000005 292h13" stroke="#d6edfb" stroke-width="2.5" marker-end="url(#arr)"/><rect x="510.2" y="158" width="219.6" height="258" rx="15" fill="#172d41" stroke="#fb7185" stroke-opacity=".7" stroke-width="2"/><circle cx="539.2" cy="191" r="18" fill="#fb7185"/><text x="539.2" y="197" font-size="18" font-weight="700" fill="#051320" text-anchor="middle">3</text><text x="526.2" y="240" font-size="18" font-weight="700" fill="#f8fafc">Contain</text><text x="526.2" y="280" font-size="15" fill="#d1e1f0">Assess impact</text><text x="526.2" y="312" font-size="15" fill="#d1e1f0">Restrict spread</text><text x="526.2" y="344" font-size="15" fill="#d1e1f0">Preserve evidence</text><path d="M730.8 292h13" stroke="#d6edfb" stroke-width="2.5" marker-end="url(#arr)"/><rect x="747.8" y="158" width="219.6" height="258" rx="15" fill="#172d41" stroke="#fb7185" stroke-opacity=".7" stroke-width="2"/><circle cx="776.8" cy="191" r="18" fill="#fb7185"/><text x="776.8" y="197" font-size="18" font-weight="700" fill="#051320" text-anchor="middle">4</text><text x="763.8" y="240" font-size="18" font-weight="700" fill="#f8fafc">Recover</text><text x="763.8" y="280" font-size="15" fill="#d1e1f0">Remediate cause</text><text x="763.8" y="312" font-size="15" fill="#d1e1f0">Verify systems</text><text x="763.8" y="344" font-size="15" fill="#d1e1f0">Monitor recurrence</text><path d="M968.4 292h13" stroke="#d6edfb" stroke-width="2.5" marker-end="url(#arr)"/><rect x="985.4" y="158" width="219.6" height="258" rx="15" fill="#172d41" stroke="#fb7185" stroke-opacity=".7" stroke-width="2"/><circle cx="1014.4" cy="191" r="18" fill="#fb7185"/><text x="1014.4" y="197" font-size="18" font-weight="700" fill="#051320" text-anchor="middle">5</text><text x="1001.4" y="240" font-size="18" font-weight="700" fill="#f8fafc">Improve</text><text x="1001.4" y="280" font-size="15" fill="#d1e1f0">Lessons learned</text><text x="1001.4" y="312" font-size="15" fill="#d1e1f0">Update controls</text><text x="1001.4" y="344" font-size="15" fill="#d1e1f0">Practice playbooks</text><rect x="35" y="452" width="1170" height="83" rx="12" fill="#20374b" stroke="#fb7185"/><text x="55" y="485" fill="#fb7185" font-size="20" font-weight="700">Security boundary / validation</text><text x="55" y="510" fill="#e1edf6" font-size="16">Containment may affect operations; document decision authority and preserve evidence before destructive changes.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" role="img" aria-labelledby="title desc"><title id="title">osquery: Interactive Snapshot vs Scheduled Deltas</title><desc id="desc">osqueryi returns an ad hoc snapshot of queried endpoint state, while osqueryd executes scheduled queries and may log added/removed rows. Event-based tables require their own supported setup.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#8ed9f5"/></marker></defs><rect width="1440" height="780" rx="18" fill="#0c1a2a"/><g font-family="Arial,Helvetica,sans-serif"><text x="38" y="56" font-size="29" font-weight="700" fill="#f7faff">osquery: Interactive Snapshot vs Scheduled Deltas</text><text x="38" y="91" font-size="18" fill="#bdd3e6">Query schedules and collectors must be configured; results are not an automatic complete event history.</text><path d="M38 115H1402" stroke="#38546d" stroke-width="2"/><rect x="38" y="163" width="410" height="182" rx="14" fill="#1a3048" stroke="#80d5f1" stroke-width="2.4"/><text x="56" y="204" font-size="21" font-weight="700" fill="#f5faff">Analyst: osqueryi</text><text x="56" y="244" font-size="18" fill="#d6e6f2">Run ad hoc SQL</text><text x="56" y="278" font-size="18" fill="#d6e6f2">View current result table</text><text x="56" y="312" font-size="18" fill="#d6e6f2">No schedule implied</text><rect x="509" y="163" width="408" height="182" rx="14" fill="#1a3048" stroke="#b8a9fb" stroke-width="2.4"/><text x="527" y="204" font-size="21" font-weight="700" fill="#f5faff">Host: osqueryd</text><text x="527" y="244" font-size="18" fill="#d6e6f2">Scheduled queries &amp; packs</text><text x="527" y="278" font-size="18" fill="#d6e6f2">Differential or snapshot output</text><text x="527" y="312" font-size="18" fill="#d6e6f2">Watch query CPU / intervals</text><rect x="979" y="163" width="424" height="182" rx="14" fill="#1a3048" stroke="#72dcbb" stroke-width="2.4"/><text x="997" y="204" font-size="21" font-weight="700" fill="#f5faff">Endpoint state</text><text x="997" y="244" font-size="18" fill="#d6e6f2">Processes, users &amp; sockets</text><text x="997" y="278" font-size="18" fill="#d6e6f2">State can change between reads</text><text x="997" y="312" font-size="18" fill="#d6e6f2">Event tables are separate</text><path d="M449 252H500" stroke="#8ed9f5" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M918 252H971" stroke="#8ed9f5" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="237" y="448" width="468" height="143" rx="14" fill="#1a3048" stroke="#80d5f1" stroke-width="2.4"/><text x="255" y="489" font-size="21" font-weight="700" fill="#f5faff">Result logs / logger plugin</text><text x="255" y="529" font-size="18" fill="#d6e6f2">JSON event + status streams</text><text x="255" y="563" font-size="18" fill="#d6e6f2">Check log format, path and rotation</text><rect x="754" y="448" width="468" height="143" rx="14" fill="#1a3048" stroke="#edca86" stroke-width="2.4"/><text x="772" y="489" font-size="21" font-weight="700" fill="#f5faff">Forwarding &amp; SIEM</text><text x="772" y="529" font-size="18" fill="#d6e6f2">Validate collection and parsing</text><text x="772" y="563" font-size="18" fill="#d6e6f2">Confirm index/search availability</text><path d="M713 345V383H473V440" stroke="#8ed9f5" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M705 519H746" stroke="#8ed9f5" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="38" y="641" width="1364" height="85" rx="13" fill="#3a3227" stroke="#ebc883" stroke-width="2"/><text x="58" y="675" font-size="20" font-weight="700" fill="#fff0c6">A polling query is not complete continuous monitoring</text><text x="58" y="706" font-size="17" fill="#f4e3c9">Missed short-lived processes and connections remain possible; use other telemetry where needed.</text><text x="39" y="758" font-size="15" fill="#b6cde0">See the official osquery logging documentation for differential and snapshot mode semantics.</text></g></svg>
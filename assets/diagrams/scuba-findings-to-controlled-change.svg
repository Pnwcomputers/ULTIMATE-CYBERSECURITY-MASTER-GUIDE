<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc">
<title id="title">A report finding is the start of a controlled decision</title>
<desc id="desc">A reviewer verifies the control evidence, makes a risk and exception decision, then plans separately approved changes and retesting. A tool error or missing scope is not a passing control.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#16354b}</style>
<rect width="1200" height="510" fill="#f4f7fa"/>
<text x="40" y="54" font-size="32" font-weight="700">A report finding is the start of a controlled decision</text>
<text x="40" y="90" font-size="19">Conceptual workflow • no tenant connection, assessment, or change performed</text>
<rect x="40" y="145" width="340" height="215" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/>
<text x="58" y="183" font-size="23" font-weight="700">Verify the finding</text>
<text x="58" y="228" font-size="20">Control and baseline version</text>
<text x="58" y="260" font-size="20">Observed settings and scope</text>
<text x="58" y="292" font-size="20">Manual / error conditions</text>
<path d="M392 250 h24 l-8 -8 m8 8 l-8 8" stroke="#337b98" stroke-width="3" fill="none"/>
<rect x="430" y="145" width="340" height="215" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/>
<text x="448" y="183" font-size="23" font-weight="700">Decide and document</text>
<text x="448" y="228" font-size="20">Applicability / risk</text>
<text x="448" y="260" font-size="20">Approved exception or change</text>
<text x="448" y="292" font-size="20">Owner and review date</text>
<path d="M782 250 h24 l-8 -8 m8 8 l-8 8" stroke="#337b98" stroke-width="3" fill="none"/>
<rect x="820" y="145" width="340" height="215" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/>
<text x="838" y="183" font-size="23" font-weight="700">Change and retest</text>
<text x="838" y="228" font-size="20">Separate change approval</text>
<text x="838" y="260" font-size="20">Rollback and sign-in checks</text>
<text x="838" y="292" font-size="20">Dated assessment evidence</text>
<rect x="40" y="411" width="1120" height="65" rx="12" fill="#e0ebf1"/>
<text x="58" y="449" font-size="19">A tool result and an accepted exception have different meanings; neither guarantees the tenant is secure.</text>
</svg>
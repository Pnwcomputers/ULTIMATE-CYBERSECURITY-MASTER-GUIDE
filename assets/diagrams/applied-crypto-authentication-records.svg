<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Different authenticators need different server records</title><desc id="desc">Comparison of password, TOTP and WebAuthn server-side storage: salted password verifier with parameters; encrypted shared TOTP seed; public-key credential record with metadata. None of these removes authorization or session controls.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#337b98"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#16354b}.heading{font-size:32px;font-weight:700}.label{font-size:24px;font-weight:700}.body{font-size:22px}.note{font-size:20px}</style><rect width="1200" height="600" fill="#f4f7fa"/><text x="36" y="50" class="heading"><tspan x="36" dy="0">Different authenticators need different server records</tspan></text><text x="36" y="88" class="note"><tspan x="36" dy="0">Conceptual record types • not a schema or a prescribed database design</tspan></text><rect x="36" y="130" width="352" height="278" rx="14" fill="#fff" stroke="#b5cbd7" stroke-width="2"/><text x="58" y="168" class="label"><tspan x="58" dy="0">Password</tspan></text><text x="58" y="212" class="body"><tspan x="58" dy="0">Salted verifier</tspan><tspan x="58" dy="30">Algorithm + cost parameters</tspan><tspan x="58" dy="30"></tspan><tspan x="58" dy="30">Verify with password API.</tspan><tspan x="58" dy="30">Do not recover plaintext.</tspan><tspan x="58" dy="30">Slow hashing limits guessing.</tspan></text><rect x="424" y="130" width="352" height="278" rx="14" fill="#fff" stroke="#b5cbd7" stroke-width="2"/><text x="446" y="168" class="label"><tspan x="446" dy="0">TOTP</tspan></text><text x="446" y="212" class="body"><tspan x="446" dy="0">Protected shared seed</tspan><tspan x="446" dy="30">Enrollment/account metadata</tspan><tspan x="446" dy="30"></tspan><tspan x="446" dy="30">Verifier needs seed access.</tspan><tspan x="446" dy="30">Hashing the seed is insufficient.</tspan><tspan x="446" dy="30">Rate-limit and reject replays.</tspan></text><rect x="812" y="130" width="352" height="278" rx="14" fill="#fff" stroke="#b5cbd7" stroke-width="2"/><text x="834" y="168" class="label"><tspan x="834" dy="0">WebAuthn / FIDO</tspan></text><text x="834" y="212" class="body"><tspan x="834" dy="0">Public key + credential ID</tspan><tspan x="834" dy="30">Policy-relevant metadata</tspan><tspan x="834" dy="30"></tspan><tspan x="834" dy="30">Verify the signed challenge.</tspan><tspan x="834" dy="30">Check origin and RP binding.</tspan><tspan x="834" dy="30">Enforce required UP/UV flags.</tspan></text><rect x="36" y="450" width="1128" height="105" rx="14" fill="#fff3d7" stroke="#b5cbd7" stroke-width="2"/><text x="58" y="488" class="label"><tspan x="58" dy="0">Protect the surrounding system</tspan></text><text x="58" y="532" class="body"><tspan x="58" dy="0">Restrict access, redact logs, secure backups, and protect account recovery and sessions.</tspan></text></svg>

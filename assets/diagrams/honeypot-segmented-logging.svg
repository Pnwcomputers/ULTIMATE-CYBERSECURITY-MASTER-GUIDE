-width="2"/><circle cx="1014.4" cy="191" r="18" fill="#34d399"/><text x="1014.4" y="197" font-size="18" font-weight="700" fill="#051320" text-anchor="middle">5</text><text x="1001.4" y="240" font-size="18" font-weight="700" fill="#f8fafc">Review</text><text x="1001.4" y="280" font-size="15" fill="#d1e1f0">Verify signal</text><text x="1001.4" y="312" font-size="15" fill="#d1e1f0">Investigate source</text><text x="1001.4" y="344" font-size="15" fill="#d1e1f0">Tune detections</text><rect x="35" y="452" width="1170" height="83" rx="12" fill="#20374b" stroke="#34d399"/><text x="55" y="485" fill="#34d399" font-size="20" font-weight="700">Security boundary / validation</text><text x="55" y="510" fill="#e1edf6" font-size="16">Never expose production credentials, administrative trust or unrestricted network access through a decoy.</text></g></svg>
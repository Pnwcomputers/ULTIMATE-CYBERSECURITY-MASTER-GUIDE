<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc"><title id="title">Social OSINT: Identity Claims Need Provenance</title><desc id="desc">Several accounts may share a handle, profile picture or repost from one origin. Independently corroborate actual ownership and context before reporting attribution; minimize unrelated personal data.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#80d7f7"/></marker></defs><rect width="1440" height="820" rx="19" fill="#0d1a2b"/><g font-family="Arial,Helvetica,sans-serif"><text x="36" y="56" font-size="29" font-weight="700" fill="#f8fcff">Social OSINT: Identity Claims Need Provenance</text><text x="36" y="90" font-size="18" fill="#c2d7e6">A copied image or matching username is a lead, not an independently verified identity.</text><path d="M36 118H1404" stroke="#354f69" stroke-width="2"/><rect x="35" y="155" width="348" height="190" rx="14" fill="#1a3049" stroke="#80d7f7" stroke-width="2.3"/><text x="53" y="197" font-size="21" font-weight="700" fill="#f9fdff">Profile A</text><text x="53" y="239" font-size="17" fill="#d8e9f4">Same handle</text><text x="53" y="272" font-size="17" fill="#d8e9f4">Reused profile image</text><text x="53" y="305" font-size="17" fill="#d8e9f4">Claimed person/name</text><rect x="547" y="155" width="348" height="190" rx="14" fill="#1a3049" stroke="#a8aafa" stroke-width="2.3"/><text x="565" y="197" font-size="21" font-weight="700" fill="#f9fdff">Profile B</text><text x="565" y="239" font-size="17" fill="#d8e9f4">Similar username</text><text x="565" y="272" font-size="17" fill="#d8e9f4">Reposted content</text><text x="565" y="305" font-size="17" fill="#d8e9f4">May be unrelated</text><rect x="1057" y="155" width="347" height="190" rx="14" fill="#1a3049" stroke="#edc787" stroke-width="2.3"/><text x="1075" y="197" font-size="21" font-weight="700" fill="#f9fdff">Profile C</text><text x="1075" y="239" font-size="17" fill="#d8e9f4">Archived profile</text><text x="1075" y="272" font-size="17" fill="#d8e9f4">Different date/context</text><text x="1075" y="305" font-size="17" fill="#d8e9f4">Cannot assume owner</text><path d="M211 346V415H720V457M721 346V457M1231 346V415H725V457" stroke="#80d7f7" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="338" y="463" width="766" height="132" rx="14" fill="#1a3049" stroke="#71dfb8" stroke-width="2.3"/><text x="356" y="505" font-size="21" font-weight="700" fill="#f9fdff">Source graph &amp; independent corroboration</text><text x="356" y="547" font-size="17" fill="#d8e9f4">Trace earliest located origin, timestamps and platform identifiers</text><text x="356" y="580" font-size="17" fill="#d8e9f4">Check contradictory clues and document unresolved uncertainty</text><rect x="36" y="660" width="1368" height="89" rx="12" fill="#3b3126" stroke="#ecc37d" stroke-width="2"/><text x="55" y="694" font-size="21" font-weight="700" fill="#ffebc2">Public data is still subject to scope and privacy requirements</text><text x="55" y="726" font-size="17" fill="#f3e3c7">Avoid unnecessary bystander profiles, leaked credentials, mass harvesting and unsupported attribution.</text><text x="37" y="796" font-size="15" fill="#b8cdde">Fictional examples only; no real person's accounts, images, locations or identity are depicted.</text></g></svg>
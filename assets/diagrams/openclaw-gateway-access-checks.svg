<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 255" role="img" aria-labelledby="title desc">
  <title id="title">Check the OpenClaw dashboard access path</title>
  <desc id="desc">Follow the browser through the access network and optional HTTPS proxy to the gateway and device pairing checks. Test intended access and verify that other paths are blocked.</desc>
  <rect width="1000" height="255" rx="16" fill="#0b1223"/>
  <g font-family="sans-serif">
    <text x="29" y="46" fill="#fff" font-size="27" font-weight="700">Check the OpenClaw dashboard access path</text>
    <rect x="29" y="75" width="286" height="128" rx="12" fill="#172a40" stroke="#38bdf8" stroke-width="2"/>
    <text x="46" y="111" fill="#fff" font-size="18" font-weight="700">Browser and network</text>
    <text x="46" y="147" fill="#d7e6f4" font-size="15">Use the intended dashboard URL</text>
    <text x="46" y="172" fill="#d7e6f4" font-size="15">Confirm which clients can reach it</text>
    <rect x="357" y="75" width="286" height="128" rx="12" fill="#172a40" stroke="#38bdf8" stroke-width="2"/>
    <text x="374" y="111" fill="#fff" font-size="18" font-weight="700">Gateway and proxy</text>
    <text x="374" y="147" fill="#d7e6f4" font-size="15">Check host ports and bind settings</text>
    <text x="374" y="172" fill="#d7e6f4" font-size="15">Validate HTTPS and allowed origin</text>
    <rect x="685" y="75" width="286" height="128" rx="12" fill="#172a40" stroke="#38bdf8" stroke-width="2"/>
    <text x="702" y="111" fill="#fff" font-size="18" font-weight="700">Sign in and pair</text>
    <text x="702" y="147" fill="#d7e6f4" font-size="15">Use the configured authentication</text>
    <text x="702" y="172" fill="#d7e6f4" font-size="15">Approve only an expected device</text>
    <path d="M321 139h30m-7-6 7 6-7 6m298-6h30m-7-6 7 6-7 6" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="29" y="233" fill="#d7e6f4" font-size="16">Test from an approved client. Check that an unintended network path cannot reach the gateway.</text>
  </g>
</svg>

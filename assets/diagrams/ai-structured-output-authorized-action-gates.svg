<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" role="img" aria-labelledby="title desc"><title id="title">Structured AI Output: From JSON To Verified Side Effect</title><desc id="desc">Parsing, schema validation, semantic checks and authorization are separate gates; only the actual target service can confirm a write.</desc><defs><marker id="next" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#86d6f5"/></marker></defs><rect width="1440" height="780" rx="19" fill="#0d1929"/><g font-family="Arial,Helvetica,sans-serif"><text x="37" y="58" font-size="29" font-weight="700" fill="#f8fbff">Structured AI Output: From JSON To Verified Side Effect</text><text x="37" y="92" font-size="17.5" fill="#c0d5e6">Model text is a proposed action, never an authorization grant or evidence of completion.</text><path d="M37 115H1403" stroke="#38506a" stroke-width="2"/><rect x="37" y="158" width="299" height="202" rx="14" fill="#1b3049" stroke="#8ad7f7" stroke-width="2.3"/><rect x="37" y="158" width="7" height="202" rx="3" fill="#8ad7f7"/><text x="54" y="197" font-size="20" font-weight="700" fill="#fafcff">1  Parse</text><text x="54" y="238" font-size="17.5" fill="#dbe8f3">Valid JSON/encoding</text><text x="54" y="271" font-size="17.5" fill="#dbe8f3">Reject malformed values</text><path d="M338 257H382" stroke="#8bd8f6" stroke-width="3" fill="none" marker-end="url(#next)"/><rect x="392" y="158" width="299" height="202" rx="14" fill="#1b3049" stroke="#b6adfb" stroke-width="2.3"/><rect x="392" y="158" width="7" height="202" rx="3" fill="#b6adfb"/><text x="409" y="197" font-size="20" font-weight="700" fill="#fafcff">2  Validate schema</text><text x="409" y="238" font-size="17.5" fill="#dbe8f3">Types and required fields</text><text x="409" y="271" font-size="17.5" fill="#dbe8f3">Versioned constraints</text><path d="M693 257H737" stroke="#8bd8f6" stroke-width="3" fill="none" marker-end="url(#next)"/><rect x="747" y="158" width="299" height="202" rx="14" fill="#1b3049" stroke="#70dbb7" stroke-width="2.3"/><rect x="747" y="158" width="7" height="202" rx="3" fill="#70dbb7"/><text x="764" y="197" font-size="20" font-weight="700" fill="#fafcff">3  Verify context</text><text x="764" y="238" font-size="17.5" fill="#dbe8f3">Truth vs source records</text><text x="764" y="271" font-size="17.5" fill="#dbe8f3">Target identity and tenant</text><path d="M1048 257H1092" stroke="#8bd8f6" stroke-width="3" fill="none" marker-end="url(#next)"/><rect x="1102" y="158" width="299" height="202" rx="14" fill="#1b3049" stroke="#f1cc85" stroke-width="2.3"/><rect x="1102" y="158" width="7" height="202" rx="3" fill="#f1cc85"/><text x="1119" y="197" font-size="20" font-weight="700" fill="#fafcff">4  Approve action</text><text x="1119" y="238" font-size="17.5" fill="#dbe8f3">Enforce ACL / policy</text><text x="1119" y="271" font-size="17.5" fill="#dbe8f3">Human signoff if needed</text><rect x="256" y="430" width="394" height="137" rx="14" fill="#1b3049" stroke="#f6a9a2" stroke-width="2.3"/><rect x="256" y="430" width="7" height="137" rx="3" fill="#f6a9a2"/><text x="273" y="469" font-size="20" font-weight="700" fill="#fafcff">Write to service</text><text x="273" y="510" font-size="17.5" fill="#dbe8f3">Preview target and operation</text><text x="273" y="543" font-size="17.5" fill="#dbe8f3">Record receipt or failure</text><rect x="773" y="430" width="410" height="137" rx="14" fill="#1b3049" stroke="#70dbb7" stroke-width="2.3"/><rect x="773" y="430" width="7" height="137" rx="3" fill="#70dbb7"/><text x="790" y="469" font-size="20" font-weight="700" fill="#fafcff">Independent readback</text><text x="790" y="510" font-size="17.5" fill="#dbe8f3">Check actual external state</text><text x="790" y="543" font-size="17.5" fill="#dbe8f3">Record audit/evidence</text><path d="M1250 360V395H453V422" stroke="#8bd8f6" stroke-width="3" fill="none" marker-end="url(#next)"/><path d="M650 496H764" stroke="#8bd8f6" stroke-width="3" fill="none" marker-end="url(#next)"/><rect x="38" y="637" width="1364" height="83" rx="12" fill="#393227" stroke="#f1cf86" stroke-width="2"/><text x="58" y="669" font-size="20" font-weight="700" fill="#fff1c5">Do not confuse schema validity with permission or truth</text><text x="58" y="700" font-size="17" fill="#f1e1c7">A perfectly shaped request can still target the wrong client, invent an incident or exceed scope.</text></g></svg>
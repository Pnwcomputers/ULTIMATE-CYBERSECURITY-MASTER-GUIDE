<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
<title id="title">Stuxnet: from Windows propagation to physical control</title>
<desc id="desc">Stuxnet propagates on Windows through multiple mechanisms, reaches Step 7 engineering systems, modifies matching PLCs and conceals changes. The industrial payload can affect physical processes; not every infected Windows system experiences that effect.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#337b98"/>
</marker>
</defs>
<rect width="1200" height="590" fill="#f4f7fa"/>
<text x="40" y="54" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#16354b">Stuxnet: from Windows propagation to physical control</text>
<text x="40" y="89" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Historical mechanism summary • original ingress into the target remains uncertain</text>
<rect x="40" y="158" width="250" height="208" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/>
<text x="58" y="192" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16354b">Propagation</text>
<text x="58" y="228" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Removable media</text>
<text x="58" y="257" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Network mechanisms</text>
<path d="M 298 260 L 319 260" stroke="#337b98" stroke-width="3" fill="none" marker-end="url(#arrow)" />
<rect x="330" y="158" width="250" height="208" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/>
<text x="348" y="192" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16354b">Engineering host</text>
<text x="348" y="228" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Siemens Step 7</text>
<text x="348" y="257" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Locate matching targets</text>
<path d="M 588 260 L 609 260" stroke="#337b98" stroke-width="3" fill="none" marker-end="url(#arrow)" />
<rect x="620" y="158" width="250" height="208" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/>
<text x="638" y="192" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16354b">PLC modification</text>
<text x="638" y="228" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Change controller code</text>
<text x="638" y="257" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Conceal modifications</text>
<path d="M 878 260 L 899 260" stroke="#337b98" stroke-width="3" fill="none" marker-end="url(#arrow)" />
<rect x="910" y="158" width="250" height="208" rx="16" fill="#fff3d7" stroke="#d3ac53" stroke-width="2"/>
<text x="928" y="192" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16354b">Physical process</text>
<text x="928" y="228" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Alter equipment behavior</text>
<text x="928" y="257" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Industrial impact</text>
<rect x="40" y="420" width="1120" height="87" rx="12" fill="#e0ebf1"/>
<text x="58" y="449" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Windows infection and the industrial payload are different stages.</text>
<text x="58" y="478" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Review removable-media controls, engineering access, PLC integrity, and independent process monitoring.</text>
</svg>
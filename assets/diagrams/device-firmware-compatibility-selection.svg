<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" width="1440" height="760" role="img" aria-labelledby="title desc"><title id="title">Device-First Firmware: Match The Hardware Before The File</title><desc id="desc">Decision tree for firmware selection separating verified hardware identity, exact target release, installation format and recorded post-install behavior.</desc><defs><marker id="next" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#78D7FC"/></marker></defs><rect width="1440" height="760" rx="20" fill="#0B1728"/><g font-family="Arial,Helvetica,sans-serif"><text x="34" y="54" font-size="31" font-weight="700" fill="#F7FAFF">Device-First Firmware: Match The Hardware Before The File</text><text x="34" y="88" font-size="18" fill="#B9D0E3">Same chip family does not guarantee same firmware image, pin mapping or peripheral support.</text><path d="M34 111H1406" stroke="#375168" stroke-width="2"/><rect x="462" y="144" width="512" height="120" rx="14" fill="#172B44" stroke="#78D7FC" stroke-width="2.5"/><rect x="462" y="144" width="7" height="120" rx="4" fill="#78D7FC"/><text x="482" y="187" font-size="21" font-weight="700" fill="#F7FAFF">Owned hardware &amp; revision</text><text x="482" y="229" font-size="18" fill="#D8E5F0">Identify MCU, board, radio, display and storage</text><path d="M720 264V305" fill="none" stroke="#78D7FC" stroke-width="3" marker-end="url(#next)"/><rect x="35" y="310" width="427" height="179" rx="14" fill="#172B44" stroke="#B9B2FF" stroke-width="2.5"/><rect x="35" y="310" width="7" height="179" rx="4" fill="#B9B2FF"/><text x="55" y="353" font-size="21" font-weight="700" fill="#F7FAFF">Check project target matrix</text><text x="55" y="395" font-size="18" fill="#D8E5F0">Named device and actual release</text><text x="55" y="430" font-size="18" fill="#D8E5F0">Distinguish stable vs dev builds</text><rect x="505" y="310" width="427" height="179" rx="14" fill="#172B44" stroke="#70DEB4" stroke-width="2.5"/><rect x="505" y="310" width="7" height="179" rx="4" fill="#70DEB4"/><text x="525" y="353" font-size="21" font-weight="700" fill="#F7FAFF">Match image &amp; installation</text><text x="525" y="395" font-size="18" fill="#D8E5F0">Bootloader vs app vs UF2/FAP</text><text x="525" y="430" font-size="18" fill="#D8E5F0">Partitions, pins and flash size</text><rect x="975" y="310" width="427" height="179" rx="14" fill="#172B44" stroke="#F0CC80" stroke-width="2.5"/><rect x="975" y="310" width="7" height="179" rx="4" fill="#F0CC80"/><text x="995" y="353" font-size="21" font-weight="700" fill="#F7FAFF">Post-flash qualification</text><text x="995" y="395" font-size="18" fill="#D8E5F0">Known safe feature in owned lab</text><text x="995" y="430" font-size="18" fill="#D8E5F0">Record firmware, artifacts, recovery</text><path d="M462 393H497" fill="none" stroke="#78D7FC" stroke-width="3" marker-end="url(#next)"/><path d="M932 393H966" fill="none" stroke="#78D7FC" stroke-width="3" marker-end="url(#next)"/><path d="M720 305V300H252V304" fill="none" stroke="#78D7FC" stroke-width="3" marker-end="url(#next)"/><rect x="36" y="555" width="1367" height="95" rx="12" fill="#3A3226" stroke="#F0CC80" stroke-width="2"/><text x="56" y="592" font-size="21" font-weight="700" fill="#FFE7B3">STOP: image is not interchangeable just because both devices use ESP32</text><text x="56" y="624" font-size="17" fill="#F1DDBD">A controller app, radio coprocessor firmware and Flipper FAP can be separate artifacts with different targets.</text><text x="36" y="716" font-size="16" fill="#BBD0E0">Check upstream target matrix and exact vendor board revision before writing; this is a selection model, not a flashed-device claim.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="815" viewBox="0 0 1440 815" role="img" aria-labelledby="title desc"><title id="title">API Ingestion: Cursor, Retry &amp; Complete Batch</title><desc id="desc">An API collector validates origin and permissions, follows the documented cursor contract, respects rate limits, stages complete pages and commits an idempotent batch only after independent reconciliation.</desc><defs><marker id="n" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#89d9fa"/></marker></defs><rect width="1440" height="815" rx="20" fill="#0e1a2b"/><g font-family="Arial,Helvetica,sans-serif"><text x="37" y="57" font-size="29" font-weight="700" fill="#f9fdff">API Ingestion: Cursor, Retry &amp; Complete Batch</text><text x="37" y="90" font-size="18" fill="#bdd4e6">A 200 response or a short page does not prove the dataset is complete.</text><path d="M37 117H1403" stroke="#36516a" stroke-width="2"/><rect x="42" y="160" width="318" height="202" rx="13" fill="#1a304a" stroke="#89d9fa" stroke-width="2.5"/><text x="60" y="200" fill="#f7faff" font-size="20" font-weight="700">1. Source contract</text><text x="60" y="242" fill="#d9e8f1" font-size="17">Allowed origin &amp; auth</text><text x="60" y="276" fill="#d9e8f1" font-size="17">Snapshot / cursor semantics</text><text x="60" y="310" fill="#d9e8f1" font-size="17">Version &amp; delete signals</text><rect x="386" y="160" width="319" height="202" rx="13" fill="#1a304a" stroke="#b4acfb" stroke-width="2.5"/><text x="404" y="200" fill="#f7faff" font-size="20" font-weight="700">2. Safe pagination</text><text x="404" y="242" fill="#d9e8f1" font-size="17">Bound page, time, bytes</text><text x="404" y="276" fill="#d9e8f1" font-size="17">Check repeated cursor</text><text x="404" y="310" fill="#d9e8f1" font-size="17">No cross-origin token leaks</text><rect x="730" y="160" width="320" height="202" rx="13" fill="#1a304a" stroke="#edc982" stroke-width="2.5"/><text x="748" y="200" fill="#f7faff" font-size="20" font-weight="700">3. Retry carefully</text><text x="748" y="242" fill="#d9e8f1" font-size="17">429 / Retry-After</text><text x="748" y="276" fill="#d9e8f1" font-size="17">Bounded delay and budget</text><text x="748" y="310" fill="#d9e8f1" font-size="17">No blind write retries</text><rect x="1074" y="160" width="318" height="202" rx="13" fill="#1a304a" stroke="#75ddb8" stroke-width="2.5"/><text x="1092" y="200" fill="#f7faff" font-size="20" font-weight="700">4. Stage and verify</text><text x="1092" y="242" fill="#d9e8f1" font-size="17">Schema + row identity</text><text x="1092" y="276" fill="#d9e8f1" font-size="17">Full export/part count</text><text x="1092" y="310" fill="#d9e8f1" font-size="17">Commit durable checkpoint</text><path d="M361 258H377" fill="none" stroke="#89d9fa" stroke-width="3" marker-end="url(#n)"/><path d="M706 258H722" fill="none" stroke="#89d9fa" stroke-width="3" marker-end="url(#n)"/><path d="M1051 258H1066" fill="none" stroke="#89d9fa" stroke-width="3" marker-end="url(#n)"/><rect x="254" y="445" width="932" height="145" rx="13" fill="#1a304a" stroke="#75ddb8" stroke-width="2.5"/><text x="272" y="485" fill="#f7faff" font-size="20" font-weight="700">Consumer proof</text><text x="272" y="527" fill="#d9e8f1" font-size="17">Reconcile source/batch counts, duplicate keys and missing parts</text><text x="272" y="561" fill="#d9e8f1" font-size="17">Store exact cursor, input hash, output version and observed failures</text><path d="M1233 362V401H722V437" fill="none" stroke="#89d9fa" stroke-width="3" marker-end="url(#n)"/><rect x="37" y="666" width="1366" height="88" rx="13" fill="#393226" stroke="#ecc57b" stroke-width="2"/><text x="58" y="699" font-size="21" font-weight="700" fill="#fff0c8">Timeout after a write does not mean the server did nothing</text><text x="58" y="732" font-size="17" fill="#f3e3c9">Use source/sink-specific idempotency and audit readback; never commit truncated files as complete.</text><text x="39" y="789" font-size="15" fill="#b9ccdf">Conceptual HTTP data-ingestion workflow; actual API pagination and quota behavior vary by provider.</text></g></svg>
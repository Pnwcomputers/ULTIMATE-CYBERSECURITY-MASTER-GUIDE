<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="775" viewBox="0 0 1440 775" role="img" aria-labelledby="title desc"><title id="title">Data Lineage: Dataset, Job, Run &amp; Field Controls</title><desc id="desc">Distinct lineage concepts model sources, transformation job, an individual run and derived datasets. Access control is enforced at stores/exports, not by drawing a lineage edge.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#8ed9f5"/></marker></defs><rect width="1440" height="775" rx="18" fill="#0c1a2a"/><g font-family="Arial,Helvetica,sans-serif"><text x="38" y="56" font-size="29" font-weight="700" fill="#f7faff">Data Lineage: Dataset, Job, Run &amp; Field Controls</text><text x="38" y="91" font-size="18" fill="#bdd3e6">Provenance graphs support analysis but do not automatically discover every manual export or hidden dependency.</text><path d="M38 115H1402" stroke="#38546d" stroke-width="2"/><rect x="38" y="156" width="360" height="160" rx="14" fill="#1a3048" stroke="#8ed9f5" stroke-width="2.4"/><text x="56" y="197" font-size="21" font-weight="700" fill="#f5faff">Input dataset A</text><text x="56" y="237" font-size="18" fill="#d6e6f2">Raw asset events</text><text x="56" y="271" font-size="18" fill="#d6e6f2">Dataset identity + version</text><rect x="38" y="368" width="360" height="160" rx="14" fill="#1a3048" stroke="#a8a7fb" stroke-width="2.4"/><text x="56" y="409" font-size="21" font-weight="700" fill="#f5faff">Reference dataset B</text><text x="56" y="449" font-size="18" fill="#d6e6f2">Site / account lookup</text><text x="56" y="483" font-size="18" fill="#d6e6f2">Separate data ownership</text><rect x="508" y="242" width="425" height="213" rx="14" fill="#1a3048" stroke="#72dbba" stroke-width="2.4"/><text x="526" y="283" font-size="21" font-weight="700" fill="#f5faff">Transformation job</text><text x="526" y="323" font-size="18" fill="#d6e6f2">Job definition + code revision</text><text x="526" y="357" font-size="18" fill="#d6e6f2">Run ID + UTC + source versions</text><text x="526" y="391" font-size="18" fill="#d6e6f2">Explicit input → output relation</text><rect x="1052" y="155" width="350" height="164" rx="14" fill="#1a3048" stroke="#edca86" stroke-width="2.4"/><text x="1070" y="196" font-size="21" font-weight="700" fill="#f5faff">Output: site totals</text><text x="1070" y="236" font-size="18" fill="#d6e6f2">Aggregate dataset</text><text x="1070" y="270" font-size="18" fill="#d6e6f2">Check derived field lineage</text><rect x="1052" y="370" width="350" height="164" rx="14" fill="#1a3048" stroke="#f6a6a6" stroke-width="2.4"/><text x="1070" y="411" font-size="21" font-weight="700" fill="#f5faff">Restricted view</text><text x="1070" y="451" font-size="18" fill="#d6e6f2">Sensitive field projections</text><text x="1070" y="485" font-size="18" fill="#d6e6f2">Review each access path</text><path d="M399 234H464V293H499" stroke="#8ed9f5" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M399 444H464V407H499" stroke="#8ed9f5" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M934 309H987V236H1044" stroke="#8ed9f5" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M934 386H987V453H1044" stroke="#8ed9f5" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="38" y="628" width="1364" height="85" rx="13" fill="#3a3227" stroke="#ebc883" stroke-width="2"/><text x="58" y="662" font-size="20" font-weight="700" fill="#fff0c6">Lineage is not authorization or a deletion guarantee</text><text x="58" y="693" font-size="17" fill="#f4e3c9">Check raw tables, exports, backups, dashboard access and uninstrumented manual transformations.</text><text x="39" y="751" font-size="15" fill="#b6cde0">This is a conceptual object-model illustration grounded in OpenLineage's dataset, job and run definitions.</text></g></svg>
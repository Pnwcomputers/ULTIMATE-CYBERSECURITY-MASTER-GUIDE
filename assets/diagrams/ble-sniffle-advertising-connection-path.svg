<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc"><title id="title">BLE Sniffle: Advertisements vs Connections</title><desc id="desc">A matched Sniffle build and supported TI radio may monitor advertisements or attempt to follow connections. Capturing a packet does not imply decrypting its encrypted payload.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#80d7f7"/></marker></defs><rect width="1440" height="800" rx="19" fill="#0d1a2b"/><g font-family="Arial,Helvetica,sans-serif"><text x="36" y="56" font-size="29" font-weight="700" fill="#f8fcff">BLE Sniffle: Advertisements vs Connections</text><text x="36" y="90" font-size="18" fill="#c2d7e6">Select owned beacon, capture mode and correct PHY before interpreting evidence.</text><path d="M36 118H1404" stroke="#354f69" stroke-width="2"/><rect x="36" y="164" width="339" height="170" rx="14" fill="#1a3049" stroke="#80d7f7" stroke-width="2.3"/><text x="54" y="206" font-size="21" font-weight="700" fill="#f9fdff">Authorized BLE device</text><text x="54" y="248" font-size="17" fill="#d8e9f4">Advertising frames / channels</text><text x="54" y="281" font-size="17" fill="#d8e9f4">Connection events if present</text><rect x="439" y="164" width="387" height="170" rx="14" fill="#1a3049" stroke="#a8aafa" stroke-width="2.3"/><text x="457" y="206" font-size="21" font-weight="700" fill="#f9fdff">TI Sniffle sniffer</text><text x="457" y="248" font-size="17" fill="#d8e9f4">Match CC26x2 / CC1352 target</text><text x="457" y="281" font-size="17" fill="#d8e9f4">Firmware, band / PHY &amp; mode</text><rect x="895" y="164" width="506" height="170" rx="14" fill="#1a3049" stroke="#71dfb8" stroke-width="2.3"/><text x="913" y="206" font-size="21" font-weight="700" fill="#f9fdff">Host capture / PCAP</text><text x="913" y="248" font-size="17" fill="#d8e9f4">Sniffle receiver and timestamps</text><text x="913" y="281" font-size="17" fill="#d8e9f4">Wireshark decoding as supported</text><path d="M376 249H431" fill="none" stroke="#80d7f7" stroke-width="3" marker-end="url(#arr)"/><path d="M827 249H886" fill="none" stroke="#80d7f7" stroke-width="3" marker-end="url(#arr)"/><rect x="138" y="407" width="536" height="173" rx="14" fill="#1a3049" stroke="#80d7f7" stroke-width="2.3"/><text x="156" y="449" font-size="21" font-weight="700" fill="#f9fdff">Advertisement-only survey</text><text x="156" y="491" font-size="17" fill="#d8e9f4">Device beacons and RSSI observations</text><text x="156" y="524" font-size="17" fill="#d8e9f4">No connection trace is implied</text><rect x="768" y="407" width="537" height="173" rx="14" fill="#1a3049" stroke="#edc787" stroke-width="2.3"/><text x="786" y="449" font-size="21" font-weight="700" fill="#f9fdff">Connection-following mode</text><text x="786" y="491" font-size="17" fill="#d8e9f4">Track selected connection if acquired</text><text x="786" y="524" font-size="17" fill="#d8e9f4">Hopping, PHY and packet loss matter</text><path d="M648 334V374H402V399" fill="none" stroke="#80d7f7" stroke-width="3" marker-end="url(#arr)"/><path d="M648 334V374H1036V399" fill="none" stroke="#80d7f7" stroke-width="3" marker-end="url(#arr)"/><rect x="36" y="652" width="1368" height="89" rx="12" fill="#3b3126" stroke="#ecc37d" stroke-width="2"/><text x="55" y="686" font-size="21" font-weight="700" fill="#ffebc2">Encrypted BLE payloads are not automatically readable</text><text x="55" y="718" font-size="17" fill="#f3e3c7">Use current supported hardware, avoid unrelated traffic, and do not confuse BLE with Bluetooth Classic.</text><text x="37" y="781" font-size="15" fill="#b8cdde">Upstream NCC Group Sniffle supports multiple capture modes but not universal capture of every nearby device/session.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc"><title id="title">Orchestration: Intervals, Dependencies &amp; Publish</title><desc id="desc">Schedulers select the logical data interval and run tasks when prerequisites are fulfilled, but success requires validated outputs rather than a mere exit code.</desc><defs><marker id="n" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#89d9fa"/></marker></defs><rect width="1440" height="820" rx="20" fill="#0e1a2b"/><g font-family="Arial,Helvetica,sans-serif"><text x="37" y="57" font-size="29" font-weight="700" fill="#f9fdff">Orchestration: Intervals, Dependencies &amp; Publish</text><text x="37" y="90" font-size="18" fill="#bdd4e6">A cleanup task completing is not a successful data publication; replay must be controlled.</text><path d="M37 117H1403" stroke="#36516a" stroke-width="2"/><rect x="46" y="162" width="398" height="139" rx="13" fill="#1a304a" stroke="#89d9fa" stroke-width="2.5"/><text x="64" y="202" fill="#f7faff" font-size="20" font-weight="700">Trigger + logical interval</text><text x="64" y="244" fill="#d9e8f1" font-size="17">Data window ≠ execution wall time</text><text x="64" y="278" fill="#d9e8f1" font-size="17">Versioned inputs and run ID</text><rect x="525" y="162" width="396" height="139" rx="13" fill="#1a304a" stroke="#b4acfb" stroke-width="2.5"/><text x="543" y="202" fill="#f7faff" font-size="20" font-weight="700">Independent extracts</text><text x="543" y="244" fill="#d9e8f1" font-size="17">Asset and event data versions</text><text x="543" y="278" fill="#d9e8f1" font-size="17">Allow safe parallel work</text><rect x="1003" y="162" width="393" height="139" rx="13" fill="#1a304a" stroke="#73dcb8" stroke-width="2.5"/><text x="1021" y="202" fill="#f7faff" font-size="20" font-weight="700">Transform &amp; validate</text><text x="1021" y="244" fill="#d9e8f1" font-size="17">Merge consistent inputs</text><text x="1021" y="278" fill="#d9e8f1" font-size="17">Quality and reconciliation</text><path d="M445 232H516" fill="none" stroke="#89d9fa" stroke-width="3" marker-end="url(#n)"/><path d="M922 232H994" fill="none" stroke="#89d9fa" stroke-width="3" marker-end="url(#n)"/><rect x="361" y="416" width="718" height="121" rx="13" fill="#1a304a" stroke="#edc982" stroke-width="2.5"/><text x="379" y="456" fill="#f7faff" font-size="20" font-weight="700">Publication gate</text><text x="379" y="498" fill="#d9e8f1" font-size="17">All dependencies verified for the same interval and version</text><text x="379" y="532" fill="#d9e8f1" font-size="17">Commit/publish only after required checks</text><path d="M1200 301V356H722V407" fill="none" stroke="#89d9fa" stroke-width="3" marker-end="url(#n)"/><rect x="48" y="588" width="644" height="91" rx="13" fill="#1a304a" stroke="#f2a8a3" stroke-width="2.5"/><text x="66" y="628" fill="#f7faff" font-size="20" font-weight="700">FAILED or BLOCKED</text><text x="66" y="670" fill="#d9e8f1" font-size="17">Record missing/late outputs, replay without duplicate effects</text><rect x="748" y="588" width="643" height="91" rx="13" fill="#1a304a" stroke="#73dcb8" stroke-width="2.5"/><text x="766" y="628" fill="#f7faff" font-size="20" font-weight="700">SUCCEEDED and PUBLISHED</text><text x="766" y="670" fill="#d9e8f1" font-size="17">Record exact version, data interval and consumer readback</text><rect x="37" y="713" width="1366" height="88" rx="13" fill="#393226" stroke="#ecc57b" stroke-width="2"/><text x="58" y="746" font-size="21" font-weight="700" fill="#fff0c8">A scheduler manages when, not data correctness</text><text x="58" y="779" font-size="17" fill="#f3e3c9">Separate data-level validation, task retry semantics, idempotency and independent consumer checks.</text></g></svg>
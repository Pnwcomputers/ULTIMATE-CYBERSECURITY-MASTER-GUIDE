<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 560" role="img" aria-labelledby="title desc"><title id="title">uConsole CM5 setup: six cautious phases</title><desc id="desc">Illustrative sequence following the repository's opt-in and recovery-first workflow Preflight: Confirm board: Back up config: Read current guide. Update: Avoid surprise: Upgrades optional: Review hostname. Kali tools: Opt-in only: Native Kali: Check packages. AIO: If hardware fitted: Use vendor notes: Opt-in install. Peripherals: Preserve boot: Check chipset: DKMS optional. Finalize: Audit packages: Reboot manually: Validate desktop. CM4 follows a different reviewed process. Firmware and display behavior require device-specific validation.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#d7e6f4"/></marker></defs><rect width="1240" height="560" rx="20" fill="#0b1223"/><g font-family="Arial,Helvetica,sans-serif"><text x="35" y="56" font-size="31" font-weight="700" fill="#ffffff">uConsole CM5 setup: six cautious phases</text><text x="35" y="89" font-size="17" fill="#b8cbe0">Illustrative sequence following the repository's opt-in and recovery-first workflow</text><rect x="35" y="157" width="181.66666666666666" height="254" rx="14" fill="#172a40" stroke="#38bdf8" stroke-width="2"/><circle cx="63" cy="190" r="18" fill="#38bdf8"/><text x="63" y="196" font-size="17" fill="#071321" font-weight="700" text-anchor="middle">1</text><text x="50" y="242" font-size="16" font-weight="700" fill="white">Preflight</text><text x="50" y="282" font-size="14" fill="#d7e6f4">Confirm board</text><text x="50" y="313" font-size="14" fill="#d7e6f4">Back up config</text><text x="50" y="344" font-size="14" fill="#d7e6f4">Read current guide</text><path d="M217.66666666666666 292h12" stroke="#d7e6f4" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="232.66666666666666" y="157" width="181.66666666666666" height="254" rx="14" fill="#
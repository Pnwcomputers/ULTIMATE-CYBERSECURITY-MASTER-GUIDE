<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" role="img" aria-labelledby="title desc">
  <title id="title">From OpenSCAD preset to print file</title>
  <desc id="desc">A named JSON preset supplies model dimensions. Select a printable part explicitly and inspect the exported mesh in a slicer before printing.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#44728a"/>
    </marker>
  </defs>
  <rect width="900" height="410" rx="18" fill="#eef4fa"/>
  <g font-family="system-ui, sans-serif" fill="#17334a">
    <text x="35" y="54" font-size="31" font-weight="700">From OpenSCAD preset to print file</text>
    <g transform="translate(35 108)">
      <rect width="250" height="232" rx="14" fill="#fff" stroke="#a6becd"/>
      <text x="16" y="39" font-size="20" font-weight="700">Load the preset</text>
      <text x="16" y="78" font-size="17">Select the JSON with -p</text>
      <text x="16" y="110" font-size="17">Select its name with -P</text>
      <text x="16" y="142" font-size="17">Check measured inputs</text>
    </g>
    <g transform="translate(325 108)">
      <rect width="250" height="232" rx="14" fill="#fff" stroke="#a6becd"/>
      <text x="16" y="39" font-size="20" font-weight="700">Select and export a part</text>
      <text x="16" y="78" font-size="17">Set the part with -D</text>
      <text x="16" y="110" font-size="17">Export the mesh with -o</text>
      <text x="16" y="142" font-size="17">Keep the assembly view</text>
      <text x="16" y="174" font-size="17">for fit checks</text>
    </g>
    <g transform="translate(615 108)">
      <rect width="250" height="232" rx="14" fill="#fff" stroke="#a6becd"/>
      <text x="16" y="39" font-size="20" font-weight="700">Inspect before printing</text>
      <text x="16" y="78" font-size="17">Open the mesh in a slicer</text>
      <text x="16" y="110" font-size="17">Check scale and orientation</text>
      <text x="16" y="142" font-size="17">Confirm the intended part</text>
    </g>
  </g>
  <g fill="none" stroke="#44728a" stroke-width="3" marker-end="url(#arrow)">
    <path d="M288 222H321"/>
    <path d="M578 222H611"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="512" viewBox="0 0 960 512" role="img" aria-labelledby="title desc">
<title id="title">Reading a 50 Ω Smith chart</title>
<desc id="desc">Five example impedances illustrate different positions on a Smith chart. A, B and C lie on the real axis at 25, 50 and 100 ohms. D is above the axis at 50 plus j50 ohms. E is below it at 50 minus j50 ohms. Only B is both resonant and matched to the 50-ohm reference.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#40536d"/></marker></defs>
<rect x="1" y="1" width="958" height="510" rx="12" fill="#f5f8fd" stroke="#c5d5e9"/>
<text x="32" y="48" fill="#14263e" font-family="Arial, sans-serif" font-size="31" font-weight="700" text-anchor="start">Reading a 50 Ω Smith chart</text>
<text x="32" y="79" fill="#40536d" font-family="Arial, sans-serif" font-size="19" font-weight="500" text-anchor="start">Impedance at the calibrated reference plane · Z₀ = 50 Ω</text>
<circle cx="287" cy="281" r="177" fill="#ffffff" stroke="#4c6684" stroke-width="1.5"/>
<circle cx="322.4" cy="281" r="141.6" fill="none" stroke="#bdcddf" stroke-width="1.5"/>

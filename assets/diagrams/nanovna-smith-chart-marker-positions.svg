<path d="M393.20 422.60 A88.5 88.5 0 0 1 464 281" fill="none" stroke="#bdcddf" stroke-width="1.5"/>
<path d="M287.00 458.00 A177.0 177.0 0 0 1 464 281" fill="none" stroke="#bdcddf" stroke-width="1.5"/>
<path d="M180.80 422.60 A354.0 354.0 0 0 1 464 281" fill="none" stroke="#bdcddf" stroke-width="1.5"/>
<path d="M180.80 139.40 A354.0 354.0 0 0 0 464 281" fill="none" stroke="#bdcddf" stroke-width="1.5"/>
<path d="M287.00 104.00 A177.0 177.0 0 0 0 464 281" fill="none" stroke="#bdcddf" stroke-width="1.5"/>
<path d="M393.20 139.40 A88.5 88.5 0 0 0 464 281" fill="none" stroke="#bdcddf" stroke-width="1.5"/>
<path d="M110 281 L464 281" fill="none" stroke="#4c6684" stroke-width="2"/>
<text x="110" y="301" fill="#40536d" font-family="Arial, sans-serif" font-size="16" font-weight="500" text-anchor="middle">Short</text>
<text x="464" y="301" fill="#40536d" font-family="Arial, sans-serif" font-size="16" font-weight="500" text-anchor="middle">Open</text>
<text x="287" y="486" fill="#40536d" font-family="Arial, sans-serif" font-size="18" font-weight="500" text-anchor="middle">All points on the rim have |Γ| = 1.</text>
<circle cx="228.0" cy="281.0" r="12" fill="#18478c" stroke="#ffffff" stroke-width="1.5"/>
<text x="228.0" y="286.0" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">A</text>
<circle cx="287.0" cy="281.0" r="12" fill="#18478c" stroke="#ffffff" stroke-width="1.5"/>
<text x="287.0" y="286.0" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">B</text>
<circle cx="346.0" cy="281.0" r="12" fill="#18478c" stroke="#ffffff" stroke-width="1.5"/>
<text x="346.0" y="286.0" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">C</text>
<circle cx="322.4" cy="210.2" r="12" fill="#126458" stroke="#ffffff" stroke-width="1.5"/>
<text x="322.4" y="215.2" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">D</text>
<circle cx="322.4" cy="351.8" r="12" fill="#8a4715" stroke="#ffffff" stroke-width="1.5"/>
<text x="322.4" y="356.8" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">E</text>
<rect x="515" y="107" width="408" height="352" rx="12" fill="#ffffff" stroke="#c5d5e9"/>
<text x="538" y="143" fill="#14263e" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">Example markers</text>

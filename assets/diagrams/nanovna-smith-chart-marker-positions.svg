<text x="571" y="206" fill="#40536d" font-family="Arial, sans-serif" font-size="16" font-weight="500" text-anchor="start">Resonant, low resistance</text>
<circle cx="547" cy="237" r="12" fill="#18478c" stroke="none" stroke-width="1.5"/>
<text x="547" y="242" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">B</text>
<text x="571" y="239" fill="#14263e" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">50 + j0 Ω</text>
<text x="571" y="262" fill="#40536d" font-family="Arial, sans-serif" font-size="16" font-weight="500" text-anchor="start">Matched to the 50 Ω reference</text>
<circle cx="547" cy="293" r="12" fill="#18478c" stroke="none" stroke-width="1.5"/>
<text x="547" y="298" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">C</text>
<text x="571" y="295" fill="#14263e" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">100 + j0 Ω</text>
<text x="571" y="318" fill="#40536d" font-family="Arial, sans-serif" font-size="16" font-weight="500" text-anchor="start">Resonant, high resistance</text>
<circle cx="547" cy="349" r="12" fill="#126458" stroke="none" stroke-width="1.5"/>
<text x="547" y="354" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">D</text>
<text x="571" y="351" fill="#14263e" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">50 + j50 Ω</text>
<text x="571" y="374" fill="#40536d" font-family="Arial, sans-serif" font-size="16" font-weight="500" text-anchor="start">Inductive</text>
<circle cx="547" cy="405" r="12" fill="#8a4715" stroke="none" stroke-width="1.5"/>
<text x="547" y="410" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">E</text>
<text x="571" y="407" fill="#14263e" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">50 − j50 Ω</text>
<text x="571" y="430" fill="#40536d" font-family="Arial, sans-serif" font-size="16" font-weight="500" text-anchor="start">Capacitive</text>
</svg>

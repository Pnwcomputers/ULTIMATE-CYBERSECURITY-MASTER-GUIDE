<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="840" viewBox="0 0 1440 840" role="img" aria-labelledby="title desc"><title id="title">Graylog: Ingest, Process &amp; Index Are Separate</title><desc id="desc">Graylog deployment is comprised of ingest/pipeline/UI processing, a search indexing backend and MongoDB for configuration; the current recommended Data Node is distinct from the legacy stand-alone OpenSearch option.</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#76D6F9"/></marker></defs><rect width="1440" height="840" rx="18" fill="#0C192B"/><g font-family="Arial,Helvetica,sans-serif"><text x="35" y="55" font-size="31" font-weight="700" fill="#FAFCFF">Graylog: Ingest, Process &amp; Index Are Separate</text><text x="35" y="90" font-size="18" fill="#C0D6E8">Logical service roles: this is not a production diagram or a validated Compose file.</text><path d="M35 111H1405" stroke="#38516A" stroke-width="2"/><rect x="42" y="164" width="365" height="168" rx="13" fill="#172D46" stroke="#76D6F9" stroke-width="2.3"/><text x="60" y="205" font-size="21" font-weight="700" fill="#F6FAFF">Event sources</text><text x="60" y="245" font-size="18" fill="#D6E7F3">Syslog, GELF and agents</text><text x="60" y="280" font-size="18" fill="#D6E7F3">Transport and input config</text><rect x="543" y="164" width="365" height="168" rx="13" fill="#172D46" stroke="#AFA9FF" stroke-width="2.3"/><text x="561" y="205" font-size="21" font-weight="700" fill="#F6FAFF">Graylog server</text><text x="561" y="245" font-size="18" fill="#D6E7F3">Inputs → streams → pipeline</text><text x="561" y="280" font-size="18" fill="#D6E7F3">Search, alerts and web API</text><rect x="1040" y="164" width="355" height="168" rx="13" fill="#172D46" stroke="#76DBB3" stroke-width="2.3"/><text x="1058" y="205" font-size="21" font-weight="700" fill="#F6FAFF">Search backend</text><text x="1058" y="245" font-size="18" fill="#D6E7F3">Data Node (recommended)</text><text x="1058" y="280" font-size="18" fill="#D6E7F3">or supported OpenSearch</text><path d="M407 248H535" fill="none" stroke="#76D6F9" stroke-width="3" marker-end="url(#arr)"/><path d="M908 248H1032" fill="none" stroke="#76D6F9" stroke-width="3" marker-end="url(#arr)"/><rect x="545" y="405" width="363" height="140" rx="13" fill="#172D46" stroke="#F0CB82" stroke-width="2.3"/><text x="563" y="446" font-size="21" font-weight="700" fill="#F6FAFF">MongoDB metadata</text><text x="563" y="486" font-size="18" fill="#D6E7F3">Users, streams &amp; settings</text><text x="563" y="521" font-size="18" fill="#D6E7F3">Not the event search index</text><path d="M725 332V397" fill="none" stroke="#76D6F9" stroke-width="3" marker-end="url(#arr)"/><rect x="107" y="612" width="1226" height="139" rx="13" fill="#172D46" stroke="#F0CB82" stroke-width="2.3"/><text x="125" y="653" font-size="21" font-weight="700" fill="#F6FAFF">Independent checks before claiming coverage</text><text x="125" y="693" font-size="18" fill="#D6E7F3">Verify input receipt → parsing → stream/pipeline → indexed document → alert/search result</text><text x="125" y="728" font-size="18" fill="#D6E7F3">Match versions with the vendor compatibility matrix. Restrict admin/API and backend ports.</text><text x="44" y="807" font-size="15" fill="#B8CCDE">Historical Graylog 5.2 + OpenSearch 2.12 examples in the written guide are not current production recipes.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
<title id="title">Correlate radio, identity and attachment evidence</title>
<desc id="desc">Radio sensors observe advertised SSIDs and management traffic; controller, endpoint and authentication records show association or access results; switch and DHCP records locate time-bounded attachment. Correlation with approved inventory supports triage.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
<path d="M0 0 L10 5 L0 10Z" fill="#337b98"/>
</marker>
</defs>
<rect width="1200" height="570" fill="#f4f7fa"/>
<text x="40" y="54" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#16354b">Correlate radio, identity and attachment evidence</text>
<text x="40" y="89" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Conceptual visibility model • no observed incident or live capture</text>
<rect x="40" y="134" width="340" height="195" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/>
<text x="58" y="168" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16354b">Radio observations</text>
<text x="58" y="206" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">BSSID / SSID / channel</text>
<text x="58" y="236" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Time and sensor coverage</text>
<rect x="430" y="134" width="340" height="195" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/>
<text x="448" y="168" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16354b">Identity / associations</text>
<text x="448" y="206" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Endpoint and controller logs</text>
<text x="448" y="236" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">RADIUS / NAC outcomes</text>
<rect x="820" y="134" width="340" height="195" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/>
<text x="838" y="168" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16354b">Wired attachment</text>
<text x="838" y="206" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Switch port / VLAN / leases</text>
<text x="838" y="236" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Time-bounded mappings</text>
<rect x="340" y="365" width="520" height="70" rx="16" fill="#fff3d7" stroke="#b5cbd7" stroke-width="2"/>
<text x="358" y="399" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16354b">Correlate with approved inventory</text>
<path d="M210 341 L328 394" stroke="#337b98" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
<path d="M600 341 L600 353" stroke="#337b98" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
<path d="M990 341 L872 394" stroke="#337b98" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
<rect x="40" y="451" width="1120" height="86" rx="12" fill="#e0ebf1"/>
<text x="58" y="481" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">An SSID, OUI, strong RSSI or unusual hostname is a clue, not proof of an evil twin or actor identity.</text>
<text x="58" y="510" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Missing coverage can hide events. A beacon does not demonstrate a successful client connection.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
<title id="title">EUCLEAK: secrets can leak during computation</title>
<desc id="desc">A secure element performs ECDSA and returns an intended signature. A separate electromagnetic side channel leaks information during non-constant-time modular inversion. With physical access and specialist analysis researchers recovered a signing secret.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#337b98"/>
</marker>
</defs>
<rect width="1200" height="590" fill="#f4f7fa"/>
<text x="40" y="54" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#16354b">EUCLEAK: secrets can leak during computation</text>
<text x="40" y="89" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">2024 NinjaLab disclosure • conceptual side channel • no measured traces</text>
<rect x="40" y="148" width="270" height="160" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/>
<text x="58" y="182" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16354b">Signing request</text>
<text x="58" y="218" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Legitimate input</text>
<text x="58" y="247" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Normal operation</text>
<rect x="400" y="148" width="360" height="160" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/>
<text x="418" y="182" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16354b">Secure element</text>
<text x="418" y="218" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">ECDSA computation</text>
<text x="418" y="247" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Non-constant-time inversion</text>
<rect x="850" y="148" width="310" height="160" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/>
<text x="868" y="182" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16354b">Signature output</text>
<text x="868" y="218" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Intended interface</text>
<text x="868" y="247" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Key is not returned</text>
<path d="M 322 225 L 388 225" stroke="#337b98" stroke-width="3" fill="none" marker-end="url(#arrow)" />
<path d="M 772 225 L 838 225" stroke="#337b98" stroke-width="3" fill="none" marker-end="url(#arrow)" />
<path d="M 581 320 L 581 362" stroke="#337b98" stroke-width="3" fill="none" marker-end="url(#arrow)" />
<rect x="290" y="376" width="620" height="112" rx="16" fill="#fff3d7" stroke="#d3ac53" stroke-width="2"/>
<text x="308" y="410" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16354b">Unintended electromagnetic leakage</text>
<text x="308" y="446" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Physical access + specialist acquisition and analysis</text>
<rect x="40" y="515" width="1120" height="58" rx="12" fill="#e0ebf1"/>
<text x="58" y="544" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">A protected storage boundary does not by itself prevent leakage during a cryptographic operation.</text>
</svg>
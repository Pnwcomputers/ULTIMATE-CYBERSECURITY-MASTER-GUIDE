<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc"><title id="title">Space Ground Segment: Command &amp; Telemetry</title><desc id="desc">Operations commands are approved and sent through a ground RF chain to spacecraft, while telemetry downlink returns independently. Link-layer authentication/replay controls depend on mission implementation.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#8adbf6"/></marker></defs><rect width="1440" height="820" rx="20" fill="#0d192a"/><g font-family="Arial,Helvetica,sans-serif"><text x="40" y="58" font-size="30" font-weight="700" fill="#fbfdff">Space Ground Segment: Command &amp; Telemetry</text><text x="40" y="92" font-size="18" fill="#c0d4e5">Diagram depicts separate command and telemetry paths, not an operational spacecraft configuration.</text><path d="M40 119H1400" stroke="#354f68" stroke-width="2"/><rect x="40" y="165" width="359" height="198" rx="15" fill="#1a304a" stroke="#9fd7ff" stroke-width="2.5"/><rect x="40" y="165" width="8" height="198" rx="4" fill="#9fd7ff"/><text x="58" y="207" font-size="21" font-weight="700" fill="#f4fcff">Mission operations</text><text x="58" y="250" font-size="18" fill="#dceaf3">Human review &amp; command policy</text><text x="58" y="286" font-size="18" fill="#dceaf3">Flight dynamics / procedures</text><text x="58" y="322" font-size="18" fill="#dceaf3">Approved TC commands</text><rect x="529" y="165" width="367" height="198" rx="15" fill="#1a304a" stroke="#85ddbf" stroke-width="2.5"/><rect x="529" y="165" width="8" height="198" rx="4" fill="#85ddbf"/><text x="547" y="207" font-size="21" font-weight="700" fill="#f4fcff">Ground station</text><text x="547" y="250" font-size="18" fill="#dceaf3">Schedule / radio link control</text><text x="547" y="286" font-size="18" fill="#dceaf3">Uplink: ground → spacecraft</text><text x="547" y="322" font-size="18" fill="#dceaf3">Downlink: spacecraft → ground</text><rect x="1025" y="165" width="370" height="198" rx="15" fill="#1a304a" stroke="#b1aeff" stroke-width="2.5"/><rect x="1025" y="165" width="8" height="198" rx="4" fill="#b1aeff"/><text x="1043" y="207" font-size="21" font-weight="700" fill="#f4fcff">Spacecraft</text><text x="1043" y="250" font-size="18" fill="#dceaf3">TC receiver and control</text><text x="1043" y="286" font-size="18" fill="#dceaf3">Telemetry sources / payloads</text><text x="1043" y="322" font-size="18" fill="#dceaf3">Onboard validation as fitted</text><path d="M400 247H519" fill="none" stroke="#8adbf6" stroke-width="3" marker-end="url(#arr)"/><path d="M897 247H1015" fill="none" stroke="#8adbf6" stroke-width="3" marker-end="url(#arr)"/><path d="M1209 375V428H708V380" stroke="#edc477" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="880" y="418" font-size="17" fill="#e9d4a8">Telemetry downlink (reverse path)</text><rect x="176" y="489" width="1072" height="126" rx="15" fill="#1a304a" stroke="#edc477" stroke-width="2.5"/><rect x="176" y="489" width="8" height="126" rx="4" fill="#edc477"/><text x="194" y="531" font-size="21" font-weight="700" fill="#f4fcff">Mission-specific security gates</text><text x="194" y="574" font-size="18" fill="#dceaf3">Command authentication, authorization, key custody and replay defenses require verified implementation</text><text x="194" y="610" font-size="18" fill="#dceaf3">CCSDS SDLS may be used on applicable links; a CCSDS packet header alone provides no security guarantee</text><rect x="40" y="667" width="1360" height="91" rx="13" fill="#393126" stroke="#f1c77b" stroke-width="2"/><text x="62" y="702" font-size="21" font-weight="700" fill="#fff0c8">No commands or transmissions are implied</text><text x="62" y="734" font-size="17" fill="#f3e0bc">Identify the actual mission protocol, deployed crypto, operator access and RF authorization before assessment.</text><text x="42" y="798" font-size="15" fill="#b8d0e2">Crosslinks and direct-to-user RF paths are optional mission-dependent interfaces, not required stops in this TT&amp;C diagram.</text></g></svg>
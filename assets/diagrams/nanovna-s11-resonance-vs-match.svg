<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" role="img" aria-labelledby="title desc"><title id="title">NanoVNA S11: Reference Plane, Resonance &amp; Match</title><desc id="desc">A vector network analyzer measures reflection relative to its calibration plane. Resistance match and zero reactance are separate constraints. Low VSWR does not guarantee radiation efficiency.</desc><defs><marker id="n" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#89d8f6"/></marker></defs><rect width="1440" height="780" rx="18" fill="#0a192b"/><g font-family="Arial,Helvetica,sans-serif"><text x="36" y="55" fill="#f7faff" font-size="30" font-weight="700">NanoVNA S11: Reference Plane, Resonance &amp; Match</text><text x="36" y="88" fill="#bed3e5" font-size="18">Calibrate at the intended connector before interpreting the antenna feedpoint.</text><path d="M36 115H1404" stroke="#36516b" stroke-width="2"/><rect x="36" y="157" width="325" height="178" rx="14" fill="#183047" stroke="#89d8f6" stroke-width="2.5"/><text x="54" y="198" fill="#f8fcff" font-size="21" font-weight="700">NanoVNA CH0</text><text x="54" y="242" font-size="17" fill="#d7e8f2">Set target frequency span</text><text x="54" y="277" font-size="17" fill="#d7e8f2">S11 and SWR/Smith view</text><rect x="476" y="157" width="339" height="178" rx="14" fill="#183047" stroke="#b9acff" stroke-width="2.5"/><text x="494" y="198" fill="#f8fcff" font-size="21" font-weight="700">Cable &amp; reference plane</text><text x="494" y="242" font-size="17" fill="#d7e8f2">SOL cal at cable end</text><text x="494" y="277" font-size="17" fill="#d7e8f2">Recalibrate if path changes</text><rect x="954" y="157" width="447" height="178" rx="14" fill="#183047" stroke="#72d9b3" stroke-width="2.5"/><text x="972" y="198" fill="#f8fcff" font-size="21" font-weight="700">Antenna feedpoint</text><text x="972" y="242" font-size="17" fill="#d7e8f2">Measure complex impedance Z</text><text x="972" y="277" font-size="17" fill="#d7e8f2">Check resonance and R ≈ 50 Ω</text><path d="M361 239H467" fill="none" stroke="#89d8f6" stroke-width="3" marker-end="url(#n)"/><path d="M815 239H945" fill="none" stroke="#89d8f6" stroke-width="3" marker-end="url(#n)"/><rect x="793" y="153" width="6" height="191" fill="#f3c982"/><text x="698" y="372" font-size="16" fill="#f3d9aa">Cal plane at adapter end</text><rect x="40" y="421" width="650" height="162" rx="14" fill="#183047" stroke="#72d9b3" stroke-width="2.5"/><text x="58" y="462" fill="#f8fcff" font-size="21" font-weight="700">1. Reactance / resonance</text><text x="58" y="506" font-size="17" fill="#d7e8f2">Check whether X is near zero</text><text x="58" y="541" font-size="17" fill="#d7e8f2">Change element geometry cautiously</text><rect x="749" y="421" width="650" height="162" rx="14" fill="#183047" stroke="#edc887" stroke-width="2.5"/><text x="767" y="462" fill="#f8fcff" font-size="21" font-weight="700">2. Resistance / matching</text><text x="767" y="506" font-size="17" fill="#d7e8f2">Compare R with system impedance</text><text x="767" y="541" font-size="17" fill="#d7e8f2">Use verified network or geometry</text><rect x="38" y="632" width="1364" height="85" rx="12" fill="#3b3224" stroke="#edcd82" stroke-width="2"/><text x="60" y="666" font-size="21" font-weight="700" fill="#ffebbf">SWR = impedance match metric, not antenna efficiency</text><text x="60" y="696" font-size="17" fill="#f4e3cb">A lossy antenna may still look well matched. Save a baseline and adjust in small reversible increments.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="730" viewBox="0 0 1380 730" role="img" aria-labelledby="title desc"><title id="title">Cyberdeck zones: illustrative reference topology</title><desc id="desc">A conceptual portable architecture showing approved upstream access, policy-controlled routing, distinct management, sensor, lab and client-test zones, plus out-of-band field RF and storage.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#38bdf8"/></marker></defs><rect width="1380" height="730" rx="20" fill="#0b1223"/><g font-family="Arial,Helvetica,sans-serif"><text x="35" y="56" font-size="31" font-weight="700" fill="#f8fafc">Cyberdeck zones: illustrative reference topology</text><text x="35" y="89" font-size="17" fill="#b8cbe0">The selected hardware, modes, ports and traffic visibility require onsite verification.</text><rect x="470" y="115" width="440" height="72" rx="12" fill="#172d41" stroke="#38bdf8" stroke-width="2"/><text x="690" y="144" text-anchor="middle" font-size="21" font-weight="700" fill="#f8fafc">Approved upstream / GL.iNet</text><text x="690" y="171" text-anchor="middle" font-size="16" fill="#d1e1f0">WISP, NAT or bridge? Verify exact mode.</text><path d="M690 189L690 222" stroke="#38bdf8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="470" y="231" width="440" height="84" rx="12" fill="#172d41" stroke="#e8b44b" stroke-width="2"/><text x="690" y="263" text-anchor="middle" font-size="22" font-weight="700" fill="#f8fafc">MikroTik / chosen router</text><text x="690" y="292" text-anchor="middle" font-size="16" fill="#d1e1f0">Policy boundaries; deny-by-default.</text><path d="M690 317V363M175 363H1205" stroke="#38bdf8" stroke-width="3" fill="none" stroke-dasharray="8 7"/><path d="M187.5 363V401" stroke="#38bdf8" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/><rect x="30" y="410" width="315" height="151" rx="15" fill="#172d41" stroke="#38bdf8" stroke-width="2"/><text x="47" y="451" font-size="20" font-weight="700" fill="#f8fafc">MANAGEMENT</text><text x="47" y="493" font-size="16" fill="#d1e1f0">Operator workstation</text><text x="47" y="523" font-size="16" fill="#d1e1f0">Local admin / console</text><text x="47" y="553" font-size="16" fill="#d1e1f0">No public portal</text><path d="M522.5 363V401" stroke="#38bdf8" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/><rect x="365" y="410" width="315" height="151" rx="15" fill="#172d41" stroke="#38bdf8" stroke-width="2"/><text x="382" y="451" font-size="20" font-weight="700" fill="#f8fafc">SENSOR</text><text x="382" y="493" font-size="16" fill="#d1e1f0">Kismet / IDS or PC</text><text x="382" y="523" font-size="16" fill="#d1e1f0">Only supplied packets</text><text x="382" y="553" font-size="16" fill="#d1e1f0">Validate mirror / TAP</text><path d="M857.5 363V401" stroke="#38bdf8" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/><rect x="700" y="410" width="315" height="151" rx="15" fill="#172d41" stroke="#38bdf8" stroke-width="2"/><text x="717" y="451" font-size="20" font-weight="700" fill="#f8fafc">ISOLATED LAB</text><text x="717" y="493" font-size="16" fill="#d1e1f0">Owned canary hosts</text><text x="717" y="523" font-size="16" fill="#d1e1f0">Synthetic controls</text><text x="717" y="553" font-size="16" fill="#d1e1f0">No production bridge</text><path d="M1192.5 363V401" stroke="#38bdf8" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/><rect x="1035" y="410" width="315" height="151" rx="15" fill="#172d41" stroke="#38bdf8" stroke-width="2"/><text x="1052" y="451" font-size="20" font-weight="700" fill="#f8fafc">CLIENT TEST</text><text x="1052" y="493" font-size="16" fill="#d1e1f0">Separate approved link</text><text x="1052" y="523" font-size="16" fill="#d1e1f0">Named targets only</text><text x="1052" y="553" font-size="16" fill="#d1e1f0">Written ROE required</text><rect x="30" y="604" width="645" height="78" rx="13" fill="#24354a" stroke="#7999ae"/><text x="48" y="631" font-size="19" fill="#f8fafc" font-weight="700">FIELD RF — standalone devices</text><text x="48" y="660" font-size="16" fill="#d1e1f0">Manual, approved operation and export; no implicit network bridge.</text><rect x="705" y="604" width="645" height="78" rx="13" fill="#24354a" stroke="#7999ae"/><text x="723" y="631" font-size="19" fill="#f8fafc" font-weight="700">STORAGE — encrypted evidence vault</text><text x="723" y="660" font-size="16" fill="#d1e1f0">Separate case records, hashes, restricted access and restore tests.</text><text x="30" y="711" font-size="14" fill="#b8cbe0">Dashed lines show conceptual policy-controlled paths, not verified cabling. Same-subnet/offloaded traffic may bypass a sensor or router.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc"><title id="title">AI Projects: Durable State &amp; Handoff</title><desc id="desc">A project charter stores stable scope and acceptance requirements, while status and evidence records track actual work. Handoff is a pointer to an inspectable state, not automatic persistence in a new agent.</desc><defs><marker id="n" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#89d9fa"/></marker></defs><rect width="1440" height="800" rx="20" fill="#0e1a2b"/><g font-family="Arial,Helvetica,sans-serif"><text x="37" y="57" font-size="29" font-weight="700" fill="#f9fdff">AI Projects: Durable State &amp; Handoff</text><text x="37" y="90" font-size="18" fill="#bdd4e6">One authoritative current project state, with exact artifact IDs and explicit review gates.</text><path d="M37 117H1403" stroke="#36516a" stroke-width="2"/><rect x="40" y="162" width="302" height="180" rx="13" fill="#1a304a" stroke="#89d9fa" stroke-width="2.5"/><text x="58" y="202" fill="#f7faff" font-size="20" font-weight="700">PROJECT / AGENTS</text><text x="58" y="244" fill="#d9e8f1" font-size="17">Mission, allowed tools</text><text x="58" y="278" fill="#d9e8f1" font-size="17">Scope &amp; approvals</text><text x="58" y="312" fill="#d9e8f1" font-size="17">Milestone contract</text><rect x="405" y="162" width="302" height="180" rx="13" fill="#1a304a" stroke="#b4acfb" stroke-width="2.5"/><text x="423" y="202" fill="#f7faff" font-size="20" font-weight="700">STATUS / DECISIONS</text><text x="423" y="244" fill="#d9e8f1" font-size="17">Current tasks, blockers</text><text x="423" y="278" fill="#d9e8f1" font-size="17">Rationale and owner</text><text x="423" y="312" fill="#d9e8f1" font-size="17">Specific next action</text><rect x="767" y="162" width="300" height="180" rx="13" fill="#1a304a" stroke="#73dcb8" stroke-width="2.5"/><text x="785" y="202" fill="#f7faff" font-size="20" font-weight="700">EVIDENCE</text><text x="785" y="244" fill="#d9e8f1" font-size="17">Actual tests and logs</text><text x="785" y="278" fill="#d9e8f1" font-size="17">Source commit &amp; outputs</text><text x="785" y="312" fill="#d9e8f1" font-size="17">Known unknowns</text><rect x="1124" y="162" width="278" height="180" rx="13" fill="#1a304a" stroke="#edc982" stroke-width="2.5"/><text x="1142" y="202" fill="#f7faff" font-size="20" font-weight="700">HANDOFF</text><text x="1142" y="244" fill="#d9e8f1" font-size="17">Exact checked state</text><text x="1142" y="278" fill="#d9e8f1" font-size="17">References, not prose</text><text x="1142" y="312" fill="#d9e8f1" font-size="17">Load explicitly</text><path d="M344 252H397" fill="none" stroke="#89d9fa" stroke-width="3" marker-end="url(#n)"/><path d="M709 252H759" fill="none" stroke="#89d9fa" stroke-width="3" marker-end="url(#n)"/><path d="M1068 252H1116" fill="none" stroke="#89d9fa" stroke-width="3" marker-end="url(#n)"/><rect x="312" y="449" width="813" height="131" rx="13" fill="#1a304a" stroke="#73dcb8" stroke-width="2.5"/><text x="330" y="489" fill="#f7faff" font-size="20" font-weight="700">Resume → verify → continue</text><text x="330" y="531" fill="#d9e8f1" font-size="17">Reload authorized files, confirm repo/target state and the next unmet criterion</text><text x="330" y="565" fill="#d9e8f1" font-size="17">Reject stale status; require independent milestone acceptance</text><path d="M1262 342V388H716V441" fill="none" stroke="#89d9fa" stroke-width="3" marker-end="url(#n)"/><rect x="37" y="661" width="1366" height="88" rx="13" fill="#393226" stroke="#ecc57b" stroke-width="2"/><text x="58" y="694" font-size="21" font-weight="700" fill="#fff0c8">Writing HANDOFF.md does not load it into the next assistant</text><text x="58" y="727" font-size="17" fill="#f3e3c9">New sessions must explicitly retrieve current files, source versions, approvals and actual test evidence.</text><text x="38" y="782" font-size="15" fill="#b9ccdf">These example filenames are portable project conventions, not mandatory ChatGPT or GitHub features.</text></g></svg>
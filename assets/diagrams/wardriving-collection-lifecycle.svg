<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 565" role="img" aria-labelledby="title desc"><title id="title">Responsible wireless survey lifecycle</title><desc id="desc">Passive mapping, quality checks and careful treatment of location-linked identifiers. Authorize: Geographic scope: Privacy limits: Permitted radios; Measure: Receive beacons: GPS and timestamps: Document channel; Validate: GPS fix quality: Duplicate records: Signal limitations; Protect: Encrypt inventory: Limit access: Retention policy; Share: Sanitize exports: Confirm disclosure: Report coverage. A passive survey is not permission to deauthenticate, intercept traffic or publicly publish coordinates.</desc><defs><marker id="arr" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#d6edfb"/></marker></defs><rect width="1240" height="565" rx="20" fill="#0b1223"/><g font-family="Arial,Helvetica,sans-serif"><text x="35" y="58" font-size="31" font-weight="700" fill="#f8fafc">Responsible wireless survey lifecycle</text><text x="35" y="92" font-size="17" fill="#b8cbe0">Passive mapping, quality checks and careful treatment of location-linked identifiers</text><rect x="35" y="158" width="219.6" height="258" rx="15" fill="#172d41" stroke="#22d3ee" stroke-opacity=".7" stroke-width="2"/><circle cx="64" cy="191" r="18" fill="#22d3ee"/><text x="64" y="197" font-size="18" font-weight="700" fill="#051320" text-anchor="middle">1</text><text x="51" y="240" font-size="18" font-weight="700" fill="#f8fafc">Authorize</text><text x="51" y="280" font-size="15" fill="#d1e1f0">Geographic scope</text><text x="51" y="312" font-size="15" fill="#d1e1f0">Privacy limits</text><text x="51" y="344" font-size="15" fill="#d1e1f0">Permitted radios</text><path d="M255.6 292h13" stroke="#d6edfb" stroke-width="2.5" marker-end="url(#arr)"/><rect x="272.6" y="158" width="219.6" height="258" rx="15" fill="#172d41" stroke="#22d3ee" stroke-opacity=".7" stroke-width="2"/><circle cx="3
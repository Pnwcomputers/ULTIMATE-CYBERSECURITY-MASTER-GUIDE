<svg xmlns="http://www.w3.org/2000/svg" width="960" height="505" viewBox="0 0 960 505" role="img" aria-labelledby="title desc">
<title id="title">Why segmented sweeps reveal narrow features</title>
<desc id="desc">For the same frequency span, a sparse sweep samples on both sides of a narrow dip without sampling its bottom. Three conceptual segments produce closer points and better reveal the dip. Illustration uses fewer points than the device.</desc>
<rect x="1" y="1" width="958" height="503" rx="12" fill="#f5f8fd" stroke="#c5d5e9"/>
<text x="32" y="49" fill="#14263e" font-family="Arial, sans-serif" font-size="31" font-weight="700" text-anchor="start">Why segmented sweeps reveal narrow features</text>
<text x="32" y="79" fill="#40536d" font-family="Arial, sans-serif" font-size="19" font-weight="500" text-anchor="start">More points across the same span reduce frequency spacing and take longer to collect.</text>
<rect x="32" y="119" width="896" height="144" rx="12" fill="#ffffff" stroke="#c5d5e9"/>
<text x="49" y="155" fill="#14263e" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start">One wide sweep</text>
<text x="49" y="180" fill="#40536d" font-family="Arial, sans-serif" font-size="16" font-weight="500" text-anchor="start">Sparse samples</text>

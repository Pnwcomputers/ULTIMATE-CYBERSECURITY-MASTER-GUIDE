<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="690" viewBox="0 0 1400 690" role="img" aria-labelledby="title desc"><title id="title">PCI DSS scope determination and evidence gates</title><desc id="desc">A conceptual workflow that starts with account data flows, identifies the cardholder data environment and connected-to or security-impacting systems, checks third-party services and segmentation, then requires documented proof before out-of-scope classifications and review sign-off. This does not establish compliance.</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#38bdf8"/></marker></defs><rect width="1400" height="690" rx="20" fill="#0b1223"/><g font-family="Arial,Helvetica,sans-serif"><text x="35" y="54" font-size="30" font-weight="700" fill="#f8fafc">PCI DSS scope: classify by data flow, reachability and security impact</text><text x="35" y="87" font-size="17" fill="#b8cbe0">Conceptual scoping workflow — not a substitute for the PCI DSS standard, testing or assessor judgment</text><rect x="40" y="133" width="300" height="147" rx="15" fill="#172d41" stroke="#38bdf8" stroke-width="2"/><text x="59" y="171" font-size="21" font-weight="700" fill="#f8fafc">1. Find payment data</text><text x="59" y="209" font-size="16" fill="#d1e1f0">PAN / SAD / flows and stores</text><text x="59" y="241" font-size="16" fill="#d1e1f0">Terminals, web, files, backups</text><path d="M344 204H376" stroke="#38bdf8" stroke-width="3" marker-end="url(#arr)"/><rect x="384" y="133" width="300" height="147" rx="15" fill="#172d41" stroke="#38bdf8" stroke-width="2"/><text x="403" y="171" font-size="21" font-weight="700" fill="#f8fafc">2. Identify the CDE</text><text x="403" y="209" font-size="16" fill="#d1e1f0">Storage, processing, transport</text><text x="403" y="241" font-size="16" fill="#d1e1f0">People, processes, networks</text><path d="M688 204H720" stroke="#38bdf8" stroke-width="3" marker-end="url(#arr)"/><rect x="728" y="133" width="300" height="147" rx="15" fill="#172d41" stroke="#38bdf8" stroke-width="2"/><text x="747" y="171" font-size="21" font-weight="700" fill="#f8fafc">3. Check dependencies</text><text x="747" y="209" font-size="16" fill="#d1e1f0">Connected-to and privileged</text><text x="747" y="241" font-size="16" fill="#d1e1f0">Identity, admin, cloud, MSP</text><path d="M1032 204H1064" stroke="#38bdf8" stroke-width="3" marker-end="url(#arr)"/><rect x="1072" y="133" width="288" height="147" rx="15" fill="#172d41" stroke="#e8b44b" stroke-width="2"/><text x="1091" y="171" font-size="21" font-weight="700" fill="#f8fafc">4. Inspect boundaries</text><text x="1091" y="209" font-size="16" fill="#d1e1f0">Segmentation and TPSPs</text><text x="1091" y="241" font-size="16" fill="#d1e1f0">Trace every admin path</text><path d="M700 287V329" stroke="#38bdf8" stroke-width="3" marker-end="url(#arr)"/><rect x="40" y="345" width="1320" height="134" rx="14" fill="#24354a" stroke="#e8b44b" stroke-width="2"/><text x="60" y="382" font-size="23" font-weight="700" fill="#fbd38d">5. Evidence gate for proposed exclusions</text><text x="60" y="415" font-size="18" fill="#f8fafc">No account-data path + no CDE access + no security-impacting privilege + effective segmentation where relied upon</text><text x="60" y="447" font-size="16" fill="#b8cbe0">Record controlled tests, scope rationale, exceptions, third-party responsibilities and change history.</text><path d="M700 486V527" stroke="#38bdf8" stroke-width="3" marker-end="url(#arr)"/><rect x="40" y="543" width="1320" height="103" rx="14" fill="#172d41" stroke="#58c69e" stroke-width="2"/><text x="60" y="580" font-size="23" font-weight="700" fill="#f8fafc">6. Reconcile, document and review</text><text x="60" y="613" font-size="18" fill="#d1e1f0">12.5.1 inventory | 12.5.2 entity scope review | 12.5.2.1 extra service-provider cadence | 11.4.5/11.4.6 segmentation testing</text><text x="40" y="676" font-size="15" fill="#b8cbe0">A missing PAN sample or firewall screenshot does not independently prove a system out of scope. No assessment or testing is represented.</text></g></svg>
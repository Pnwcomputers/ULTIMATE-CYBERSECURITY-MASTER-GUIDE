<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="585" viewBox="0 0 1200 585" role="img" aria-labelledby="title desc"><title id="title">Choose the network boundary for the workload</title><desc id="desc">NAT permits outbound traffic; host-only includes the host; an internal segment must be checked for routes and uplinks.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#286585"/></marker></defs><rect width="1200" height="585" fill="#f6f9fc"/><g font-family="Arial, sans-serif" fill="#16354b"><text x="40" y="48" font-size="30" font-weight="700">Choose the network boundary for the workload</text><rect x="40" y="85" width="542.5" height="120" rx="12" fill="#e4f0f5" stroke="#8faebb"/><text x="56" y="114" font-size="21" font-weight="700">NAT</text><text x="56" y="143" font-size="18">Guest uses host translation</text><text x="56" y="166" font-size="18">Outbound access remains possible</text><path d="M585.5 145h27" stroke="#286585" stroke-width="2" marker-end="url(#arrow)"/><rect x="617.5" y="85" width="542.5" height="120" rx="12" fill="#e4f0f5" stroke="#8faebb"/><text x="633.5" y="114" font-size="21" font-weight="700">Review egress</text><text x="633.5" y="143" font-size="18">Host and LAN may be reachable</text><text x="633.5" y="166" font-size="18">VPN routing must be verified</text><rect x="40" y="230" width="542.5" height="120" rx="12" fill="#fff3d8" stroke="#8faebb"/><text x="56" y="259" font-size="21" font-weight="700">Host-only</text><text x="56" y="288" font-size="18">Guests share a private segment</text><text x="56" y="311" font-size="18">Host also participates</text><path d="M585.5 290h27" stroke="#286585" stroke-width="2" marker-end="url(#arrow)"/><rect x="617.5" y="230" width="542.5" height="120" rx="12" fill="#fff3d8" stroke="#8faebb"/><text x="633.5" y="259" font-size="21" font-weight="700">Review host exposure</text><text x="633.5" y="288" font-size="18">No default external connection</text><text x="633.5" y="311" font-size="18">Host forwarding can change this</text><rect x="40" y="375" width="542.5" height="120" rx="12" fill="#e4f0f5" stroke="#8faebb"/><text x="56" y="404" font-size="21" font-weight="700">Internal / isolated segment</text><text x="56" y="433" font-size="18">Only intended analysis guests</text><text x="56" y="456" font-size="18">No host adapter or uplink</text><path d="M585.5 435h27" stroke="#286585" stroke-width="2" marker-end="url(#arrow)"/><rect x="617.5" y="375" width="542.5" height="120" rx="12" fill="#e4f0f5" stroke="#8faebb"/><text x="633.5" y="404" font-size="21" font-weight="700">Verify actual configuration</text><text x="633.5" y="433" font-size="18">No bridging or hidden route</text><text x="633.5" y="456" font-size="18">Test before sample execution</text><text x="40" y="565" font-size="17">Conceptual comparison; product names and defaults differ. A mode label is not a containment test.</text></g></svg>
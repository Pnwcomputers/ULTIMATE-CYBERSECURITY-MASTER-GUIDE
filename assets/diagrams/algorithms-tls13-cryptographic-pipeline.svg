<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">TLS 1.3: How Cryptographic Algorithms Work Together</title><desc id="desc">Conceptual authenticated handshake and record protection; sequence details vary by negotiated mode.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#80cfff"/></marker><marker id="gold" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#f9bd59"/></marker></defs><rect width="1200" height="680" rx="20" fill="#0c1425"/><g font-family="Arial,Helvetica,sans-serif"><text x="42" y="56" font-size="31" font-weight="700" fill="#f8fafc">TLS 1.3: How Cryptographic Algorithms Work Together</text><text x="42" y="89" font-size="17" fill="#b9cee0">Conceptual authenticated handshake and record protection; sequence details vary by negotiated mode.</text><rect x="40" y="178" width="269" height="241" rx="15" fill="#163149" stroke="#4b98b7" stroke-width="1.8"/><circle cx="68" cy="209" r="17" fill="#38bdf8"/><text x="68" y="215" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#072337" text-anchor="middle">1</text><text x="60" y="255" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="start">Identity &amp; Parameters</text><text x="60" y="295" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#86d8ff" text-anchor="start">Certificate + signatures</text><text x="60" y="342" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#d3e5f4" text-anchor="start">Validate hostname &amp; trust</text><path d="M311 301 L326 301" stroke="#80cfff" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="329" y="178" width="269" height="241" rx="15" fill="#163149" stroke="#4b98b7" stroke-width="1.8"/><circle cx="357" cy="209" r="17" fill="#38bdf8"/><text x="357" y="215" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#072337" text-anchor="middle">2</text><text x="349" y="255" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="start">Key Agreement</text><text x="349" y="295" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#86d8ff" text-anchor="start">(EC)DHE / supported group</text><text x="349" y="342" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#d3e5f4" text-anchor="start">Establish shared secret</text><path d="M600 301 L615 301" stroke="#80cfff" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="618" y="178" width="269" height="241" rx="15" fill="#163149" stroke="#4b98b7" stroke-width="1.8"/><circle cx="646" cy="209" r="17" fill="#38bdf8"/><text x="646" y="215" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#072337" text-anchor="middle">3</text><text x="638" y="255" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="start">Key Derivation</text><text x="638" y="295" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#86d8ff" text-anchor="start">Transcript hash + HKDF</text><text x="638" y="342" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#d3e5f4" text-anchor="start">Derive handshake / traffic keys</text><path d="M889 301 L904 301" stroke="#80cfff" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="907" y="178" width="269" height="241" rx="15" fill="#163149" stroke="#4b98b7" stroke-width="1.8"/><circle cx="935" cy="209" r="17" fill="#38bdf8"/><text x="935" y="215" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#072337" text-anchor="middle">4</text><text x="927" y="255" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="start">Record Protection</text><text x="927" y="295" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#86d8ff" text-anchor="start">AEAD: AES-GCM etc.</text><text x="927" y="342" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#d3e5f4" text-anchor="start">Encrypt &amp; authenticate records</text><rect x="43" y="449" width="546" height="121" rx="15" fill="#262b3c" stroke="#7c809a" stroke-width="1.8"/><text x="66" y="482" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#f9f7f1" text-anchor="start">Important: SHA-256 is NOT encryption</text><text x="66" y="514" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#dcebf5" text-anchor="start">Hash/KDF roles support transcript binding &amp; keys.</text><text x="66" y="544" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#dcebf5" text-anchor="start">Server identity still depends on trust validation.</text><rect x="611" y="449" width="546" height="121" rx="15" fill="#252b3d" stroke="#7c809a" stroke-width="1.8"/><text x="634" y="482" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#f9f7f1" text-anchor="start">Important: AEAD is not authorization</text><text x="634" y="514" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#dcebf5" text-anchor="start">Endpoint compromises can reveal plaintext.</text><text x="634" y="544" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#dcebf5" text-anchor="start">Replay, nonce and key lifetime need protocol controls.</text><rect x="40" y="602" width="1120" height="51" rx="15" fill="#172e43" stroke="#476982" stroke-width="1.8"/><text x="60" y="633" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#d5e9f7" text-anchor="start">Do not build custom TLS or crypto from this figure; use maintained protocol stacks.</text></g></svg>
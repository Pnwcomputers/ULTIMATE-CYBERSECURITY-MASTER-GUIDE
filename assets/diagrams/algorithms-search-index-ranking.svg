<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Search &amp; Indexing: Retrieval Is Not Ranking</title><desc id="desc">Security search pipelines must preserve access controls, source provenance and timestamps.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#80cfff"/></marker><marker id="gold" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#f9bd59"/></marker></defs><rect width="1200" height="650" rx="20" fill="#0c1425"/><g font-family="Arial,Helvetica,sans-serif"><text x="42" y="56" font-size="31" font-weight="700" fill="#f8fafc">Search &amp; Indexing: Retrieval Is Not Ranking</text><text x="42" y="89" font-size="17" fill="#b9cee0">Security search pipelines must preserve access controls, source provenance and timestamps.</text><rect x="36" y="173" width="216" height="236" rx="15" fill="#182d42" stroke="#5286ac" stroke-width="1.8"/><text x="53" y="223" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#fff" text-anchor="start">Raw Events</text><text x="53" y="287" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#8cd6fa" text-anchor="start">Logs / URLs / files</text><text x="53" y="344" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#dcebf5" text-anchor="start">Preserve originals</text><path d="M254 286 L265 286" stroke="#80cfff" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="271" y="173" width="216" height="236" rx="15" fill="#182d42" stroke="#5286ac" stroke-width="1.8"/><text x="288" y="223" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#fff" text-anchor="start">Normalization</text><text x="288" y="287" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#8cd6fa" text-anchor="start">Parse / tokenize</text><text x="288" y="344" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#dcebf5" text-anchor="start">Define comparison</text><path d="M489 286 L500 286" stroke="#80cfff" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="506" y="173" width="216" height="236" rx="15" fill="#182d42" stroke="#5286ac" stroke-width="1.8"/><text x="523" y="223" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#fff" text-anchor="start">Index</text><text x="523" y="287" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#8cd6fa" text-anchor="start">B-tree / inverted</text><text x="523" y="344" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#dcebf5" text-anchor="start">Find candidates</text><path d="M724 286 L735 286" stroke="#80cfff" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="741" y="173" width="216" height="236" rx="15" fill="#182d42" stroke="#5286ac" stroke-width="1.8"/><text x="758" y="223" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#fff" text-anchor="start">Rank &amp; Filter</text><text x="758" y="287" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#8cd6fa" text-anchor="start">PageRank / top-k</text><text x="758" y="344" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#dcebf5" text-anchor="start">Not proof of trust</text><path d="M959 286 L970 286" stroke="#80cfff" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="976" y="173" width="216" height="236" rx="15" fill="#182d42" stroke="#5286ac" stroke-width="1.8"/><text x="993" y="223" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#fff" text-anchor="start">Review</text><text x="993" y="287" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#8cd6fa" text-anchor="start">Tenant / source / time</text><text x="993" y="344" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#dcebf5" text-anchor="start">Validate results</text><rect x="43" y="448" width="541" height="97" rx="15" fill="#273445" stroke="#7099b5" stroke-width="1.8"/><text x="65" y="483" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="start">Binary Search</text><text x="65" y="515" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#dcebf5" text-anchor="start">Sorted input required; database plan may differ.</text><rect x="610" y="448" width="546" height="97" rx="15" fill="#273445" stroke="#7099b5" stroke-width="1.8"/><text x="632" y="483" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="start">PageRank</text><text x="632" y="515" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#dcebf5" text-anchor="start">Graph importance ≠ legitimacy or truth.</text><rect x="40" y="572" width="1120" height="51" rx="15" fill="#172e43" stroke="#476982" stroke-width="1.8"/><text x="60" y="603" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#d5e9f7" text-anchor="start">Missing fields, stale indexes &amp; untrusted ranking signals can create misleading conclusions.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="790" viewBox="0 0 1440 790" role="img" aria-labelledby="title desc"><title id="title">Splunk: Collection, Indexing &amp; Detection</title><desc id="desc">An endpoint Universal Forwarder sends selected events but does not perform indexing or search. The indexer stores and searches events; a separate search head coordinates searches in a distributed deployment.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#8adbf6"/></marker></defs><rect width="1440" height="790" rx="20" fill="#0d192a"/><g font-family="Arial,Helvetica,sans-serif"><text x="40" y="58" font-size="30" font-weight="700" fill="#fbfdff">Splunk: Collection, Indexing &amp; Detection</text><text x="40" y="92" font-size="18" fill="#c0d4e5">A one-instance lab may combine receiving, indexing, and search roles.</text><path d="M40 119H1400" stroke="#354f68" stroke-width="2"/><rect x="40" y="169" width="325" height="213" rx="15" fill="#1a304a" stroke="#90d8fa" stroke-width="2.5"/><rect x="40" y="169" width="8" height="213" rx="4" fill="#90d8fa"/><text x="58" y="211" font-size="21" font-weight="700" fill="#f4fcff">Event-producing host</text><text x="58" y="254" font-size="18" fill="#dceaf3">Windows / Linux source logs</text><text x="58" y="290" font-size="18" fill="#dceaf3">File monitors / inputs</text><text x="58" y="326" font-size="18" fill="#dceaf3">Universal Forwarder</text><rect x="443" y="169" width="327" height="213" rx="15" fill="#1a304a" stroke="#77dfb5" stroke-width="2.5"/><rect x="443" y="169" width="8" height="213" rx="4" fill="#77dfb5"/><text x="461" y="211" font-size="21" font-weight="700" fill="#f4fcff">Receiving / indexing</text><text x="461" y="254" font-size="18" fill="#dceaf3">Configured receiver (9997)</text><text x="461" y="290" font-size="18" fill="#dceaf3">Event processing and storage</text><text x="461" y="326" font-size="18" fill="#dceaf3">Index and sourcetype review</text><rect x="850" y="169" width="331" height="213" rx="15" fill="#1a304a" stroke="#b6a7ff" stroke-width="2.5"/><rect x="850" y="169" width="8" height="213" rx="4" fill="#b6a7ff"/><text x="868" y="211" font-size="21" font-weight="700" fill="#f4fcff">Search head / analyst</text><text x="868" y="254" font-size="18" fill="#dceaf3">Search and saved searches</text><text x="868" y="290" font-size="18" fill="#dceaf3">Alert scheduling where licensed</text><text x="868" y="326" font-size="18" fill="#dceaf3">Confirm actual search results</text><path d="M366 267H434" fill="none" stroke="#8adbf6" stroke-width="3" marker-end="url(#arr)"/><path d="M771 267H841" fill="none" stroke="#8adbf6" stroke-width="3" marker-end="url(#arr)"/><rect x="368" y="460" width="701" height="127" rx="15" fill="#1a304a" stroke="#f2c886" stroke-width="2.5"/><rect x="368" y="460" width="8" height="127" rx="4" fill="#f2c886"/><text x="386" y="502" font-size="21" font-weight="700" fill="#f4fcff">Evidence check</text><text x="386" y="545" font-size="18" fill="#dceaf3">Read back a representative event in the intended index</text><text x="386" y="581" font-size="18" fill="#dceaf3">Test alert rule separately; document drop/parse gaps</text><path d="M1015 383V418H712V451" fill="none" stroke="#8adbf6" stroke-width="3" marker-end="url(#arr)"/><rect x="40" y="646" width="1360" height="91" rx="13" fill="#393126" stroke="#f1c77b" stroke-width="2"/><text x="62" y="681" font-size="21" font-weight="700" fill="#fff0c8">Forwarder present ≠ logs searchable or alerts operational</text><text x="62" y="713" font-size="17" fill="#f3e0bc">A Universal Forwarder cannot itself index or search; licenses and alert features depend on edition.</text><text x="40" y="764" font-size="15" fill="#b8d0e2">Conceptual Splunk Enterprise reference; not a verified or deployed Splunk architecture.</text></g></svg>
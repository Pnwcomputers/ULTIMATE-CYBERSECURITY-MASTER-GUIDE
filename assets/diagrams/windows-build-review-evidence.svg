<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc"><title id="title">Compare effective state against the agreed baseline</title><desc id="desc">Versioned requirement and host evidence determine each result. Changes require their own scope and retest.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#286585"/></marker></defs><rect width="1200" height="440" fill="#f6f9fc"/><g font-family="Arial, sans-serif" fill="#16354b"><text x="40" y="48" font-size="30" font-weight="700">Compare effective state against the agreed baseline</text><rect x="40" y="85" width="350" height="120" rx="12" fill="#e4f0f5" stroke="#8faebb"/><text x="56" y="114" font-size="21" font-weight="700">Select</text><text x="56" y="143" font-size="18">OS, role and benchmark revision</text><text x="56" y="166" font-size="18">Agree profile and exceptions</text><path d="M393 145h27" stroke="#286585" stroke-width="2" marker-end="url(#arrow)"/><rect x="425" y="85" width="350" height="120" rx="12" fill="#e4f0f5" stroke="#8faebb"/><text x="441" y="114" font-size="21" font-weight="700">Observe</text><text x="441" y="143" font-size="18">Collect effective settings</text><text x="441" y="166" font-size="18">Record source and collection time</text><path d="M778 145h27" stroke="#286585" stroke-width="2" marker-end="url(#arrow)"/><rect x="810" y="85" width="350" height="120" rx="12" fill="#e4f0f5" stroke="#8faebb"/><text x="826" y="114" font-size="21" font-weight="700">Assess</text><text x="826" y="143" font-size="18">Compare applicable controls</text><text x="826" y="166" font-size="18">Separate unknown from pass</text><rect x="40" y="230" width="350" height="120" rx="12" fill="#fff3d8" stroke="#8faebb"/><text x="56" y="259" font-size="21" font-weight="700">Report</text><text x="56" y="288" font-size="18">Evidence and affected hosts</text><text x="56" y="311" font-size="18">Owner, impact and priority</text><path d="M393 290h27" stroke="#286585" stroke-width="2" marker-end="url(#arrow)"/><rect x="425" y="230" width="350" height="120" rx="12" fill="#fff3d8" stroke="#8faebb"/><text x="441" y="259" font-size="21" font-weight="700">Remediate within scope</text><text x="441" y="288" font-size="18">Test intended policy changes</text><text x="441" y="311" font-size="18">Preserve operational access</text><path d="M778 290h27" stroke="#286585" stroke-width="2" marker-end="url(#arrow)"/><rect x="810" y="230" width="350" height="120" rx="12" fill="#fff3d8" stroke="#8faebb"/><text x="826" y="259" font-size="21" font-weight="700">Retest</text><text x="826" y="288" font-size="18">Collect new effective evidence</text><text x="826" y="311" font-size="18">Track exceptions and drift</text><text x="40" y="420" font-size="17">Conceptual review workflow; a sampled host, catalog link or score does not prove fleet-wide security.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 660" role="img" aria-labelledby="title desc"><title id="title">Nmap analysis is a review-only evidence workflow</title><desc id="desc">Written scope; separately run approved Nmap scan; minimize and sanitize output; organize observations and candidate CVEs; independently verify exact asset and build evidence; human approves reporting or separate validation. The AgentFlow does not scan, exploit, or change systems.</desc><defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#16324f}.title{font-size:31px;font-weight:700}.subtitle{font-size:18px;fill:#40566f}.scope{fill:#edf4ff;stroke:#4b79a8;stroke-width:2}.card{fill:#fff;stroke:#9bb2c9;stroke-width:2}.data{fill:#fff7e8;stroke:#c89435;stroke-width:2}.agent{fill:#eef0ff;stroke:#6964a8;stroke-width:2}.verify{fill:#eaf7ef;stroke:#4f9465;stroke-width:2}.human{fill:#f3f6fa;stroke:#526b85;stroke-width:2}.num{font-size:14px;font-weight:700;letter-spacing:1px;fill:#586f87}.head{font-size:19px;font-weight:700}.body{font-size:15px}.arrow{stroke:#486883;stroke-width:3;fill:none;marker-end:url(#arrow)}.bar{fill:#102f4d}.bartext{fill:#fff;font-size:18px;font-weight:700}</style><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#486883"/></marker></defs><rect width="1500" height="660" fill="#f5f8fc"/><text x="750" y="48" text-anchor="middle" class="title">NmapAnalyzer: evidence in, review leads out</text><text x="750" y="78" text-anchor="middle" class="subtitle">The AgentFlow analyzes supplied output; it does not perform network activity</text><rect x="30" y="120" width="215" height="300" rx="15" class="scope"/><text x="48" y="153" class="num">01 · SCOPE</text><text x="48" y="188" class="head">Written authority</text><text x="48" y="220" class="body"><tspan x="48">Exact assets, methods,</tspan><tspan x="48" dy="22">rate limits and stop</tspan><tspan x="48" dy="22">conditions are agreed.</tspan></text><path d="M248 268H272" class="arrow"/><rect x="280" y="120" width="215" height="300" rx="15" class="card"/><text x="298" y="153" class="num">02 · SEPARATE STEP</text><text x="298" y="188" class="head">Approved scan</text><text x="298" y="220" class="body"><tspan x="298">A human runs Nmap</tspan><tspan x="298" dy="22">under the engagement</tspan><tspan x="298" dy="22">plan. Review NSE scripts</tspan><tspan x="298" dy="22">and likely impact.</tspan></text><path d="M498 268H522" class="arrow"/><rect x="530" y="120" width="215" height="300" rx="15" class="data"/><text x="548" y="153" class="num">03 · DATA BOUNDARY</text><text x="548" y="188" class="head">Minimize input</text><text x="548" y="220" class="body"><tspan x="548">Remove secrets and</tspan><tspan x="548" dy="22">unneeded identifiers.</tspan><tspan x="548" dy="22">Treat banners and scan</tspan><tspan x="548" dy="22">text as untrusted data.</tspan></text><path d="M748 268H772" class="arrow"/><rect x="780" y="120" width="215" height="300" rx="15" class="agent"/><text x="798" y="153" class="num">04 · AGENTFLOW</text><text x="798" y="188" class="head">Organize evidence</text><text x="798" y="220" class="body"><tspan x="798">Observed services stay</tspan><tspan x="798" dy="22">separate from hypotheses.</tspan><tspan x="798" dy="22">CVE matches are leads,</tspan><tspan x="798" dy="22">not verified findings.</tspan></text><path d="M998 268H1022" class="arrow"/><rect x="1030" y="120" width="215" height="300" rx="15" class="verify"/><text x="1048" y="153" class="num">05 · INDEPENDENT CHECK</text><text x="1048" y="188" class="head">Verify applicability</text><text x="1048" y="220" class="body"><tspan x="1048">Confirm asset, exact</tspan><tspan x="1048" dy="22">build, backports and</tspan><tspan x="1048" dy="22">conditions with vendor</tspan><tspan x="1048" dy="22">and owner evidence.</tspan></text><path d="M1248 268H1272" class="arrow"/><rect x="1280" y="120" width="190" height="300" rx="15" class="human"/><text x="1298" y="153" class="num">06 · HUMAN GATE</text><text x="1298" y="188" class="head">Decide &amp; report</text><text x="1298" y="220" class="body"><tspan x="1298">Owner reviews limits,</tspan><tspan x="1298" dy="22">remediation and any</tspan><tspan x="1298" dy="22">separately approved</tspan><tspan x="1298" dy="22">validation.</tspan></text><rect x="165" y="475" width="1170" height="92" rx="15" class="bar"/><text x="750" y="514" text-anchor="middle" class="bartext">No automatic scan, exploit, credential test or system change from this analysis flow.</text><text x="750" y="545" text-anchor="middle" fill="#d9e6f2" font-size="15">Keep evidence, confidence and limitations attached to every reported conclusion.</text></svg>
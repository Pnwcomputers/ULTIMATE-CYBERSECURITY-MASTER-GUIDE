<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Capture quality: distortion can change the interpretation</title>
<desc id="desc">One trace is smooth and another has flattened peaks to illustrate clipping. Distortion, missing samples and DC artifacts can undermine demodulation. Display color alone is not proof of overload.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
<path d="M0 0 L10 5 L0 10Z" fill="#337b98"/>
</marker>
</defs>
<rect width="1200" height="600" fill="#f4f7fa"/>
<text x="40" y="54" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#16354b">Capture quality: distortion can change the interpretation</text>
<text x="40" y="89" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Schematic amplitude traces • arbitrary units • not measurements or diagnostic guarantees</text>
<rect x="40" y="145" width="535" height="285" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/>
<text x="58" y="179" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16354b">Unclipped illustration</text>
<text x="58" y="217" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Preserve amplitude variation</text>
<rect x="625" y="145" width="535" height="285" rx="16" fill="#fff3d7" stroke="#b5cbd7" stroke-width="2"/>
<text x="643" y="179" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16354b">Clipped illustration</text>

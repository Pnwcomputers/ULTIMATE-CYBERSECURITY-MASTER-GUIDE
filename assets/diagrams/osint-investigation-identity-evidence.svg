<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="identity-title identity-desc"><title id="identity-title">A match is a lead; identity is a separate claim</title><desc id="identity-desc">Synthetic examples distinguish observations from hypotheses: the same username, shared IP or reused photo can have several explanations. Independent evidence and conflicting context must be assessed before stating a qualified conclusion.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#347e99"/></marker></defs><rect width="1200" height="660" fill="#f4f7fa"/><g font-family="Arial, Helvetica, sans-serif" fill="#16364b"><text x="40" y="54" font-size="32" font-weight="700">A match is a lead; identity is a separate claim</text><text x="40" y="91" font-size="20">Original synthetic examples • no people, accounts or addresses were investigated</text><rect x="40" y="145" width="345" height="350" rx="17" fill="#ffffff" stroke="#b3ccdc" stroke-width="2"/><text x="60" y="181" font-size="23">Observed</text><text x="60" y="223" font-size="20">Same username on two sites</text><text x="60" y="254" font-size="20">Two domains share an IP</text><text x="60" y="285" font-size="20">Same picture on two profiles</text><rect x="425" y="145" width="345" height="350" rx="17" fill="#fff3d6" stroke="#b3ccdc" stroke-width="2"/><text x="445" y="181" font-size="23">Possible explanations</text><text x="445" y="223" font-size="20">Reuse, coincidence or copying</text><text x="445" y="254" font-size="20">Shared hosting or common owner</text><text x="445" y="285" font-size="20">Repost, stock image or same user</text><rect x="810" y="145" width="350" height="350" rx="17" fill="#ffffff" stroke="#b3ccdc" stroke-width="2"/><text x="830" y="181" font-size="23">Verification needed</text><text x="830" y="223" font-size="20">Independent corroboration</text><text x="830" y="254" font-size="20">Source dates and history</text><text x="830" y="285" font-size="20">Contradictions and uncertainty</text><path d="M392 310 L416 310" stroke="#347e99" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M777 310 L801 310" stroke="#347e99" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="40" y="545" width="1120" height="86" rx="13" fill="#dfebf1"/><text x="58" y="574" font-size="20">Label graph edges with their evidence and date; keep hypotheses distinct from facts.</text><text x="58" y="605" font-size="20">Several sites repeating one source are not independent confirmation.</text></g></svg>

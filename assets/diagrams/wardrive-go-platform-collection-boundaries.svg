<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 640" role="img" aria-labelledby="title desc"><title id="title">Wardrive Go: Mobile Data Paths</title><desc id="desc">Comparison of Android operating-system permitted observations, optional compatible external adapters and the iOS path via an external iosESP device, leading to locally reviewed location-tagged sessions and optional publication.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#6AD5FF"/></marker></defs><rect width="1440" height="640" rx="18" fill="#0D182A"/><g font-family="Arial,Helvetica,sans-serif"><text x="34" y="57" font-size="32" font-weight="700" fill="#FFFFFF">Wardrive Go: Mobile Data Paths</text><text x="34" y="91" font-size="18" fill="#C4D7E7">Platform features depend on OS permissions, compatible radio devices and current app versions.</text><path d="M34 115H1406" stroke="#344B64" stroke-width="2"/><rect x="34" y="162" width="305" height="270" rx="14" fill="#192D47" stroke="#6AD5FF" stroke-width="2.5"/><rect x="34" y="162" width="7" height="270" rx="3" fill="#6AD5FF"/><text x="53" y="205" font-size="21" font-weight="700" fill="#FFFFFF">1  Android phone</text><text x="53" y="265" font-size="18" fill="#D5E4F1">OS-permitted Wi-Fi/BLE</text><text x="53" y="303" font-size="18" fill="#D5E4F1">Optional supported OTG</text><text x="53" y="341" font-size="18" fill="#D5E4F1">Confirm known test AP</text><path d="M342 297H376" fill="none" stroke="#6AD5FF" stroke-width="3" marker-end="url(#arrow)"/><rect x="389" y="162" width="305" height="270" rx="14" fill="#192D47" stroke="#B6ABFF" stroke-width="2.5"/><rect x="389" y="162" width="7" height="270" rx="3" fill="#B6ABFF"/><text x="408" y="205" font-size="21" font-weight="700" fill="#FFFFFF">2  iPhone / iPad</text><text x="408" y="265" font-size="18" fill="#D5E4F1">Phone BLE &amp; location</text><text x="408" y="303" font-size="18" fill="#D5E4F1">Wi-Fi via supported iosESP</text><text x="408" y="341" font-size="18" fill="#D5E4F1">Check board-to-app link</text><path d="M697 297H731" fill="none" stroke="#6AD5FF" stroke-width="3" marker-end="url(#arrow)"/><rect x="744" y="162" width="305" height="270" rx="14" fill="#192D47" stroke="#70DEB6" stroke-width="2.5"/><rect x="744" y="162" width="7" height="270" rx="3" fill="#70DEB6"/><text x="763" y="205" font-size="21" font-weight="700" fill="#FFFFFF">3  Local session</text><text x="763" y="265" font-size="18" fill="#D5E4F1">Validate GNSS &amp; time</text><text x="763" y="303" font-size="18" fill="#D5E4F1">Check scan provenance</text><text x="763" y="341" font-size="18" fill="#D5E4F1">Inspect classification</text><path d="M1052 297H1086" fill="none" stroke="#6AD5FF" stroke-width="3" marker-end="url(#arrow)"/><rect x="1099" y="162" width="305" height="270" rx="14" fill="#192D47" stroke="#F1CD84" stroke-width="2.5"/><rect x="1099" y="162" width="7" height="270" rx="3" fill="#F1CD84"/><text x="1118" y="205" font-size="21" font-weight="700" fill="#FFFFFF">4  Share only if allowed</text><text x="1118" y="265" font-size="18" fill="#D5E4F1">Review exclusion rules</text><text x="1118" y="303" font-size="18" fill="#D5E4F1">Minimize BSSID/GPS data</text><text x="1118" y="341" font-size="18" fill="#D5E4F1">Confirm upload consent</text><rect x="34" y="481" width="1372" height="98" rx="12" fill="#353226" stroke="#F1CD84" stroke-width="2"/><text x="53" y="519" font-size="21" font-weight="700" fill="#FFF1C9">Safety / interpretation boundary</text><text x="53" y="551" font-size="17" fill="#F2E4CA">An iOS phone alone does not imply general native Wi-Fi scanning or monitor-mode access.</text></g></svg>
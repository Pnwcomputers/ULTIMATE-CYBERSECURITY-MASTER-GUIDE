<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
<title id="title">Observation, decoding and attribution need different evidence</title>
<desc id="desc">Energy detection establishes an observed signal under test conditions, decoding produces an interpretation, and attribution requires independent evidence. Quiet samples do not establish spectrum availability.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
<path d="M0 0L10 5L0 10Z" fill="#337b98"/>
</marker>
</defs>
<rect width="1200" height="580" fill="#f4f7fa"/>
<text x="40" y="54" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#16354b">Observation, decoding and attribution need different evidence</text>
<text x="40" y="89" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Conceptual reasoning ladder • no authenticated signal or incident implied</text>
<rect x="40" y="155" width="250" height="215" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/>
<text x="58" y="189" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16354b">Observe</text>
<text x="58" y="228" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Energy / timing / bandwidth</text>
<text x="58" y="257" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Receiver conditions</text>
<path d="M298 260L319 260" stroke="#337b98" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
<rect x="330" y="155" width="250" height="215" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/>
<text x="348" y="189" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16354b">Decode</text>
<text x="348" y="228" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Supported modulation</text>
<text x="348" y="257" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Validated frame fields</text>
<path d="M588 260L609 260" stroke="#337b98" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
<rect x="620" y="155" width="250" height="215" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/>
<text x="638" y="189" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16354b">Assess</text>
<text x="638" y="228" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Consistency and limits</text>
<text x="638" y="257" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Independent evidence</text>
<path d="M878 260L899 260" stroke="#337b98" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
<rect x="910" y="155" width="250" height="215" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/>
<text x="928" y="189" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16354b">Attribute</text>
<text x="928" y="228" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Identity / intent claims</text>
<text x="928" y="257" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Need corroboration</text>
<rect x="40" y="465" width="1120" height="85" rx="12" fill="#e0ebf1"/>
<text x="58" y="495" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Uncalibrated FFT or sample power is not dBm. High entropy does not prove encryption.</text>
<text x="58" y="524" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">A quiet channel, valid checksum or reported identifier is not proof of authority, authenticity or intent.</text>
</svg>

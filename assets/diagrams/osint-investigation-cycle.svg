<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="cycle-title cycle-desc"><title id="cycle-title">A question-led investigation leaves a reviewable trail</title><desc id="cycle-desc">Conceptual seven-stage cycle. Define requirements and limits, select sources, collect within scope, preserve and process, analyze alternatives, report qualified findings, and feed unanswered questions back into the plan.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#347e99"/></marker></defs><rect width="1200" height="660" fill="#f4f7fa"/><g font-family="Arial, Helvetica, sans-serif" fill="#16364b"><text x="40" y="54" font-size="32" font-weight="700">A question-led investigation leaves a reviewable trail</text><text x="40" y="91" font-size="20">Original conceptual model • no actual investigation or collection</text><rect x="40" y="145" width="250" height="170" rx="17" fill="#ffffff" stroke="#b3ccdc" stroke-width="2"/><text x="60" y="181" font-size="23">1. Define</text><text x="60" y="223" font-size="20">Question and purpose</text><text x="60" y="254" font-size="20">Authority and limits</text><rect x="330" y="145" width="250" height="170" rx="17" fill="#ffffff" stroke="#b3ccdc" stroke-width="2"/><text x="350" y="181" font-size="23">2. Select</text><text x="350" y="223" font-size="20">Primary source paths</text><text x="350" y="254" font-size="20">Access and disclosure</text><rect x="620" y="145" width="250" height="170" rx="17" fill="#ffffff" stroke="#b3ccdc" stroke-width="2"/><text x="640" y="181" font-size="23">3. Collect</text><text x="640" y="223" font-size="20">Bounded observations</text><text x="640" y="254" font-size="20">Record errors too</text><rect x="910" y="145" width="250" height="170" rx="17" fill="#ffffff" stroke="#b3ccdc" stroke-width="2"/><text x="930" y="181" font-size="23">4. Preserve</text><text x="930" y="223" font-size="20">Source and UTC time</text><text x="930" y="254" font-size="20">Originals and context</text><path d="M298 230 L320 230" stroke="#347e99" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M588 230 L610 230" stroke="#347e99" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M878 230 L900 230" stroke="#347e99" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="40" y="360" width="345" height="165" rx="17" fill="#ffffff" stroke="#b3ccdc" stroke-width="2"/><text x="60" y="396" font-size="23">5. Analyze</text><text x="60" y="438" font-size="20">Compare independent evidence</text><text x="60" y="469" font-size="20">Test other explanations</text><rect x="425" y="360" width="345" height="165" rx="17" fill="#ffffff" stroke="#b3ccdc" stroke-width="2"/><text x="445" y="396" font-size="23">6. Report</text><text x="445" y="438" font-size="20">Facts, inferences, uncertainty</text><text x="445" y="469" font-size="20">Minimized supporting record</text><rect x="810" y="360" width="350" height="165" rx="17" fill="#ffffff" stroke="#b3ccdc" stroke-width="2"/><text x="830" y="396" font-size="23">7. Revisit</text><text x="830" y="438" font-size="20">What is still unanswered?</text><text x="830" y="469" font-size="20">Refine scope before collecting</text><path d="M392 440 L416 440" stroke="#347e99" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M777 440 L801 440" stroke="#347e99" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="40" y="566" width="1120" height="86" rx="13" fill="#dfebf1"/><text x="58" y="595" font-size="20">Pause when authority, source reliability or collection effects are unclear.</text><text x="58" y="626" font-size="20">More results do not automatically mean more confidence.</text></g></svg>

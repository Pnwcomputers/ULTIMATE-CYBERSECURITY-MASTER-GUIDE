<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 900" role="img" aria-labelledby="title desc">
<title id="title">Journalist source data crosses device, account, copy, and network boundaries</title>
<desc id="desc">A conceptual flow moves source information from a source through a reporter's device and an account or cloud service to newsroom or recipient devices. A separate network path connects the endpoint to online services, with optional VPN routing. The diagram distinguishes endpoint encryption and lock controls, account authentication and recovery, sync and backup review, and approved newsroom handling. Each layer addresses a different boundary.</desc>
<defs><style>.bg{fill:#f4f7fb}.band{fill:#17354f}.box{fill:#fff;stroke:#b7c8d8;stroke-width:2}.device{fill:#e7f3fb;stroke:#5d94ba;stroke-width:2}.account{fill:#edf0fc;stroke:#7d82bd;stroke-width:2}.source{fill:#fff2dc;stroke:#c3923e;stroke-width:2}.recipient{fill:#e9f5ed;stroke:#60a075;stroke-width:2}.warning{fill:#fff0ef;stroke:#c66d62;stroke-width:2}.t{font:700 20px system-ui,Segoe UI,Arial,sans-serif;fill:#17354f}.b{font:15px system-ui,Segoe UI,Arial,sans-serif;fill:#314a60}.h{font:700 23px system-ui,Segoe UI,Arial,sans-serif;fill:white}.title{font:700 29px system-ui,Segoe UI,Arial,sans-serif;fill:#17354f}.arrow{stroke:#496b85;stroke-width:3;fill:none;marker-end:url(#a)}.dash{stroke:#5e7790;stroke-width:2;fill:none;stroke-dasharray:8 6;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="#496b85"/></marker></defs>
<rect class="bg" width="1320" height="900" rx="20"/><text class="title" x="48" y="50">Protect each boundary where source data can persist or be exposed</text>
<rect class="band" x="48" y="72" width="1224" height="50" rx="12"/><text class="h" x="72" y="105">1  Follow the data and its copies</text>
<rect class="source" x="48" y="148" width="220" height="150" rx="14"/><text class="t" x="72" y="183">Source / contact</text><text class="b" x="72" y="216">Identity and contact</text><text class="b" x="72" y="241">details may be sensitive</text><text class="b" x="72" y="266">before a message is sent.</text>
<rect class="device" x="320" y="148" width="260" height="150" rx="14"/><text class="t" x="344" y="183">Reporter device</text><text class="b" x="344" y="216">Messages, contacts, files,</text><text class="b" x="344" y="241">photos, previews, caches,</text><text class="b" x="344" y="266">and location metadata.</text>
<rect class="account" x="638" y="148" width="290" height="150" rx="14"/><text class="t" x="662" y="183">App / account / cloud</text><text class="b" x="662" y="216">Sync, backups, version history,</text><text class="b" x="662" y="241">recovery methods, and provider</text><text class="b" x="662" y="266">records have separate access.</text>
<rect class="recipient" x="986" y="148" width="286" height="150" rx="14"/><text class="t" x="1010" y="183">Newsroom / recipient</text><text class="b" x="1010" y="216">Copies can reach other devices,</text><text class="b" x="1010" y="241">shared drives, editors, or</text><text class="b" x="1010" y="266">publication workflows.</text>
<path class="arrow" d="M268 223H312"/><path class="arrow" d="M580 223H630"/><path class="arrow" d="M928 223H978"/>
<text class="b" x="294" y="326">Information can be copied at every step; encryption at one step does not remove the other copies.</text>
<rect class="band" x="48" y="362" width="1224" height="50" rx="12"/><text class="h" x="72" y="395">2  Network routing is a separate boundary</text>
<rect class="box" x="72" y="442" width="245" height="100" rx="12"/><text class="t" x="98" y="479">Device and app</text><text class="b" x="98" y="510">Only configured traffic</text><path class="arrow" d="M317 492H400"/>
<rect class="box" x="400" y="442" width="250" height="100" rx="12"/><text class="t" x="426" y="479">Wi-Fi / carrier / ISP</text><text class="b" x="426" y="510">Local network boundary</text><path class="dash" d="M650 492H735"/>
<rect class="account" x="735" y="442" width="220" height="100" rx="12"/><text class="t" x="762" y="479">Optional VPN</text><text class="b" x="762" y="510">Trust shifts to provider</text><path class="arrow" d="M955 492H1030"/>
<rect class="box" x="1030" y="442" width="242" height="100" rx="12"/><text class="t" x="1058" y="479">Online service</text><text class="b" x="1058" y="510">Account and content rules</text>
<text class="b" x="72" y="570">A VPN changes which network operator sees the connection; it does not protect an unlocked device, account, or stored backup.</text>
<rect class="band" x="48" y="598" width="1224" height="50" rx="12"/><text class="h" x="72" y="631">3  Match controls to the layer they protect</text>
<rect class="device" x="48" y="672" width="286" height="150" rx="14"/><text class="t" x="72" y="708">Endpoint</text><text class="b" x="72" y="738">Strong passcode, encryption,</text><text class="b" x="72" y="762">updates, auto-lock; test recovery.</text><text class="b" x="72" y="790">Unlocked/seized risk remains.</text>
<rect class="account" x="363" y="672" width="286" height="150" rx="14"/><text class="t" x="387" y="708">Accounts</text><text class="b" x="387" y="738">Phishing-resistant sign-in,</text><text class="b" x="387" y="762">separate recovery, session review.</text><text class="b" x="387" y="790">Review provider-held data.</text>
<rect class="source" x="678" y="672" width="286" height="150" rx="14"/><text class="t" x="702" y="708">Copies and sync</text><text class="b" x="702" y="738">Review previews, backups,</text><text class="b" x="702" y="762">sharing, and photo/contact sync.</text><text class="b" x="702" y="790">Keep only what policy needs.</text>
<rect class="recipient" x="993" y="672" width="279" height="150" rx="14"/><text class="t" x="1017" y="708">Newsroom process</text><text class="b" x="1017" y="738">Approved intake, custody,</text><text class="b" x="1017" y="762">retention, and safety plans.</text><text class="b" x="1017" y="790">Coordinate with an editor.</text>
<rect class="warning" x="48" y="840" width="1224" height="38" rx="10"/><text class="b" x="72" y="865">Conceptual map: end-to-end encryption protects a message in transit, not compromised endpoints or separately stored backups.</text>
</svg>
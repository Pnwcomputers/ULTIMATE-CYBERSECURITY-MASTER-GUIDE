<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" role="img" aria-labelledby="title desc">
  <title id="title">Key OWASP Top 10 changes from 2021 to final 2025 edition</title>
  <desc id="desc">2021 vulnerable and outdated components expands to 2025 software supply chain failures. 2021 SSRF is incorporated into 2025 broken access control. 2025 adds mishandling of exceptional conditions. The 2025 edition is final and 2021 is superseded.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#294862"/></marker><style>
    .title{font:700 28px system-ui,sans-serif;fill:#102a43}.label{font:700 19px system-ui,sans-serif;fill:#102a43}.body{font:16px system-ui,sans-serif;fill:#243b53}.small{font:14px system-ui,sans-serif;fill:#334e68}.box{rx:16;stroke-width:2}.line{stroke:#294862;stroke-width:4;fill:none;marker-end:url(#arrow)}
  </style></defs>
  <rect width="1240" height="600" rx="24" fill="#f5f8fb"/>
  <text x="48" y="52" class="title">What changed between the 2021 list and final 2025 list?</text>
  <rect x="45" y="108" width="490" height="150" class="box" fill="#e6f0fa" stroke="#7aa7d3"/>
  <text x="75" y="148" class="label">Expanded category</text>
  <text x="80" y="190" class="body">A06:2021 Vulnerable and Outdated Components</text>
  <path d="M280 202 H450" class="line"/>
  <text x="80" y="235" class="body">A03:2025 Software Supply Chain Failures</text>
  <rect x="705" y="108" width="490" height="150" class="box" fill="#e7f5ec" stroke="#62a878"/>
  <text x="735" y="148" class="label">Moved into a broader risk</text>
  <text x="740" y="190" class="body">A10:2021 Server-Side Request Forgery (SSRF)</text>
  <path d="M940 202 H1110" class="line"/>
  <text x="740" y="235" class="body">A01:2025 Broken Access Control</text>
  <rect x="45" y="315" width="490" height="150" class="box" fill="#fff3cd" stroke="#d6a638"/>
  <text x="75" y="355" class="label">New 2025 category</text>
  <text x="80" y="397" class="body">A10:2025 Mishandling of Exceptional</text><text x="80" y="424" class="body">Conditions — error handling, logic errors, fail-open</text>
  <rect x="705" y="315" width="490" height="150" class="box" fill="#e9e5f7" stroke="#9286c2"/>
  <text x="735" y="355" class="label">Edition status</text>
  <text x="740" y="397" class="body">2025: Final and current edition</text>
  <text x="740" y="430" class="body">2021: Superseded; retain for historical mapping</text>
  <rect x="45" y="515" width="1150" height="48" rx="12" fill="#dce7f0"/>
  <text x="620" y="545" text-anchor="middle" class="small">Use the 2021→2025 crosswalk for historical reports; category mappings are not always one-to-one.</text>
</svg>
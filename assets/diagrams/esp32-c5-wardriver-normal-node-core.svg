<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="785" viewBox="0 0 1440 785" role="img" aria-labelledby="title desc"><title id="title">ESP32-C5 Wardriver: Normal, Node &amp; Core Roles</title><desc id="desc">The same C5 project can log a local GPS-tagged survey, forward observations as a Node or aggregate Node observations as a Core. Only validated capture/log roles can support a report.</desc><rect x="0" y="0" width="1440" height="785" rx="18" fill="#0d1a2c"/><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#83d9f7"/></marker></defs><g font-family="Arial,Helvetica,sans-serif"><text x="38" y="55" font-size="29" font-weight="700" fill="#f7faff">ESP32-C5 Wardriver: Normal, Node &amp; Core Roles</text><text x="38" y="90" font-size="18" fill="#bdd4e5">Core mode aggregates and geotags Node observations; it is not itself another independent scanner.</text><path d="M38 116H1402" stroke="#36516a" stroke-width="2"/><rect x="39" y="158" width="433" height="241" rx="13" fill="#1b3047" stroke="#80d9f7" stroke-width="2.3"/><text x="58" y="199" font-size="21" font-weight="700" fill="#f9fcff">Normal / standalone</text><text x="58" y="240" font-size="17" fill="#dae9f3">C5 radio discovers permitted APs</text><text x="58" y="274" font-size="17" fill="#dae9f3">GPS fix + SD / logger needed</text><text x="58" y="308" font-size="17" fill="#dae9f3">Local WiGLE-style export</text><rect x="505" y="158" width="434" height="241" rx="13" fill="#1b3047" stroke="#b2abff" stroke-width="2.3"/><text x="524" y="199" font-size="21" font-weight="700" fill="#f9fcff">Node mode</text><text x="524" y="240" font-size="17" fill="#dae9f3">C5 radio observes nearby RF</text><text x="524" y="274" font-size="17" fill="#dae9f3">Forwards observations to Core</text><text x="524" y="308" font-size="17" fill="#dae9f3">No assumed local CSV</text><rect x="970" y="158" width="430" height="241" rx="13" fill="#1b3047" stroke="#73dbb9" stroke-width="2.3"/><text x="989" y="199" font-size="21" font-weight="700" fill="#f9fcff">Core mode</text><text x="989" y="240" font-size="17" fill="#dae9f3">Accepts linked Node reports</text><text x="989" y="274" font-size="17" fill="#dae9f3">Provides GPS and log destination</text><text x="989" y="308" font-size="17" fill="#dae9f3">No separate own RF scan</text><path d="M940 289H962" fill="none" stroke="#83d9f7" stroke-width="3" marker-end="url(#arr)"/><rect x="225" y="466" width="996" height="124" rx="13" fill="#1b3047" stroke="#edc985" stroke-width="2.3"/><text x="244" y="507" font-size="21" font-weight="700" fill="#f9fcff">Case export and privacy check</text><text x="244" y="548" font-size="17" fill="#dae9f3">Confirm source radio, GNSS time/accuracy, route and saved record location</text><text x="244" y="582" font-size="17" fill="#dae9f3">Review opt-in WiGLE / WDGWars publication, exclusions and exact endpoint</text><path d="M255 399V442H715V458" fill="none" stroke="#83d9f7" stroke-width="3" marker-end="url(#arr)"/><path d="M1168 399V442H730V458" fill="none" stroke="#83d9f7" stroke-width="3" marker-end="url(#arr)"/><rect x="40" y="654" width="1360" height="91" rx="12" fill="#3c3228" stroke="#edc985" stroke-width="2"/><text x="62" y="688" font-size="21" font-weight="700" fill="#ffedc2">One C5 radio does not monitor both Wi-Fi bands simultaneously</text><text x="62" y="721" font-size="17" fill="#f3e2ca">Document channel dwell, power-jumper compatibility and real test AP results per firmware/hardware build.</text><text x="40" y="766" font-size="15" fill="#b8cede">Illustrative device mode chart from upstream ESP32DualBandWardriver; no device flash or survey performed.</text></g></svg>
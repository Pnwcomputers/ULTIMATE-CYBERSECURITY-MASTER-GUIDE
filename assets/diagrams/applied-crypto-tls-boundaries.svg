<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">TLS protects a channel with a verified peer</title><desc id="desc">Conceptual server-authenticated TLS: the client checks chain, validity and intended hostname; the encrypted channel reaches the TLS endpoint. Application authorization and session protection remain additional controls.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#337b98"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#16354b}.heading{font-size:32px;font-weight:700}.label{font-size:24px;font-weight:700}.body{font-size:22px}.note{font-size:20px}</style><rect width="1200" height="600" fill="#f4f7fa"/><text x="36" y="50" class="heading"><tspan x="36" dy="0">TLS protects a channel with a verified peer</tspan></text><text x="36" y="88" class="note"><tspan x="36" dy="0">Conceptual server-authenticated connection • no real traffic or test results</tspan></text><rect x="36" y="132" width="330" height="225" rx="14" fill="#fff" stroke="#b5cbd7" stroke-width="2"/><text x="58" y="170" class="label"><tspan x="58" dy="0">1  Client validation</tspan></text><text x="58" y="214" class="body"><tspan x="58" dy="0">Trusted certificate chain</tspan><tspan x="58" dy="30">Certificate validity</tspan><tspan x="58" dy="30">Expected hostname</tspan><tspan x="58" dy="30">Reject verification errors</tspan></text><rect x="435" y="132" width="330" height="225" rx="14" fill="#fff" stroke="#b5cbd7" stroke-width="2"/><text x="457" y="170" class="label"><tspan x="457" dy="0">2  TLS endpoint</tspan></text><text x="457" y="214" class="body"><tspan x="457" dy="0">Negotiate secure settings</tspan><tspan x="457" dy="30">Authenticate the server</tspan><tspan x="457" dy="30">Protect channel records</tspan><tspan x="457" dy="30">Terminate TLS here</tspan></text><rect x="834" y="132" width="330" height="225" rx="14" fill="#fff" stroke="#b5cbd7" stroke-width="2"/><text x="856" y="170" class="label"><tspan x="856" dy="0">3  Application</tspan></text><text x="856" y="214" class="body"><tspan x="856" dy="0">Authenticate the user</tspan><tspan x="856" dy="30">Authorize each action</tspan><tspan x="856" dy="30">Protect sessions</tspan><tspan x="856" dy="30">Validate application input</tspan></text><path d="M372,242 L427,242" fill="none" stroke="#337b98" stroke-width="3" marker-end="url(#arrow)"/><path d="M771,242 L826,242" fill="none" stroke="#337b98" stroke-width="3" marker-end="url(#arrow)"/><rect x="36" y="407" width="1128" height="144" rx="14" fill="#fff3d7" stroke="#b5cbd7" stroke-width="2"/><text x="58" y="445" class="label"><tspan x="58" dy="0">Boundary to review</tspan></text><text x="58" y="489" class="body"><tspan x="58" dy="0">A reverse proxy may be the TLS endpoint. Protect any onward hop separately.</tspan><tspan x="58" dy="30">A valid certificate or strong cipher suite does not establish application security.</tspan></text></svg>

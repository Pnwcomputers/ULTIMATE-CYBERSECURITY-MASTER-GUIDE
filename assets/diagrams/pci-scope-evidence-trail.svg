<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" role="img" aria-labelledby="title desc">
  <title id="title">Build a PCI DSS scoping evidence trail</title>
  <desc id="desc">Reconcile payment flows with assets and providers. Review each exclusion against connectivity and security dependencies. Record unresolved decisions and private sign-off.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#44728a"/>
    </marker>
  </defs>
  <rect width="900" height="410" rx="18" fill="#eef4fa"/>
  <g font-family="system-ui, sans-serif" fill="#17334a">
    <text x="35" y="54" font-size="31" font-weight="700">Build a PCI DSS scoping evidence trail</text>
    <g transform="translate(35 108)">
      <rect width="250" height="232" rx="14" fill="#fff" stroke="#a6becd"/>
      <text x="16" y="39" font-size="20" font-weight="700">Map the payment flows</text>
      <text x="16" y="78" font-size="17">List channels and stages</text>
      <text x="16" y="110" font-size="17">Trace account data</text>
      <text x="16" y="142" font-size="17">Match flows to assets</text>
    </g>
    <g transform="translate(325 108)">
      <rect width="250" height="232" rx="14" fill="#fff" stroke="#a6becd"/>
      <text x="16" y="39" font-size="20" font-weight="700">Review proposed scope</text>
      <text x="16" y="78" font-size="17">Trace admin dependencies</text>
      <text x="16" y="110" font-size="17">Check provider evidence</text>
      <text x="16" y="142" font-size="17">Verify exclusions</text>
    </g>
    <g transform="translate(615 108)">
      <rect width="250" height="232" rx="14" fill="#fff" stroke="#a6becd"/>
      <text x="16" y="39" font-size="20" font-weight="700">Record the decision</text>
      <text x="16" y="78" font-size="17">Assign unresolved items</text>
      <text x="16" y="110" font-size="17">Keep evidence private</text>
      <text x="16" y="142" font-size="17">Schedule reconfirmation</text>
    </g>
  </g>
  <g fill="none" stroke="#44728a" stroke-width="3" marker-end="url(#arrow)">
    <path d="M288 222H321"/>
    <path d="M578 222H611"/>
  </g>
</svg>

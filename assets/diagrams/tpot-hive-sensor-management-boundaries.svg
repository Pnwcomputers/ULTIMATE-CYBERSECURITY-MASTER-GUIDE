<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="775" viewBox="0 0 1440 775" role="img" aria-labelledby="title desc"><title id="title">T-Pot: Sensor / Hive &amp; Administrative Separation</title><desc id="desc">T-Pot deployment options include local honeypot containers and centralized stack components. Sensor log forwarding and trusted management traffic are separate from hostile decoy ingress.</desc><defs><marker id="n" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#89d8f6"/></marker></defs><rect width="1440" height="775" rx="18" fill="#0a192b"/><g font-family="Arial,Helvetica,sans-serif"><text x="36" y="55" fill="#f7faff" font-size="30" font-weight="700">T-Pot: Sensor / Hive &amp; Administrative Separation</text><text x="36" y="88" fill="#bed3e5" font-size="18">Validate current T-Pot release profile, exposed ports and outbound data-sharing options.</text><path d="M36 115H1404" stroke="#36516b" stroke-width="2"/><rect x="38" y="157" width="376" height="170" rx="14" fill="#183047" stroke="#f4a8a3" stroke-width="2.5"/><text x="56" y="198" fill="#f8fcff" font-size="21" font-weight="700">Untrusted decoy traffic</text><text x="56" y="242" font-size="17" fill="#d7e8f2">Authorized exposure only</text><text x="56" y="277" font-size="17" fill="#d7e8f2">Isolate guests/host egress</text><rect x="513" y="157" width="399" height="170" rx="14" fill="#183047" stroke="#8dd4f3" stroke-width="2.5"/><text x="531" y="198" fill="#f8fcff" font-size="21" font-weight="700">Sensor role (optional)</text><text x="531" y="242" font-size="17" fill="#d7e8f2">Honeypot containers</text><text x="531" y="277" font-size="17" fill="#d7e8f2">Local events / ship to Hive</text><rect x="1011" y="157" width="392" height="170" rx="14" fill="#183047" stroke="#70dcb4" stroke-width="2.5"/><text x="1029" y="198" fill="#f8fcff" font-size="21" font-weight="700">Hive role</text><text x="1029" y="242" font-size="17" fill="#d7e8f2">Log ingestion / Elastic stack</text><text x="1029" y="277" font-size="17" fill="#d7e8f2">Search, analysis, dashboards</text><path d="M414 240H504" fill="none" stroke="#89d8f6" stroke-width="3" marker-end="url(#n)"/><path d="M912 240H1002" fill="none" stroke="#89d8f6" stroke-width="3" marker-end="url(#n)"/><rect x="267" y="410" width="914" height="146" rx="14" fill="#183047" stroke="#b9acff" stroke-width="2.5"/><text x="285" y="451" fill="#f8fcff" font-size="21" font-weight="700">Separate trusted management</text><text x="285" y="495" font-size="17" fill="#d7e8f2">Restrict WebUI and SSH to approved admin source networks</text><text x="285" y="530" font-size="17" fill="#d7e8f2">Do not expose management endpoints with decoy listeners</text><path d="M730 410V362H211V337" stroke="#f4a8a3" stroke-width="3" fill="none" stroke-dasharray="12 9"/><text x="62" y="387" fill="#f7c4bd" font-size="16">No trust inheritance from decoy zone</text><rect x="38" y="638" width="1364" height="85" rx="12" fill="#3b3224" stroke="#edcd82" stroke-width="2"/><text x="60" y="672" font-size="21" font-weight="700" fill="#ffebbf">Avoid duplicate ingestion and unreviewed publication</text><text x="60" y="702" font-size="17" fill="#f4e3cb">T-Pot already provides a native Elastic pipeline; review community telemetry submission and any separate Wazuh integration.</text></g></svg>
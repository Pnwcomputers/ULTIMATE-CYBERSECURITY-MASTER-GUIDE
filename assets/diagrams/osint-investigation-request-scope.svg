<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="scope-title scope-desc"><title id="scope-title">Choose the activity before choosing the tool</title><desc id="scope-desc">Three conceptual request classes: querying an existing provider dataset discloses the query to that provider, DNS requests go to resolvers and potentially authoritative servers, and direct web requests or scans contact target services. Actual modules and options decide the class.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#347e99"/></marker></defs><rect width="1200" height="660" fill="#f4f7fa"/><g font-family="Arial, Helvetica, sans-serif" fill="#16364b"><text x="40" y="54" font-size="32" font-weight="700">Choose the activity before choosing the tool</text><text x="40" y="91" font-size="20">Original scope model • tool names alone do not define network behavior</text><rect x="40" y="150" width="345" height="335" rx="17" fill="#ffffff" stroke="#b3ccdc" stroke-width="2"/><text x="60" y="186" font-size="23">Existing-record lookup</text><text x="60" y="228" font-size="20">Search / archive index / CT</text><text x="60" y="259" font-size="20">Provider receives the query</text><text x="60" y="290" font-size="20">Coverage may be stale</text><text x="60" y="321" font-size="20">Accounts and quotas may apply</text><rect x="425" y="150" width="345" height="335" rx="17" fill="#fff3d6" stroke="#b3ccdc" stroke-width="2"/><text x="445" y="186" font-size="23">DNS activity</text><text x="445" y="228" font-size="20">Resolution / reverse DNS</text><text x="445" y="259" font-size="20">Resolver receives the query</text><text x="445" y="290" font-size="20">May reach authoritative DNS</text><text x="445" y="321" font-size="20">Record resolver and timing</text><rect x="810" y="150" width="350" height="335" rx="17" fill="#fff3d6" stroke="#b3ccdc" stroke-width="2"/><text x="830" y="186" font-size="23">Direct interaction</text><text x="830" y="228" font-size="20">HTTP / crawler / port probe</text><text x="830" y="259" font-size="20">Target service receives traffic</text><text x="830" y="290" font-size="20">May log, change or block state</text><text x="830" y="321" font-size="20">Explicit destination/activity scope</text><rect x="40" y="535" width="1120" height="86" rx="13" fill="#dfebf1"/><text x="58" y="564" font-size="20">Review destinations, credentials, rates, visibility and output before running a module.</text><text x="58" y="595" font-size="20">A newly discovered related hostname or IP does not expand authorized scope.</text></g></svg>

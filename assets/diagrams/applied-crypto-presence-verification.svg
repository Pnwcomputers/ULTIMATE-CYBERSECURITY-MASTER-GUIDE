<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">A touch and a PIN establish different things</title><desc id="desc">User presence is an interaction such as a touch; user verification checks a local PIN or biometric. The relying party validates the signed assertion and requires the correct flags. Setting a PIN alone is not an assurance policy.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#337b98"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#16354b}.heading{font-size:32px;font-weight:700}.label{font-size:24px;font-weight:700}.body{font-size:22px}.note{font-size:20px}</style><rect width="1200" height="600" fill="#f4f7fa"/><text x="36" y="50" class="heading"><tspan x="36" dy="0">A touch and a PIN establish different things</tspan></text><text x="36" y="88" class="note"><tspan x="36" dy="0">Conceptual WebAuthn distinction • implementation must follow the full verification algorithm</tspan></text><rect x="36" y="132" width="352" height="225" rx="14" fill="#fff" stroke="#b5cbd7" stroke-width="2"/><text x="58" y="170" class="label"><tspan x="58" dy="0">User presence  (UP)</tspan></text><text x="58" y="214" class="body"><tspan x="58" dy="0">User interacts with the key.</tspan><tspan x="58" dy="30">Example: touch or button.</tspan><tspan x="58" dy="30"></tspan><tspan x="58" dy="30">This alone does not identify</tspan><tspan x="58" dy="30">the person holding the key.</tspan></text><rect x="424" y="132" width="352" height="225" rx="14" fill="#fff" stroke="#b5cbd7" stroke-width="2"/><text x="446" y="170" class="label"><tspan x="446" dy="0">User verification  (UV)</tspan></text><text x="446" y="214" class="body"><tspan x="446" dy="0">Authenticator checks the user.</tspan><tspan x="446" dy="30">Example: PIN or biometric.</tspan><tspan x="446" dy="30"></tspan><tspan x="446" dy="30">A simple touch is not UV.</tspan><tspan x="446" dy="30">Capability varies by device.</tspan></text><rect x="812" y="132" width="352" height="225" rx="14" fill="#fff" stroke="#b5cbd7" stroke-width="2"/><text x="834" y="170" class="label"><tspan x="834" dy="0">Relying-party policy</tspan></text><text x="834" y="214" class="body"><tspan x="834" dy="0">Request required verification.</tspan><tspan x="834" dy="30">Validate challenge + signature.</tspan><tspan x="834" dy="30">Validate origin + RP binding.</tspan><tspan x="834" dy="30">Require the expected flags.</tspan><tspan x="834" dy="30">Reject failed checks.</tspan></text><path d="M598,366 L598,411" fill="none" stroke="#337b98" stroke-width="3" marker-end="url(#arrow)"/><rect x="36" y="424" width="1128" height="133" rx="14" fill="#fff3d7" stroke="#b5cbd7" stroke-width="2"/><text x="58" y="462" class="label"><tspan x="58" dy="0">Enrollment, recovery, and sessions remain separate</tspan></text><text x="58" y="506" class="body"><tspan x="58" dy="0">A PIN configured on a key does not force every site to demand UV.</tspan><tspan x="58" dy="30">Review fallback and recovery paths; successful FIDO authentication does not protect a stolen session.</tspan></text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc"><title id="title">Android App: Static, Runtime &amp; API Tests</title><desc id="desc">Initial Android security review should distinguish static manifest/bytecode inspection, dynamic app behavior and server-side API authorization; missing optional defenses are context-dependent, not automatic exploits.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#80d7f7"/></marker></defs><rect width="1440" height="810" rx="19" fill="#0d1a2b"/><g font-family="Arial,Helvetica,sans-serif"><text x="36" y="56" font-size="29" font-weight="700" fill="#f8fcff">Android App: Static, Runtime &amp; API Tests</text><text x="36" y="90" font-size="18" fill="#c2d7e6">Use OWASP MASVS/MASTG with explicit app build, OS/device and approved test accounts.</text><path d="M36 118H1404" stroke="#354f69" stroke-width="2"/><rect x="36" y="158" width="417" height="210" rx="14" fill="#1a3049" stroke="#80d7f7" stroke-width="2.3"/><text x="54" y="200" font-size="21" font-weight="700" fill="#f9fdff">Static APK &amp; manifest</text><text x="54" y="242" font-size="17" fill="#d8e9f4">Exported components / permissions</text><text x="54" y="275" font-size="17" fill="#d8e9f4">Network config &amp; app signing</text><text x="54" y="308" font-size="17" fill="#d8e9f4">Review code and resources</text><rect x="511" y="158" width="417" height="210" rx="14" fill="#1a3049" stroke="#a8aafa" stroke-width="2.3"/><text x="529" y="200" font-size="21" font-weight="700" fill="#f9fdff">Runtime app behavior</text><text x="529" y="242" font-size="17" fill="#d8e9f4">TLS and storage observations</text><text x="529" y="275" font-size="17" fill="#d8e9f4">WebView / intent handling</text><text x="529" y="308" font-size="17" fill="#d8e9f4">Controls tested as deployed</text><rect x="985" y="158" width="417" height="210" rx="14" fill="#1a3049" stroke="#71dfb8" stroke-width="2.3"/><text x="1003" y="200" font-size="21" font-weight="700" fill="#f9fdff">Separate API assessment</text><text x="1003" y="242" font-size="17" fill="#d8e9f4">Server-side object ownership</text><text x="1003" y="275" font-size="17" fill="#d8e9f4">Authentication and authorization</text><text x="1003" y="308" font-size="17" fill="#d8e9f4">Test permitted identities</text><rect x="226" y="443" width="991" height="142" rx="14" fill="#1a3049" stroke="#edc787" stroke-width="2.3"/><text x="244" y="485" font-size="21" font-weight="700" fill="#f9fdff">Evidence-driven result</text><text x="244" y="527" font-size="17" fill="#d8e9f4">Reproduce with known test conditions and record impact</text><text x="244" y="560" font-size="17" fill="#d8e9f4">Distinguish applicable weaknesses from optional defense-in-depth choices</text><path d="M245 368V402H718V435" fill="none" stroke="#80d7f7" stroke-width="3" marker-end="url(#arr)"/><path d="M719 368V435" fill="none" stroke="#80d7f7" stroke-width="3" marker-end="url(#arr)"/><path d="M1193 368V402H729V435" fill="none" stroke="#80d7f7" stroke-width="3" marker-end="url(#arr)"/><rect x="36" y="651" width="1368" height="89" rx="12" fill="#3b3126" stroke="#ecc37d" stroke-width="2"/><text x="55" y="685" font-size="21" font-weight="700" fill="#ffebc2">No pinning, obfuscation or root detection ≠ automatic exploitability</text><text x="55" y="717" font-size="17" fill="#f3e3c7">Risk depends on the app threat model and backend controls; do not call the checklist a full MASVS assessment.</text><text x="37" y="787" font-size="15" fill="#b8cdde">Conceptual scope separation based on OWASP Mobile Application Security Verification Standard and Testing Guide.</text></g></svg>
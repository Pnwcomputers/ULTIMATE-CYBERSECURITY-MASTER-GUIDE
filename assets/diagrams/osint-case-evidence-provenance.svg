<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 640" role="img" aria-labelledby="title desc"><title id="title">OSINT: Case Evidence &amp; Review</title><desc id="desc">Four-stage example of an authorized OSINT case: approved scope, controlled source collection, timestamped raw evidence and independent verification. Incomplete and unavailable queries must be reported, not assumed negative.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#6AD5FF"/></marker></defs><rect width="1440" height="640" rx="18" fill="#0D182A"/><g font-family="Arial,Helvetica,sans-serif"><text x="34" y="57" font-size="32" font-weight="700" fill="#FFFFFF">OSINT: Case Evidence &amp; Review</text><text x="34" y="91" font-size="18" fill="#C4D7E7">Every collected indicator needs provenance and a recorded outcome.</text><path d="M34 115H1406" stroke="#344B64" stroke-width="2"/><rect x="34" y="162" width="305" height="270" rx="14" fill="#192D47" stroke="#6AD5FF" stroke-width="2.5"/><rect x="34" y="162" width="7" height="270" rx="3" fill="#6AD5FF"/><text x="53" y="205" font-size="21" font-weight="700" fill="#FFFFFF">1  Authorize case</text><text x="53" y="265" font-size="18" fill="#D5E4F1">Approved indicators</text><text x="53" y="303" font-size="18" fill="#D5E4F1">Scope &amp; legal basis</text><text x="53" y="341" font-size="18" fill="#D5E4F1">Private case state</text><path d="M342 297H376" fill="none" stroke="#6AD5FF" stroke-width="3" marker-end="url(#arrow)"/><rect x="389" y="162" width="305" height="270" rx="14" fill="#192D47" stroke="#B6ABFF" stroke-width="2.5"/><rect x="389" y="162" width="7" height="270" rx="3" fill="#B6ABFF"/><text x="408" y="205" font-size="21" font-weight="700" fill="#FFFFFF">2  Collect carefully</text><text x="408" y="265" font-size="18" fill="#D5E4F1">Provider/privacy review</text><text x="408" y="303" font-size="18" fill="#D5E4F1">Use scoped tools</text><text x="408" y="341" font-size="18" fill="#D5E4F1">Keep errors and timeouts</text><path d="M697 297H731" fill="none" stroke="#6AD5FF" stroke-width="3" marker-end="url(#arrow)"/><rect x="744" y="162" width="305" height="270" rx="14" fill="#192D47" stroke="#70DEB6" stroke-width="2.5"/><rect x="744" y="162" width="7" height="270" rx="3" fill="#70DEB6"/><text x="763" y="205" font-size="21" font-weight="700" fill="#FFFFFF">3  Preserve evidence</text><text x="763" y="265" font-size="18" fill="#D5E4F1">Original stdout/stderr</text><text x="763" y="303" font-size="18" fill="#D5E4F1">UTC times &amp; SHA-256</text><text x="763" y="341" font-size="18" fill="#D5E4F1">Status: complete / partial</text><path d="M1052 297H1086" fill="none" stroke="#6AD5FF" stroke-width="3" marker-end="url(#arrow)"/><rect x="1099" y="162" width="305" height="270" rx="14" fill="#192D47" stroke="#F1CD84" stroke-width="2.5"/><rect x="1099" y="162" width="7" height="270" rx="3" fill="#F1CD84"/><text x="1118" y="205" font-size="21" font-weight="700" fill="#FFFFFF">4  Review findings</text><text x="1118" y="265" font-size="18" fill="#D5E4F1">Corroborate identities</text><text x="1118" y="303" font-size="18" fill="#D5E4F1">Separate fact vs inference</text><text x="1118" y="341" font-size="18" fill="#D5E4F1">Redact before reporting</text><rect x="34" y="481" width="1372" height="98" rx="12" fill="#353226" stroke="#F1CD84" stroke-width="2"/><text x="53" y="519" font-size="21" font-weight="700" fill="#FFF1C9">Safety / interpretation boundary</text><text x="53" y="551" font-size="17" fill="#F2E4CA">Unavailable tools and partial responses cannot establish that an indicator does not exist.</text></g></svg>
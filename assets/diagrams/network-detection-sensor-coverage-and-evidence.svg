<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc"><title id="title">Network Detection: Sensor Visibility to Analyst Evidence</title><desc id="desc">WAN, DMZ and internal east-west traffic each need their own routed or correctly mirrored vantage point. Captured packets can feed Zeek logs, Suricata alerts or PCAP storage, but absent packets do not prove no attack.</desc><rect x="0" y="0" width="1440" height="820" rx="18" fill="#0d1a2c"/><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#83d9f7"/></marker></defs><g font-family="Arial,Helvetica,sans-serif"><text x="38" y="55" font-size="29" font-weight="700" fill="#f7faff">Network Detection: Sensor Visibility to Analyst Evidence</text><text x="38" y="90" font-size="18" fill="#bdd4e5">Passive NSM coverage is only as complete as physical packet access, routing and loss monitoring.</text><path d="M38 116H1402" stroke="#36516a" stroke-width="2"/><rect x="37" y="154" width="414" height="169" rx="13" fill="#1b3047" stroke="#8dd8f3" stroke-width="2.3"/><text x="56" y="195" font-size="21" font-weight="700" fill="#f9fcff">WAN / edge visibility</text><text x="56" y="236" font-size="17" fill="#dae9f3">Firewall routed interface or TAP</text><text x="56" y="270" font-size="17" fill="#dae9f3">North / south flow</text><rect x="510" y="154" width="413" height="169" rx="13" fill="#1b3047" stroke="#b2abff" stroke-width="2.3"/><text x="529" y="195" font-size="21" font-weight="700" fill="#f9fcff">DMZ boundary</text><text x="529" y="236" font-size="17" fill="#dae9f3">Routed DMZ-to-internal paths</text><text x="529" y="270" font-size="17" fill="#dae9f3">Check traffic traverses sensor</text><rect x="980" y="154" width="422" height="169" rx="13" fill="#1b3047" stroke="#73dfb9" stroke-width="2.3"/><text x="999" y="195" font-size="21" font-weight="700" fill="#f9fcff">East / west in VLANs</text><text x="999" y="236" font-size="17" fill="#dae9f3">Switch mirror or inline TAP</text><text x="999" y="270" font-size="17" fill="#dae9f3">SPAN destination is configured</text><rect x="38" y="408" width="412" height="159" rx="13" fill="#1b3047" stroke="#82d9f6" stroke-width="2.3"/><text x="57" y="449" font-size="21" font-weight="700" fill="#f9fcff">Capture + storage</text><text x="57" y="490" font-size="17" fill="#dae9f3">Packet scope, timestamps, loss</text><text x="57" y="524" font-size="17" fill="#dae9f3">Controlled PCAP retention</text><rect x="510" y="408" width="412" height="159" rx="13" fill="#1b3047" stroke="#b2abff" stroke-width="2.3"/><text x="529" y="449" font-size="21" font-weight="700" fill="#f9fcff">Protocol + detections</text><text x="529" y="490" font-size="17" fill="#dae9f3">Zeek connection / DNS / TLS</text><text x="529" y="524" font-size="17" fill="#dae9f3">Suricata EVE event streams</text><rect x="980" y="408" width="423" height="159" rx="13" fill="#1b3047" stroke="#edc985" stroke-width="2.3"/><text x="999" y="449" font-size="21" font-weight="700" fill="#f9fcff">SIEM / analyst</text><text x="999" y="490" font-size="17" fill="#dae9f3">Correlate indexed evidence</text><text x="999" y="524" font-size="17" fill="#dae9f3">Independent alert validation</text><path d="M245 323V363H243V399" fill="none" stroke="#83d9f7" stroke-width="3" marker-end="url(#arr)"/><path d="M716 323V399" fill="none" stroke="#83d9f7" stroke-width="3" marker-end="url(#arr)"/><path d="M1192 323V363H1190V399" fill="none" stroke="#83d9f7" stroke-width="3" marker-end="url(#arr)"/><path d="M451 489H501" fill="none" stroke="#83d9f7" stroke-width="3" marker-end="url(#arr)"/><path d="M923 489H972" fill="none" stroke="#83d9f7" stroke-width="3" marker-end="url(#arr)"/><rect x="40" y="650" width="1360" height="91" rx="12" fill="#3c3228" stroke="#edc985" stroke-width="2"/><text x="62" y="684" font-size="21" font-weight="700" fill="#ffedc2">Visibility is not automatic</text><text x="62" y="717" font-size="17" fill="#f3e2ca">Unmanaged switches do not mirror unrelated unicast; SPAN/TAP feeds may lose packets under load.</text><text x="40" y="798" font-size="15" fill="#b8cede">Conceptual network-monitoring design; excludes unsupported capture metrics and any real SIEM deployment result.</text></g></svg>
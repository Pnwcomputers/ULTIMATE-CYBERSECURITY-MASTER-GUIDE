<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc"><title id="title">Classical Cryptanalysis: Pattern Clues, Not Proof</title><desc id="desc">Statistical attacks narrow historical cipher candidates; the result still needs verification. Short text, non-English data and key-length multiples can mislead frequency and IC. These methods do not establish a shortcut to modern authenticated encryption.</desc><defs><marker id="arr" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#68d4ff"/></marker></defs><rect width="1400" height="720" rx="26" fill="#0e1b2b"/><g font-family="Arial,Helvetica,sans-serif"><text x="34" y="58" fill="#f1f7fe" font-size="29" font-weight="700">Classical Cryptanalysis: Pattern Clues, Not Proof</text><text x="34" y="90" fill="#c2d4e4" font-size="17">Statistical attacks narrow historical cipher candidates; the result still needs verification.</text><path d="M34 117H1366" stroke="#345570" stroke-width="2"/><rect x="34" y="170" width="304" height="318" rx="18" fill="#1a3047" stroke="#72c6ec" stroke-width="2"/><rect x="52" y="192" width="49" height="42" rx="11" fill="#72c6ec" opacity="0.23"/><text x="62" y="220" font-weight="700" font-size="23" fill="#72c6ec">01</text><text x="52" y="275" font-size="22" font-weight="700" fill="#ffffff">Classify sample</text><text x="52" y="321" font-size="17" fill="#d8e8f4">• Alphabet, symbols and length</text><text x="52" y="366" font-size="17" fill="#d8e8f4">• Language hypothesis</text><text x="52" y="411" font-size="17" fill="#d8e8f4">• Text normalization policy</text><path d="M345 327H370" stroke="#68d4ff" stroke-width="3" marker-end="url(#arr)"/><rect x="377" y="170" width="304" height="318" rx="18" fill="#1a3047" stroke="#baa1f2" stroke-width="2"/><rect x="395" y="192" width="49" height="42" rx="11" fill="#baa1f2" opacity="0.23"/><text x="405" y="220" font-weight="700" font-size="23" fill="#baa1f2">02</text><text x="395" y="275" font-size="22" font-weight="700" fill="#ffffff">Simple substitution</text><text x="395" y="321" font-size="17" fill="#d8e8f4">• Single alphabet mapping</text><text x="395" y="366" font-size="17" fill="#d8e8f4">• Frequency and word patterns</text><text x="395" y="411" font-size="17" fill="#d8e8f4">• Try multiple candidate keys</text><path d="M688 327H713" stroke="#68d4ff" stroke-width="3" marker-end="url(#arr)"/><rect x="720" y="170" width="304" height="318" rx="18" fill="#1a3047" stroke="#9fd8b6" stroke-width="2"/><rect x="738" y="192" width="49" height="42" rx="11" fill="#9fd8b6" opacity="0.23"/><text x="748" y="220" font-weight="700" font-size="23" fill="#9fd8b6">03</text><text x="738" y="275" font-size="22" font-weight="700" fill="#ffffff">Repeating-key ciphers</text><text x="738" y="321" font-size="17" fill="#d8e8f4">• Kasiski repeat distances</text><text x="738" y="366" font-size="17" fill="#d8e8f4">• Candidate periods with IC</text><text x="738" y="411" font-size="17" fill="#d8e8f4">• Compare per-column shifts</text><path d="M1031 327H1056" stroke="#68d4ff" stroke-width="3" marker-end="url(#arr)"/><rect x="1063" y="170" width="304" height="318" rx="18" fill="#1a3047" stroke="#f0c17b" stroke-width="2"/><rect x="1081" y="192" width="49" height="42" rx="11" fill="#f0c17b" opacity="0.23"/><text x="1091" y="220" font-weight="700" font-size="23" fill="#f0c17b">04</text><text x="1081" y="275" font-size="22" font-weight="700" fill="#ffffff">Validate plaintext</text><text x="1081" y="321" font-size="17" fill="#d8e8f4">• Language and known context</text><text x="1081" y="366" font-size="17" fill="#d8e8f4">• Check complete ciphertext</text><text x="1081" y="411" font-size="17" fill="#d8e8f4">• Report ambiguous answers</text><rect x="34" y="533" width="1332" height="134" rx="16" fill="#182c40" stroke="#335a76"/><text x="54" y="570" fill="#f0c780" font-size="18" font-weight="700">EVIDENCE AND ASSUMPTION BOUNDARIES</text><text x="54" y="604" fill="#e4edf5" font-size="18">Short text, non-English data and key-length multiples can mislead frequency and IC.</text><text x="54" y="633" fill="#e4edf5" font-size="18">These methods do not establish a shortcut to modern authenticated encryption.</text></g></svg>

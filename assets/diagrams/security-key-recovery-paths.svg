<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc"><title id="title">Plan and test each account recovery path</title><desc id="desc">Two separate keys must each be registered. Fallback recovery is governed by the service and must be reviewed independently.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#286585"/></marker></defs><rect width="1200" height="440" fill="#f6f9fc"/><g font-family="Arial, sans-serif" fill="#16354b"><text x="40" y="48" font-size="30" font-weight="700">Plan and test each account recovery path</text><rect x="40" y="85" width="350" height="120" rx="12" fill="#e4f0f5" stroke="#8faebb"/><text x="56" y="114" font-size="21" font-weight="700">Daily key</text><text x="56" y="143" font-size="18">Register credential A</text><text x="56" y="166" font-size="18">Test sign-in on the service</text><path d="M393 145h27" stroke="#286585" stroke-width="2" marker-end="url(#arrow)"/><rect x="425" y="85" width="350" height="120" rx="12" fill="#e4f0f5" stroke="#8faebb"/><text x="441" y="114" font-size="21" font-weight="700">Account</text><text x="441" y="143" font-size="18">Stores registered public keys</text><text x="441" y="166" font-size="18">Enforces sign-in policy</text><path d="M807 145h-27" stroke="#286585" stroke-width="2" marker-end="url(#arrow)"/><rect x="810" y="85" width="350" height="120" rx="12" fill="#e4f0f5" stroke="#8faebb"/><text x="826" y="114" font-size="21" font-weight="700">Backup key</text><text x="826" y="143" font-size="18">Register credential B separately</text><text x="826" y="166" font-size="18">Test, then store securely</text><rect x="40" y="230" width="350" height="120" rx="12" fill="#fff3d8" stroke="#8faebb"/><text x="56" y="259" font-size="21" font-weight="700">Lost key</text><text x="56" y="288" font-size="18">Use tested backup or recovery</text><text x="56" y="311" font-size="18">Report loss promptly</text><path d="M393 290h27" stroke="#286585" stroke-width="2" marker-end="url(#arrow)"/><rect x="425" y="230" width="350" height="120" rx="12" fill="#fff3d8" stroke="#8faebb"/><text x="441" y="259" font-size="21" font-weight="700">Restore access</text><text x="441" y="288" font-size="18">Revoke the lost credential</text><text x="441" y="311" font-size="18">Inspect recent account activity</text><path d="M778 290h27" stroke="#286585" stroke-width="2" marker-end="url(#arrow)"/><rect x="810" y="230" width="350" height="120" rx="12" fill="#fff3d8" stroke="#8faebb"/><text x="826" y="259" font-size="21" font-weight="700">Replace and retest</text><text x="826" y="288" font-size="18">Enroll a replacement key</text><text x="826" y="311" font-size="18">Review weaker fallback paths</text><text x="40" y="420" font-size="17">Conceptual account workflow. Two keys do not imply two enrollments; recovery is service-specific.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="775" viewBox="0 0 1440 775" role="img" aria-labelledby="title desc"><title id="title">Recoverable Point ≠ Backup Timestamp</title><desc id="desc">Disaster recovery combines a trusted base, retained changes, keys, schemas and verified replay. RPO is the recovery-point gap; RTO ends when service is usable.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#8fd7ef"/></marker></defs><rect width="1440" height="775" fill="#0e1927" rx="20"/><g font-family="Arial,Helvetica,sans-serif"><text x="40" y="58" font-size="30" font-weight="700" fill="#f4faff">Recoverable Point ≠ Backup Timestamp</text><text x="40" y="93" font-size="18" fill="#bed2e2">Example timeline shows relationships, not promised recovery performance.</text><line x1="40" y1="119" x2="1400" y2="119" stroke="#385066" stroke-width="2"/><rect x="44" y="155" width="1352" height="217" rx="15" fill="#142940" stroke="#7697b8" stroke-width="2"/><line x1="118" y1="272" x2="1300" y2="272" stroke="#bdd2e6" stroke-width="4"/><circle cx="170" cy="272" r="11" fill="#77dcbc"/><path d="M170 272V230" stroke="#77dcbc" stroke-width="2"/><text x="125" y="208" font-size="19" font-weight="700" fill="#f8fcff">Trusted backup</text><text x="125" y="335" font-size="16" fill="#b8d0e2">Base + checkpoint</text><circle cx="552" cy="272" r="11" fill="#80d0f7"/><path d="M552 272V230" stroke="#80d0f7" stroke-width="2"/><text x="507" y="208" font-size="19" font-weight="700" fill="#f8fcff">Durable log</text><text x="507" y="335" font-size="16" fill="#b8d0e2">Events retained</text><circle cx="934" cy="272" r="11" fill="#f5aa9d"/><path d="M934 272V230" stroke="#f5aa9d" stroke-width="2"/><text x="889" y="208" font-size="19" font-weight="700" fill="#f8fcff">Failure</text><text x="889" y="335" font-size="16" fill="#b8d0e2">Stop writes safely</text><circle cx="1248" cy="272" r="11" fill="#efca86"/><path d="M1248 272V230" stroke="#efca86" stroke-width="2"/><text x="1203" y="208" font-size="19" font-weight="700" fill="#f8fcff">Recovered</text><text x="1203" y="335" font-size="16" fill="#b8d0e2">Validated cutover</text><rect x="42" y="433" width="642" height="165" fill="#193047" stroke="#77dcbc" stroke-width="2.5" rx="14"/><rect x="42" y="433" width="8" height="165" rx="4" fill="#77dcbc"/><text x="61" y="472" font-size="21" font-weight="700" fill="#f5faff">RPO = latest recoverable state</text><text x="61" y="514" font-size="17" fill="#d7e6f2">Trusted base + complete replay history</text><text x="61" y="548" font-size="17" fill="#d7e6f2">Check for missing or untrusted events</text><rect x="742" y="433" width="655" height="165" fill="#193047" stroke="#efca86" stroke-width="2.5" rx="14"/><rect x="742" y="433" width="8" height="165" rx="4" fill="#efca86"/><text x="761" y="472" font-size="21" font-weight="700" fill="#f5faff">RTO = verified service recovery</text><text x="761" y="514" font-size="17" fill="#d7e6f2">Restore + rebuild + controls + cutover</text><text x="761" y="548" font-size="17" fill="#d7e6f2">Confirm consumer-visible functionality</text><rect x="40" y="635" width="1360" height="90" rx="13" fill="#3b3228" stroke="#ecc981" stroke-width="2"/><text x="58" y="670" font-size="21" fill="#ffe7b9" font-weight="700">Replication alone is not historical recovery</text><text x="58" y="703" font-size="17" fill="#f4e4cb">Deletes and corruption can replicate; restore into an isolated destination and validate before cutover.</text></g></svg>
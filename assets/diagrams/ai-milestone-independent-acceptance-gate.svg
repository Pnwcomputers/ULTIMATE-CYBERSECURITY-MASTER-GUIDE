<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 735" width="1440" height="735" role="img" aria-labelledby="title desc"><title id="title">Milestone Acceptance: An Output Is Not A Pass</title><desc id="desc">Milestone state depends on agreed conditions and inspectable evidence, not tasks, commits, progress bars or model declarations.</desc><defs><marker id="end-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#78D9FB"/></marker></defs><rect width="1440" height="735" rx="20" fill="#0C1829"/><g font-family="Arial,Helvetica,sans-serif"><text x="34" y="54" font-size="30" font-weight="700" fill="#F8FBFF">Milestone Acceptance: An Output Is Not A Pass</text><text x="34" y="86" font-size="18" fill="#B9D2E4">Define the outcome and failure conditions before delegating work.</text><path d="M34 110H1406" stroke="#385067" stroke-width="2"/><rect x="34" y="155" width="308" height="223" rx="14" fill="#172C45" stroke="#78D9FB" stroke-width="2.4"/><rect x="34" y="155" width="7" height="223" rx="3" fill="#78D9FB"/><text x="53" y="197" font-size="21" font-weight="700" fill="#F9FBFF">1  Outcome contract</text><text x="53" y="242" font-size="17" fill="#DAE9F3">Owner &amp; approved scope</text><text x="53" y="276" font-size="17" fill="#DAE9F3">Required state and exclusions</text><path d="M344 264H377" stroke="#78D9FB" stroke-width="3" fill="none" marker-end="url(#end-arrow)"/><rect x="388" y="155" width="308" height="223" rx="14" fill="#172C45" stroke="#B5ADFF" stroke-width="2.4"/><rect x="388" y="155" width="7" height="223" rx="3" fill="#B5ADFF"/><text x="407" y="197" font-size="21" font-weight="700" fill="#F9FBFF">2  Work &amp; deliverables</text><text x="407" y="242" font-size="17" fill="#DAE9F3">Draft files / configs / tests</text><text x="407" y="276" font-size="17" fill="#DAE9F3">Record exact artifact versions</text><path d="M698 264H731" stroke="#78D9FB" stroke-width="3" fill="none" marker-end="url(#end-arrow)"/><rect x="742" y="155" width="308" height="223" rx="14" fill="#172C45" stroke="#70DEB7" stroke-width="2.4"/><rect x="742" y="155" width="7" height="223" rx="3" fill="#70DEB7"/><text x="761" y="197" font-size="21" font-weight="700" fill="#F9FBFF">3  Validate</text><text x="761" y="242" font-size="17" fill="#DAE9F3">Run positive and negative cases</text><text x="761" y="276" font-size="17" fill="#DAE9F3">Compare actual against expected</text><path d="M1052 264H1085" stroke="#78D9FB" stroke-width="3" fill="none" marker-end="url(#end-arrow)"/><rect x="1096" y="155" width="308" height="223" rx="14" fill="#172C45" stroke="#F0CB81" stroke-width="2.4"/><rect x="1096" y="155" width="7" height="223" rx="3" fill="#F0CB81"/><text x="1115" y="197" font-size="21" font-weight="700" fill="#F9FBFF">4  Review evidence</text><text x="1115" y="242" font-size="17" fill="#DAE9F3">Logs, hashes &amp; readback</text><text x="1115" y="276" font-size="17" fill="#DAE9F3">Independent owner decision</text><rect x="34" y="455" width="664" height="145" rx="14" fill="#172C45" stroke="#70DEB7" stroke-width="2.4"/><rect x="34" y="455" width="7" height="145" rx="3" fill="#70DEB7"/><text x="53" y="497" font-size="21" font-weight="700" fill="#F9FBFF">ACCEPTED</text><text x="53" y="542" font-size="17" fill="#DAE9F3">All criteria met and verified by the named reviewer</text><text x="53" y="576" font-size="17" fill="#DAE9F3">Only then advance to the next project stage</text><rect x="742" y="455" width="664" height="145" rx="14" fill="#172C45" stroke="#F6A4A4" stroke-width="2.4"/><rect x="742" y="455" width="7" height="145" rx="3" fill="#F6A4A4"/><text x="761" y="497" font-size="21" font-weight="700" fill="#F9FBFF">BLOCKED / RETEST</text><text x="761" y="542" font-size="17" fill="#DAE9F3">Missing proof, unexpected effects or wrong environment</text><text x="761" y="576" font-size="17" fill="#DAE9F3">Repair, rerun and update the evidence record</text><path d="M1250 455V419H895V388" stroke="#78D9FB" stroke-width="3" fill="none" marker-end="url(#end-arrow)"/><text x="35" y="666" font-size="15.5" fill="#B5CCDE">A closed issue or completed build can satisfy a task without proving its milestone acceptance.</text></g></svg>
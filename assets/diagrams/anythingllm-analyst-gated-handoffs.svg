<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Analyst-gated AnythingLLM flow handoffs</title>
  <desc id="desc">A conceptual workflow starts with approved scope and data classification, uses only authorized source queries, treats each flow result as untrusted and incomplete, and requires an analyst to verify scope, privacy, provenance, and evidence before another flow or a report. Unapproved scope or disclosure stops the sequence.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#36536b"/></marker>
    <style>
      .title{font:700 30px system-ui,sans-serif;fill:#102a43}
      .head{font:700 20px system-ui,sans-serif;fill:#102a43}
      .body{font:16px system-ui,sans-serif;fill:#243b53}
      .small{font:14px system-ui,sans-serif;fill:#334e68}
      .box{rx:16;stroke-width:2}
      .arrow{stroke:#36536b;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="620" rx="24" fill="#f5f8fb"/>
  <text x="50" y="58" class="title">AgentFlow sequences need analyst gates</text>
  <rect x="45" y="105" width="240" height="160" class="box" fill="#e6f0fa" stroke="#7aa7d3"/>
  <text x="165" y="145" class="head" text-anchor="middle">1 · Approve scope</text>
  <text x="165" y="180" class="body" text-anchor="middle">Assets, accounts,</text>
  <text x="165" y="205" class="body" text-anchor="middle">purpose and data class</text>
  <text x="165" y="238" class="small" text-anchor="middle">Unlisted target? Stop.</text>

  <rect x="340" y="105" width="250" height="160" class="box" fill="#e9f5ee" stroke="#62a878"/>
  <text x="465" y="145" class="head" text-anchor="middle">2 · Query approved</text>
  <text x="465" y="180" class="body" text-anchor="middle">sources with minimum</text>
  <text x="465" y="205" class="body" text-anchor="middle">necessary input</text>
  <text x="465" y="238" class="small" text-anchor="middle">Review each provider path</text>

  <rect x="645" y="105" width="250" height="160" class="box" fill="#fff3cd" stroke="#d6a638"/>
  <text x="770" y="145" class="head" text-anchor="middle">3 · Treat output as</text>
  <text x="770" y="180" class="body" text-anchor="middle">untrusted and incomplete</text>
  <text x="770" y="212" class="small" text-anchor="middle">Check source, date, scope;</text>
  <text x="770" y="236" class="small" text-anchor="middle">no match ≠ no exposure</text>

  <rect x="950" y="105" width="205" height="160" class="box" fill="#e6f0fa" stroke="#7aa7d3"/>
  <text x="1052" y="145" class="head" text-anchor="middle">4 · Analyst</text>
  <text x="1052" y="180" class="body" text-anchor="middle">verifies evidence</text>
  <text x="1052" y="207" class="body" text-anchor="middle">before handoff</text>
  <text x="1052" y="238" class="small" text-anchor="middle">Approve next step</text>

  <path d="M285 185 H330" class="arrow"/>
  <path d="M590 185 H635" class="arrow"/>
  <path d="M895 185 H940" class="arrow"/>
  <path d="M1052 265 V345 H770 V275" class="arrow"/>

  <rect x="275" y="345" width="620" height="125" class="box" fill="#ffffff" stroke="#8ca8bd"/>
  <text x="585" y="385" class="head" text-anchor="middle">5 · Report with provenance and uncertainty</text>
  <text x="585" y="420" class="body" text-anchor="middle">Separate observed source data, analyst conclusions, and model-generated text.</text>
  <text x="585" y="447" class="small" text-anchor="middle">A report does not itself authorize scanning, account action, or remediation.</text>

  <path d="M165 265 V525 H420 V480" stroke="#b94b45" stroke-width="3" stroke-dasharray="8 7" fill="none" marker-end="url(#arrow)"/>
  <path d="M465 265 V525 H420" stroke="#b94b45" stroke-width="3" stroke-dasharray="8 7" fill="none"/>
  <rect x="420" y="505" width="420" height="68" rx="14" fill="#fde8e7" stroke="#d66b63" stroke-width="2"/>
  <text x="630" y="535" class="head" text-anchor="middle">Stop, minimize, and document</text>
  <text x="630" y="558" class="small" text-anchor="middle">if scope, privacy, or evidence checks fail</text>
  <text x="50" y="600" class="small">Conceptual workflow. Unless explicitly configured and validated, treat the examples as analyst-run sequences, not automatic flow-to-flow orchestration.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" width="1440" height="810" role="img" aria-labelledby="title desc"><title id="title">Threat Intel: Provenance Before Detection Rules</title><desc id="desc">Open threat intelligence must be preserved with original context, source date and confidence before conversion to observables, ATT&amp;CK hypotheses and read-only hunts. IOC matching is not attribution.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#88d8f8"/></marker></defs><rect width="1440" height="810" rx="20" fill="#0b192b"/><g font-family="Arial,Helvetica,sans-serif"><text x="39" y="58" font-size="29" font-weight="700" fill="#f7fcff">Threat Intel: Provenance Before Detection Rules</text><text x="39" y="91" font-size="18" fill="#c2d7e7">A shared IP, domain or ATT&amp;CK technique does not identify the actor or prove an incident.</text><path d="M39 119H1401" stroke="#344d67" stroke-width="2"/><rect x="38" y="160" width="305" height="183" rx="15" fill="#1a3049" stroke="#85d6f6" stroke-width="2.5"/><text x="57" y="200" font-size="21" font-weight="700" fill="#f9fdff">1. Research question</text><text x="57" y="241" font-size="17" fill="#dce8f2">Owner, scope, expected value</text><path d="M345 244H380" fill="none" stroke="#88d8f8" stroke-width="3" marker-end="url(#arrow)"/><rect x="390" y="160" width="305" height="183" rx="15" fill="#1a3049" stroke="#b3a8fd" stroke-width="2.5"/><text x="409" y="200" font-size="21" font-weight="700" fill="#f9fdff">2. Source evidence</text><text x="409" y="241" font-size="17" fill="#dce8f2">URL, context, timestamps</text><path d="M697 244H732" fill="none" stroke="#88d8f8" stroke-width="3" marker-end="url(#arrow)"/><rect x="742" y="160" width="305" height="183" rx="15" fill="#1a3049" stroke="#75dfb7" stroke-width="2.5"/><text x="761" y="200" font-size="21" font-weight="700" fill="#f9fdff">3. Evaluate claim</text><text x="761" y="241" font-size="17" fill="#dce8f2">Independence &amp; confidence</text><path d="M1049 244H1084" fill="none" stroke="#88d8f8" stroke-width="3" marker-end="url(#arrow)"/><rect x="1094" y="160" width="305" height="183" rx="15" fill="#1a3049" stroke="#eac57e" stroke-width="2.5"/><text x="1113" y="200" font-size="21" font-weight="700" fill="#f9fdff">4. Detection content</text><text x="1113" y="241" font-size="17" fill="#dce8f2">Versioned IOC and behavior</text><rect x="132" y="429" width="547" height="167" rx="15" fill="#1a3049" stroke="#eac57e" stroke-width="2.5"/><text x="151" y="469" font-size="21" font-weight="700" fill="#f9fdff">Short-lived indicators</text><text x="151" y="510" font-size="17" fill="#dce8f2">Time-to-live and false-positive review</text><text x="151" y="544" font-size="17" fill="#dce8f2">Document observation limits</text><rect x="760" y="429" width="547" height="167" rx="15" fill="#1a3049" stroke="#75dfb7" stroke-width="2.5"/><text x="779" y="469" font-size="21" font-weight="700" fill="#f9fdff">Controlled validation</text><text x="779" y="510" font-size="17" fill="#dce8f2">Benign positive/negative fixtures</text><text x="779" y="544" font-size="17" fill="#dce8f2">Hunt result &amp; triage context</text><path d="M1249 343V390H1029V420" fill="none" stroke="#88d8f8" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="648" width="1360" height="85" rx="12" fill="#3c3327" stroke="#eac580" stroke-width="2"/><text x="60" y="681" font-size="21" font-weight="700" fill="#ffedc1">Separate identification, hypothesis and observed detection</text><text x="60" y="712" font-size="17" fill="#f4e3c7">A matching observable is a lead; only independently supported evidence justifies actor attribution.</text><text x="39" y="792" font-size="15" fill="#b7ccdf">Conceptual CTI integration with provenance and MITRE ATT&amp;CK behavior mapping, not verified live feed ingestion.</text></g></svg>
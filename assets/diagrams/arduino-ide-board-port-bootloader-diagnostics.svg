<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" width="1440" height="810" role="img" aria-labelledby="title desc"><title id="title">Arduino IDE: Board Core ≠ Serial Port ≠ Bootloader</title><desc id="desc">Arduino IDE 2 tool setup has three independent prerequisites: installed board platform, enumerated USB connection and compatible upload method. Identifying a port does not prove the chosen target is correct.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#88d8f8"/></marker></defs><rect width="1440" height="810" rx="20" fill="#0b192b"/><g font-family="Arial,Helvetica,sans-serif"><text x="39" y="58" font-size="29" font-weight="700" fill="#f7fcff">Arduino IDE: Board Core ≠ Serial Port ≠ Bootloader</text><text x="39" y="91" font-size="18" fill="#c2d7e7">Use the exact physical board and core revision before compiling or flashing any image.</text><path d="M39 119H1401" stroke="#344d67" stroke-width="2"/><rect x="39" y="163" width="425" height="184" rx="15" fill="#1a3049" stroke="#85d6f6" stroke-width="2.5"/><text x="58" y="203" font-size="21" font-weight="700" fill="#f9fdff">Boards Manager package</text><text x="58" y="244" font-size="17" fill="#dce8f2">Correct core + selected board</text><text x="58" y="278" font-size="17" fill="#dce8f2">Toolchain / target flash layout</text><rect x="509" y="163" width="425" height="184" rx="15" fill="#1a3049" stroke="#b3a8fd" stroke-width="2.5"/><text x="528" y="203" font-size="21" font-weight="700" fill="#f9fdff">USB / device interface</text><text x="528" y="244" font-size="17" fill="#dce8f2">Data cable, OS driver, port</text><text x="528" y="278" font-size="17" fill="#dce8f2">USB-UART vs native USB</text><rect x="977" y="163" width="425" height="184" rx="15" fill="#1a3049" stroke="#75dfb7" stroke-width="2.5"/><text x="996" y="203" font-size="21" font-weight="700" fill="#f9fdff">Bootloader / uploader</text><text x="996" y="244" font-size="17" fill="#dce8f2">Reset mode &amp; upload protocol</text><text x="996" y="278" font-size="17" fill="#dce8f2">Check exact board revision</text><path d="M465 256H501" fill="none" stroke="#88d8f8" stroke-width="3" marker-end="url(#arrow)"/><path d="M934 256H968" fill="none" stroke="#88d8f8" stroke-width="3" marker-end="url(#arrow)"/><rect x="184" y="430" width="1081" height="132" rx="15" fill="#1a3049" stroke="#eac57e" stroke-width="2.5"/><text x="203" y="470" font-size="21" font-weight="700" fill="#f9fdff">Diagnose the actual failure point</text><text x="203" y="511" font-size="17" fill="#dce8f2">No board menu → check package/core. No port → cable, USB permissions, driver and enumeration.</text><text x="203" y="545" font-size="17" fill="#dce8f2">Upload error → verify selected target, bootloader mode, port use and serial monitor state.</text><path d="M1177 347V390H725V421" fill="none" stroke="#88d8f8" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="646" width="1360" height="85" rx="12" fill="#3c3327" stroke="#eac580" stroke-width="2"/><text x="60" y="679" font-size="21" font-weight="700" fill="#ffedc1">Verify every board, including official and third-party devices</text><text x="60" y="710" font-size="17" fill="#f4e3c7">No blanket assumption that a USB driver is unnecessary; port and upload behavior depend on model and OS.</text><text x="39" y="792" font-size="15" fill="#b7ccdf">Based on Arduino's IDE 2 board/port/upload documentation; menu labels and drivers vary by platform.</text></g></svg>
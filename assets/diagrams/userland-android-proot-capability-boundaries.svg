<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 795" width="1440" height="795" role="img" aria-labelledby="title desc"><title id="title">UserLAnd: Linux Userspace Is Not Android Root</title><desc id="desc">Unrooted UserLAnd runs Linux tools inside Android app/process permissions. Linux filesystem and command-line sessions do not grant Linux kernel drivers, Android root or radio monitor-mode capabilities.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#89dafa"/></marker></defs><rect width="1440" height="795" rx="19" fill="#0d1b2d"/><g font-family="Arial,Helvetica,sans-serif"><text x="38" y="56" font-size="30" font-weight="700" fill="#f9fcff">UserLAnd: Linux Userspace Is Not Android Root</text><text x="38" y="91" font-size="18" fill="#c1d5e6">Supported uses are scripting, ordinary networking, SSH, and offline file analysis.</text><path d="M38 117H1402" stroke="#38536f" stroke-width="2"/><rect x="40" y="160" width="418" height="176" rx="14" fill="#1a3049" stroke="#f1ad9f" stroke-width="2.4"/><text x="59" y="199" font-size="21" font-weight="700" fill="#f8fdff">Android device &amp; kernel</text><text x="59" y="239" font-size="17" fill="#d8e9f3">Owns real hardware and radios</text><text x="59" y="274" font-size="17" fill="#d8e9f3">Controls process permissions</text><text x="59" y="309" font-size="17" fill="#d8e9f3">App sandbox persists</text><rect x="511" y="160" width="418" height="176" rx="14" fill="#1a3049" stroke="#8bd9fb" stroke-width="2.4"/><text x="530" y="199" font-size="21" font-weight="700" fill="#f8fdff">UserLAnd session</text><text x="530" y="239" font-size="17" fill="#d8e9f3">Linux filesystem and shell</text><text x="530" y="274" font-size="17" fill="#d8e9f3">User-mode compatibility layer</text><text x="530" y="309" font-size="17" fill="#d8e9f3">Package tools by distro</text><rect x="981" y="160" width="420" height="176" rx="14" fill="#1a3049" stroke="#73dbb9" stroke-width="2.4"/><text x="1000" y="199" font-size="21" font-weight="700" fill="#f8fdff">Permitted workflows</text><text x="1000" y="239" font-size="17" fill="#d8e9f3">Python, Git, SSH, curl</text><text x="1000" y="274" font-size="17" fill="#d8e9f3">TCP-connect diagnostics</text><text x="1000" y="309" font-size="17" fill="#d8e9f3">Read permitted local files</text><path d="M459 248H502" fill="none" stroke="#89dafa" stroke-width="3" marker-end="url(#a)"/><path d="M930 248H972" fill="none" stroke="#89dafa" stroke-width="3" marker-end="url(#a)"/><rect x="54" y="413" width="652" height="173" rx="14" fill="#1a3049" stroke="#f1ad9f" stroke-width="2.4"/><text x="73" y="452" font-size="21" font-weight="700" fill="#f8fdff">Not granted by PRoot</text><text x="73" y="492" font-size="17" fill="#d8e9f3">Host kernel modules or firewall control</text><text x="73" y="527" font-size="17" fill="#d8e9f3">Wi-Fi monitor mode / packet injection</text><text x="73" y="562" font-size="17" fill="#d8e9f3">Raw packet interfaces or USB gadgets</text><rect x="755" y="413" width="631" height="173" rx="14" fill="#1a3049" stroke="#edc982" stroke-width="2.4"/><text x="774" y="452" font-size="21" font-weight="700" fill="#f8fdff">Practical alternatives</text><text x="774" y="492" font-size="17" fill="#d8e9f3">Use authorized capture device / remote host</text><text x="774" y="527" font-size="17" fill="#d8e9f3">Import PCAP for offline review</text><text x="774" y="562" font-size="17" fill="#d8e9f3">Check Android lifecycle / storage grants</text><rect x="38" y="649" width="1364" height="88" rx="13" fill="#3d3326" stroke="#edc67f" stroke-width="2"/><text x="60" y="684" font-size="21" font-weight="700" fill="#ffeabd">App sandbox boundaries remain in force</text><text x="60" y="713" font-size="17" fill="#f6e4c8">An apparent UID 0 within the Linux environment does not mean root access to Android or its radios.</text><text x="41" y="778" font-size="15" fill="#b8d0e2">Illustrative platform constraints from upstream UserLAnd and Android application privilege model.</text></g></svg>
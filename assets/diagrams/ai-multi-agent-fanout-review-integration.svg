<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc"><title id="title">Multi-Agent: Separate Lanes &amp; Review</title><desc id="desc">Coordinator fans bounded tasks to distinct researcher and builder lanes, then requires independent checks and integration tests; approval of side effects is held by the owner.</desc><defs><marker id="n" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#89d9fa"/></marker></defs><rect width="1440" height="810" rx="20" fill="#0e1a2b"/><g font-family="Arial,Helvetica,sans-serif"><text x="37" y="57" font-size="29" font-weight="700" fill="#f9fdff">Multi-Agent: Separate Lanes &amp; Review</text><text x="37" y="90" font-size="18" fill="#bdd4e6">Parallel work is safe only when file, account and resource ownership are explicit.</text><path d="M37 117H1403" stroke="#36516a" stroke-width="2"/><rect x="530" y="154" width="377" height="128" rx="13" fill="#1a304a" stroke="#89d9fa" stroke-width="2.5"/><text x="548" y="194" fill="#f7faff" font-size="20" font-weight="700">Coordinator</text><text x="548" y="236" fill="#d9e8f1" font-size="17">Approved scope, task contracts</text><text x="548" y="270" fill="#d9e8f1" font-size="17">Version-pinned base &amp; dependencies</text><rect x="80" y="355" width="340" height="152" rx="13" fill="#1a304a" stroke="#b1a9fb" stroke-width="2.5"/><text x="98" y="395" fill="#f7faff" font-size="20" font-weight="700">Research lane</text><text x="98" y="437" fill="#d9e8f1" font-size="17">Read primary source &amp; dates</text><text x="98" y="471" fill="#d9e8f1" font-size="17">No production write access</text><rect x="553" y="355" width="340" height="152" rx="13" fill="#1a304a" stroke="#77dfbd" stroke-width="2.5"/><text x="571" y="395" fill="#f7faff" font-size="20" font-weight="700">Build lane</text><text x="571" y="437" fill="#d9e8f1" font-size="17">Scoped branch / file ownership</text><text x="571" y="471" fill="#d9e8f1" font-size="17">Diff, fixtures &amp; local checks</text><rect x="1017" y="355" width="340" height="152" rx="13" fill="#1a304a" stroke="#ecc57b" stroke-width="2.5"/><text x="1035" y="395" fill="#f7faff" font-size="20" font-weight="700">Verifier lane</text><text x="1035" y="437" fill="#d9e8f1" font-size="17">Read-only independent evidence</text><text x="1035" y="471" fill="#d9e8f1" font-size="17">Compare acceptance criteria</text><path d="M717 282V319H249V347" fill="none" stroke="#89d9fa" stroke-width="3" marker-end="url(#n)"/><path d="M717 282V346" fill="none" stroke="#89d9fa" stroke-width="3" marker-end="url(#n)"/><path d="M717 282V319H1189V346" fill="none" stroke="#89d9fa" stroke-width="3" marker-end="url(#n)"/><rect x="437" y="552" width="566" height="97" rx="13" fill="#1a304a" stroke="#f4aba7" stroke-width="2.5"/><text x="455" y="592" fill="#f7faff" font-size="20" font-weight="700">Integration &amp; owner approval</text><text x="455" y="634" fill="#d9e8f1" font-size="17">Resolve overlaps, rerun combined checks and approve writes</text><path d="M248 506V533H716V543" fill="none" stroke="#89d9fa" stroke-width="3" marker-end="url(#n)"/><path d="M723 507V543" fill="none" stroke="#89d9fa" stroke-width="3" marker-end="url(#n)"/><path d="M1187 507V533H726V543" fill="none" stroke="#89d9fa" stroke-width="3" marker-end="url(#n)"/><rect x="37" y="676" width="1366" height="88" rx="13" fill="#393226" stroke="#ecc57b" stroke-width="2"/><text x="58" y="709" font-size="21" font-weight="700" fill="#fff0c8">Different agent prompts are not independent evidence</text><text x="58" y="742" font-size="17" fill="#f3e3c9">Require a separate readback, reproducible test output and named human permission for sensitive actions.</text><text x="38" y="790" fill="#b9ccdf" font-size="15">Conceptual orchestration method, not an autonomous authority or proof of multiple independently executing agents.</text></g></svg>
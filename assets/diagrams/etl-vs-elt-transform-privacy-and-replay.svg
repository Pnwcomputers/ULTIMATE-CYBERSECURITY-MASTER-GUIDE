<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 805" width="1440" height="805" role="img" aria-labelledby="title desc"><title id="title">ETL vs ELT: Where Transformation Happens</title><desc id="desc">ETL transforms before landing the curated destination; ELT lands controlled source data and transforms using destination compute. Both need access restrictions, checkpoints and completeness checks.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#89dafa"/></marker></defs><rect width="1440" height="805" rx="19" fill="#0d1b2d"/><g font-family="Arial,Helvetica,sans-serif"><text x="38" y="56" font-size="30" font-weight="700" fill="#f9fcff">ETL vs ELT: Where Transformation Happens</text><text x="38" y="91" font-size="18" fill="#c1d5e6">Raw retention, backfills and costs are policy and implementation choices, not guaranteed outcomes.</text><path d="M38 117H1402" stroke="#38536f" stroke-width="2"/><rect x="35" y="159" width="668" height="430" rx="18" fill="#132d45" stroke="#8bd9fb" stroke-width="2.3"/><rect x="738" y="159" width="668" height="430" rx="18" fill="#1b2d43" stroke="#b4abfa" stroke-width="2.3"/><text x="61" y="198" font-size="27" font-weight="700" fill="#e8faff">ETL: Transform then Load</text><text x="761" y="198" font-size="27" font-weight="700" fill="#ede8ff">ELT: Load then Transform</text><rect x="57" y="236" width="189" height="150" rx="14" fill="#1a3049" stroke="#8bd9fb" stroke-width="2.4"/><text x="76" y="275" font-size="21" font-weight="700" fill="#f8fdff">Source</text><text x="76" y="315" font-size="16" fill="#d8e9f3">Approved records</text><text x="76" y="350" font-size="16" fill="#d8e9f3">Bounded extract</text><rect x="272" y="236" width="190" height="150" rx="14" fill="#1a3049" stroke="#75daba" stroke-width="2.4"/><text x="291" y="275" font-size="21" font-weight="700" fill="#f8fdff">Transform</text><text x="291" y="315" font-size="16" fill="#d8e9f3">Validate / mask</text><text x="291" y="350" font-size="16" fill="#d8e9f3">Before storage</text><rect x="489" y="236" width="190" height="150" rx="14" fill="#1a3049" stroke="#edc982" stroke-width="2.4"/><text x="508" y="275" font-size="21" font-weight="700" fill="#f8fdff">Destination</text><text x="508" y="315" font-size="16" fill="#d8e9f3">Curated data</text><text x="508" y="350" font-size="16" fill="#d8e9f3">Provenance kept</text><path d="M246 305H263" fill="none" stroke="#89dafa" stroke-width="3" marker-end="url(#a)"/><path d="M462 305H480" fill="none" stroke="#89dafa" stroke-width="3" marker-end="url(#a)"/><rect x="758" y="236" width="189" height="150" rx="14" fill="#1a3049" stroke="#8bd9fb" stroke-width="2.4"/><text x="777" y="275" font-size="21" font-weight="700" fill="#f8fdff">Source</text><text x="777" y="315" font-size="16" fill="#d8e9f3">Approved records</text><text x="777" y="350" font-size="16" fill="#d8e9f3">Bounded extract</text><rect x="973" y="236" width="190" height="150" rx="14" fill="#1a3049" stroke="#75daba" stroke-width="2.4"/><text x="992" y="275" font-size="21" font-weight="700" fill="#f8fdff">Raw landing</text><text x="992" y="315" font-size="16" fill="#d8e9f3">Retention policy</text><text x="992" y="350" font-size="16" fill="#d8e9f3">Limit sensitive data</text><rect x="1179" y="236" width="199" height="150" rx="14" fill="#1a3049" stroke="#edc982" stroke-width="2.4"/><text x="1198" y="275" font-size="21" font-weight="700" fill="#f8fdff">Model in sink</text><text x="1198" y="315" font-size="16" fill="#d8e9f3">SQL transforms</text><text x="1198" y="350" font-size="16" fill="#d8e9f3">Rebuild outputs</text><path d="M948 305H964" fill="none" stroke="#89dafa" stroke-width="3" marker-end="url(#a)"/><path d="M1164 305H1170" fill="none" stroke="#89dafa" stroke-width="3" marker-end="url(#a)"/><text x="58" y="448" font-size="18" fill="#dfecf7">Best when restricted fields must</text><text x="58" y="480" font-size="18" fill="#dfecf7">never land in the destination</text><text x="760" y="448" font-size="18" fill="#dfecf7">Best when controlled raw history</text><text x="760" y="480" font-size="18" fill="#dfecf7">supports model rebuild and replay</text><path d="M40 612H1398" stroke="#48617b" stroke-width="2"/><rect x="38" y="647" width="1364" height="88" rx="13" fill="#3d3326" stroke="#edc67f" stroke-width="2"/><text x="60" y="682" font-size="21" font-weight="700" fill="#ffeabd">Both approaches require validation and recovery design</text><text x="60" y="711" font-size="17" fill="#f6e4c8">Store source positions, verify reconciliation and handle deletes, duplicates, late events and privacy obligations.</text><text x="41" y="785" font-size="15" fill="#b8d0e2">Conceptual patterns. Real pipelines often combine pre-landing minimization with destination-side modeling.</text></g></svg>
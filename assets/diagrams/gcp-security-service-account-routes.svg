<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Service account attachment is not token creation</title>
<desc id="desc">Service Account User allows attaching a service account to a resource and does not itself mint short-lived credentials. Token Creator permits supported short-lived credential creation. Permissions held by the service account determine the reach of either route.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
<path d="M0 0 L10 5 L0 10Z" fill="#337b98"/>
</marker>
</defs>
<rect width="1200" height="600" fill="#f4f7fa"/>
<text x="40" y="54" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#16354b">Service account attachment is not token creation</text>
<text x="40" y="89" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Conceptual permission distinction • not an impersonation procedure</text>
<rect x="40" y="149" width="535" height="280" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/>
<text x="58" y="183" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#16354b">Attach to a resource</text>
<text x="58" y="222" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#16354b">Service Account User / actAs</text>
<text x="58" y="252" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#16354b">Deployment permissions also needed</text>
<text x="58" y="282" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#16354b">Workload uses attached identity</text>
<rect x="625" y="149" width="535" height="280" rx="16" fill="#fff3d7" stroke="#b5cbd7" stroke-width="2"/>
<text x="643" y="183" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#16354b">Create short-lived credentials</text>
<text x="643" y="222" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#16354b">Service Account Token Creator</text>
<text x="643" y="252" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#16354b">Token permissions on the account</text>
<text x="643" y="282" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#16354b">Caller uses delegated credentials</text>
<rect x="40" y="480" width="1120" height="86" rx="12" fill="#e0ebf1"/>
<text x="58" y="510" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">The service account’s own access determines potential impact; inspect both sides of the relationship.</text>
<text x="58" y="539" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Do not equate actAs with getAccessToken or assume one permission completes a deployment chain.</text>
</svg>

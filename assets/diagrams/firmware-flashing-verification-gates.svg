<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 750" width="1440" height="750" role="img" aria-labelledby="title desc"><title id="title">Firmware Flashing: Verify, Write, Prove &amp; Recover</title><desc id="desc">A four-stage firmware installation decision flow with a hard stop for any mismatch, plus independent post-flash behavioral verification.</desc><defs><marker id="next" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#78D7FC"/></marker></defs><rect width="1440" height="750" rx="20" fill="#0B1728"/><g font-family="Arial,Helvetica,sans-serif"><text x="34" y="54" font-size="31" font-weight="700" fill="#F7FAFF">Firmware Flashing: Verify, Write, Prove &amp; Recover</text><text x="34" y="88" font-size="18" fill="#B9D0E3">Do not confuse an apparently successful flash with working, compatible or trusted firmware.</text><path d="M34 111H1406" stroke="#375168" stroke-width="2"/><rect x="35" y="160" width="306" height="236" rx="14" fill="#172B44" stroke="#78D7FC" stroke-width="2.5"/><rect x="35" y="160" width="7" height="236" rx="4" fill="#78D7FC"/><text x="55" y="203" font-size="21" font-weight="700" fill="#F7FAFF">1  Identify exact board</text><text x="55" y="245" font-size="17" fill="#D8E5F0">MCU &amp; hardware revision</text><text x="55" y="280" font-size="17" fill="#D8E5F0">Flash size and peripherals</text><text x="55" y="315" font-size="17" fill="#D8E5F0">Backup config/logs</text><path d="M344 283H377" fill="none" stroke="#78D7FC" stroke-width="3" marker-end="url(#next)"/><rect x="389" y="160" width="306" height="236" rx="14" fill="#172B44" stroke="#B9B2FF" stroke-width="2.5"/><rect x="389" y="160" width="7" height="236" rx="4" fill="#B9B2FF"/><text x="409" y="203" font-size="21" font-weight="700" fill="#F7FAFF">2  Verify source image</text><text x="409" y="245" font-size="17" fill="#D8E5F0">Project release &amp; hash</text><text x="409" y="280" font-size="17" fill="#D8E5F0">Board-specific build</text><text x="409" y="315" font-size="17" fill="#D8E5F0">Boot/partition layout</text><path d="M698 283H731" fill="none" stroke="#78D7FC" stroke-width="3" marker-end="url(#next)"/><rect x="743" y="160" width="306" height="236" rx="14" fill="#172B44" stroke="#70DEB4" stroke-width="2.5"/><rect x="743" y="160" width="7" height="236" rx="4" fill="#70DEB4"/><text x="763" y="203" font-size="21" font-weight="700" fill="#F7FAFF">3  Choose install route</text><text x="763" y="245" font-size="17" fill="#D8E5F0">Official flasher if offered</text><text x="763" y="280" font-size="17" fill="#D8E5F0">Supported browser/driver</text><text x="763" y="315" font-size="17" fill="#D8E5F0">Review wipe &amp; reset effects</text><path d="M1052 283H1085" fill="none" stroke="#78D7FC" stroke-width="3" marker-end="url(#next)"/><rect x="1097" y="160" width="306" height="236" rx="14" fill="#172B44" stroke="#F0CC80" stroke-width="2.5"/><rect x="1097" y="160" width="7" height="236" rx="4" fill="#F0CC80"/><text x="1117" y="203" font-size="21" font-weight="700" fill="#F7FAFF">4  Verify after reboot</text><text x="1117" y="245" font-size="17" fill="#D8E5F0">Runtime version &amp; features</text><text x="1117" y="280" font-size="17" fill="#D8E5F0">Safe owned-device test</text><text x="1117" y="315" font-size="17" fill="#D8E5F0">Logs and recovery result</text><rect x="36" y="470" width="1367" height="95" rx="12" fill="#3A3226" stroke="#F0CC80" stroke-width="2"/><text x="56" y="507" font-size="21" font-weight="700" fill="#FFE7B3">STOP if build, chip, flash layout, power or authorization does not match</text><text x="56" y="539" font-size="17" fill="#F1DDBD">A vendor flasher, Web Serial permission dialog or progress bar cannot fix a mismatched target.</text><text x="35" y="628" font-size="17" fill="#BBD0E0">Browser flashing requires a supported environment and explicit port permission; alternative DFU/UF2/SD routes differ by board.</text><text x="35" y="668" font-size="17" fill="#BBD0E0">Do not copy ESP flash offsets across chip families or reuse images intended for a different controller.</text></g></svg>
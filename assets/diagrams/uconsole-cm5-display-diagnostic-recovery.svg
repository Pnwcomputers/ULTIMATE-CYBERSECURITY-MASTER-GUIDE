<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="795" viewBox="0 0 1440 795" role="img" aria-labelledby="title desc"><title id="title">uConsole CM5: Recover Display Without Blind Changes</title><desc id="desc">Recover by preserving state, distinguishing cursor-only desktop failure from rotation and examining apt/boot modifications separately. Restore only configuration verified for the exact Rex image and board.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#80d7f7"/></marker></defs><rect width="1440" height="795" rx="19" fill="#0d1a2b"/><g font-family="Arial,Helvetica,sans-serif"><text x="36" y="56" font-size="29" font-weight="700" fill="#f8fcff">uConsole CM5: Recover Display Without Blind Changes</text><text x="36" y="90" font-size="18" fill="#c2d7e6">Do not assume display connector names, Xorg config or Kali package sources apply to every CM5.</text><path d="M36 118H1404" stroke="#354f69" stroke-width="2"/><rect x="35" y="157" width="414" height="175" rx="14" fill="#1a3049" stroke="#80d7f7" stroke-width="2.3"/><text x="53" y="199" font-size="21" font-weight="700" fill="#f9fdff">1. Preserve &amp; identify</text><text x="53" y="241" font-size="17" fill="#d8e9f4">Backup configs and data</text><text x="53" y="274" font-size="17" fill="#d8e9f4">Record original OS, image &amp; AIO</text><text x="53" y="307" font-size="17" fill="#d8e9f4">Find prior setup script version</text><rect x="511" y="157" width="416" height="175" rx="14" fill="#1a3049" stroke="#a8aafa" stroke-width="2.3"/><text x="529" y="199" font-size="21" font-weight="700" fill="#f9fdff">2. Diagnose the symptom</text><text x="529" y="241" font-size="17" fill="#d8e9f4">Blank cursor: session/autostart</text><text x="529" y="274" font-size="17" fill="#d8e9f4">Rotation: X11 or Wayland?</text><text x="529" y="307" font-size="17" fill="#d8e9f4">Check logs before modifications</text><rect x="989" y="157" width="412" height="175" rx="14" fill="#1a3049" stroke="#edc787" stroke-width="2.3"/><text x="1007" y="199" font-size="21" font-weight="700" fill="#f9fdff">3. Check side effects</text><text x="1007" y="241" font-size="17" fill="#d8e9f4">APT source mixing and overrides</text><text x="1007" y="274" font-size="17" fill="#d8e9f4">Review overlays if installed</text><text x="1007" y="307" font-size="17" fill="#d8e9f4">Avoid blind package downgrade</text><path d="M450 240H502" fill="none" stroke="#80d7f7" stroke-width="3" marker-end="url(#arr)"/><path d="M928 240H980" fill="none" stroke="#80d7f7" stroke-width="3" marker-end="url(#arr)"/><rect x="239" y="425" width="964" height="165" rx="14" fill="#1a3049" stroke="#71dfb8" stroke-width="2.3"/><text x="257" y="467" font-size="21" font-weight="700" fill="#f9fdff">4. Choose the narrowest recovery</text><text x="257" y="509" font-size="17" fill="#d8e9f4">Restore matching desktop session and image-specific settings, OR use known-good image</text><text x="257" y="542" font-size="17" fill="#d8e9f4">Reboot after review; independently verify screen, login, peripherals and package health</text><path d="M1197 332V382H722V417" fill="none" stroke="#80d7f7" stroke-width="3" marker-end="url(#arr)"/><rect x="36" y="642" width="1368" height="89" rx="12" fill="#3b3126" stroke="#ecc37d" stroke-width="2"/><text x="55" y="676" font-size="21" font-weight="700" fill="#ffebc2">The updated installer does not undo older package changes</text><text x="55" y="708" font-size="17" fill="#f3e3c7">Software fixture tests cannot confirm that a real CM5 display and AIO board work; record hardware checks.</text><text x="38" y="782" font-size="15" fill="#b8cdde">Conceptual repair decision flow, not a tested screenshot or a one-command repair prescription.</text></g></svg>
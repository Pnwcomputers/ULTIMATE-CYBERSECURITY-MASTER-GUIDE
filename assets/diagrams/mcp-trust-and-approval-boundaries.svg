<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 640" role="img" aria-labelledby="title desc"><title id="title">MCP: Trust &amp; Tool Permission Gates</title><desc id="desc">Conceptual separation of untrusted external content, the AI host and its MCP client, server-side tool permissions and independent human approval of side effects.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#6AD5FF"/></marker></defs><rect width="1440" height="640" rx="18" fill="#0D182A"/><g font-family="Arial,Helvetica,sans-serif"><text x="34" y="57" font-size="32" font-weight="700" fill="#FFFFFF">MCP: Trust &amp; Tool Permission Gates</text><text x="34" y="91" font-size="18" fill="#C4D7E7">Tool schemas describe capabilities; they do not grant authority.</text><path d="M34 115H1406" stroke="#344B64" stroke-width="2"/><rect x="34" y="162" width="305" height="270" rx="14" fill="#192D47" stroke="#6AD5FF" stroke-width="2.5"/><rect x="34" y="162" width="7" height="270" rx="3" fill="#6AD5FF"/><text x="53" y="205" font-size="21" font-weight="700" fill="#FFFFFF">1  Untrusted input</text><text x="53" y="265" font-size="18" fill="#D5E4F1">Resources &amp; retrieved text</text><text x="53" y="303" font-size="18" fill="#D5E4F1">Model suggestions</text><text x="53" y="341" font-size="18" fill="#D5E4F1">Treat prompts as data</text><path d="M342 297H376" fill="none" stroke="#6AD5FF" stroke-width="3" marker-end="url(#arrow)"/><rect x="389" y="162" width="305" height="270" rx="14" fill="#192D47" stroke="#B6ABFF" stroke-width="2.5"/><rect x="389" y="162" width="7" height="270" rx="3" fill="#B6ABFF"/><text x="408" y="205" font-size="21" font-weight="700" fill="#FFFFFF">2  Host-side policy</text><text x="408" y="265" font-size="18" fill="#D5E4F1">Identify caller &amp; tenant</text><text x="408" y="303" font-size="18" fill="#D5E4F1">Allowlist tools &amp; scope</text><text x="408" y="341" font-size="18" fill="#D5E4F1">Validate requests</text><path d="M697 297H731" fill="none" stroke="#6AD5FF" stroke-width="3" marker-end="url(#arrow)"/><rect x="744" y="162" width="305" height="270" rx="14" fill="#192D47" stroke="#70DEB6" stroke-width="2.5"/><rect x="744" y="162" width="7" height="270" rx="3" fill="#70DEB6"/><text x="763" y="205" font-size="21" font-weight="700" fill="#FFFFFF">3  MCP server/API</text><text x="763" y="265" font-size="18" fill="#D5E4F1">Authenticate each call</text><text x="763" y="303" font-size="18" fill="#D5E4F1">Authorize operation</text><text x="763" y="341" font-size="18" fill="#D5E4F1">Log and read back</text><path d="M1052 297H1086" fill="none" stroke="#6AD5FF" stroke-width="3" marker-end="url(#arrow)"/><rect x="1099" y="162" width="305" height="270" rx="14" fill="#192D47" stroke="#F1CD84" stroke-width="2.5"/><rect x="1099" y="162" width="7" height="270" rx="3" fill="#F1CD84"/><text x="1118" y="205" font-size="21" font-weight="700" fill="#FFFFFF">4  Human approval</text><text x="1118" y="265" font-size="18" fill="#D5E4F1">Preview recipients/targets</text><text x="1118" y="303" font-size="18" fill="#D5E4F1">Review side effects</text><text x="1118" y="341" font-size="18" fill="#D5E4F1">Allow or reject write</text><rect x="34" y="481" width="1372" height="98" rx="12" fill="#353226" stroke="#F1CD84" stroke-width="2"/><text x="53" y="519" font-size="21" font-weight="700" fill="#FFF1C9">Safety / interpretation boundary</text><text x="53" y="551" font-size="17" fill="#F2E4CA">No message, model result or tool description can authorize privileged operations by itself.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="585" viewBox="0 0 1200 585" role="img" aria-labelledby="title desc"><title id="title">One device can expose different cryptographic interfaces</title><desc id="desc">Three independent protocol paths: WebAuthn signatures for account login, hmac-secret for supported LUKS2 integrations, and optional PIV or OpenPGP applications.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#286585"/></marker></defs><rect width="1200" height="585" fill="#f6f9fc"/><g font-family="Arial, sans-serif" fill="#16354b"><text x="40" y="48" font-size="30" font-weight="700">One device can expose different cryptographic interfaces</text><rect x="40" y="85" width="542.5" height="120" rx="12" fill="#e4f0f5" stroke="#8faebb"/><text x="56" y="114" font-size="21" font-weight="700">WebAuthn sign-in</text><text x="56" y="143" font-size="18">Browser + service challenge</text><text x="56" y="166" font-size="18">Credential signs the challenge</text><path d="M585.5 145h27" stroke="#286585" stroke-width="2" marker-end="url(#arrow)"/><rect x="617.5" y="85" width="542.5" height="120" rx="12" fill="#e4f0f5" stroke="#8faebb"/><text x="633.5" y="114" font-size="21" font-weight="700">Service checks</text><text x="633.5" y="143" font-size="18">Signature, origin and policy</text><text x="633.5" y="166" font-size="18">Grants an account session</text><rect x="40" y="230" width="542.5" height="120" rx="12" fill="#fff3d8" stroke="#8faebb"/><text x="56" y="259" font-size="21" font-weight="700">FIDO2 hmac-secret</text><text x="56" y="288" font-size="18">Only supported token + host</text><text x="56" y="311" font-size="18">Extension derives secret output</text><path d="M585.5 290h27" stroke="#286585" stroke-width="2" marker-end="url(#arrow)"/><rect x="617.5" y="230" width="542.5" height="120" rx="12" fill="#fff3d8" stroke="#8faebb"/><text x="633.5" y="259" font-size="21" font-weight="700">LUKS2 integration</text><text x="633.5" y="288" font-size="18">Host manages disk-unlock use</text><text x="633.5" y="311" font-size="18">Needs its own recovery plan</text><rect x="40" y="375" width="542.5" height="120" rx="12" fill="#e4f0f5" stroke="#8faebb"/><text x="56" y="404" font-size="21" font-weight="700">PIV / OpenPGP apps</text><text x="56" y="433" font-size="18">Available on selected models</text><text x="56" y="456" font-size="18">Separate keys and protocols</text><path d="M585.5 435h27" stroke="#286585" stroke-width="2" marker-end="url(#arrow)"/><rect x="617.5" y="375" width="542.5" height="120" rx="12" fill="#e4f0f5" stroke="#8faebb"/><text x="633.5" y="404" font-size="21" font-weight="700">Compatible application</text><text x="633.5" y="433" font-size="18">Signing or decryption workflow</text><text x="633.5" y="456" font-size="18">Separate lifecycle and recovery</text><text x="40" y="565" font-size="17">Conceptual interfaces. Support for one path does not establish support for the other paths.</text></g></svg>
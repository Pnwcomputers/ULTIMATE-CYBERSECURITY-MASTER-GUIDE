<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
<title id="title">Keep secrets out of the artifact and review each exposure path</title>
<desc id="desc">A secret store can supply temporary build secrets and separately supply runtime secrets. Build tools or applications can still copy secrets into output, logs or persistent storage. Temporary secret mounts are not a guarantee against misuse.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
<path d="M0 0L10 5L0 10Z" fill="#337b98"/>
</marker>
</defs>
<rect width="1200" height="580" fill="#f4f7fa"/>
<text x="40" y="54" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#16354b">Keep secrets out of the artifact and review each exposure path</text>
<text x="40" y="89" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Conceptual build/runtime lifecycle • no credentials or live services shown</text>
<rect x="40" y="160" width="260" height="200" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/>
<text x="58" y="194" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16354b">Secret source</text>
<text x="58" y="233" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Scoped credentials</text>
<text x="58" y="262" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Access and rotation</text>
<rect x="425" y="130" width="330" height="135" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/>
<text x="443" y="164" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16354b">Build-time mount</text>
<text x="443" y="203" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Temporary build access</text>
<rect x="425" y="310" width="330" height="135" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/>
<text x="443" y="344" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16354b">Runtime delivery</text>
<text x="443" y="383" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Application access</text>
<rect x="865" y="222" width="295" height="165" rx="16" fill="#fff3d7" stroke="#b5cbd7" stroke-width="2"/>
<text x="883" y="256" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16354b">Exposure review</text>
<text x="883" y="295" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Artifact / cache / logs</text>
<text x="883" y="324" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Process / files / backups</text>
<path d="M312 222L413 197" stroke="#337b98" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
<path d="M312 300L413 372" stroke="#337b98" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
<path d="M767 197L853 263" stroke="#337b98" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
<path d="M767 377L853 335" stroke="#337b98" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
<rect x="40" y="465" width="1120" height="85" rx="12" fill="#e0ebf1"/>
<text x="58" y="495" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Do not bake credentials into layers or build arguments/environment variables.</text>
<text x="58" y="524" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">A secret-delivery mechanism does not prevent the consuming tool from disclosing the secret.</text>
</svg>

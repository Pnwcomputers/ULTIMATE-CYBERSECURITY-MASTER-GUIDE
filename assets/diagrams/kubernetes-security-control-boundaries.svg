<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
<title id="title">Kubernetes controls answer different questions</title>
<desc id="desc">Authentication establishes an identity, authorization including RBAC checks an API action, admission evaluates a proposed object, and runtime controls act on execution. Permission to create a Pod does not establish that a particular Pod will be admitted or safely run.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
<path d="M0 0 L10 5 L0 10Z" fill="#337b98"/>
</marker>
</defs>
<rect width="1200" height="570" fill="#f4f7fa"/>
<text x="40" y="54" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#16354b">Kubernetes controls answer different questions</text>
<text x="40" y="89" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Conceptual Pod-write path • not a complete API-server sequence</text>
<rect x="40" y="158" width="250" height="210" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/>
<text x="58" y="192" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16354b">Authenticate</text>
<text x="58" y="230" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Who is making</text>
<text x="58" y="260" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">the request?</text>
<path d="M298 260 L319 260" stroke="#337b98" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
<rect x="330" y="158" width="250" height="210" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/>
<text x="348" y="192" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16354b">Authorize</text>
<text x="348" y="230" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">May this identity</text>
<text x="348" y="260" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">perform this API action?</text>
<path d="M588 260 L609 260" stroke="#337b98" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
<rect x="620" y="158" width="250" height="210" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/>
<text x="638" y="192" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16354b">Admission</text>
<text x="638" y="230" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Is this proposed object</text>
<text x="638" y="260" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">allowed by policy?</text>
<path d="M878 260 L899 260" stroke="#337b98" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
<rect x="910" y="158" width="250" height="210" rx="16" fill="#fff3d7" stroke="#b5cbd7" stroke-width="2"/>
<text x="928" y="192" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16354b">Runtime</text>
<text x="928" y="230" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">How is execution</text>
<text x="928" y="260" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">restricted and observed?</text>
<rect x="40" y="451" width="1120" height="86" rx="12" fill="#e0ebf1"/>
<text x="58" y="481" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">RBAC is API authorization. Pod Security Admission is object policy. Runtime isolation is another boundary.</text>
<text x="58" y="510" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">A permitted API verb, an admitted Pod and a secure workload are distinct findings.</text>
</svg>
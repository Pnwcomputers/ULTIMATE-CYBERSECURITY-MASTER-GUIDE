<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="775" viewBox="0 0 1440 775" role="img" aria-labelledby="title desc"><title id="title">Honeypot to Wazuh: Trace Every Telemetry Hop</title><desc id="desc">Isolated deception endpoints produce distinct event formats; enrolled Wazuh agents collect configured JSON files; manager decoding/rules and index/dashboard require separate validation.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#8fd7ef"/></marker></defs><rect width="1440" height="775" fill="#0e1927" rx="20"/><g font-family="Arial,Helvetica,sans-serif"><text x="40" y="58" font-size="30" font-weight="700" fill="#f4faff">Honeypot to Wazuh: Trace Every Telemetry Hop</text><text x="40" y="93" font-size="18" fill="#bed2e2">Synthetic rule tests and indexed alert readback are different evidence levels.</text><line x1="40" y1="119" x2="1400" y2="119" stroke="#385066" stroke-width="2"/><rect x="40" y="158" width="290" height="240" fill="#193047" stroke="#77dcbc" stroke-width="2.5" rx="14"/><rect x="40" y="158" width="8" height="240" rx="4" fill="#77dcbc"/><text x="59" y="197" font-size="21" font-weight="700" fill="#f5faff">Decoy zone</text><text x="59" y="239" font-size="17" fill="#d7e6f2">OpenCanary JSONL</text><text x="59" y="273" font-size="17" fill="#d7e6f2">Cowrie cowrie.json</text><text x="59" y="307" font-size="17" fill="#d7e6f2">DIY HTTP JSONL</text><text x="59" y="341" font-size="17" fill="#d7e6f2">ESP32: relay only</text><rect x="396" y="158" width="288" height="240" fill="#193047" stroke="#80d0f7" stroke-width="2.5" rx="14"/><rect x="396" y="158" width="8" height="240" rx="4" fill="#80d0f7"/><text x="415" y="197" font-size="21" font-weight="700" fill="#f5faff">Decoy host / agent</text><text x="415" y="239" font-size="17" fill="#d7e6f2">Read correct local path</text><text x="415" y="273" font-size="17" fill="#d7e6f2">JSON-per-line parsing</text><text x="415" y="307" font-size="17" fill="#d7e6f2">Enrolled agent transport</text><text x="415" y="341" font-size="17" fill="#d7e6f2">Check permissions/rotation</text><rect x="750" y="158" width="288" height="240" fill="#193047" stroke="#b0a8fd" stroke-width="2.5" rx="14"/><rect x="750" y="158" width="8" height="240" rx="4" fill="#b0a8fd"/><text x="769" y="197" font-size="21" font-weight="700" fill="#f5faff">Wazuh manager</text><text x="769" y="239" font-size="17" fill="#d7e6f2">Decode source fields</text><text x="769" y="273" font-size="17" fill="#d7e6f2">Apply custom rule IDs</text><text x="769" y="307" font-size="17" fill="#d7e6f2">Log alerts &amp; errors</text><text x="769" y="341" font-size="17" fill="#d7e6f2">Test actual sample</text><rect x="1104" y="158" width="296" height="240" fill="#193047" stroke="#efca86" stroke-width="2.5" rx="14"/><rect x="1104" y="158" width="8" height="240" rx="4" fill="#efca86"/><text x="1123" y="197" font-size="21" font-weight="700" fill="#f5faff">Indexer / dashboard</text><text x="1123" y="239" font-size="17" fill="#d7e6f2">Verify event delivery</text><text x="1123" y="273" font-size="17" fill="#d7e6f2">Check index timestamps</text><text x="1123" y="307" font-size="17" fill="#d7e6f2">Search result &amp; alert</text><text x="1123" y="341" font-size="17" fill="#d7e6f2">Triangulate WIDS separately</text><path d="M331 274H386" stroke="#8fd7ef" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M685 274H740" stroke="#8fd7ef" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M1039 274H1094" stroke="#8fd7ef" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="40" y="455" width="1360" height="122" rx="13" fill="#162d42" stroke="#6fbfdd" stroke-width="2"/><text x="62" y="489" font-size="20" font-weight="700" fill="#f5faff">Evidence chain: do not skip a failed stage</text><text x="62" y="525" font-size="18" fill="#d5e7f4">File writes → agent reads → manager rule matches → alert indexed → analyst independently reviews context.</text><text x="62" y="556" font-size="17" fill="#d5e7f4">A local wazuh-logtest match alone does not prove a collector, transport or dashboard is working.</text><rect x="40" y="631" width="1360" height="90" rx="13" fill="#3b3228" stroke="#ecc981" stroke-width="2"/><text x="58" y="666" font-size="21" fill="#ffe7b9" font-weight="700">Isolation is part of the detection design</text><text x="58" y="699" font-size="17" fill="#f4e4cb">Deny-by-default decoy egress; never run downloaded payloads; protect recorded credentials.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">IQ representation changes storage and interpretation</title>
<desc id="desc">HackRF native transfer files alternate signed 8-bit I and Q samples. A complex float32 working file stores two 32-bit floating-point values. Conversion changes representation; renaming a file does not.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
<path d="M0 0 L10 5 L0 10Z" fill="#337b98"/>
</marker>
</defs>
<rect width="1200" height="600" fill="#f4f7fa"/>
<text x="40" y="54" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#16354b">IQ representation changes storage and interpretation</text>
<text x="40" y="89" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Conceptual data layout • not bytes from a captured signal</text>
<rect x="40" y="145" width="535" height="280" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/>
<text x="58" y="180" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16354b">Native hackrf_transfer file</text>
<text x="58" y="218" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">I:int8   Q:int8   I:int8   Q:int8</text>
<text x="58" y="248" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">2 bytes per complex sample</text>
<text x="58" y="278" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">8 MS/s → 16 MB/s (decimal)</text>
<rect x="625" y="145" width="535" height="280" rx="16" fill="#fff3d7" stroke="#b5cbd7" stroke-width="2"/>
<text x="643" y="180" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16354b">Complex float32 working copy</text>
<text x="643" y="218" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">I:float32   Q:float32</text>
<text x="643" y="248" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">8 bytes per complex sample</text>
<text x="643" y="278" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Same rate → 4× native storage</text>
<rect x="40" y="480" width="1120" height="86" rx="12" fill="#e0ebf1"/>
<text x="58" y="510" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Preserve the original, and record conversion scale, sample rate, frequency, and I/Q order.</text>
<text x="58" y="539" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Samples, pulse timings, audio, sweep CSV and decoded PCAP are different evidence types.</text>
</svg>

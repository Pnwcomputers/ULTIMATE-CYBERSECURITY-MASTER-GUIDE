<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Security Detection: From Observation To Reviewed Alert</title><desc id="desc">A threshold or pattern match alone cannot prove malicious activity.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#80cfff"/></marker><marker id="gold" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#f9bd59"/></marker></defs><rect width="1200" height="650" rx="20" fill="#0c1425"/><g font-family="Arial,Helvetica,sans-serif"><text x="42" y="56" font-size="31" font-weight="700" fill="#f8fafc">Security Detection: From Observation To Reviewed Alert</text><text x="42" y="89" font-size="17" fill="#b9cee0">A threshold or pattern match alone cannot prove malicious activity.</text><rect x="35" y="166" width="217" height="251" rx="15" fill="#172d41" stroke="#549eb6" stroke-width="1.8"/><circle cx="64" cy="201" r="19" fill="#38bdf8"/><text x="64" y="208" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#062037" text-anchor="middle">1</text><text x="52" y="257" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="start">Collect</text><text x="52" y="316" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#dcebf5" text-anchor="start">SPAN / TAP / endpoint</text><text x="52" y="358" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#8ccfe6" text-anchor="start">Visibility limits</text><path d="M253 287 L265 287" stroke="#80cfff" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="271" y="166" width="217" height="251" rx="15" fill="#172d41" stroke="#549eb6" stroke-width="1.8"/><circle cx="300" cy="201" r="19" fill="#38bdf8"/><text x="300" y="208" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#062037" text-anchor="middle">2</text><text x="288" y="257" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="start">Normalize</text><text x="288" y="316" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#dcebf5" text-anchor="start">Parse / timestamp</text><text x="288" y="358" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#8ccfe6" text-anchor="start">Encoding / identity</text><path d="M489 287 L501 287" stroke="#80cfff" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="507" y="166" width="217" height="251" rx="15" fill="#172d41" stroke="#549eb6" stroke-width="1.8"/><circle cx="536" cy="201" r="19" fill="#38bdf8"/><text x="536" y="208" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#062037" text-anchor="middle">3</text><text x="524" y="257" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="start">Detect</text><text x="524" y="316" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#dcebf5" text-anchor="start">Aho–Corasick / rules</text><text x="524" y="358" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#8ccfe6" text-anchor="start">EWMA / sliding windows</text><path d="M725 287 L737 287" stroke="#80cfff" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="743" y="166" width="217" height="251" rx="15" fill="#172d41" stroke="#549eb6" stroke-width="1.8"/><circle cx="772" cy="201" r="19" fill="#38bdf8"/><text x="772" y="208" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#062037" text-anchor="middle">4</text><text x="760" y="257" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="start">Correlate</text><text x="760" y="316" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#dcebf5" text-anchor="start">Context / asset graph</text><text x="760" y="358" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#8ccfe6" text-anchor="start">Evidence &amp; baselines</text><path d="M961 287 L973 287" stroke="#80cfff" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="979" y="166" width="217" height="251" rx="15" fill="#172d41" stroke="#549eb6" stroke-width="1.8"/><circle cx="1008" cy="201" r="19" fill="#38bdf8"/><text x="1008" y="208" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#062037" text-anchor="middle">5</text><text x="996" y="257" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="start">Respond</text><text x="996" y="316" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#dcebf5" text-anchor="start">Human verification</text><text x="996" y="358" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#8ccfe6" text-anchor="start">Approval / rollback</text><rect x="45" y="457" width="526" height="98" rx="15" fill="#332b37" stroke="#bc8d8b" stroke-width="1.8"/><text x="66" y="488" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#ffe6dc" text-anchor="start">Blind Spots</text><text x="66" y="521" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#dcebf5" text-anchor="start">Encryption, packet loss, off-path sensors, late logs</text><rect x="597" y="457" width="560" height="98" rx="15" fill="#142f3d" stroke="#6baa99" stroke-width="1.8"/><text x="618" y="488" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#e0fff0" text-anchor="start">Quality Controls</text><text x="618" y="521" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#dcebf5" text-anchor="start">Precision, recall, coverage, false-positive review</text><rect x="40" y="572" width="1120" height="51" rx="15" fill="#172e43" stroke="#476982" stroke-width="1.8"/><text x="60" y="603" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#d5e9f7" text-anchor="start">No automatic blocking from an unvalidated toy score; retain original evidence.</text></g></svg>
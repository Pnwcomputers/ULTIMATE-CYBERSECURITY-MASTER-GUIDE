<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">LA1010 maximum sample rate by active channels</title>
<desc id="desc">Manufacturer-published LA1010 sampling rates: 100 mega-samples per second at 3 active channels, 50 at 6 channels, 32 at 9 channels, and 16 at 16 channels. The manufacturer's table separately lists a fastest digital signal specification of 20 megahertz. This chart is a product specification summary, not a measured capture.</desc>
<rect width="1000" height="560" rx="24" fill="#f5f8fc"/>
<text x="500" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#142b45">LA1010: More Channels, Lower Maximum Sample Rate</text>
<text x="500" y="78" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#365672">Manufacturer-published mode limits · not a measured result</text>
<g font-family="Arial,sans-serif">
<text x="240" y="130" text-anchor="end" font-size="17" font-weight="700" fill="#142b45">3 active channels</text>
<rect x="270" y="108" width="520" height="32" rx="8" fill="#2f6e9e"/><text x="805" y="131" font-size="18" font-weight="700" fill="#142b45">100 MS/s</text>
<text x="240" y="190" text-anchor="end" font-size="17" font-weight="700" fill="#142b45">6 active channels</text>
<rect x="270" y="168" width="260" height="32" rx="8" fill="#4387b5"/><text x="545" y="191" font-size="18" font-weight="700" fill="#142b45">50 MS/s</text>
<text x="240" y="250" text-anchor="end" font-size="17" font-weight="700" fill="#142b45">9 active channels</text>
<rect x="270" y="228" width="166" height="32" rx="8" fill="#5c9ac4"/><text x="451" y="251" font-size="18" font-weight="700" fill="#142b45">32 MS/s</text>
<text x="240" y="310" text-anchor="end" font-size="17" font-weight="700" fill="#142b45">16 active channels</text>
<rect x="270" y="288" width="83" height="32" rx="8" fill="#79afd0"/><text x="368" y="311" font-size="18" font-weight="700" fill="#142b45">16 MS/s</text>
<line x1="270" y1="344" x2="790" y2="344" stroke="#8497a8" stroke-width="1"/>
<g fill="#52687d" font-size="13" text-anchor="middle"><text x="270" y="365">0</text><text x="530" y="365">50</text><text x="790" y="365">100 MS/s</text></g>
<rect x="100" y="398" width="800" height="58" rx="12" fill="#fff4e6" stroke="#c17b25" stroke-width="2"/>
<text x="500" y="434" text-anchor="middle" font-size="18" font-weight="700" fill="#5b3510">The manufacturer's table also lists 20 MHz as the fastest digital signal.</text>
<text x="500" y="490" text-anchor="middle" font-size="16" fill="#365672">Sample rate is not analog bandwidth; use the exact channel mode and current manual to plan a capture.</text>
<text x="500" y="520" text-anchor="middle" font-size="14" fill="#52687d">Source: InnoMaker LA1010 product specifications. Specifications are not independent validation.</text>
</g></svg>
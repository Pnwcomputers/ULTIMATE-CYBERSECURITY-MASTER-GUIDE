<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 640" role="img" aria-labelledby="title desc"><title id="title">uConsole: Hardware &amp; OS Preflight</title><desc id="desc">Separation of CM4 and CM5 hardware/image selection, OS-family package source safety, optional AIO board checks and physical postflight validation.</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#6AD5FF"/></marker></defs><rect width="1440" height="640" rx="18" fill="#0D182A"/><g font-family="Arial,Helvetica,sans-serif"><text x="36" y="57" font-size="31" font-weight="700" fill="#F5F8FF">uConsole: Hardware &amp; OS Preflight</text><text x="36" y="91" font-size="18" fill="#C0D4E5">The same uConsole shell and AIO board may require different CM4 / CM5 setup procedures.</text><path d="M36 115H1404" stroke="#384E65" stroke-width="2"/><rect x="35" y="162" width="308" height="271" rx="14" fill="#172B44" stroke="#6AD5FF" stroke-width="2"/><text x="52" y="206" font-size="21" font-weight="700" fill="#FFF">1  Identify hardware</text><text x="52" y="265" font-size="18" fill="#D3E5F0">Read CM4 / CM5 revision</text><text x="52" y="303" font-size="18" fill="#D3E5F0">Confirm adapter &amp; AIO v2</text><text x="52" y="341" font-size="18" fill="#D3E5F0">Backup existing storage</text><path d="M346 295H377" stroke="#6AD5FF" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="389" y="162" width="308" height="271" rx="14" fill="#172B44" stroke="#AFA6FF" stroke-width="2"/><text x="406" y="206" font-size="21" font-weight="700" fill="#FFF">2  Verify OS image</text><text x="406" y="265" font-size="18" fill="#D3E5F0">Native Kali or Debian</text><text x="406" y="303" font-size="18" fill="#D3E5F0">Do not mix APT sources</text><text x="406" y="341" font-size="18" fill="#D3E5F0">Check kernel &amp; desktop</text><path d="M700 295H731" stroke="#6AD5FF" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="743" y="162" width="308" height="271" rx="14" fill="#172B44" stroke="#6DDBB2" stroke-width="2"/><text x="760" y="206" font-size="21" font-weight="700" fill="#FFF">3  Optional peripherals</text><text x="760" y="265" font-size="18" fill="#D3E5F0">Confirm antenna/voltage</text><text x="760" y="303" font-size="18" fill="#D3E5F0">Review GPIO &amp; RTC</text><text x="760" y="341" font-size="18" fill="#D3E5F0">Enable only if fitted</text><path d="M1054 295H1085" stroke="#6AD5FF" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="1097" y="162" width="308" height="271" rx="14" fill="#172B44" stroke="#F1CF88" stroke-width="2"/><text x="1114" y="206" font-size="21" font-weight="700" fill="#FFF">4  Validate on device</text><text x="1114" y="265" font-size="18" fill="#D3E5F0">Display &amp; power checks</text><text x="1114" y="303" font-size="18" fill="#D3E5F0">GPS/SDR/LoRa as fitted</text><text x="1114" y="341" font-size="18" fill="#D3E5F0">Record exact test results</text><rect x="35" y="486" width="1370" height="93" rx="12" fill="#373225" stroke="#F1CF88" stroke-width="2"/><text x="55" y="519" font-size="21" font-weight="700" fill="#FFEDBF">Operational checkpoint</text><text x="55" y="553" font-size="17" fill="#F1DFBD">Scripts and mock exports cannot prove radio reception, power rails, screen rotation or device compatibility.</text></g></svg>
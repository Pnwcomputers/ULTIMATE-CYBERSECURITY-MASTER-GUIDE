<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="295" viewBox="0 0 1200 295" role="img" aria-labelledby="title desc"><title id="title">Contain every affected resource</title><desc id="desc">Three independent response paths address message delivery, account access and endpoint compromise.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#286585"/></marker></defs><rect width="1200" height="295" fill="#f6f9fc"/><g font-family="Arial, sans-serif" fill="#16354b"><text x="40" y="48" font-size="30" font-weight="700">Contain every affected resource</text><rect x="40" y="85" width="350" height="120" rx="12" fill="#e4f0f5" stroke="#8faebb"/><text x="56" y="114" font-size="21" font-weight="700">Message delivery</text><text x="56" y="143" font-size="18">Preserve, find and review matches</text><text x="56" y="166" font-size="18">Quarantine or remove as scoped</text><rect x="425" y="85" width="350" height="120" rx="12" fill="#e4f0f5" stroke="#8faebb"/><text x="441" y="114" font-size="21" font-weight="700">Account access</text><text x="441" y="143" font-size="18">Contain and revoke sessions</text><text x="441" y="166" font-size="18">Review credentials and persistence</text><rect x="810" y="85" width="350" height="120" rx="12" fill="#e4f0f5" stroke="#8faebb"/><text x="826" y="114" font-size="21" font-weight="700">Endpoint state</text><text x="826" y="143" font-size="18">Investigate execution evidence</text><text x="826" y="166" font-size="18">Isolate and recover as required</text><text x="40" y="275" font-size="17">Conceptual response paths. Completion of one does not establish completion of the other two.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 500" role="img" aria-labelledby="title desc"><title id="title">Hardware threat modeling depends on attacker capability</title><desc id="desc">A conceptual flow starts with a defined attacker capability and authorized access, maps only reachable device interfaces and assets, evaluates applicable controls and residual risk, then documents assumptions and evidence. Physical access does not automatically imply debug access or key extraction.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#365672"/></marker></defs><rect width="1160" height="500" rx="24" fill="#f5f8fc"/><text x="580" y="51" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#142b45">Hardware Threat Model: Capabilities, Reachability, Residual Risk</text><g font-family="Arial,sans-serif"><rect x="38" y="114" width="250" height="210" rx="16" fill="#e7eff9" stroke="#365672" stroke-width="3"/><text x="163" y="155" text-anchor="middle" font-size="21" font-weight="700" fill="#142b45">1 · Define capability</text><text x="62" y="195" font-size="16" fill="#20364e"><tspan x="62" dy="0">Remote / local / physical</tspan><tspan x="62" dy="27">Time and expertise</tspan><tspan x="62" dy="27">Equipment and access</tspan><tspan x="62" dy="27">Authorized scope</tspan></text><rect x="326" y="114" width="250" height="210" rx="16" fill="#fff3d6" stroke="#9b7015" stroke-width="3"/><text x="451" y="155" text-anchor="middle" font-size="21" font-weight="700" fill="#3f310c">2 · Map exposure</text><text x="350" y="195" font-size="16" fill="#3f310c"><tspan x="350" dy="0">Reachable interfaces</tspan><tspan x="350" dy="27">Assets and data paths</tspan><tspan x="350" dy="27">Lifecycle / debug state</tspan><tspan x="350" dy="27">Evidence gaps</tspan></text><rect x="614" y="114" width="250" height="210" rx="16" fill="#e5f4f1" stroke="#287769" stroke-width="3"/><text x="739" y="155" text-anchor="middle" font-size="21" font-weight="700" fill="#143b36">3 · Assess controls</text><text x="638" y="195" font-size="16" fill="#143b36"><tspan x="638" dy="0">Prevent and limit</tspan><tspan x="638" dy="27">Detect and respond</tspan><tspan x="638" dy="27">Protect and recover</tspan><tspan x="638" dy="27">Test stated assumptions</tspan></text><rect x="902" y="114" width="220" height="210" rx="16" fill="#eee9f8" stroke="#67508d" stroke-width="3"/><text x="1012" y="155" text-anchor="middle" font-size="21" font-weight="700" fill="#30234a">4 · Record risk</text><text x="924" y="195" font-size="16" fill="#30234a"><tspan x="924" dy="0">Likelihood / impact</tspan><tspan x="924" dy="27">Residual risk</tspan><tspan x="924" dy="27">Owner and treatment</tspan><tspan x="924" dy="27">Evidence and limits</tspan></text><path d="M294 218 H316" stroke="#365672" stroke-width="4" marker-end="url(#arr)"/><path d="M582 218 H604" stroke="#365672" stroke-width="4" marker-end="url(#arr)"/><path d="M870 218 H892" stroke="#365672" stroke-width="4" marker-end="url(#arr)"/><rect x="92" y="368" width="976" height="76" rx="15" fill="#fff" stroke="#a4b2c2" stroke-width="2"/><text x="580" y="400" text-anchor="middle" font-size="19" font-weight="700" fill="#142b45">Physical possession changes the scenario; it does not guarantee debug access or secret extraction.</text><text x="580" y="425" text-anchor="middle" font-size="16" fill="#354b63">Every attack path depends on device design, configuration, lifecycle state, attacker capability, and tested evidence.</text></g></svg>
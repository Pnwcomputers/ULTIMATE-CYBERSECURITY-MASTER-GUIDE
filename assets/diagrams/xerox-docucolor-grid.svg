width="345" height="433" rx="18" fill="#15334b"/><text x="845" y="165" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#fff" style="fill:#fff">FOLLOW COLUMN 2</text><text x="845" y="213" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#fff" style="fill:#fff">Present data dots:</text><text x="845" y="252" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#fff" style="fill:#fff">32 + 16 + 2 = 50</text><text x="845" y="296" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#fff" style="fill:#fff">Minute = 50</text><text x="845" y="352" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#fff" style="fill:#fff">3 data dots → odd</text><text x="845" y="390" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#fff" style="fill:#fff">Top parity dot absent</text><text x="845" y="445" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#fff" style="fill:#fff">Presence = 1</text><text x="845" y="483" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#fff" style="fill:#fff">Absence = 0</text><text x="845" y="526" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#fff" style="fill:#fff">Exclude parity from the sum.</text><text x="40" y="594" class="label" >COLUMN KEY</text><text x="40" y="630" class="small" >1  Row parity</text><text x="40" y="659" class="small" >2  Minute</text><text x="40" y="688" class="small" >3–4  Unused</text><text x="330" y="630" class="small" >5  Hour</text><text x="330" y="659" class="small" >6  Day</text><text x="330" y="688" class="small" >7  Month</text><text x="620" y="630" class="small" >8  Year (no century)</text><text x="620" y="659" class="small" >9  Unused</text><text x="620" y="688" class="small" >10  Separator</text><text x="910" y="630" class="small" >11–14  Serial pairs</text><text x="910" y="659" class="small" >Read 14 → 11 (BCD)</text><text x="910" y="688" class="small" >15  Unknown</text><text x="40" y="757" class="small" >Odd parity checks transcription consistency; it does not authenticate a page or identify its operator.</text></svg>
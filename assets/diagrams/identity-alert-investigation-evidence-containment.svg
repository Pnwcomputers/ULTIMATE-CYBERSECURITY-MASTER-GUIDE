<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc"><title id="title">Account Access Alerts: Risk Is Not Compromise</title><desc id="desc">Failed logons, successful authentication, geolocation and malicious actions require correlation. Failures plus a success in a time window do not establish order or unauthorized access. Risk severity and response targets must follow the organization's incident plan.</desc><defs><marker id="arr" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#68d4ff"/></marker></defs><rect width="1400" height="720" rx="26" fill="#0e1b2b"/><g font-family="Arial, Helvetica, sans-serif"><text x="34" y="58" fill="#f1f7fe" font-size="29" font-weight="700">Account Access Alerts: Risk Is Not Compromise</text><text x="34" y="90" fill="#c2d4e4" font-size="17">Failed logons, successful authentication, geolocation and malicious actions require correlation.</text><path d="M34 117H1366" stroke="#345570" stroke-width="2"/><rect x="34" y="170" width="304" height="318" rx="18" fill="#1a3047" stroke="#72c6ec" stroke-width="2"/><rect x="52" y="192" width="49" height="42" rx="11" fill="#72c6ec" opacity="0.23"/><text x="62" y="220" font-weight="700" font-size="23" fill="#72c6ec">01</text><text x="52" y="275" font-size="22" font-weight="700" fill="#ffffff">Alert and baseline</text><text x="52" y="321" font-size="17" fill="#d8e8f4">• 4625 failure / 4624 success</text><text x="52" y="366" font-size="17" fill="#d8e8f4">• Source and logon type</text><text x="52" y="411" font-size="17" fill="#d8e8f4">• Normalize IDs and UTC</text><path d="M345 327 H370" stroke="#68d4ff" stroke-width="3" marker-end="url(#arr)"/><rect x="377" y="170" width="304" height="318" rx="18" fill="#1a3047" stroke="#baa1f2" stroke-width="2"/><rect x="395" y="192" width="49" height="42" rx="11" fill="#baa1f2" opacity="0.23"/><text x="405" y="220" font-weight="700" font-size="23" fill="#baa1f2">02</text><text x="395" y="275" font-size="22" font-weight="700" fill="#ffffff">Confirm context</text><text x="395" y="321" font-size="17" fill="#d8e8f4">• VPN, proxy, known device</text><text x="395" y="366" font-size="17" fill="#d8e8f4">• Expected travel and usage</text><text x="395" y="411" font-size="17" fill="#d8e8f4">• MFA and Conditional Access</text><path d="M688 327 H713" stroke="#68d4ff" stroke-width="3" marker-end="url(#arr)"/><rect x="720" y="170" width="304" height="318" rx="18" fill="#1a3047" stroke="#9fd8b6" stroke-width="2"/><rect x="738" y="192" width="49" height="42" rx="11" fill="#9fd8b6" opacity="0.23"/><text x="748" y="220" font-weight="700" font-size="23" fill="#9fd8b6">03</text><text x="738" y="275" font-size="22" font-weight="700" fill="#ffffff">Seek compromise evidence</text><text x="738" y="321" font-size="17" fill="#d8e8f4">• Unusual session or OAuth grant</text><text x="738" y="366" font-size="17" fill="#d8e8f4">• Mailbox/file access changes</text><text x="738" y="411" font-size="17" fill="#d8e8f4">• Endpoint and token activity</text><path d="M1031 327 H1056" stroke="#68d4ff" stroke-width="3" marker-end="url(#arr)"/><rect x="1063" y="170" width="304" height="318" rx="18" fill="#1a3047" stroke="#f0c17b" stroke-width="2"/><rect x="1081" y="192" width="49" height="42" rx="11" fill="#f0c17b" opacity="0.23"/><text x="1091" y="220" font-weight="700" font-size="23" fill="#f0c17b">04</text><text x="1081" y="275" font-size="22" font-weight="700" fill="#ffffff">Risk-based action</text><text x="1081" y="321" font-size="17" fill="#d8e8f4">• Preserve logs + decisions</text><text x="1081" y="366" font-size="17" fill="#d8e8f4">• Revoke sessions if warranted</text><text x="1081" y="411" font-size="17" fill="#d8e8f4">• Rotate secrets and retest</text><rect x="34" y="533" width="1332" height="134" rx="16" fill="#182c40" stroke="#335a76"/><text x="54" y="570" fill="#f0c780" font-weight="700" font-size="18">EVIDENCE AND ASSUMPTION BOUNDARIES</text><text x="54" y="604" fill="#e4edf5" font-size="18">Failures plus a success in a time window do not establish order or unauthorized access.</text><text x="54" y="633" fill="#e4edf5" font-size="18">Risk severity and response targets must follow the organization's incident plan.</text></g></svg>

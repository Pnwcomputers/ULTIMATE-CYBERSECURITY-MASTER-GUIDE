<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Key rotation is not the same as rewriting data</title><desc id="desc">Envelope encryption uses a data encryption key, DEK, for the payload and a key encryption key, KEK, to wrap the DEK. A new KEK version changes future wrapping; rewrapping changes the protected DEK; new data keys and re-encryption change payload ciphertext. Compromise response depends on which material leaked.</desc><style>text{font-family:Arial,sans-serif;fill:#16354b}.heading{font-size:32px;font-weight:700}.label{font-size:24px;font-weight:700}.body{font-size:22px}.note{font-size:20px}</style><rect width="1200" height="620" fill="#f4f7fa"/><text x="36" y="50" class="heading"><tspan x="36" dy="0">Key rotation is not the same as rewriting data</tspan></text><text x="36" y="88" class="note"><tspan x="36" dy="0">Conceptual envelope encryption • operations and key protections depend on the service</tspan></text><rect x="36" y="130" width="352" height="225" rx="14" fill="#fff" stroke="#b5cbd7" stroke-width="2"/><text x="58" y="168" class="label"><tspan x="58" dy="0">Payload encryption</tspan></text><text x="58" y="212" class="body"><tspan x="58" dy="0">Plaintext + data key (DEK)</tspan><tspan x="58" dy="30">produce payload ciphertext.</tspan><tspan x="58" dy="30">Store required nonce, tag,</tspan><tspan x="58" dy="30">algorithm, and version metadata.</tspan></text><rect x="424" y="130" width="352" height="225" rx="14" fill="#fff" stroke="#b5cbd7" stroke-width="2"/><text x="446" y="168" class="label"><tspan x="446" dy="0">Data-key protection</tspan></text><text x="446" y="212" class="body"><tspan x="446" dy="0">Key-encryption key (KEK)</tspan><tspan x="446" dy="30">wraps the DEK.</tspan><tspan x="446" dy="30">Store the wrapped DEK and</tspan><tspan x="446" dy="30">its wrapping-key identifier.</tspan></text><rect x="812" y="130" width="352" height="225" rx="14" fill="#fff" stroke="#b5cbd7" stroke-width="2"/><text x="834" y="168" class="label"><tspan x="834" dy="0">Authorized reading</tspan></text><text x="834" y="212" class="body"><tspan x="834" dy="0">Unwrap the DEK.</tspan><tspan x="834" dy="30">Authenticate + decrypt payload.</tspan><tspan x="834" dy="30">Decrypt permission can expose</tspan><tspan x="834" dy="30">plaintext to the authorized app.</tspan></text><text x="36" y="404" class="label"><tspan x="36" dy="0">Three different changes</tspan></text><rect x="36" y="425" width="352" height="125" rx="14" fill="#fff" stroke="#b5cbd7" stroke-width="2"/><text x="58" y="463" class="label"><tspan x="58" dy="0">Rotate KEK</tspan></text><text x="58" y="507" class="body"><tspan x="58" dy="0">Select a new key version.</tspan><tspan x="58" dy="30">Old data still needs old keys.</tspan></text><rect x="424" y="425" width="352" height="125" rx="14" fill="#fff" stroke="#b5cbd7" stroke-width="2"/><text x="446" y="463" class="label"><tspan x="446" dy="0">Rewrap DEK</tspan></text><text x="446" y="507" class="body"><tspan x="446" dy="0">Change the DEK's protection.</tspan><tspan x="446" dy="30">Payload may stay unchanged.</tspan></text><rect x="812" y="425" width="352" height="125" rx="14" fill="#fff" stroke="#b5cbd7" stroke-width="2"/><text x="834" y="463" class="label"><tspan x="834" dy="0">Replace DEK + re-encrypt</tspan></text><text x="834" y="507" class="body"><tspan x="834" dy="0">New data key and ciphertext.</tspan><tspan x="834" dy="30">Re-encrypt when required.</tspan></text><text x="36" y="585" class="note"><tspan x="36" dy="0">Rewrapping cannot undo theft of a DEK or copies of plaintext already obtained by an attacker.</tspan></text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="775" viewBox="0 0 1440 775" role="img" aria-labelledby="title desc"><title id="title">Tsurugi OSINT: Verified Image To Protected Evidence</title><desc id="desc">Verifying a distribution download, isolating an analysis workstation and preserving acquired case material are separate security decisions. A hash is not an authorization or authenticity proof by itself.</desc><defs><marker id="n" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#89d8f6"/></marker></defs><rect width="1440" height="775" rx="18" fill="#0a192b"/><g font-family="Arial,Helvetica,sans-serif"><text x="36" y="55" fill="#f7faff" font-size="30" font-weight="700">Tsurugi OSINT: Verified Image To Protected Evidence</text><text x="36" y="88" fill="#bed3e5" font-size="18">Do not use the investigative live/installed OS as a reason to bypass case consent or custody.</text><path d="M36 115H1404" stroke="#36516b" stroke-width="2"/><rect x="38" y="166" width="300" height="233" rx="14" fill="#183047" stroke="#89d8f6" stroke-width="2.5"/><text x="56" y="207" fill="#f8fcff" font-size="21" font-weight="700">1. Official image</text><text x="56" y="251" font-size="17" fill="#d7e8f2">Official downloads / mirror</text><text x="56" y="286" font-size="17" fill="#d7e8f2">Check exact release artifact</text><path d="M340 280H383" fill="none" stroke="#89d8f6" stroke-width="3" marker-end="url(#n)"/><rect x="393" y="166" width="300" height="233" rx="14" fill="#183047" stroke="#b9acff" stroke-width="2.5"/><text x="411" y="207" fill="#f8fcff" font-size="21" font-weight="700">2. Authenticate file</text><text x="411" y="251" font-size="17" fill="#d7e8f2">Verify signing key fingerprint</text><text x="411" y="286" font-size="17" fill="#d7e8f2">Check signed digest + file</text><path d="M695 280H738" fill="none" stroke="#89d8f6" stroke-width="3" marker-end="url(#n)"/><rect x="748" y="166" width="300" height="233" rx="14" fill="#183047" stroke="#70dcb4" stroke-width="2.5"/><text x="766" y="207" fill="#f8fcff" font-size="21" font-weight="700">3. Isolate workstation</text><text x="766" y="251" font-size="17" fill="#d7e8f2">VM/host network and updates</text><text x="766" y="286" font-size="17" fill="#d7e8f2">Separate cases and accounts</text><path d="M1050 280H1093" fill="none" stroke="#89d8f6" stroke-width="3" marker-end="url(#n)"/><rect x="1103" y="166" width="300" height="233" rx="14" fill="#183047" stroke="#edc887" stroke-width="2.5"/><text x="1121" y="207" fill="#f8fcff" font-size="21" font-weight="700">4. Preserve evidence</text><text x="1121" y="251" font-size="17" fill="#d7e8f2">Originals → working copies</text><text x="1121" y="286" font-size="17" fill="#d7e8f2">Log hashes, review claims</text><rect x="265" y="466" width="910" height="139" rx="14" fill="#183047" stroke="#f4a8a3" stroke-width="2.5"/><text x="283" y="507" fill="#f8fcff" font-size="21" font-weight="700">No automatic source attribution or anonymization</text><text x="283" y="551" font-size="17" fill="#d7e8f2">OSINT profile is a tool/menu profile, not a privacy tunnel.</text><text x="283" y="586" font-size="17" fill="#d7e8f2">Validate claim provenance and export only approved case data.</text><rect x="38" y="638" width="1364" height="85" rx="12" fill="#3b3224" stroke="#edcd82" stroke-width="2"/><text x="60" y="672" font-size="21" font-weight="700" fill="#ffebbf">Stop if the image signature, file digest, scope or storage path is unknown</text><text x="60" y="702" font-size="17" fill="#f4e3cb">Do not handle evidence drives during OS installation; keep case originals outside source control.</text></g></svg>
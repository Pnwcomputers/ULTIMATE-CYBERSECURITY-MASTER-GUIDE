<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 560" role="img" aria-labelledby="title desc"><title id="title">Security assessment checklist lifecycle</title><desc id="desc">Turn engagement authorization into documented evidence and actionable review Scope: Written approval: Targets and dates: Safety constraints. Select: Relevant controls: Checklist version: Test accounts. Execute: Record attempts: Capture evidence: Track exceptions. Review: Confirm findings: Prioritize impact: Check coverage. Close: Remediation plan: Archive safely: Set retest date. A completed checklist does not independently prove the target is secure.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#d7e6f4"/></marker></defs><rect width="1240" height="560" rx="20" fill="#0b1223"/><g font-family="Arial,Helvetica,sans-serif"><text x="35" y="56" font-size="31" font-weight="700" fill="#ffffff">Security assessment checklist lifecycle</text><text x="35" y="89" font-size="17" fill="#b8cbe0">Turn engagement authorization into documented evidence and actionable review</text><rect x="35" y="157" width="221.2" height="254" rx="14" fill="#172a40" stroke="#34d399" stroke-width="2"/><circle cx="63" cy="190" r="18" fill="#34d399"/><text x="63" y="196" font-size="17" fill="#071321" font-weight="700" text-anchor="middle">1</text><text x="50" y="242" font-size="19" font-weight="700" fill="white">Scope</text><text x="50" y="282" font-size="17" fill="#d7e6f4">Written approval</text><text x="50" y="313" font-size="17" fill="#d7e6f4">Targets and dates</text><text x="50" y="344" font-size="17" fill="#d7e6f4">Safety constraints</text><path d="M257.2 292h12" stroke="#d7e6f4" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="272.2" y="157" width="221.2" height="254" rx="14" fill="#172a40" stroke="#34d399" stroke-width="2"/><circle cx="300.2" cy="190" r="18" fill="#34d399"/><text x="300.2" y="196" font-size="17" fill="#071321" font-weight="700" text-anchor="middle">2</text><text x="287.2" y="242" font-size="19" font-weight="700" fill="white">Select</text><text x="287.2" y="282" font-size="17" fill="#d7e6f4">Relevant controls</text><text x="287.2" y="313" font-size="17" fill="#d7e6f4">Checklist version</text><text x="287.2" y="344" font-size="17" fill="#d7e6f4">Test accounts</text><path d="M494.4 292h12" stroke="#d7e6f4" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="509.4" y="157" width="221.2" height="254" rx="14" fill="#172a40" stroke="#34d399" stroke-width="2"/><circle cx="537.4" cy="190" r="18" fill="#34d399"/><text x="537.4" y="196" font-size="17" fill="#071321" font-weight="700" text-anchor="middle">3</text><text x="524.4" y="242" font-size="19" font-weight="700" fill="white">Execute</text><text x="524.4" y="282" font-size="17" fill="#d7e6f4">Record attempts</text><text x="524.4" y="313" font-size="17" fill="#d7e6f4">Capture evidence</text><text x="524.4" y="344" font-size="17" fill="#d7e6f4">Track exceptions</text><path d="M731.5999999999999 292h12" stroke="#d7e6f4" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="746.5999999999999" y="157" width="221.2" height="254" rx="14" fill="#172a40" stroke="#34d399" stroke-width="2"/><circle cx="774.5999999999999" cy="190" r="18" fill="#34d399"/><text x="774.5999999999999" y="196" font-size="17" fill="#071321" font-weight="700" text-anchor="middle">4</text><text x="761.5999999999999" y="242" font-size="19" font-weight="700" fill="white">Review</text><text x="761.5999999999999" y="282" font-size="17" fill="#d7e6f4">Confirm findings</text><text x="761.5999999999999" y="313" font-size="17" fill="#d7e6f4">Prioritize impact</text><text x="761.5999999999999" y="344" font-size="17" fill="#d7e6f4">Check coverage</text><path d="M968.8 292h12" stroke="#d7e6f4" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="983.8" y="157" width="221.2" height="254" rx="14" fill="#172a40" stroke="#34d399" stroke-width="2"/><circle cx="1011.8" cy="190" r="18" fill="#34d399"/><text x="1011.8" y="196" font-size="17" fill="#071321" font-weight="700" text-anchor="middle">5</text><text x="998.8" y="242" font-size="19" font-weight="700" fill="white">Close</text><text x="998.8" y="282" font-size="17" fill="#d7e6f4">Remediation plan</text><text x="998.8" y="313" font-size="17" fill="#d7e6f4">Archive safely</text><text x="998.8" y="344" font-size="17" fill="#d7e6f4">Set retest date</text><rect x="35" y="450" width="1170" height="77" rx="12" fill="#20374b" stroke="#34d399"/><text x="55" y="480" font-size="19" fill="#34d399" font-weight="700">Validation</text><text x="55" y="506" font-size="16" fill="#e1edf6">A completed checklist does not independently prove the target is secure.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 640" role="img" aria-labelledby="title desc"><title id="title">Cyberdeck: Evidence &amp; Redacted Outputs</title><desc id="desc">Local-first evidence model from separately authorized acquisition to immutable originals, hash manifests, derivative disclosure, integrity readback and approved retention.</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#6AD5FF"/></marker></defs><rect width="1440" height="640" rx="18" fill="#0D182A"/><g font-family="Arial,Helvetica,sans-serif"><text x="36" y="57" font-size="31" font-weight="700" fill="#F5F8FF">Cyberdeck: Evidence &amp; Redacted Outputs</text><text x="36" y="91" font-size="18" fill="#C0D4E5">An offline hash proves byte equality, not source authenticity or lawful custody.</text><path d="M36 115H1404" stroke="#384E65" stroke-width="2"/><rect x="35" y="162" width="308" height="271" rx="14" fill="#172B44" stroke="#6AD5FF" stroke-width="2"/><text x="52" y="206" font-size="21" font-weight="700" fill="#FFF">1  Approved capture</text><text x="52" y="265" font-size="18" fill="#D3E5F0">Signed scope reference</text><text x="52" y="303" font-size="18" fill="#D3E5F0">Actual vantage &amp; tool</text><text x="52" y="341" font-size="18" fill="#D3E5F0">UTC with clock caveat</text><path d="M346 295H377" stroke="#6AD5FF" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="389" y="162" width="308" height="271" rx="14" fill="#172B44" stroke="#AFA6FF" stroke-width="2"/><text x="406" y="206" font-size="21" font-weight="700" fill="#FFF">2  Restrict originals</text><text x="406" y="265" font-size="18" fill="#D3E5F0">Private case directory</text><text x="406" y="303" font-size="18" fill="#D3E5F0">Encryption &amp; access logs</text><text x="406" y="341" font-size="18" fill="#D3E5F0">Keep raw bytes intact</text><path d="M700 295H731" stroke="#6AD5FF" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="743" y="162" width="308" height="271" rx="14" fill="#172B44" stroke="#6DDBB2" stroke-width="2"/><text x="760" y="206" font-size="21" font-weight="700" fill="#FFF">3  Manifest &amp; review</text><text x="760" y="265" font-size="18" fill="#D3E5F0">SHA-256 &amp; byte count</text><text x="760" y="303" font-size="18" fill="#D3E5F0">Record source/version</text><text x="760" y="341" font-size="18" fill="#D3E5F0">Compare after transfer</text><path d="M1054 295H1085" stroke="#6AD5FF" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="1097" y="162" width="308" height="271" rx="14" fill="#172B44" stroke="#F1CF88" stroke-width="2"/><text x="1114" y="206" font-size="21" font-weight="700" fill="#FFF">4  Share a derivative</text><text x="1114" y="265" font-size="18" fill="#D3E5F0">Redact identifiers</text><text x="1114" y="303" font-size="18" fill="#D3E5F0">Hash exported copy</text><text x="1114" y="341" font-size="18" fill="#D3E5F0">Retention &amp; sign-off</text><rect x="35" y="486" width="1370" height="93" rx="12" fill="#373225" stroke="#F1CF88" stroke-width="2"/><text x="55" y="519" font-size="21" font-weight="700" fill="#FFEDBF">Operational checkpoint</text><text x="55" y="553" font-size="17" fill="#F1DFBD">Never place customer PCAPs, signed approvals, credentials or raw location evidence in the public repo.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc"><title id="title">Compression, Hashes, AEAD &amp; Signatures</title><desc id="desc">Similar-looking transformations answer different security questions.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#80cfff"/></marker><marker id="gold" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#f9bd59"/></marker></defs><rect width="1200" height="690" rx="20" fill="#0c1425"/><g font-family="Arial,Helvetica,sans-serif"><text x="42" y="56" font-size="31" font-weight="700" fill="#f8fafc">Compression, Hashes, AEAD &amp; Signatures</text><text x="42" y="89" font-size="17" fill="#b9cee0">Similar-looking transformations answer different security questions.</text><rect x="38" y="142" width="274" height="374" rx="15" fill="#142b40" stroke="#4c88a5" stroke-width="1.8"/><text x="54" y="180" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#f8fafc" text-anchor="start">Compression</text><path d="M54 203 h242" stroke="#41627a"/><text x="54" y="243" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#cae4f6" text-anchor="start">Data → smaller encoding</text><text x="54" y="291" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#8bd6ff" text-anchor="start">LZ77 / Huffman / DEFLATE</text><rect x="55" y="323" width="240" height="58" rx="9" fill="#0d1d2b"/><text x="65" y="345" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#9dc9dd" text-anchor="start">PROVIDES</text><text x="65" y="367" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#e4f3f9" text-anchor="start">Reversible (lossless)</text><rect x="55" y="395" width="240" height="78" rx="9" fill="#312a35"/><text x="65" y="417" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#f0b3b2" text-anchor="start">DOES NOT GUARANTEE</text><text x="65" y="442" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#fff2e3" text-anchor="start">Not secret or authenticated</text><rect x="328" y="142" width="274" height="374" rx="15" fill="#142b40" stroke="#4c88a5" stroke-width="1.8"/><text x="344" y="180" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#f8fafc" text-anchor="start">Hashing</text><path d="M344 203 h242" stroke="#41627a"/><text x="344" y="243" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#cae4f6" text-anchor="start">Bytes → fixed-size digest</text><text x="344" y="291" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#8bd6ff" text-anchor="start">SHA-256 / SHA-3</text><rect x="345" y="323" width="240" height="58" rx="9" fill="#0d1d2b"/><text x="355" y="345" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#9dc9dd" text-anchor="start">PROVIDES</text><text x="355" y="367" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#e4f3f9" text-anchor="start">Check against trusted digest</text><rect x="345" y="395" width="240" height="78" rx="9" fill="#312a35"/><text x="355" y="417" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#f0b3b2" text-anchor="start">DOES NOT GUARANTEE</text><text x="355" y="442" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#fff2e3" text-anchor="start">No encryption or origin proof</text><rect x="618" y="142" width="274" height="374" rx="15" fill="#142b40" stroke="#f9bd59" stroke-width="1.8"/><text x="634" y="180" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#f8fafc" text-anchor="start">AEAD Encryption</text><path d="M634 203 h242" stroke="#41627a"/><text x="634" y="243" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#cae4f6" text-anchor="start">Plaintext + key → ciphertext</text><text x="634" y="291" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#8bd6ff" text-anchor="start">AES-GCM / ChaCha20-Poly1305</text><rect x="635" y="323" width="240" height="58" rx="9" fill="#0d1d2b"/><text x="645" y="345" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#9dc9dd" text-anchor="start">PROVIDES</text><text x="645" y="367" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#e4f3f9" text-anchor="start">Confidentiality + integrity</text><rect x="635" y="395" width="240" height="78" rx="9" fill="#312a35"/><text x="645" y="417" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#f0b3b2" text-anchor="start">DOES NOT GUARANTEE</text><text x="645" y="442" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#fff2e3" text-anchor="start">Key &amp; nonce rules required</text><rect x="908" y="142" width="274" height="374" rx="15" fill="#142b40" stroke="#4c88a5" stroke-width="1.8"/><text x="924" y="180" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#f8fafc" text-anchor="start">Signatures</text><path d="M924 203 h242" stroke="#41627a"/><text x="924" y="243" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#cae4f6" text-anchor="start">Message + private key → sig</text><text x="924" y="291" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#8bd6ff" text-anchor="start">Ed25519 / ECDSA / RSA-PSS</text><rect x="925" y="323" width="240" height="58" rx="9" fill="#0d1d2b"/><text x="935" y="345" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#9dc9dd" text-anchor="start">PROVIDES</text><text x="935" y="367" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#e4f3f9" text-anchor="start">Public verification</text><rect x="925" y="395" width="240" height="78" rx="9" fill="#312a35"/><text x="935" y="417" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#f0b3b2" text-anchor="start">DOES NOT GUARANTEE</text><text x="935" y="442" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#fff2e3" text-anchor="start">Needs trusted public key</text><rect x="42" y="544" width="1116" height="63" rx="15" fill="#123146" stroke="#639ab7" stroke-width="1.8"/><text x="60" y="572" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" fill="#f4f8fa" text-anchor="start">TLS 1.3 combines authentication, key agreement, HKDF &amp; AEAD — not a single “AES + SHA” step.</text><text x="60" y="592" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#a4cde2" text-anchor="start">Compression beside secrets can leak lengths; a bare hash requires independently trusted reference.</text><rect x="40" y="612" width="1120" height="51" rx="15" fill="#172e43" stroke="#476982" stroke-width="1.8"/><text x="60" y="643" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#d5e9f7" text-anchor="start">Cryptography is a protocol &amp; trust problem, not a single algorithm name.</text></g></svg>
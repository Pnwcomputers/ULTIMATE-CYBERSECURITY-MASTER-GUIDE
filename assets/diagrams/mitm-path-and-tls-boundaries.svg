<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">MITM path and TLS trust boundaries</title>
<desc id="desc">A client communicates with a destination through a network intermediary. With correct TLS validation, application payloads remain encrypted while the intermediary can observe some connection metadata or disrupt availability. If endpoint trust or validation is compromised, traffic may be exposed. Independent endpoint, network, and infrastructure evidence should be correlated.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#315a7d"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#142b42}.title{font-size:32px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:18px}.small{font-size:16px}</style></defs>
<rect width="1200" height="760" rx="24" fill="#f4f7fb"/>
<text x="600" y="54" text-anchor="middle" class="title">On-path does not automatically mean readable</text><text x="600" y="86" text-anchor="middle" class="body">TLS protection depends on endpoint validation and trust</text>
<rect x="55" y="130" width="230" height="130" rx="18" fill="#dcecf7" stroke="#315a7d" stroke-width="3"/><text x="170" y="178" text-anchor="middle" class="head">Client</text><text x="170" y="212" text-anchor="middle" class="body">validates server name</text><text x="170" y="238" text-anchor="middle" class="body">and certificate chain</text>
<rect x="485" y="130" width="230" height="130" rx="18" fill="#fff0cf" stroke="#ad7416" stroke-width="3"/><text x="600" y="178" text-anchor="middle" class="head">On-path device</text><text x="600" y="212" text-anchor="middle" class="body">router, proxy, or</text><text x="600" y="238" text-anchor="middle" class="body">unauthorized relay</text>
<rect x="915" y="130" width="230" height="130" rx="18" fill="#dcecf7" stroke="#315a7d" stroke-width="3"/><text x="1030" y="178" text-anchor="middle" class="head">Destination</text><text x="1030" y="212" text-anchor="middle" class="body">presents a server</text><text x="1030" y="238" text-anchor="middle" class="body">identity over TLS</text>
<line x1="285" y1="190" x2="475" y2="190" stroke="#315a7d" stroke-width="5" marker-end="url(#arrow)"/><line x1="715" y1="190" x2="905" y2="190" stroke="#315a7d" stroke-width="5" marker-end="url(#arrow)"/><text x="380" y="160" text-anchor="middle" class="small">encrypted session</text><text x="810" y="160" text-anchor="middle" class="small">encrypted session</text>
<rect x="70" y="300" width="510" height="175" rx="18" fill="#e4f4ea" stroke="#398454" stroke-width="3"/><text x="95" y="338" class="head">TLS validation succeeds</text><text x="98" y="374" class="body">• Payload stays unreadable to the intermediary</text><text x="98" y="408" class="body">• Some IP, timing, size, and routing metadata remains</text><text x="98" y="442" class="body">• Blocking or disruption can still occur</text>
<rect x="620" y="300" width="510" height="175" rx="18" fill="#fde7e5" stroke="#b34d48" stroke-width="3"/><text x="645" y="338" class="head">Trust or endpoint is compromised</text><text x="648" y="374" class="body">• Untrusted certificate accepted or wrong name allowed</text><text x="648" y="408" class="body">• Attacker-controlled root or endpoint compromise</text><text x="648" y="442" class="body">• Explicitly trusted inspection proxy decrypts/re-encrypts</text>
<rect x="70" y="515" width="1060" height="190" rx="18" fill="#e9edf4" stroke="#718096" stroke-width="2"/><text x="600" y="552" text-anchor="middle" class="head">Correlate independent evidence; one signal is not proof of MITM</text>
<rect x="100" y="580" width="300" height="84" rx="12" fill="#fff" stroke="#8b99aa" stroke-width="2"/><text x="250" y="614" text-anchor="middle" class="body">Endpoint</text><text x="250" y="642" text-anchor="middle" class="small">certificate, proxy, trust store</text>
<rect x="450" y="580" width="300" height="84" rx="12" fill="#fff" stroke="#8b99aa" stroke-width="2"/><text x="600" y="614" text-anchor="middle" class="body">Network</text><text x="600" y="642" text-anchor="middle" class="small">ARP, DNS, routes, packet path</text>
<rect x="800" y="580" width="300" height="84" rx="12" fill="#fff" stroke="#8b99aa" stroke-width="2"/><text x="950" y="614" text-anchor="middle" class="body">Infrastructure</text><text x="950" y="642" text-anchor="middle" class="small">AP, switch, DHCP, IdP logs</text>
</svg>
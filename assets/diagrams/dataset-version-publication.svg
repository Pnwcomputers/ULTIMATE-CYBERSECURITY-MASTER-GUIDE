<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 425" role="img" aria-labelledby="title desc">
  <title id="title">Publish a complete dataset version</title>
  <desc id="desc">Keep the current pointer on version one while writing and validating version two. A successful pointer update makes the new manifest visible to new readers. Readers already using version one can finish while the old files are retained. A failed conditional update leaves the writer to re-read the current pointer.</desc>
  <rect width="1000" height="425" rx="20" fill="#f3f7fa"/>
  <g font-family="Arial,sans-serif" fill="#17334a">
    <text x="40" y="49" font-size="27" font-weight="700">Publish a complete dataset version</text>
    <text x="40" y="80" font-size="17">Readers resolve the current pointer once per read.</text>
    <g stroke-width="2">
      <rect x="40" y="111" width="276" height="165" rx="15" fill="#e9f0fa" stroke="#3b6796"/>
      <rect x="362" y="111" width="276" height="165" rx="15" fill="#fff5e5" stroke="#a75c19"/>
      <rect x="684" y="111" width="276" height="165" rx="15" fill="#e6f3ef" stroke="#197064"/>
    </g>
    <g stroke="#3b6796" stroke-width="3" fill="none">
      <path d="M321 193h34m-10-8 10 8-10 8"/>
      <path d="M643 193h34m-10-8 10 8-10 8"/>
    </g>
    <g font-size="19" font-weight="700">
      <text x="60" y="150">Write version 2</text>
      <text x="382" y="150">Validate &amp; commit</text>
      <text x="704" y="150">Read a complete version</text>
    </g>
    <g font-size="16">
      <text x="60" y="184">Write to separate file names.</text>
      <text x="60" y="212">Version 1 remains current.</text>
      <text x="382" y="184">Check files and seal the manifest.</text>
      <text x="382" y="212">Update the version pointer.</text>
      <text x="704" y="184">New reads resolve version 2.</text>
      <text x="704" y="212">Existing reads can finish on v1.</text>
    </g>
    <rect x="40" y="308" width="920" height="73" rx="13" fill="#e7edf4"/>
    <text x="60" y="340" font-size="16">If a conditional update fails, re-read the current pointer before deciding whether to retry.</text>
    <text x="60" y="365" font-size="16">Retain old files for active readers and rollback.</text>
  </g>
</svg>

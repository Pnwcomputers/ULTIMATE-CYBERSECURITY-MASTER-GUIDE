<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="540" viewBox="0 0 1240 540" role="img" aria-labelledby="title desc">
  <title id="title">GreatFET authorized I2C inspection workflow</title>
  <desc id="desc">Confirm authorization, target voltage, pull-ups and pinout. Scan the bus and record responding addresses without treating them as device identities. Consult the datasheet before documented reads, then validate output and preserve context. Scanning generates bus traffic and can affect devices.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#294862"/></marker><style>
    .title{font:700 27px system-ui,sans-serif;fill:#102a43}.label{font:700 18px system-ui,sans-serif;fill:#102a43}.body{font:15px system-ui,sans-serif;fill:#243b53}.small{font:14px system-ui,sans-serif;fill:#334e68}.box{rx:15;stroke-width:2}.line{stroke:#294862;stroke-width:3.5;fill:none;marker-end:url(#arrow)}
  </style></defs>
  <rect width="1240" height="540" rx="24" fill="#f5f8fb"/>
  <text x="45" y="50" class="title">GreatFET I²C: verify, scan, interpret, then read</text>
  <rect x="40" y="125" width="255" height="145" class="box" fill="#e6f0fa" stroke="#7aa7d3"/>
  <text x="167" y="169" text-anchor="middle" class="label">1. Verify setup</text><text x="167" y="204" text-anchor="middle" class="body">Authorization, pinout,</text><text x="167" y="232" text-anchor="middle" class="small">voltage and pull-ups</text>
  <rect x="335" y="125" width="255" height="145" class="box" fill="#fff3cd" stroke="#d6a638"/>
  <text x="462" y="169" text-anchor="middle" class="label">2. Scan bus</text><text x="462" y="204" text-anchor="middle" class="body">Record addresses that</text><text x="462" y="232" text-anchor="middle" class="small">acknowledge the probes</text>
  <rect x="630" y="125" width="255" height="145" class="box" fill="#e9e5f7" stroke="#9286c2"/>
  <text x="757" y="169" text-anchor="middle" class="label">3. Identify device</text><text x="757" y="204" text-anchor="middle" class="body">Consult schematic and</text><text x="757" y="232" text-anchor="middle" class="small">datasheet; ACK ≠ identity</text>
  <rect x="925" y="125" width="275" height="145" class="box" fill="#e7f5ec" stroke="#62a878"/>
  <text x="1062" y="169" text-anchor="middle" class="label">4. Read documented data</text><text x="1062" y="204" text-anchor="middle" class="body">Check protocol/side effects;</text><text x="1062" y="232" text-anchor="middle" class="small">capture output as text or bytes</text>
  <path d="M295 197 H328" class="line"/><path d="M590 197 H623" class="line"/><path d="M885 197 H918" class="line"/>
  <rect x="230" y="340" width="780" height="98" rx="15" fill="#fde8e7" stroke="#d66b63" stroke-width="2"/>
  <text x="620" y="380" text-anchor="middle" class="label">Important limits</text>
  <text x="620" y="412" text-anchor="middle" class="body">A scan is active bus traffic; it lists responders, not hidden device names or safe commands.</text>
  <text x="620" y="467" text-anchor="middle" class="small">GreatFET One: I2C0 SDA = J2_P39 · SCL = J2_P40 (confirm revision/orientation)</text>
  <text x="620" y="503" text-anchor="middle" class="small">Record board, host-tool version, address, operation, output format and errors.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 565" role="img" aria-labelledby="title desc"><title id="title">Safe reverse engineering workflow</title><desc id="desc">Preserve an unknown binary, inspect safely and document reproducible findings. Intake: Authorized sample: Verify source: Hash originals; Triage: Metadata and type: Static indicators: Contain unknowns; Analyze: Disassembly: Call graph: Data references; Validate: Controlled lab: Compare hypotheses: Record behavior; Report: Document limits: Create signatures: Store evidence. Use isolated environments for unknown executables; static analysis alone cannot prove full behavior.</desc><defs><marker id="arr" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#d6edfb"/></marker></defs><rect width="1240" height="565" rx="20" fill="#0b1223"/><g font-family="Arial,Helvetica,sans-serif"><text x="35" y="58" font-size="31" font-weight="700" fill="#f8fafc">Safe reverse engineering workflow</text><text x="35" y="92" font-size="17" fill="#b8cbe0">Preserve an unknown binary, inspect safely and document reproducible findings</text><rect x="35" y="158" width="219.6" height="258" rx="15" fill="#172d41" stroke="#a78bfa" stroke-opacity=".7" stroke-width="2"/><circle cx="64" cy="191" r="18" fill="#a78bfa"/><text x="64" y="197" font-size="18" font-weight="700" fill="#051320" text-anchor="middle">1</text><text x="51" y="240" font-size="18" font-weight="700" fill="#f8fafc">Intake</text><text x="51" y="280" font-size="15" fill="#d1e1f0">Authorized sample</text><text x="51" y="312" font-size="15" fill="#d1e1f0">Verify source</text><text x="51" y="344" font-size="15" fill="#d1e1f0">Hash originals</text><path d="M255.6 292h13" stroke="#d6edfb" stroke-width="2.5" marker-end="url(#arr)"/><rect x="272.6" y="158" width="219.6" height="258" rx="15" fill="#172d41" stroke="#a78bfa" stroke-opacity=".7" stroke-width="2"/><circle cx="301.6" cy="191" r="18" fill="#a78bfa"/><text x="301.6" y="197" font-size="18" font-weight="700" fill="#051320" text-anchor="middle">2</text><text x="288.6" y="240" font-size="18" font-weight="700" fill="#f8fafc">Triage</text><text x="288.6" y="280" font-size="15" fill="#d1e1f0">Metadata and type</text><text x="288.6" y="312" font-size="15" fill="#d1e1f0">Static indicators</text><text x="288.6" y="344" font-size="15" fill="#d1e1f0">Contain unknowns</text><path d="M493.20000000000005 292h13" stroke="#d6edfb" stroke-width="2.5" marker-end="url(#arr)"/><rect x="510.2" y="158" width="219.6" height="258" rx="15" fill="#172d41" stroke="#a78bfa" stroke-opacity=".7" stroke-width="2"/><circle cx="539.2" cy="191" r="18" fill="#a78bfa"/><text x="539.2" y="197" font-size="18" font-weight="700" fill="#051320" text-anchor="middle">3</text><text x="526.2" y="240" font-size="18" font-weight="700" fill="#f8fafc">Analyze</text><text x="526.2" y="280" font-size="15" fill="#d1e1f0">Disassembly</text><text x="526.2" y="312" font-size="15" fill="#d1e1f0">Call graph</text><text x="526.2" y="344" font-size="15" fill="#d1e1f0">Data references</text><path d="M730.8 292h13" stroke="#d6edfb" stroke-width="2.5" marker-end="url(#arr)"/><rect x="747.8" y="158" width="219.6" height="258" rx="15" fill="#172d41" stroke="#a78bfa" stroke-opacity=".7" stroke-width="2"/><circle cx="776.8" cy="191" r="18" fill="#a78bfa"/><text x="776.8" y="197" font-size="18" font-weight="700" fill="#051320" text-anchor="middle">4</text><text x="763.8" y="240" font-size="18" font-weight="700" fill="#f8fafc">Validate</text><text x="763.8" y="280" font-size="15" fill="#d1e1f0">Controlled lab</text><text x="763.8" y="312" font-size="15" fill="#d1e1f0">Compare hypotheses</text><text x="763.8" y="344" font-size="15" fill="#d1e1f0">Record behavior</text><path d="M968.4 292h13" stroke="#d6edfb" stroke-width="2.5" marker-end="url(#arr)"/><rect x="985.4" y="158" width="219.6" height="258" rx="15" fill="#172d41" stroke="#a78bfa" stroke-opacity=".7" stroke-width="2"/><circle cx="1014.4" cy="191" r="18" fill="#a78bfa"/><text x="1014.4" y="197" font-size="18" font-weight="700" fill="#051320" text-anchor="middle">5</text><text x="1001.4" y="240" font-size="18" font-weight="700" fill="#f8fafc">Report</text><text x="1001.4" y="280" font-size="15" fill="#d1e1f0">Document limits</text><text x="1001.4" y="312" font-size="15" fill="#d1e1f0">Create signatures</text><text x="1001.4" y="344" font-size="15" fill="#d1e1f0">Store evidence</text><rect x="35" y="452" width="1170" height="83" rx="12" fill="#20374b" stroke="#a78bfa"/><text x="55" y="485" fill="#a78bfa" font-size="20" font-weight="700">Security boundary / validation</text><text x="55" y="510" fill="#e1edf6" font-size="16">Use isolated environments for unknown executables; static analysis alone cannot prove full behavior.</text></g></svg>
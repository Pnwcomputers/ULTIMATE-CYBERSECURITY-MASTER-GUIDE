<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 785" width="1440" height="785" role="img" aria-labelledby="title desc"><title id="title">Elastic Stack: Ingest, Index &amp; Investigate</title><desc id="desc">Beats or Elastic Agent deliver logs through optional Logstash or directly to Elasticsearch. Elasticsearch indexes events; Kibana queries and visualizes them. Ingest pipelines are a separate optional processing stage.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#89dafa"/></marker></defs><rect width="1440" height="785" rx="19" fill="#0d1b2d"/><g font-family="Arial,Helvetica,sans-serif"><text x="38" y="56" font-size="30" font-weight="700" fill="#f9fcff">Elastic Stack: Ingest, Index &amp; Investigate</text><text x="38" y="91" font-size="18" fill="#c1d5e6">Illustrative architecture; production credentials, TLS and version compatibility must be verified.</text><path d="M38 117H1402" stroke="#38536f" stroke-width="2"/><rect x="38" y="159" width="285" height="198" rx="14" fill="#1a3049" stroke="#8bd9fb" stroke-width="2.4"/><text x="57" y="198" font-size="21" font-weight="700" fill="#f8fdff">Endpoints</text><text x="57" y="238" font-size="17" fill="#d8e9f3">Filebeat / Winlogbeat</text><text x="57" y="273" font-size="17" fill="#d8e9f3">Elastic Agent (where used)</text><text x="57" y="308" font-size="17" fill="#d8e9f3">Events and metadata</text><rect x="384" y="159" width="294" height="198" rx="14" fill="#1a3049" stroke="#b3a9f9" stroke-width="2.4"/><text x="403" y="198" font-size="21" font-weight="700" fill="#f8fdff">Optional Logstash</text><text x="403" y="238" font-size="17" fill="#d8e9f3">Input / filter / output</text><text x="403" y="273" font-size="17" fill="#d8e9f3">Parse, enrich and route</text><text x="403" y="308" font-size="17" fill="#d8e9f3">May be bypassed</text><rect x="738" y="159" width="301" height="198" rx="14" fill="#1a3049" stroke="#74dabb" stroke-width="2.4"/><text x="757" y="198" font-size="21" font-weight="700" fill="#f8fdff">Elasticsearch</text><text x="757" y="238" font-size="17" fill="#d8e9f3">Ingest pipelines (optional)</text><text x="757" y="273" font-size="17" fill="#d8e9f3">Index, store, search</text><text x="757" y="308" font-size="17" fill="#d8e9f3">Retention / access policy</text><rect x="1099" y="159" width="300" height="198" rx="14" fill="#1a3049" stroke="#edc982" stroke-width="2.4"/><text x="1118" y="198" font-size="21" font-weight="700" fill="#f8fdff">Kibana</text><text x="1118" y="238" font-size="17" fill="#d8e9f3">Explore and dashboard</text><text x="1118" y="273" font-size="17" fill="#d8e9f3">Detection rules where enabled</text><text x="1118" y="308" font-size="17" fill="#d8e9f3">Access and security setup</text><path d="M324 254H376" fill="none" stroke="#89dafa" stroke-width="3" marker-end="url(#a)"/><path d="M679 254H730" fill="none" stroke="#89dafa" stroke-width="3" marker-end="url(#a)"/><path d="M1040 254H1091" fill="none" stroke="#89dafa" stroke-width="3" marker-end="url(#a)"/><path d="M191 357V416H889V365" stroke="#75dbb8" stroke-dasharray="11 8" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="430" y="402" font-size="17" fill="#9bebce">Direct Beats/Agent route may omit Logstash</text><rect x="235" y="471" width="970" height="126" rx="14" fill="#1a3049" stroke="#edc982" stroke-width="2.4"/><text x="254" y="510" font-size="21" font-weight="700" fill="#f8fdff">Validate every hop</text><text x="254" y="550" font-size="18" fill="#d8e9f3">Source event → collector → parser → indexed document → search result → alert evidence</text><text x="254" y="585" font-size="18" fill="#d8e9f3">A running container or open dashboard does not prove the desired logs are complete.</text><rect x="38" y="647" width="1364" height="88" rx="13" fill="#3d3326" stroke="#edc67f" stroke-width="2"/><text x="60" y="682" font-size="21" font-weight="700" fill="#ffeabd">Lab-only recipe warning</text><text x="60" y="711" font-size="17" fill="#f6e4c8">The guide's legacy Docker 8.12 example is not a current supported production or TLS-hardening recipe.</text><text x="40" y="771" font-size="15" fill="#b8d0e2">Follow installed-version Elastic security, ingest and API documentation; no live deployment was exercised.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="yara-lifecycle-title yara-lifecycle-desc"><title id="yara-lifecycle-title">Build a rule, test its limits and record the revision</title><desc id="yara-lifecycle-desc">Conceptual YARA-X rule lifecycle: define intended patterns and context, compile and inspect compatibility diagnostics, test synthetic positives, negatives, lookalikes and boundaries, then record the engine version, fixture hashes and actual results before revising.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#347e99"/></marker></defs><rect width="1200" height="660" fill="#f4f7fa"/><g font-family="Arial, Helvetica, sans-serif" fill="#16364b"><text x="40" y="54" font-size="32" font-weight="700">Build a rule, test its limits and record the revision</text><text x="40" y="91" font-size="20">Original conceptual workflow • no rules compiled or samples scanned</text><rect x="40" y="155" width="250" height="290" rx="17" fill="#ffffff" stroke="#b3ccdc" stroke-width="2"/><text x="60" y="191" font-size="23">Define the rule</text><text x="60" y="233" font-size="20">Patterns and context</text><text x="60" y="264" font-size="20">Expected matches</text><text x="60" y="295" font-size="20">Expected exclusions</text><text x="60" y="326" font-size="20">Synthetic purpose</text><rect x="330" y="155" width="250" height="290" rx="17" fill="#ffffff" stroke="#b3ccdc" stroke-width="2"/><text x="350" y="191" font-size="23">Compile + inspect</text><text x="350" y="233" font-size="20">Check syntax</text><text x="350" y="264" font-size="20">Review warnings</text><text x="350" y="295" font-size="20">Modules / dependencies</text><text x="350" y="326" font-size="20">Engine compatibility</text><rect x="620" y="155" width="250" height="290" rx="17" fill="#ffffff" stroke="#b3ccdc" stroke-width="2"/><text x="640" y="191" font-size="23">Test boundaries</text><text x="640" y="233" font-size="20">Positive and negative</text><text x="640" y="264" font-size="20">Benign lookalikes</text><text x="640" y="295" font-size="20">Size / offset changes</text><text x="640" y="326" font-size="20">Errors kept distinct</text><rect x="910" y="155" width="250" height="290" rx="17" fill="#fff3d6" stroke="#b3ccdc" stroke-width="2"/><text x="930" y="191" font-size="23">Record + revise</text><text x="930" y="233" font-size="20">Engine and rule version</text><text x="930" y="264" font-size="20">Fixture hashes</text><text x="930" y="295" font-size="20">Observed results</text><text x="930" y="326" font-size="20">Changes and rationale</text><path d="M298 300 L320 300" stroke="#347e99" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M588 300 L610 300" stroke="#347e99" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M878 300 L900 300" stroke="#347e99" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="40" y="520" width="1120" height="86" rx="13" fill="#dfebf1"/><text x="58" y="549" font-size="20">One positive toy fixture does not establish malware-family coverage or a false-positive rate.</text><text x="58" y="580" font-size="20">Keep source rules, compiled artifacts, diagnostics and test records associated with their versions.</text></g></svg>

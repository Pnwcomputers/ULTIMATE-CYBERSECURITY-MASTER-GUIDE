<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 700" role="img" aria-labelledby="title desc">
<title id="title">Safe USB Rubber Ducky marker validation workflow</title>
<desc id="desc">An authorized defensive lab verifies the device generation and firmware, reviews a fixed-text source, compiles with a compatible vendor tool, stages it using that model's instructions, tests on an isolated host with a blank editor and observes telemetry, then records evidence and cleans up. Unknown compatibility or unexpected focus/output leads to stop and re-scope.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#9fb5d0"/></marker></defs>
<rect width="1280" height="700" rx="24" fill="#101827"/>
<text x="640" y="48" text-anchor="middle" fill="#f3f6fb" font-family="system-ui,sans-serif" font-size="28" font-weight="700">Defensive HID marker validation</text>
<text x="640" y="79" text-anchor="middle" fill="#aebed2" font-family="system-ui,sans-serif" font-size="17">Follow the selected USB Rubber Ducky generation; other HID platforms need their own build path</text>
<g font-family="system-ui,sans-serif">
<g transform="translate(38 132)"><rect width="350" height="142" rx="16" fill="#182538" stroke="#3b536f" stroke-width="2"/><circle cx="31" cy="32" r="19" fill="#2563eb"/><text x="31" y="39" fill="white" text-anchor="middle" font-size="18" font-weight="700">1</text><text x="62" y="39" fill="#eaf1fb" font-size="21" font-weight="700">Authorize &amp; identify</text><text x="22" y="78" fill="#cbd5e1" font-size="17">Record approval, model, firmware,</text><text x="22" y="105" fill="#cbd5e1" font-size="17">compiler, keyboard layout and host.</text></g>
<path d="M398 203h45" stroke="#9fb5d0" stroke-width="4" marker-end="url(#a)"/>
<g transform="translate(455 132)"><rect width="350" height="142" rx="16" fill="#182538" stroke="#3b536f" stroke-width="2"/><circle cx="31" cy="32" r="19" fill="#2563eb"/><text x="31" y="39" fill="white" text-anchor="middle" font-size="18" font-weight="700">2</text><text x="62" y="39" fill="#eaf1fb" font-size="21" font-weight="700">Review benign source</text><text x="22" y="78" fill="#cbd5e1" font-size="17">Use a fixed text marker; inspect every</text><text x="22" y="105" fill="#cbd5e1" font-size="17">keystroke and expected focus behavior.</text></g>
<path d="M815 203h45" stroke="#9fb5d0" stroke-width="4" marker-end="url(#a)"/>
<g transform="translate(872 132)"><rect width="370" height="142" rx="16" fill="#182538" stroke="#3b536f" stroke-width="2"/><circle cx="31" cy="32" r="19" fill="#2563eb"/><text x="31" y="39" fill="white" text-anchor="middle" font-size="18" font-weight="700">3</text><text x="62" y="39" fill="#eaf1fb" font-size="21" font-weight="700">Compile compatibly</text><text x="22" y="78" fill="#cbd5e1" font-size="17">Choose vendor compiler options for the</text><text x="22" y="105" fill="#cbd5e1" font-size="17">identified generation; inspect diagnostics.</text></g>
<path d="M1057 286v54" stroke="#9fb5d0" stroke-width="4" marker-end="url(#a)"/>
<g transform="translate(872 354)"><rect width="370" height="142" rx="16" fill="#182538" stroke="#3b536f" stroke-width="2"/><circle cx="31" cy="32" r="19" fill="#2563eb"/><text x="31" y="39" fill="white" text-anchor="middle" font-size="18" font-weight="700">4</text><text x="62" y="39" fill="#eaf1fb" font-size="21" font-weight="700">Stage by model</text><text x="22" y="78" fill="#cbd5e1" font-size="17">Verify the artifact and follow the specific</text><text x="22" y="105" fill="#cbd5e1" font-size="17">device's documented storage/arming steps.</text></g>
<path d="M860 425h-45" stroke="#9fb5d0" stroke-width="4" marker-end="url(#a)"/>
<g transform="translate(455 354)"><rect width="350" height="142" rx="16" fill="#182538" stroke="#3b536f" stroke-width="2"/><circle cx="31" cy="32" r="19" fill="#047857"/><text x="31" y="39" fill="white" text-anchor="middle" font-size="18" font-weight="700">5</text><text x="62" y="39" fill="#eaf1fb" font-size="21" font-weight="700">Test in isolation</text><text x="22" y="78" fill="#cbd5e1" font-size="17">Use an approved offline host, blank editor</text><text x="22" y="105" fill="#cbd5e1" font-size="17">and observe exact output and USB telemetry.</text></g>
<path d="M443 425h-45" stroke="#9fb5d0" stroke-width="4" marker-end="url(#a)"/>
<g transform="translate(38 354)"><rect width="350" height="142" rx="16" fill="#182538" stroke="#3b536f" stroke-width="2"/><circle cx="31" cy="32" r="19" fill="#047857"/><text x="31" y="39" fill="white" text-anchor="middle" font-size="18" font-weight="700">6</text><text x="62" y="39" fill="#eaf1fb" font-size="21" font-weight="700">Record &amp; clean up</text><text x="22" y="78" fill="#cbd5e1" font-size="17">Preserve source, artifact checksum, results</text><text x="22" y="105" fill="#cbd5e1" font-size="17">and cleanup; retest ordinary keyboard use.</text></g>
</g>
<rect x="38" y="548" width="1204" height="92" rx="15" fill="#351d28" stroke="#f87171" stroke-width="2"/>
<text x="64" y="583" fill="#fecaca" font-family="system-ui,sans-serif" font-size="20" font-weight="700">STOP &amp; re-scope</text>
<text x="64" y="613" fill="#f1d4d4" font-family="system-ui,sans-serif" font-size="17">If model, source, artifact, host authorization, or editor focus is uncertain—or output differs from the fixed marker—disconnect and investigate.</text>
<text x="640" y="674" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="15">Conceptual safety workflow • no credential capture, shell commands, or data transfer</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">A bench transmission needs independent observation</title>
<desc id="desc">An approved test waveform travels through a verified attenuated or contained path to a test receiver. Its outcome is observed independently through logs or another receiver. One HackRF is half duplex.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
<path d="M0 0 L10 5 L0 10Z" fill="#337b98"/>
</marker>
</defs>
<rect width="1200" height="600" fill="#f4f7fa"/>
<text x="40" y="54" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#16354b">A bench transmission needs independent observation</text>
<text x="40" y="89" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Conceptual test roles • not wiring instructions or proof of containment</text>
<rect x="40" y="166" width="250" height="210" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/>
<text x="58" y="201" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16354b">Test source</text>
<text x="58" y="239" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Finite approved input</text>
<text x="58" y="269" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Known sample format</text>
<rect x="330" y="166" width="250" height="210" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/>
<text x="348" y="201" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16354b">Verified RF path</text>
<text x="348" y="239" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Attenuation / filtering</text>
<text x="348" y="269" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Power and ratings</text>
<rect x="620" y="166" width="250" height="210" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/>
<text x="638" y="201" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16354b">Development DUT</text>
<text x="638" y="239" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Inert output</text>
<text x="638" y="269" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Restorable state</text>
<rect x="910" y="166" width="250" height="210" rx="16" fill="#fff3d7" stroke="#b5cbd7" stroke-width="2"/>
<text x="928" y="201" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16354b">Independent result</text>
<text x="928" y="239" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Logs / logic / receiver</text>
<text x="928" y="269" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Positive controls</text>
<path d="M298 271 L319 271" stroke="#337b98" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M588 271 L609 271" stroke="#337b98" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M878 271 L899 271" stroke="#337b98" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="40" y="480" width="1120" height="86" rx="12" fill="#e0ebf1"/>
<text x="58" y="510" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Half duplex: a transmitting HackRF cannot simultaneously receive the DUT’s reply.</text>
<text x="58" y="539" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Observe actual acceptance or rejection; waveform transmission alone is not test success.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 745" width="1440" height="745" role="img" aria-labelledby="title desc"><title id="title">AI Projects: Notes Do Not Execute Hooks</title><desc id="desc">Two conceptual lanes distinguish reference context from event-driven actions; both produce independently checkable evidence and require an owner to accept milestones.</desc><defs><marker id="end-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#78D9FB"/></marker></defs><rect width="1440" height="745" rx="20" fill="#0C1829"/><g font-family="Arial,Helvetica,sans-serif"><text x="34" y="54" font-size="30" font-weight="700" fill="#F8FBFF">AI Projects: Notes Do Not Execute Hooks</text><text x="34" y="86" font-size="18" fill="#B9D2E4">The same words 'note', 'hook' and 'memory' can have different definitions in different host products.</text><path d="M34 110H1406" stroke="#385067" stroke-width="2"/><rect x="34" y="156" width="612" height="182" rx="14" fill="#172C45" stroke="#B5ADFF" stroke-width="2.4"/><rect x="34" y="156" width="7" height="182" rx="3" fill="#B5ADFF"/><text x="53" y="198" font-size="21" font-weight="700" fill="#F9FBFF">Passive context lane</text><text x="53" y="243" font-size="17" fill="#DAE9F3">Notes / source citations / project state</text><text x="53" y="277" font-size="17" fill="#DAE9F3">Loaded by a separate authorized process</text><text x="53" y="311" font-size="17" fill="#DAE9F3">Writing a note never runs a command</text><rect x="792" y="156" width="612" height="182" rx="14" fill="#172C45" stroke="#70DEB7" stroke-width="2.4"/><rect x="792" y="156" width="7" height="182" rx="3" fill="#70DEB7"/><text x="811" y="198" font-size="21" font-weight="700" fill="#F9FBFF">Event/action lane</text><text x="811" y="243" font-size="17" fill="#DAE9F3">Explicit event, schedule or webhook</text><text x="811" y="277" font-size="17" fill="#DAE9F3">Host validates identity, schema and scope</text><text x="811" y="311" font-size="17" fill="#DAE9F3">Approved handler may act and log result</text><path d="M340 338V396H714V443" stroke="#78D9FB" stroke-width="3" fill="none" marker-end="url(#end-arrow)"/><path d="M1090 338V396H726V443" stroke="#78D9FB" stroke-width="3" fill="none" marker-end="url(#end-arrow)"/><rect x="337" y="446" width="764" height="129" rx="14" fill="#172C45" stroke="#78D9FB" stroke-width="2.4"/><rect x="337" y="446" width="7" height="129" rx="3" fill="#78D9FB"/><text x="356" y="488" font-size="21" font-weight="700" fill="#F9FBFF">Independent result check</text><text x="356" y="533" font-size="17" fill="#DAE9F3">Read back the actual file, alert or external state</text><text x="356" y="567" font-size="17" fill="#DAE9F3">Preserve provenance and errors; do not infer success</text><rect x="337" y="601" width="764" height="86" rx="14" fill="#172C45" stroke="#F0CB81" stroke-width="2.4"/><rect x="337" y="601" width="7" height="86" rx="3" fill="#F0CB81"/><text x="356" y="643" font-size="21" font-weight="700" fill="#F9FBFF">Milestone acceptance</text><text x="356" y="688" font-size="17" fill="#DAE9F3">Named reviewer confirms agreed evidence</text><path d="M720 575V595" stroke="#78D9FB" stroke-width="3" fill="none" marker-end="url(#end-arrow)"/><text x="35" y="726" font-size="15.5" fill="#B5CCDE">Untrusted documents and model output cannot grant tool permissions or establish task completion.</text></g></svg>
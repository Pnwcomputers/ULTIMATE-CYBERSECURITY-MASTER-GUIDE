<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="mvt-custody-title mvt-custody-desc"><title id="mvt-custody-title">Consent and custody shape the analysis workflow</title><desc id="mvt-custody-desc">Conceptual MVT workflow: obtain data-owner consent and define collection and recipients, preserve original acquisition and protected key material, analyze a working copy with recorded modules and network settings, and share a minimized report with limitations and retention controls.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#347e99"/></marker></defs><rect width="1200" height="660" fill="#f4f7fa"/><g font-family="Arial, Helvetica, sans-serif" fill="#16364b"><text x="40" y="54" font-size="32" font-weight="700">Consent and custody shape the analysis workflow</text><text x="40" y="91" font-size="20">Original conceptual workflow • no device connection, backup or scan</text><rect x="40" y="155" width="250" height="290" rx="17" fill="#ffffff" stroke="#b3ccdc" stroke-width="2"/><text x="60" y="191" font-size="23">Authorize scope</text><text x="60" y="233" font-size="20">Data-owner consent</text><text x="60" y="264" font-size="20">Purpose and method</text><text x="60" y="295" font-size="20">Approved recipients</text><text x="60" y="326" font-size="20">Retention limits</text><rect x="330" y="155" width="250" height="290" rx="17" fill="#ffffff" stroke="#b3ccdc" stroke-width="2"/><text x="350" y="191" font-size="23">Preserve originals</text><text x="350" y="233" font-size="20">Acquisition and hashes</text><text x="350" y="264" font-size="20">Protect keys / backups</text><text x="350" y="295" font-size="20">Log transformations</text><text x="350" y="326" font-size="20">Separate working copy</text><rect x="620" y="155" width="250" height="290" rx="17" fill="#ffffff" stroke="#b3ccdc" stroke-width="2"/><text x="640" y="191" font-size="23">Analyze copy</text><text x="640" y="233" font-size="20">Version and modules</text><text x="640" y="264" font-size="20">Indicator revision</text><text x="640" y="295" font-size="20">Network / disclosure</text><text x="640" y="326" font-size="20">Errors and uncertainty</text><rect x="910" y="155" width="250" height="290" rx="17" fill="#fff3d6" stroke="#b3ccdc" stroke-width="2"/><text x="930" y="191" font-size="23">Report selectively</text><text x="930" y="233" font-size="20">Minimize personal data</text><text x="930" y="264" font-size="20">Explain coverage gaps</text><text x="930" y="295" font-size="20">Log access / transfer</text><text x="930" y="326" font-size="20">Apply retention plan</text><path d="M298 300 L320 300" stroke="#347e99" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M588 300 L610 300" stroke="#347e99" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M878 300 L900 300" stroke="#347e99" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="40" y="520" width="1120" height="86" rx="13" fill="#dfebf1"/><text x="58" y="549" font-size="20">Offline handling must be planned: URL resolution and optional provider lookups can disclose data.</text><text x="58" y="580" font-size="20">A hash supports integrity comparison; provenance, timing and interpretation still need context.</text></g></svg>

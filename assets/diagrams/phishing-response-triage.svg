<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="295" viewBox="0 0 1200 295" role="img" aria-labelledby="title desc"><title id="title">Match response to the observed interaction</title><desc id="desc">Receipt is different from credential entry or code execution; both account and endpoint exposure can occur.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#286585"/></marker></defs><rect width="1200" height="295" fill="#f6f9fc"/><g font-family="Arial, sans-serif" fill="#16354b"><text x="40" y="48" font-size="30" font-weight="700">Match response to the observed interaction</text><rect x="40" y="85" width="350" height="120" rx="12" fill="#e4f0f5" stroke="#8faebb"/><text x="56" y="114" font-size="21" font-weight="700">Received / reported</text><text x="56" y="143" font-size="18">Preserve original message</text><text x="56" y="166" font-size="18">Search for related delivery</text><rect x="425" y="85" width="350" height="120" rx="12" fill="#e4f0f5" stroke="#8faebb"/><text x="441" y="114" font-size="21" font-weight="700">Visited / downloaded</text><text x="441" y="143" font-size="18">Inspect actual user actions</text><text x="441" y="166" font-size="18">Review browser and EDR evidence</text><rect x="810" y="85" width="350" height="120" rx="12" fill="#e4f0f5" stroke="#8faebb"/><text x="826" y="114" font-size="21" font-weight="700">Entered / approved / ran</text><text x="826" y="143" font-size="18">Identify account and host impact</text><text x="826" y="166" font-size="18">Escalate affected response paths</text><text x="40" y="275" font-size="17">Conceptual triage; steps can overlap. A click or a reputation verdict alone does not prove compromise.</text></g></svg>
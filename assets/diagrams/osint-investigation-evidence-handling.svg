<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="handling-title handling-desc"><title id="handling-title">Preserve bytes and preserve the surrounding context</title><desc id="handling-desc">Conceptual evidence handling: record acquisition source and context, protect original files and a trusted hash manifest, analyze working copies with transformations logged, then share a minimized report while retaining access and transfer records. A hash alone cannot prove origin or publication time.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#347e99"/></marker></defs><rect width="1200" height="660" fill="#f4f7fa"/><g font-family="Arial, Helvetica, sans-serif" fill="#16364b"><text x="40" y="54" font-size="32" font-weight="700">Preserve bytes and preserve the surrounding context</text><text x="40" y="91" font-size="20">Original conceptual workflow • no evidence was acquired or submitted</text><rect x="40" y="155" width="250" height="290" rx="17" fill="#ffffff" stroke="#b3ccdc" stroke-width="2"/><text x="60" y="191" font-size="23">Acquire + record</text><text x="60" y="233" font-size="20">Source / redirects</text><text x="60" y="264" font-size="20">UTC time and collector</text><text x="60" y="295" font-size="20">Tool / settings</text><text x="60" y="326" font-size="20">Failures and omissions</text><rect x="330" y="155" width="250" height="290" rx="17" fill="#ffffff" stroke="#b3ccdc" stroke-width="2"/><text x="350" y="191" font-size="23">Protect originals</text><text x="350" y="233" font-size="20">SHA-256 manifest</text><text x="350" y="264" font-size="20">Restricted storage</text><text x="350" y="295" font-size="20">Backup and access log</text><text x="350" y="326" font-size="20">Keep context nearby</text><rect x="620" y="155" width="250" height="290" rx="17" fill="#ffffff" stroke="#b3ccdc" stroke-width="2"/><text x="640" y="191" font-size="23">Analyze copies</text><text x="640" y="233" font-size="20">Log transformations</text><text x="640" y="264" font-size="20">Hash derived files</text><text x="640" y="295" font-size="20">Compare sources</text><text x="640" y="326" font-size="20">Separate uncertainty</text><rect x="910" y="155" width="250" height="290" rx="17" fill="#fff3d6" stroke="#b3ccdc" stroke-width="2"/><text x="930" y="191" font-size="23">Share selectively</text><text x="930" y="233" font-size="20">Redact bystander data</text><text x="930" y="264" font-size="20">Verify recipient route</text><text x="930" y="295" font-size="20">Log transfer / ticket</text><text x="930" y="326" font-size="20">Apply retention plan</text><path d="M298 300 L320 300" stroke="#347e99" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M588 300 L610 300" stroke="#347e99" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M878 300 L900 300" stroke="#347e99" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="40" y="520" width="1120" height="86" rx="13" fill="#dfebf1"/><text x="58" y="549" font-size="20">A trusted hash comparison detects byte changes; it does not establish authorship, truth or publication time.</text><text x="58" y="580" font-size="20">A screenshot, HTML capture and handling log answer different evidence questions.</text></g></svg>

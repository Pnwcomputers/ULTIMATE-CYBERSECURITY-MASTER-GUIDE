<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="785" viewBox="0 0 1440 785" role="img" aria-labelledby="title desc"><title id="title">Wi-Fi PSK Evidence: Capture, Convert &amp; Scope</title><desc id="desc">An authorized wireless capture has a radio-mode and privacy gate before acquisition. A PCAPNG must actually contain usable PMKID/EAPOL for an applicable PSK network before conversion to Hashcat WPA-PBKDF2 22000 mode.</desc><rect x="0" y="0" width="1440" height="785" rx="18" fill="#0d1a2c"/><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#83d9f7"/></marker></defs><g font-family="Arial,Helvetica,sans-serif"><text x="38" y="55" font-size="29" font-weight="700" fill="#f7faff">Wi-Fi PSK Evidence: Capture, Convert &amp; Scope</text><text x="38" y="90" font-size="18" fill="#bdd4e5">WPA3-SAE and enterprise EAP are not automatically covered by legacy WPA-PSK cracking workflows.</text><path d="M38 116H1402" stroke="#36516a" stroke-width="2"/><rect x="41" y="158" width="335" height="213" rx="13" fill="#1b3047" stroke="#edc985" stroke-width="2.3"/><text x="60" y="199" font-size="21" font-weight="700" fill="#f9fcff">Authorized RF source</text><text x="60" y="240" font-size="17" fill="#dae9f3">Owned/approved AP &amp; clients</text><text x="60" y="274" font-size="17" fill="#dae9f3">Inspect radio behavior first</text><text x="60" y="308" font-size="17" fill="#dae9f3">Active mode? stop/review</text><rect x="416" y="158" width="338" height="213" rx="13" fill="#1b3047" stroke="#82d9f6" stroke-width="2.3"/><text x="435" y="199" font-size="21" font-weight="700" fill="#f9fcff">Collected PCAPNG</text><text x="435" y="240" font-size="17" fill="#dae9f3">Store raw frames privately</text><text x="435" y="274" font-size="17" fill="#dae9f3">Check PMKID/EAPOL present</text><text x="435" y="308" font-size="17" fill="#dae9f3">Capture may be incomplete</text><rect x="797" y="158" width="325" height="213" rx="13" fill="#1b3047" stroke="#b2abff" stroke-width="2.3"/><text x="816" y="199" font-size="21" font-weight="700" fill="#f9fcff">hcxpcapngtool</text><text x="816" y="240" font-size="17" fill="#dae9f3">Convert suitable captures</text><text x="816" y="274" font-size="17" fill="#dae9f3">Retain original and limits</text><text x="816" y="308" font-size="17" fill="#dae9f3">Do not assume output</text><rect x="1164" y="158" width="234" height="213" rx="13" fill="#1b3047" stroke="#72dcbc" stroke-width="2.3"/><text x="1183" y="199" font-size="21" font-weight="700" fill="#f9fcff">Mode 22000</text><text x="1183" y="240" font-size="15" fill="#dae9f3">WPA-PBKDF2</text><text x="1183" y="274" font-size="15" fill="#dae9f3">PMKID + EAPOL</text><text x="1183" y="308" font-size="15" fill="#dae9f3">PSK audit only</text><path d="M377 261H407" fill="none" stroke="#83d9f7" stroke-width="3" marker-end="url(#arr)"/><path d="M755 261H788" fill="none" stroke="#83d9f7" stroke-width="3" marker-end="url(#arr)"/><path d="M1123 261H1155" fill="none" stroke="#83d9f7" stroke-width="3" marker-end="url(#arr)"/><rect x="244" y="450" width="943" height="139" rx="13" fill="#1b3047" stroke="#72dcbc" stroke-width="2.3"/><text x="263" y="491" font-size="21" font-weight="700" fill="#f9fcff">Offline validation on synthetic/authorized captures</text><text x="263" y="532" font-size="17" fill="#dae9f3">Record the actual protocol type and format before any password strength assessment</text><text x="263" y="566" font-size="17" fill="#dae9f3">An absent matching record is not proof of secure configuration or complete observation</text><path d="M1282 372V409H718V441" fill="none" stroke="#83d9f7" stroke-width="3" marker-end="url(#arr)"/><rect x="40" y="653" width="1360" height="91" rx="12" fill="#3c3228" stroke="#edc985" stroke-width="2"/><text x="62" y="687" font-size="21" font-weight="700" fill="#ffedc2">Do not call hcxdumptool passive without checking the exact mode</text><text x="62" y="720" font-size="17" fill="#f3e2ca">The project supports active monitoring functions; read the installed version's help before RF collection.</text><text x="41" y="766" font-size="15" fill="#b8cede">This is a protocol interpretation flow, not a command sequence to capture third-party network credentials.</text></g></svg>
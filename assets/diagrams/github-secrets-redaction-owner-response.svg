<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 650" role="img" aria-labelledby="title desc">
<title id="title">GitHub secret alert handling and evidence gates</title>
<desc id="desc">Written repository scope and least-privilege authorization lead to an approved scanner operating in a restricted environment. A local redaction gate removes credential values and source excerpts. The AgentFlow receives metadata only and organizes leads. An authorized owner independently checks alert status and access scope, then decides whether to revoke or rotate credentials and review logs. History rewriting is a separate coordinated step. The flow does not scan code or test credentials.</desc>
<defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#17324d}.title{font-size:30px;font-weight:700}.sub{font-size:18px;fill:#435a72}.gate{fill:#eef5ff;stroke:#4e78a3;stroke-width:2}.restricted{fill:#fff7e8;stroke:#c39339;stroke-width:2}.redact{fill:#eaf7f0;stroke:#548d68;stroke-width:2}.agent{fill:#f3f0ff;stroke:#7763a5;stroke-width:2}.owner{fill:#eff5fa;stroke:#496982;stroke-width:2}.step{font-size:13px;font-weight:700;letter-spacing:1px;fill:#5d7083}.head{font-size:18px;font-weight:700}.body{font-size:14px}.arrow{stroke:#486883;stroke-width:3;fill:none;marker-end:url(#arrow)}.foot{font-size:16px;font-weight:700;fill:#fff}</style><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#486883"/></marker></defs>
<rect width="1450" height="650" fill="#f5f8fc"/>
<text x="725" y="48" text-anchor="middle" class="title">Secret exposure response: keep values out of the LLM</text>
<text x="725" y="78" text-anchor="middle" class="sub">The AgentFlow reviews redacted alert metadata; the authorized scanner and credential owner remain separate.</text>
<rect x="28" y="145" width="210" height="265" rx="16" class="gate"/><text x="48" y="177" class="step">1 · SCOPE</text><text x="48" y="215" class="head">Confirm repository</text><text x="48" y="250" class="body"><tspan x="48">Owner-controlled or</tspan><tspan x="48" dy="21">explicitly in written scope.</tspan><tspan x="48" dy="31">Use least-privilege access</tspan><tspan x="48" dy="21">and approved handling.</tspan></text>
<path d="M238 278H266" class="arrow"/>
<rect x="274" y="145" width="210" height="265" rx="16" class="restricted"/><text x="294" y="177" class="step">2 · SCAN</text><text x="294" y="215" class="head">Restricted scanner</text><text x="294" y="250" class="body"><tspan x="294">Approved scanner checks</tspan><tspan x="294" dy="21">authorized files/history.</tspan><tspan x="294" dy="31">Raw values and code stay</tspan><tspan x="294" dy="21">in the protected system.</tspan></text>
<path d="M484 278H512" class="arrow"/>
<rect x="520" y="145" width="210" height="265" rx="16" class="redact"/><text x="540" y="177" class="step">3 · REDACT</text><text x="540" y="215" class="head">Verify before export</text><text x="540" y="250" class="body"><tspan x="540">Keep alert ID, category,</tspan><tspan x="540" dy="21">repo, path, line, commit.</tspan><tspan x="540" dy="31">Remove values, prefixes,</tspan><tspan x="540" dy="21">suffixes and source lines.</tspan></text>
<path d="M730 278H758" class="arrow"/>
<rect x="766" y="145" width="210" height="265" rx="16" class="agent"/><text x="786" y="177" class="step">4 · REVIEW</text><text x="786" y="215" class="head">Metadata only</text><text x="786" y="250" class="body"><tspan x="786">AgentFlow summarizes</tspan><tspan x="786" dy="21">findings and uncertainty.</tspan><tspan x="786" dy="31">It does not scan code,</tspan><tspan x="786" dy="21">test or validate secrets.</tspan></text>
<path d="M976 278H1004" class="arrow"/>
<rect x="1012" y="145" width="210" height="265" rx="16" class="owner"/><text x="1032" y="177" class="step">5 · OWNER CHECK</text><text x="1032" y="215" class="head">Verify safely</text><text x="1032" y="250" class="body"><tspan x="1032">Check status and privileges</tspan><tspan x="1032" dy="21">through provider records.</tspan><tspan x="1032" dy="31">Never sign in with the</tspan><tspan x="1032" dy="21">discovered credential.</tspan></text>
<path d="M1222 278H1250" class="arrow"/>
<rect x="1258" y="145" width="164" height="265" rx="16" class="gate"/><text x="1278" y="177" class="step">6 · RESPOND</text><text x="1278" y="215" class="head">Owner decides</text><text x="1278" y="250" class="body"><tspan x="1278">Revoke/rotate;</tspan><tspan x="1278" dy="21">review audit logs.</tspan><tspan x="1278" dy="31">History cleanup is</tspan><tspan x="1278" dy="21">separate and coordinated.</tspan></text>
<rect x="28" y="465" width="1394" height="92" rx="15" fill="#16324d"/><text x="725" y="504" text-anchor="middle" class="foot">Never paste raw scanner output, matched values, partial values, private keys or source excerpts into prompts.</text><text x="725" y="533" text-anchor="middle" class="foot">A pattern match is an alert to review, not proof that a credential is valid or was misused.</text>
</svg>
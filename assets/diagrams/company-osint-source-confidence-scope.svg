<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 650" role="img" aria-labelledby="title desc">
<title id="title">Company OSINT source verification and scope flow</title>
<desc id="desc">A written scope gate permits collection only from approved public organization sources. The analyst records source URL, retrieval time, and provenance. A model treats retrieved content as untrusted data and extracts organization-level facts without profiling people or copying secrets. An analyst independently verifies facts and confidence. A human owner decides whether a lead needs separate scope confirmation. No scanning, credential testing, or individual targeting occurs.</desc>
<defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#17324d}.title{font-size:30px;font-weight:700}.sub{font-size:18px;fill:#435a72}.card{fill:#fff;stroke:#9aafc1;stroke-width:2}.gate{fill:#eef5ff;stroke:#4e78a3;stroke-width:2}.source{fill:#f4f1ff;stroke:#7763a5;stroke-width:2}.data{fill:#fff7e8;stroke:#c39339;stroke-width:2}.verify{fill:#eaf7f0;stroke:#548d68;stroke-width:2}.human{fill:#eff5fa;stroke:#496982;stroke-width:2}.step{font-size:13px;font-weight:700;letter-spacing:1px;fill:#5d7083}.head{font-size:18px;font-weight:700}.body{font-size:14px}.arrow{stroke:#486883;stroke-width:3;fill:none;marker-end:url(#arrow)}.foot{font-size:16px;font-weight:700;fill:#fff}</style><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#486883"/></marker></defs>
<rect width="1450" height="650" fill="#f5f8fc"/>
<text x="725" y="48" text-anchor="middle" class="title">CompanyOSINT: source quality before scope decisions</text>
<text x="725" y="78" text-anchor="middle" class="sub">Public data creates leads; independent verification and human scope review decide what follows.</text>
<rect x="28" y="145" width="210" height="264" rx="16" class="gate"/><text x="48" y="177" class="step">1 · SCOPE</text><text x="48" y="215" class="head">Confirm authority</text><text x="48" y="250" class="body"><tspan x="48">Written scope and approved</tspan><tspan x="48" dy="21">source types first.</tspan><tspan x="48" dy="31">Organization-level purpose</tspan><tspan x="48" dy="21">only; no people profiling.</tspan></text>
<path d="M238 275H266" class="arrow"/>
<rect x="274" y="145" width="210" height="264" rx="16" class="source"/><text x="294" y="177" class="step">2 · COLLECT</text><text x="294" y="215" class="head">Approved sources</text><text x="294" y="250" class="body"><tspan x="294">Official company pages</tspan><tspan x="294" dy="21">and public org repositories.</tspan><tspan x="294" dy="31">Use permitted access;</tspan><tspan x="294" dy="21">no scraping or bypassing.</tspan></text>
<path d="M484 275H512" class="arrow"/>
<rect x="520" y="145" width="210" height="264" rx="16" class="card"/><text x="540" y="177" class="step">3 · PROVENANCE</text><text x="540" y="215" class="head">Keep evidence trail</text><text x="540" y="250" class="body"><tspan x="540">Record URL, retrieval</tspan><tspan x="540" dy="21">time and source owner.</tspan><tspan x="540" dy="31">Mark stale, indirect or</tspan><tspan x="540" dy="21">ambiguous observations.</tspan></text>
<path d="M730 275H758" class="arrow"/>
<rect x="766" y="145" width="210" height="264" rx="16" class="data"/><text x="786" y="177" class="step">4 · ANALYZE</text><text x="786" y="215" class="head">Organization facts</text><text x="786" y="250" class="body"><tspan x="786">Treat retrieved text as</tspan><tspan x="786" dy="21">untrusted data.</tspan><tspan x="786" dy="31">No employee dossiers,</tspan><tspan x="786" dy="21">secret values or exploits.</tspan></text>
<path d="M976 275H1004" class="arrow"/>
<rect x="1012" y="145" width="210" height="264" rx="16" class="verify"/><text x="1032" y="177" class="step">5 · VERIFY</text><text x="1032" y="215" class="head">Check confidence</text><text x="1032" y="250" class="body"><tspan x="1032">Corroborate claims using</tspan><tspan x="1032" dy="21">independent approved</tspan><tspan x="1032" dy="21">sources; cite URL and date.</tspan><tspan x="1032" dy="31">Do not infer vulnerabilities</tspan><tspan x="1032" dy="21">from technology names.</tspan></text>
<path d="M1222 275H1250" class="arrow"/>
<rect x="1258" y="145" width="164" height="264" rx="16" class="human"/><text x="1278" y="177" class="step">6 · DECIDE</text><text x="1278" y="215" class="head">Human review</text><text x="1278" y="250" class="body"><tspan x="1278">Scope leads require</tspan><tspan x="1278" dy="21">separate confirmation.</tspan><tspan x="1278" dy="31">A human approves</tspan><tspan x="1278" dy="21">any follow-up.</tspan></text>
<rect x="28" y="464" width="1394" height="92" rx="15" fill="#16324d"/><text x="725" y="503" text-anchor="middle" class="foot">This workflow gathers and reviews public organization-level context only.</text><text x="725" y="532" text-anchor="middle" class="foot">It does not scan systems, test credentials, copy secrets, or identify individual targets.</text>
</svg>
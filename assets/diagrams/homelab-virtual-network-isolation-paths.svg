<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" width="1440" height="820" role="img" aria-labelledby="title desc"><title id="title">Virtualization Lab: Internal, Host-Only &amp; Routed Boundaries</title><desc id="desc">Three virtual networking paths differ in who can communicate: disconnected internal vSwitch, host-only network with the host, and explicitly routed lab uplink. Isolation must be tested per hypervisor.</desc><defs><marker id="next" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#78D7FC"/></marker></defs><rect width="1440" height="820" rx="20" fill="#0B1728"/><g font-family="Arial,Helvetica,sans-serif"><text x="34" y="54" font-size="31" font-weight="700" fill="#F7FAFF">Virtualization Lab: Internal, Host-Only &amp; Routed Boundaries</text><text x="34" y="88" font-size="18" fill="#B9D0E3">A NAT setting, VLAN label or firewall VM is not an automatically proven isolation boundary.</text><path d="M34 111H1406" stroke="#375168" stroke-width="2"/><rect x="35" y="162" width="306" height="249" rx="14" fill="#172B44" stroke="#70DEB4" stroke-width="2.5"/><rect x="35" y="162" width="7" height="249" rx="4" fill="#70DEB4"/><text x="55" y="205" font-size="21" font-weight="700" fill="#F7FAFF">Internal / disconnected lab</text><text x="55" y="247" font-size="17" fill="#D8E5F0">Virtual switch with no uplink</text><text x="55" y="282" font-size="17" fill="#D8E5F0">Selected lab VMs only</text><text x="55" y="317" font-size="17" fill="#D8E5F0">Validate all extra NICs/routes</text><rect x="389" y="162" width="306" height="249" rx="14" fill="#172B44" stroke="#F0CC80" stroke-width="2.5"/><rect x="389" y="162" width="7" height="249" rx="4" fill="#F0CC80"/><text x="409" y="205" font-size="21" font-weight="700" fill="#F7FAFF">Host-only / host-connected</text><text x="409" y="247" font-size="17" fill="#D8E5F0">Lab guests plus host interface</text><text x="409" y="282" font-size="17" fill="#D8E5F0">The host can reach lab guests</text><text x="409" y="317" font-size="17" fill="#D8E5F0">Restrict host services &amp; paths</text><rect x="743" y="162" width="306" height="249" rx="14" fill="#172B44" stroke="#B9B2FF" stroke-width="2.5"/><rect x="743" y="162" width="7" height="249" rx="4" fill="#B9B2FF"/><text x="763" y="205" font-size="21" font-weight="700" fill="#F7FAFF">Approved routed lab</text><text x="763" y="247" font-size="17" fill="#D8E5F0">Firewall VM or dedicated router</text><text x="763" y="282" font-size="17" fill="#D8E5F0">Explicit allowlist / DNS / IPv6</text><text x="763" y="317" font-size="17" fill="#D8E5F0">Measure permitted egress</text><rect x="1097" y="162" width="306" height="249" rx="14" fill="#172B44" stroke="#F6A7A7" stroke-width="2.5"/><rect x="1097" y="162" width="7" height="249" rx="4" fill="#F6A7A7"/><text x="1117" y="205" font-size="21" font-weight="700" fill="#F7FAFF">Physical / client network</text><text x="1117" y="247" font-size="17" fill="#D8E5F0">Must remain out of scope</text><text x="1117" y="282" font-size="17" fill="#D8E5F0">No direct vulnerable VM bridge</text><text x="1117" y="317" font-size="17" fill="#D8E5F0">Test access controls</text><rect x="36" y="471" width="1367" height="148" rx="14" fill="#193046" stroke="#78D7FC" stroke-width="2.5"/><text x="58" y="508" font-size="22" font-weight="700" fill="#F8FBFF">Verify segmentation rather than assuming it</text><text x="58" y="543" font-size="18" fill="#D3E3F1">Test guest → host, guest → LAN, guest → DNS, guest → internet and cross-VLAN flows (IPv4 and IPv6).</text><text x="58" y="580" font-size="18" fill="#D3E3F1">Repeat after snapshot restore, NIC changes, router updates and hypervisor migration.</text><rect x="36" y="665" width="1367" height="95" rx="12" fill="#3A3226" stroke="#F0CC80" stroke-width="2"/><text x="56" y="702" font-size="21" font-weight="700" fill="#FFE7B3">No physical uplink does not eliminate host or hypervisor risk</text><text x="56" y="734" font-size="17" fill="#F1DDBD">Classify untrusted samples, disable unnecessary shared folders/clipboard and verify test containment before executing code.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Test the boundary and verify the effect</title><desc id="desc">A synthetic fixture may test model behavior, a mock enforcement gate or an isolated real integration. Authorized positive and unauthorized negative cases plus independent outcome evidence show what was actually tested.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#337b98"/></marker></defs><rect width="1200" height="620" fill="#f4f7fa"/><text x="40" y="54" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#16354b">Test the boundary and verify the effect</text><text x="40" y="90" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Conceptual evidence model • synthetic markers only; no production evaluation</text><rect x="40" y="155" width="350" height="235" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/><text x="60" y="193" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#16354b">1  Stimulus</text><text x="60" y="235" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Synthetic untrusted document</text><text x="60" y="264" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Expected allow / deny result</text><text x="60" y="293" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Known identity and target</text><text x="60" y="322" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">No real secrets or recipients</text><rect x="425" y="155" width="350" height="235" rx="16" fill="#e8f3ef" stroke="#b5cbd7" stroke-width="2"/><text x="445" y="193" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#16354b">2  Observe enforcement</text><text x="445" y="235" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Model-only or mock test?</text><text x="445" y="264" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Actual policy path exercised?</text><text x="445" y="293" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Attempted calls and denials</text><text x="445" y="322" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Software / policy versions</text><rect x="810" y="155" width="350" height="235" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/><text x="830" y="193" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#16354b">3  Verify outcome</text><text x="830" y="235" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Independent service evidence</text><text x="830" y="264" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">No unauthorized effect</text><text x="830" y="293" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Authorized control succeeds</text><text x="830" y="322" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Record timing and limits</text><path d="M397 267 L415 267" stroke="#337b98" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M782 267 L800 267" stroke="#337b98" stroke-width="3" marker-end="url(#arrow)" fill="none"/><rect x="40" y="430" width="1120" height="115" rx="16" fill="#e5eef4"/><text x="64" y="472" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#16354b">A refusal message alone does not demonstrate containment.</text><text x="64" y="511" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#16354b">A passing fixture describes that test's scope; it does not prove all future behavior.</text><text x="40" y="593" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#16354b">Original conceptual diagram • labels describe evidence strength, not a measured security score</text></svg>
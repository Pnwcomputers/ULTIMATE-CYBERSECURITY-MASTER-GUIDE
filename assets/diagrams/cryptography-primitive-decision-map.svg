<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="730" viewBox="0 0 1440 730" role="img" aria-labelledby="title desc"><title id="title">Cryptography: Choose a Primitive by Security Goal</title><desc id="desc">Four distinct needs map to reviewed cryptographic primitives. Authenticated encryption does not imply source identity; hashing and encryption are not password verification.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#7DE0F8"/></marker></defs><rect width="1440" height="730" rx="22" fill="#0B1829"/><g font-family="Arial,Helvetica,sans-serif"><text x="38" y="54" font-size="31" font-weight="700" fill="#F8FBFF">Cryptography: Choose a Primitive by Security Goal</text><text x="38" y="87" font-size="18" fill="#BED2E2">Start with the desired security property and vetted platform APIs.</text><path d="M38 111H1402" stroke="#36516A" stroke-width="2"/><rect x="452" y="142" width="536" height="98" rx="13" fill="#172C45" stroke="#F1CF83" stroke-width="2.5"/><text x="470" y="183" font-weight="700" font-size="20" fill="#F7FAFF">What must the system protect?</text><text x="470" y="226" font-size="17" fill="#D6E6F2">Classify data, threats and trust relationships</text><rect x="35" y="323" width="312" height="216" rx="13" fill="#172C45" stroke="#7DDCF5" stroke-width="2.5"/><text x="53" y="364" font-weight="700" font-size="20" fill="#F7FAFF">Protect stored data</text><text x="53" y="407" font-size="17" fill="#D6E6F2">AEAD encryption</text><text x="53" y="441" font-size="17" fill="#D6E6F2">AES-GCM / ChaCha20-Poly1305</text><text x="53" y="475" font-size="17" fill="#D6E6F2">Unique nonces; manage keys</text><path d="M720 240V282H190V316" fill="none" stroke="#7DE0F8" stroke-width="3" marker-end="url(#arr)"/><rect x="388" y="323" width="312" height="216" rx="13" fill="#172C45" stroke="#B6ADFF" stroke-width="2.5"/><text x="406" y="364" font-weight="700" font-size="20" fill="#F7FAFF">Verify a password</text><text x="406" y="407" font-size="17" fill="#D6E6F2">Dedicated password KDF</text><text x="406" y="441" font-size="17" fill="#D6E6F2">Argon2id / approved alternative</text><text x="406" y="475" font-size="17" fill="#D6E6F2">Random salt; tuned work factor</text><path d="M720 240V282H543V316" fill="none" stroke="#7DE0F8" stroke-width="3" marker-end="url(#arr)"/><rect x="741" y="323" width="312" height="216" rx="13" fill="#172C45" stroke="#70DDB5" stroke-width="2.5"/><text x="759" y="364" font-weight="700" font-size="20" fill="#F7FAFF">Prove message origin</text><text x="759" y="407" font-size="17" fill="#D6E6F2">Digital signature or HMAC</text><text x="759" y="441" font-size="17" fill="#D6E6F2">Choice depends on key sharing</text><text x="759" y="475" font-size="17" fill="#D6E6F2">Authenticate the verification key</text><path d="M720 240V282H896V316" fill="none" stroke="#7DE0F8" stroke-width="3" marker-end="url(#arr)"/><rect x="1094" y="323" width="312" height="216" rx="13" fill="#172C45" stroke="#F1CF83" stroke-width="2.5"/><text x="1112" y="364" font-weight="700" font-size="20" fill="#F7FAFF">Agree on session key</text><text x="1112" y="407" font-size="17" fill="#D6E6F2">Vetted authenticated protocol</text><text x="1112" y="441" font-size="17" fill="#D6E6F2">Use current TLS / KEM suites</text><text x="1112" y="475" font-size="17" fill="#D6E6F2">Plan PQC migration carefully</text><path d="M720 240V282H1249V316" fill="none" stroke="#7DE0F8" stroke-width="3" marker-end="url(#arr)"/><rect x="35" y="589" width="1370" height="85" rx="12" fill="#393127" stroke="#F1CF83" stroke-width="2"/><text x="55" y="624" font-size="20" font-weight="700" fill="#FFE7AC">Do not interchange the primitives</text><text x="55" y="652" font-size="17" fill="#F4E1C5">Hashing is not encryption; a signature does not provide secrecy; AEAD alone does not authenticate who sent data.</text><text x="36" y="704" font-size="15" fill="#BFD0E0">Illustrative decision map. Validate library, mode, nonce policy, secret lifecycle, algorithm requirements and exact protocol version.</text></g></svg>
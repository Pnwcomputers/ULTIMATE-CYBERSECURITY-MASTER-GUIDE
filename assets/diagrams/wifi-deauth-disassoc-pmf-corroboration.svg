<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="830" viewBox="0 0 1440 830" role="img" aria-labelledby="title desc"><title id="title">802.11 Disconnects: State, Frame &amp; PMF</title><desc id="desc">Authenticated and associated stations can disconnect by explicit management frames or local changes. PMF protects certain robust management frames only after successful negotiation; packet capture is not proof of spoofing.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#80d7f7"/></marker></defs><rect width="1440" height="830" rx="19" fill="#0d1a2b"/><g font-family="Arial,Helvetica,sans-serif"><text x="36" y="56" font-size="29" font-weight="700" fill="#f8fcff">802.11 Disconnects: State, Frame &amp; PMF</text><text x="36" y="90" font-size="18" fill="#c2d7e6">Interpret deauth versus disassoc with capture channel, AP records and client logs.</text><path d="M36 118H1404" stroke="#354f69" stroke-width="2"/><rect x="36" y="164" width="309" height="178" rx="14" fill="#1a3049" stroke="#80d7f7" stroke-width="2.3"/><text x="54" y="206" font-size="21" font-weight="700" fill="#f9fdff">Authentication state</text><text x="54" y="248" font-size="17" fill="#d8e9f4">Authentication / SAE as fitted</text><text x="54" y="281" font-size="17" fill="#d8e9f4">Station may not yet associate</text><rect x="401" y="164" width="310" height="178" rx="14" fill="#1a3049" stroke="#a8aafa" stroke-width="2.3"/><text x="419" y="206" font-size="21" font-weight="700" fill="#f9fdff">Association state</text><text x="419" y="248" font-size="17" fill="#d8e9f4">Association establishes BSS link</text><text x="419" y="281" font-size="17" fill="#d8e9f4">Key establishment follows</text><rect x="768" y="164" width="300" height="178" rx="14" fill="#1a3049" stroke="#71dfb8" stroke-width="2.3"/><text x="786" y="206" font-size="21" font-weight="700" fill="#f9fdff">Data / operation</text><text x="786" y="248" font-size="17" fill="#d8e9f4">Normal user and management</text><text x="786" y="281" font-size="17" fill="#d8e9f4">PMF protection if negotiated</text><rect x="1120" y="164" width="281" height="178" rx="14" fill="#1a3049" stroke="#edc787" stroke-width="2.3"/><text x="1138" y="206" font-size="21" font-weight="700" fill="#f9fdff">Disconnect</text><text x="1138" y="248" font-size="16" fill="#d8e9f4">Disassoc: end association</text><text x="1138" y="281" font-size="16" fill="#d8e9f4">Deauth: end authentication</text><path d="M346 252H393" fill="none" stroke="#80d7f7" stroke-width="3" marker-end="url(#arr)"/><path d="M711 252H760" fill="none" stroke="#80d7f7" stroke-width="3" marker-end="url(#arr)"/><path d="M1069 252H1112" fill="none" stroke="#80d7f7" stroke-width="3" marker-end="url(#arr)"/><rect x="84" y="428" width="603" height="157" rx="14" fill="#1a3049" stroke="#a8aafa" stroke-width="2.3"/><text x="102" y="470" font-size="21" font-weight="700" fill="#f9fdff">Captured frame</text><text x="102" y="512" font-size="17" fill="#d8e9f4">Look at subtype, flags, direction and time</text><text x="102" y="545" font-size="17" fill="#d8e9f4">MAC/reason fields can be spoofed</text><rect x="750" y="428" width="605" height="157" rx="14" fill="#1a3049" stroke="#71dfb8" stroke-width="2.3"/><text x="768" y="470" font-size="21" font-weight="700" fill="#f9fdff">Independent telemetry</text><text x="768" y="512" font-size="17" fill="#d8e9f4">AP/controller logs and client events</text><text x="768" y="545" font-size="17" fill="#d8e9f4">RF coverage, channel and packet loss</text><path d="M1240 343V389H385V420" fill="none" stroke="#80d7f7" stroke-width="3" marker-end="url(#arr)"/><path d="M1240 343V389H1052V420" fill="none" stroke="#80d7f7" stroke-width="3" marker-end="url(#arr)"/><rect x="36" y="657" width="1368" height="89" rx="12" fill="#3b3126" stroke="#ecc37d" stroke-width="2"/><text x="55" y="691" font-size="21" font-weight="700" fill="#ffebc2">PMF is not an all-frame or pre-key authentication shield</text><text x="55" y="723" font-size="17" fill="#f3e3c7">Treat burst counts as leads; require negotiated PMF state and corroborating logs.</text><text x="37" y="808" font-size="15" fill="#b8cdde">Conceptual IEEE 802.11 transition states. Not all Wi-Fi disconnects generate a captured management frame.</text></g></svg>
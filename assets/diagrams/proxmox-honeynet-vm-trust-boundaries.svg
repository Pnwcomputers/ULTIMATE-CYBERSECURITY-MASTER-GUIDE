<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="790" viewBox="0 0 1440 790" role="img" aria-labelledby="title desc"><title id="title">Proxmox Honeynet: Trust Zones &amp; Controlled Egress</title><desc id="desc">Management must remain separate from decoy guests, with explicit access restrictions and narrowly permitted telemetry egress. A virtual bridge is not an intrusion-prevention policy.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#8ed9f5"/></marker></defs><rect width="1440" height="790" rx="18" fill="#0c1a2a"/><g font-family="Arial,Helvetica,sans-serif"><text x="38" y="56" font-size="29" font-weight="700" fill="#f7faff">Proxmox Honeynet: Trust Zones &amp; Controlled Egress</text><text x="38" y="91" font-size="18" fill="#bdd3e6">Authorized test connections enter the decoy zone; management and storage remain separately trusted.</text><path d="M38 115H1402" stroke="#38546d" stroke-width="2"/><rect x="38" y="155" width="385" height="156" rx="14" fill="#1a3048" stroke="#8ed9f5" stroke-width="2.4"/><text x="56" y="196" font-size="21" font-weight="700" fill="#f5faff">Approved test / internet</text><text x="56" y="236" font-size="18" fill="#d6e6f2">Ingress allowed by router policy</text><text x="56" y="270" font-size="18" fill="#d6e6f2">No unlimited outbound access</text><rect x="529" y="155" width="385" height="156" rx="14" fill="#1a3048" stroke="#ebc883" stroke-width="2.4"/><text x="547" y="196" font-size="21" font-weight="700" fill="#f5faff">Gateway + routing policy</text><text x="547" y="236" font-size="18" fill="#d6e6f2">Inbound decoy-port allowlist</text><text x="547" y="270" font-size="18" fill="#d6e6f2">Outbound default deny</text><rect x="1018" y="155" width="385" height="156" rx="14" fill="#1a3048" stroke="#f7a6a6" stroke-width="2.4"/><text x="1036" y="196" font-size="21" font-weight="700" fill="#f5faff">Trusted administration</text><text x="1036" y="236" font-size="18" fill="#d6e6f2">PVE host management</text><text x="1036" y="270" font-size="18" fill="#d6e6f2">Backups and operator access</text><path d="M425 233H520" stroke="#8ed9f5" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="260" y="380" width="461" height="166" rx="14" fill="#1a3048" stroke="#70dfb6" stroke-width="2.4"/><text x="278" y="421" font-size="21" font-weight="700" fill="#f5faff">Decoy bridge / VLAN</text><text x="278" y="461" font-size="18" fill="#d6e6f2">OpenCanary VM and Cowrie VM</text><text x="278" y="495" font-size="18" fill="#d6e6f2">Guest network is considered hostile</text><rect x="822" y="380" width="460" height="166" rx="14" fill="#1a3048" stroke="#aaa9ff" stroke-width="2.4"/><text x="840" y="421" font-size="21" font-weight="700" fill="#f5faff">Wazuh manager / analyst</text><text x="840" y="461" font-size="18" fill="#d6e6f2">Only narrow agent transport</text><text x="840" y="495" font-size="18" fill="#d6e6f2">Separate alert validation</text><path d="M720 311V341H490V372" stroke="#8ed9f5" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M721 460H812" stroke="#8ed9f5" stroke-width="3" fill="none" marker-end="url(#a)"/><line x1="925" y1="314" x2="1090" y2="370" stroke="#f7a6a6" stroke-width="3" stroke-dasharray="12 8"/><line x1="1110" y1="335" x2="1142" y2="365" stroke="#f7a6a6" stroke-width="4"/><line x1="1142" y1="335" x2="1110" y2="365" stroke="#f7a6a6" stroke-width="4"/><rect x="38" y="634" width="1364" height="85" rx="13" fill="#3a3227" stroke="#ebc883" stroke-width="2"/><text x="58" y="668" font-size="20" font-weight="700" fill="#fff0c6">Test segmentation from the guest, not from a pretty topology</text><text x="58" y="699" font-size="17" fill="#f4e3c9">Check management reachability, unexpected IPv4/IPv6 egress and permitted telemetry paths.</text><text x="39" y="760" font-size="15" fill="#b6cde0">Conceptual configuration: verify bridge/VLAN/firewall behavior against the installed Proxmox release; no live port check is implied.</text></g></svg>
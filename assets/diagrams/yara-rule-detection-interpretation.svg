<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="yara-interpretation-title yara-interpretation-desc"><title id="yara-interpretation-title">Interpret the result together with scan completion</title><desc id="yara-interpretation-desc">Conceptual YARA-X result classes. A matching rule condition requires contextual review and does not prove malware. A completed no-match is limited to the actual input and rules. Errors, skips, timeouts or missing data are incomplete evidence, not no-match results.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#347e99"/></marker></defs><rect width="1200" height="660" fill="#f4f7fa"/><g font-family="Arial, Helvetica, sans-serif" fill="#16364b"><text x="40" y="54" font-size="32" font-weight="700">Interpret the result together with scan completion</text><text x="40" y="91" font-size="20">Original interpretation model • no scanner output or incident evidence</text><rect x="40" y="145" width="345" height="350" rx="17" fill="#ffffff" stroke="#b3ccdc" stroke-width="2"/><text x="60" y="181" font-size="23">Rule matched</text><text x="60" y="223" font-size="20">Condition was satisfied</text><text x="60" y="254" font-size="20">Review content and context</text><text x="60" y="285" font-size="20">Does not prove compromise</text><rect x="425" y="145" width="345" height="350" rx="17" fill="#fff3d6" stroke="#b3ccdc" stroke-width="2"/><text x="445" y="181" font-size="23">Completed no-match</text><text x="445" y="223" font-size="20">No condition matched this input</text><text x="445" y="254" font-size="20">Limited by rules and settings</text><text x="445" y="285" font-size="20">Does not prove a clean system</text><rect x="810" y="145" width="350" height="350" rx="17" fill="#ffffff" stroke="#b3ccdc" stroke-width="2"/><text x="830" y="181" font-size="23">Incomplete / error</text><text x="830" y="223" font-size="20">Compile / read / scan failure</text><text x="830" y="254" font-size="20">Skipped, timeout or missing data</text><text x="830" y="285" font-size="20">Resolve before interpreting</text><rect x="40" y="545" width="1120" height="86" rx="13" fill="#dfebf1"/><text x="58" y="574" font-size="20">Record artifact hash, engine/rule versions, options and completion before drawing conclusions.</text><text x="58" y="605" font-size="20">Corroborate with independent triage; matching is not execution, attribution or a verdict.</text></g></svg>

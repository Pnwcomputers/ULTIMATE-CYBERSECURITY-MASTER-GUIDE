<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 565" role="img" aria-labelledby="title desc"><title id="title">Reliable security-data pipeline</title><desc id="desc">Design ingestion and transformations for repeatability, observability and safe recovery. Ingest: File / API / events: Schema contract: Source timestamps; Validate: Quality checks: Quarantine errors: Classify secrets; Transform: Idempotent jobs: Version rules: Lineage tracking; Store: Access controls: Backups: Retention policy; Operate: Metrics / alerts: Replay and restore: Test changes. Do not treat successfully transported data as trustworthy; enforce contracts and verify independent recovery.</desc><defs><marker id="arr" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#d6edfb"/></marker></defs><rect width="1240" height="565" rx="20" fill="#0b1223"/><g font-family="Arial,Helvetica,sans-serif"><text x="35" y="58" font-size="31" font-weight="700" fill="#f8fafc">Reliable security-data pipeline</text><text x="35" y="92" font-size="17" fill="#b8cbe0">Design ingestion and transformations for repeatability, observability and safe recovery</text><rect x="35" y="158" width="219.6" height="258" rx="15" fill="#172d41" stroke="#34d399" stroke-opacity=".7" stroke-width="2"/><circle cx="64" cy="191" r="18" fill="#34d399"/><text x="64" y="197" font-size="18" font-weight="700" fill="#051320" text-anchor="middle">1</text><text x="51" y="240" font-size="18" font-weight="700" fill="#f8fafc">Ingest</text><text x="51" y="280" font-size="15" fill="#d1e1f0">File / API / events</text><text x="51" y="312" font-size="15" fill="#d1e1f0">Schema contract</text><text x="51" y="344" font-size="15" fill="#d1e1f0">Source timestamps</text><path d="M255.6 292h13" stroke="#d6edfb" stroke-width="2.5" marker-end="url(#arr)"/><rect x="272.6" y="158" width="219.6" height="258" rx="15" fill="#172d41" stroke="#34d399" stroke-opacity=".7" stroke-width="2"/><circle cx="301.6" cy="191" r="18" fill="#34d399"/><text x="301.6" y="197" font-size="18" font-weight="700" fill="#051320" text-anchor="middle">2</text><text x="288.6" y="240" font-size="18" font-weight="700" fill="#f8fafc">Validate</text><text x="288.6" y="280" font-size="15" fill="#d1e1f0">Quality checks</text><text x="288.6" y="312" font-size="15" fill="#d1e1f0">Quarantine errors</text><text x="288.6" y="344" font-size="15" fill="#d1e1f0">Classify secrets</text><path d="M493.20000000000005 292h13" stroke="#d6edfb" stroke-width="2.5" marker-end="url(#arr)"/><rect x="510.2" y="158" width="219.6" height="258" rx="15" fill="#172d41" stroke="#34d399" stroke-opacity=".7" stroke-width="2"/><circle cx="539.2" cy="191" r="18" fill="#34d399"/><text x="539.2" y="197" font-size="18" font-weight="700" fill="#051320" text-anchor="middle">3</text><text x="526.2" y="240" font-size="18" font-weight="700" fill="#f8fafc">Transform</text><text x="526.2" y="280" font-size="15" fill="#d1e1f0">Idempotent jobs</text><text x="526.2" y="312" font-size="15" fill="#d1e1f0">Version rules</text><text x="526.2" y="344" font-size="15" fill="#d1e1f0">Lineage tracking</text><path d="M730.8 292h13" stroke="#d6edfb" stroke-width="2.5" marker-end="url(#arr)"/><rect x="747.8" y="158" width="219.6" height="258" rx="15" fill="#172d41" stroke="#34d399" stroke-opacity=".7" stroke-width="2"/><circle cx="776.8" cy="191" r="18" fill="#34d399"/><text x="776.8" y="197" font-size="18" font-weight="700" fill="#051320" text-anchor="middle">4</text><text x="763.8" y="240" font-size="18" font-weight="700" fill="#f8fafc">Store</text><text x="763.8" y="280" font-size="15" fill="#d1e1f0">Access controls</text><text x="763.8" y="312" font-size="15" fill="#d1e1f0">Backups</text><text x="763.8" y="344" font-size="15" fill="#d1e1f0">Retention policy</text><path d="M968.4 292h13" stroke="#d6edfb" stroke-width="2.5" marker-end="url(#arr)"/><rect x="985.4" y="158" width="219.6" height="258" rx="15" fill="#172d41" stroke="#34d399" stroke-opacity=".7" stroke-width="2"/><circle cx="1014.4" cy="191" r="18" fill="#34d399"/><text x="1014.4" y="197" font-size="18" font-weight="700" fill="#051320" text-anchor="middle">5</text><text x="1001.4" y="240" font-size="18" font-weight="700" fill="#f8fafc">Operate</text><text x="1001.4" y="280" font-size="15" fill="#d1e1f0">Metrics / alerts</text><text x="1001.4" y="312" font-size="15" fill="#d1e1f0">Replay and restore</text><text x="1001.4" y="344" font-size="15" fill="#d1e1f0">Test changes</text><rect x="35" y="452" width="1170" height="83" rx="12" fill="#20374b" stroke="#34d399"/><text x="55" y="485" fill="#34d399" font-size="20" font-weight="700">Security boundary / validation</text><text x="55" y="510" fill="#e1edf6" font-size="16">Do not treat successfully transported data as trustworthy; enforce contracts and verify independent recovery.</text></g></svg>
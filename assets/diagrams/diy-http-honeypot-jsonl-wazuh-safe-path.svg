<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="790" viewBox="0 0 1440 790" role="img" aria-labelledby="title desc"><title id="title">DIY HTTP Decoy: Minimal Event Path</title><desc id="desc">A deliberately simple Python HTTP decoy returns a non-sensitive response, records bounded request metadata without query string or body and optionally forwards an agent-readable JSONL stream to Wazuh.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#8adbf6"/></marker></defs><rect width="1440" height="790" rx="20" fill="#0d192a"/><g font-family="Arial,Helvetica,sans-serif"><text x="40" y="58" font-size="30" font-weight="700" fill="#fbfdff">DIY HTTP Decoy: Minimal Event Path</text><text x="40" y="92" font-size="18" fill="#c0d4e5">Lab-only network tripwire; not a real login service or production Web application.</text><path d="M40 119H1400" stroke="#354f68" stroke-width="2"/><rect x="38" y="165" width="319" height="190" rx="15" fill="#1a304a" stroke="#91d9f6" stroke-width="2.5"/><rect x="38" y="165" width="8" height="190" rx="4" fill="#91d9f6"/><text x="56" y="207" font-size="21" font-weight="700" fill="#f4fcff">Approved test client</text><text x="56" y="250" font-size="18" fill="#dceaf3">Synthetic GET/POST</text><text x="56" y="286" font-size="18" fill="#dceaf3">Owned test network only</text><text x="56" y="322" font-size="18" fill="#dceaf3">No real credentials</text><rect x="416" y="165" width="366" height="190" rx="15" fill="#1a304a" stroke="#77deb6" stroke-width="2.5"/><rect x="416" y="165" width="8" height="190" rx="4" fill="#77deb6"/><text x="434" y="207" font-size="21" font-weight="700" fill="#f4fcff">Isolated HTTP decoy</text><text x="434" y="250" font-size="18" fill="#dceaf3">Loopback by default :8080</text><text x="434" y="286" font-size="18" fill="#dceaf3">HTTP 404, no app execution</text><text x="434" y="322" font-size="18" fill="#dceaf3">Sanitize / truncate fields</text><rect x="845" y="165" width="553" height="190" rx="15" fill="#1a304a" stroke="#b4acff" stroke-width="2.5"/><rect x="845" y="165" width="8" height="190" rx="4" fill="#b4acff"/><text x="863" y="207" font-size="21" font-weight="700" fill="#f4fcff">Protected local JSONL</text><text x="863" y="250" font-size="18" fill="#dceaf3">UTC, source IP/port and path</text><text x="863" y="286" font-size="18" fill="#dceaf3">Method and bounded user-agent</text><text x="863" y="322" font-size="18" fill="#dceaf3">No body / query / auth header</text><path d="M358 254H407" fill="none" stroke="#8adbf6" stroke-width="3" marker-end="url(#arr)"/><path d="M783 254H835" fill="none" stroke="#8adbf6" stroke-width="3" marker-end="url(#arr)"/><rect x="250" y="448" width="944" height="146" rx="15" fill="#1a304a" stroke="#e9c982" stroke-width="2.5"/><rect x="250" y="448" width="8" height="146" rx="4" fill="#e9c982"/><text x="268" y="490" font-size="21" font-weight="700" fill="#f4fcff">Optional telemetry and investigation</text><text x="268" y="533" font-size="18" fill="#dceaf3">Agent localfile: json → Wazuh manager rule → indexed alert and analyst review</text><text x="268" y="569" font-size="18" fill="#dceaf3">Validate each hop with real benign test data; a synthetic unit test isn't live ingestion</text><path d="M1103 356V404H721V440" fill="none" stroke="#8adbf6" stroke-width="3" marker-end="url(#arr)"/><rect x="40" y="644" width="1360" height="91" rx="13" fill="#393126" stroke="#f1c77b" stroke-width="2"/><text x="62" y="679" font-size="21" font-weight="700" fill="#fff0c8">Decoy isolation and privacy are external controls</text><text x="62" y="711" font-size="17" fill="#f3e0bc">Deny unauthorized outbound traffic; keep this prototype away from production and sensitive networks.</text><text x="41" y="767" font-size="15" fill="#b8d0e2">A network-exposed listener requires independently verified firewall and service constraints; no production load testing performed.</text></g></svg>
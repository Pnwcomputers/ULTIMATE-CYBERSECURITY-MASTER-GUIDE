<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Bash Bunny defensive device-policy validation workflow</title>
<desc id="desc">Plan an authorized lab and record baseline, identify the exact device and firmware, run only approved marker or device-enumeration checks on an isolated host, then compare telemetry to policy and document cleanup. Unexpected keystrokes, routes, hosts, or privileged actions require stopping.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#9fb5d0"/></marker></defs>
<rect width="1200" height="600" rx="24" fill="#101827"/>
<text x="600" y="50" text-anchor="middle" fill="#f3f6fb" font-family="system-ui,sans-serif" font-size="28" font-weight="700">Bash Bunny defensive device-policy review</text>
<text x="600" y="81" text-anchor="middle" fill="#aebed2" font-family="system-ui,sans-serif" font-size="17">Use isolated, authorized hosts; record expected and actual behavior</text>
<g font-family="system-ui,sans-serif">
<g transform="translate(35 145)"><rect width="260" height="230" rx="16" fill="#182538" stroke="#3b536f" stroke-width="2"/><circle cx="30" cy="32" r="19" fill="#2563eb"/><text x="30" y="39" text-anchor="middle" fill="white" font-size="18" font-weight="700">1</text><text x="59" y="39" fill="#eaf1fb" font-size="21" font-weight="700">Plan &amp; baseline</text><text x="22" y="88" fill="#cbd5e1" font-size="16">Written scope, observer,</text><text x="22" y="116" fill="#cbd5e1" font-size="16">synthetic user, offline host,</text><text x="22" y="144" fill="#cbd5e1" font-size="16">USB policy, route and EDR</text><text x="22" y="172" fill="#cbd5e1" font-size="16">baseline, stop conditions.</text><text x="22" y="210" fill="#94a3b8" font-size="14">No test until approved.</text></g>
<path d="M304 260h35" stroke="#9fb5d0" stroke-width="4" marker-end="url(#arrow)"/>
<g transform="translate(350 145)"><rect width="260" height="230" rx="16" fill="#182538" stroke="#3b536f" stroke-width="2"/><circle cx="30" cy="32" r="19" fill="#2563eb"/><text x="30" y="39" text-anchor="middle" fill="white" font-size="18" font-weight="700">2</text><text x="59" y="39" fill="#eaf1fb" font-size="21" font-weight="700">Identify &amp; review</text><text x="22" y="88" fill="#cbd5e1" font-size="16">Record model and firmware.</text><text x="22" y="116" fill="#cbd5e1" font-size="16">Inspect source and payload path;</text><text x="22" y="144" fill="#cbd5e1" font-size="16">confirm switch assignment,</text><text x="22" y="172" fill="#cbd5e1" font-size="16">helper support, and rollback.</text><text x="22" y="210" fill="#94a3b8" font-size="14">Untrusted files stay out.</text></g>
<path d="M619 260h35" stroke="#9fb5d0" stroke-width="4" marker-end="url(#arrow)"/>
<g transform="translate(665 145)"><rect width="260" height="230" rx="16" fill="#182538" stroke="#3b536f" stroke-width="2"/><circle cx="30" cy="32" r="19" fill="#047857"/><text x="30" y="39" text-anchor="middle" fill="white" font-size="18" font-weight="700">3</text><text x="59" y="39" fill="#eaf1fb" font-size="21" font-weight="700">Validate minimally</text><text x="22" y="88" fill="#cbd5e1" font-size="16">Fixed-text HID marker, or</text><text x="22" y="116" fill="#cbd5e1" font-size="16">passive device enumeration for</text><text x="22" y="144" fill="#cbd5e1" font-size="16">storage, network, or serial policy.</text><text x="22" y="172" fill="#cbd5e1" font-size="16">No collection or transfer.</text><text x="22" y="210" fill="#94a3b8" font-size="14">One approved check at a time.</text></g>
<path d="M934 260h35" stroke="#9fb5d0" stroke-width="4" marker-end="url(#arrow)"/>
<g transform="translate(980 145)"><rect width="185" height="230" rx="16" fill="#182538" stroke="#3b536f" stroke-width="2"/><circle cx="30" cy="32" r="19" fill="#047857"/><text x="30" y="39" text-anchor="middle" fill="white" font-size="18" font-weight="700">4</text><text x="59" y="39" fill="#eaf1fb" font-size="20" font-weight="700">Record &amp; restore</text><text x="18" y="88" fill="#cbd5e1" font-size="16">Capture observed</text><text x="18" y="116" fill="#cbd5e1" font-size="16">telemetry, compare</text><text x="18" y="144" fill="#cbd5e1" font-size="16">to policy, remove</text><text x="18" y="172" fill="#cbd5e1" font-size="16">test artifacts, close.</text><text x="18" y="210" fill="#94a3b8" font-size="14">Document limits.</text></g>
</g>
<rect x="35" y="420" width="1130" height="95" rx="15" fill="#351d28" stroke="#f87171" stroke-width="2"/>
<text x="61" y="458" fill="#fecaca" font-family="system-ui,sans-serif" font-size="20" font-weight="700">Stop and escalate</text>
<text x="61" y="488" fill="#f1d4d4" font-family="system-ui,sans-serif" font-size="16">Unexpected focus or keystrokes, privileged action, route/DNS change, or out-of-scope device/host: disconnect, preserve evidence, and follow the approved response plan.</text>
<text x="600" y="560" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="15">Conceptual guide to defensive observations; actual behavior depends on exact hardware and firmware.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 565" role="img" aria-labelledby="title desc"><title id="title">Governance, risk and control evidence</title><desc id="desc">One control can support many frameworks when effectiveness is demonstrated. Identify: Business assets: Threats and duties: Risk owners; Map: NIST / ISO / CIS: Legal obligations: Control objectives; Implement: Access and logging: Encryption: Training / policy; Measure: Test operation: Collect evidence: Resolve gaps; Review: Leadership decision: Risk acceptance: Refresh controls. A control mapping is not proof of compliance, certification or legal adequacy.</desc><defs><marker id="arr" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#d6edfb"/></marker></defs><rect width="1240" height="565" rx="20" fill="#0b1223"/><g font-family="Arial,Helvetica,sans-serif"><text x="35" y="58" font-size="31" font-weight="700" fill="#f8fafc">Governance, risk and control evidence</text><text x="35" y="92" font-size="17" fill="#b8cbe0">One control can support many frameworks when effectiveness is demonstrated</text><rect x="35" y="158" width="219.6" height="258" rx="15" fill="#172d41" stroke="#eab308" stroke-opacity=".7" stroke-width="2"/><circle cx="64" cy="191" r="18" fill="#eab308"/><text x="64" y="197" font-size="18" font-weight="700" fill="#051320" text-anchor="middle">1</text><text x="51" y="240" font-size="18" font-weight="700" fill="#f8fafc">Identify</text><text x="51" y="280" font-size="15" fill="#d1e1f0">Business assets</text><text x="51" y="312" font-size="15" fill="#d1e1f0">Threats and duties</text><text x="51" y="344" font-size="15" fill="#d1e1f0">Risk owners</text><path d="M255.6 292h13" stroke="#d6edfb" stroke-width="2.5" marker-end="url(#arr)"/><rect x="272.6" y="158" width="219.6" height="258" rx="15" fill="#172d41" stroke="#eab308" stroke-opacity=".7" stroke-width="2"/><circle cx="301.6" cy="191" r="18" fill="#eab308"/><text x="301.6" y="19
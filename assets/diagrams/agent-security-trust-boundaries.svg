<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">A model proposal does not confer permission</title><desc id="desc">Untrusted pages and tool output can influence the model. Host policy and downstream service authorization remain separate enforcement boundaries. Read-only tools may also disclose data.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#337b98"/></marker></defs><rect width="1200" height="620" fill="#f4f7fa"/><text x="40" y="54" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#16354b">A model proposal does not confer permission</text><text x="40" y="90" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Conceptual architecture • content labels guide interpretation; code enforces access</text><rect x="40" y="155" width="250" height="190" rx="16" fill="#fff4dc" stroke="#b5cbd7" stroke-width="2"/><text x="60" y="193" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#16354b">External content</text><text x="60" y="235" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Web / email / files</text><text x="60" y="264" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Tool results / memory</text><text x="60" y="293" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Treat as untrusted data</text><rect x="330" y="155" width="240" height="190" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/><text x="350" y="193" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#16354b">Model proposal</text><text x="350" y="235" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Instructions + context</text><text x="350" y="264" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Suggest a tool + args</text><text x="350" y="293" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">No new privileges</text><rect x="610" y="155" width="250" height="190" rx="16" fill="#e8f3ef" stroke="#b5cbd7" stroke-width="2"/><text x="630" y="193" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#16354b">Host enforcement</text><text x="630" y="235" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Validate arguments</text><text x="630" y="264" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Caller / tenant / target</text><text x="630" y="293" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Policy + scoped consent</text><rect x="900" y="155" width="260" height="190" rx="16" fill="#e8f3ef" stroke="#b5cbd7" stroke-width="2"/><text x="920" y="193" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#16354b">Target service</text><text x="920" y="235" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Scoped credentials</text><text x="920" y="264" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Enforce resource ACLs</text><text x="920" y="293" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Return auditable result</text><path d="M298 250 L320 250" stroke="#337b98" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M578 250 L600 250" stroke="#337b98" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M868 250 L890 250" stroke="#337b98" stroke-width="3" marker-end="url(#arrow)" fill="none"/><rect x="40" y="390" width="1120" height="165" rx="16" fill="#e5eef4"/><text x="64" y="430" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#16354b">Review every disclosure path</text><text x="64" y="471" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#16354b">Search queries, URLs, tool arguments and traces can carry sensitive data.</text><text x="64" y="508" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#16354b">A trusted transport or tool name does not authenticate every returned claim.</text><text x="40" y="593" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#16354b">Original conceptual diagram • no live agent, network request or service was exercised</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Troubleshoot the measurement before judging the card</title>
<desc id="desc">Check supported hardware and protocol, compare with a known supported test tag, inspect coupling and configuration, and then record the observed result. No detection and authentication failure are different outcomes and neither alone establishes security.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#337b98"/>
</marker>
</defs>
<rect width="1200" height="600" fill="#f4f7fa"/>
<text x="40" y="54" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#16354b">Troubleshoot the measurement before judging the card</text>
<text x="40" y="89" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Conceptual bench workflow • preserve observations and uncertainty</text>
<rect x="40" y="142" width="340" height="210" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/>
<text x="58" y="176" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#16354b">1 · Compatibility</text>
<text x="58" y="215" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#16354b">Band and antenna</text>
<text x="58" y="245" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#16354b">Air protocol and frontend</text>
<text x="58" y="275" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#16354b">Client / firmware match</text>
<path d="M 392 247 L 418 247" stroke="#337b98" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="430" y="142" width="340" height="210" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/>
<text x="448" y="176" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#16354b">2 · Known test tag</text>
<text x="448" y="215" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#16354b">Confirm the reader works</text>
<text x="448" y="245" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#16354b">Use a supported sample</text>
<text x="448" y="275" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#16354b">Record the baseline</text>
<path d="M 782 247 L 808 247" stroke="#337b98" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="820" y="142" width="340" height="210" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/>
<text x="838" y="176" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#16354b">3 · Coupling</text>
<text x="838" y="215" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#16354b">Change one variable</text>
<text x="838" y="245" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#16354b">Alignment / spacing / metal</text>
<text x="838" y="275" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#16354b">Retain repeatable results</text>
<path d="M 1000 365 L 1000 395" stroke="#337b98" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="40" y="410" width="1120" height="100" rx="16" fill="#fff3d7" stroke="#d3ac53" stroke-width="2"/>
<text x="58" y="444" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#16354b">4 · Record what was actually observed</text>
<text x="58" y="483" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#16354b">No detection  |  Identifier only  |  Partial application read  |  Authentication failed  |  Authorized read</text>
<text x="40" y="556" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#16354b">Report conditions and limits. Frequency, appearance, and failure alone do not establish a security tier.</text>
</svg>
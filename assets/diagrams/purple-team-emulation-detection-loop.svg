<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="570" viewBox="0 0 1440 570" role="img" aria-labelledby="title desc"><title id="title">Purple Team: scope to detection evidence</title><desc id="desc">A conceptual workflow for CTI selection, human approval, canary testing, sensor telemetry, SIEM/EDR correlation, and evidence-driven rule tuning.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#38bdf8"/></marker></defs><rect width="1440" height="570" rx="20" fill="#0b1223"/><g font-family="Arial,Helvetica,sans-serif"><text x="35" y="56" font-size="31" font-weight="700" fill="#f8fafc">Purple Team: scope to detection evidence</text><text x="35" y="89" font-size="17" fill="#b8cbe0">No generated payload is authorized or executed merely because an AI proposed it.</text><rect x="35" y="150" width="195" height="225" rx="15" fill="#172d41" stroke="#38bdf8" stroke-width="2"/><text x="52" y="191" font-size="18" font-weight="700" fill="#f8fafc">1. Select behavior</text><text x="52" y="233" font-size="16" fill="#d1e1f0">Source and ATT&amp;CK ID</text><text x="52" y="263" font-size="16" fill="#d1e1f0">Version and hypothesis</text><text x="52" y="293" font-size="16" fill="#d1e1f0">Known safety risks</text><path d="M232 260L266 260" stroke="#38bdf8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="270" y="150" width="195" height="225" rx="15" fill="#172d41" stroke="#38bdf8" stroke-width="2"/><text x="287" y="191" font-size="18" font-weight="700" fill="#f8fafc">2. Approve method</text><text x="287" y="233" font-size="16" fill="#d1e1f0">Written scope / ROE</text><text x="287" y="263" font-size="16" fill="#d1e1f0">Human script review</text><text x="287" y="293" font-size="16" fill="#d1e1f0">Stop and rollback</text><path d="M467 260L501 260" stroke="#38bdf8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="505" y="150" width="195" height="225" rx="15" fill="#172d41" stroke="#38bdf8" stroke-width="2"/><text x="522" y="191" font-size="18" font-weight="700" fill="#f8fafc">3. Run canary</text><text x="522" y="233" font-size="16" fill="#d1e1f0">Disposable lab host</text><text x="522" y="263" font-size="16" fill="#d1e1f0">Benign control paired</text><text x="522" y="293" font-size="16" fill="#d1e1f0">Timestamp and isolate</text><path d="M702 260L736 260" stroke="#38bdf8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="740" y="150" width="195" height="225" rx="15" fill="#172d41" stroke="#38bdf8" stroke-width="2"/><text x="757" y="191" font-size="18" font-weight="700" fill="#f8fafc">4. Collect events</text><text x="757" y="233" font-size="16" fill="#d1e1f0">Real sensor visibility</text><text x="757" y="263" font-size="16" fill="#d1e1f0">Raw log provenance</text><text x="757" y="293" font-size="16" fill="#d1e1f0">Fields and time sync</text><path d="M937 260L971 260" stroke="#38bdf8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="975" y="150" width="195" height="225" rx="15" fill="#172d41" stroke="#38bdf8" stroke-width="2"/><text x="992" y="191" font-size="18" font-weight="700" fill="#f8fafc">5. Check detection</text><text x="992" y="233" font-size="16" fill="#d1e1f0">Backend-native rule</text><text x="992" y="263" font-size="16" fill="#d1e1f0">Alert delivery path</text><text x="992" y="293" font-size="16" fill="#d1e1f0">Correlate the evidence</text><path d="M1172 260L1206 260" stroke="#38bdf8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="1210" y="150" width="195" height="225" rx="15" fill="#172d41" stroke="#38bdf8" stroke-width="2"/><text x="1227" y="191" font-size="18" font-weight="700" fill="#f8fafc">6. Decide outcome</text><text x="1227" y="233" font-size="16" fill="#d1e1f0">Positive + negative</text><text x="1227" y="263" font-size="16" fill="#d1e1f0">Miss vs no telemetry</text><text x="1227" y="293" font-size="16" fill="#d1e1f0">Reviewer sign-off</text><rect x="35" y="415" width="1370" height="119" rx="13" fill="#26364c" stroke="#e8b44b" stroke-width="2"/><text x="55" y="453" font-size="21" font-weight="700" fill="#fbd38d">Tuning loop (reviewed change, never automatic deployment)</text><text x="55" y="485" font-size="17" fill="#e3edf6">Draft Sigma / native logic → review backend field mapping → test benign negatives → rerun approved canary → version results.</text><text x="55" y="512" font-size="15" fill="#b8cbe0">Illustrative only. Synthetic fixtures, imported telemetry and real SIEM/EDR observations have different evidence levels.</text></g></svg>
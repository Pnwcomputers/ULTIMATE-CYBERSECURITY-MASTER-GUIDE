<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="570" viewBox="0 0 1240 570" role="img" aria-labelledby="title desc">
  <title id="title">OSINT operational security decision path</title>
  <desc id="desc">Start with authorized scope and threat model, select a permitted network path, select an approved account or no-login method, obey platform limits and stop if blocked. VPN and Tor are tools, not authorization or anonymity guarantees.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#294862"/></marker><style>
    .title{font:700 28px system-ui,sans-serif;fill:#102a43}.label{font:700 18px system-ui,sans-serif;fill:#102a43}.body{font:16px system-ui,sans-serif;fill:#243b53}.small{font:14px system-ui,sans-serif;fill:#334e68}.box{rx:15;stroke-width:2}.line{stroke:#294862;stroke-width:4;fill:none;marker-end:url(#arrow)}
  </style></defs>
  <rect width="1240" height="570" rx="24" fill="#f5f8fb"/>
  <text x="48" y="53" class="title">Choose OPSEC controls from the case—not by default</text>
  <rect x="45" y="125" width="255" height="150" class="box" fill="#e6f0fa" stroke="#7aa7d3"/>
  <text x="172" y="169" text-anchor="middle" class="label">1. Define authority</text><text x="172" y="205" text-anchor="middle" class="body">Scope, purpose, allowed</text><text x="172" y="233" text-anchor="middle" class="small">sources and methods</text>
  <rect x="350" y="125" width="255" height="150" class="box" fill="#fff3cd" stroke="#d6a638"/>
  <text x="477" y="169" text-anchor="middle" class="label">2. Choose egress</text><text x="477" y="205" text-anchor="middle" class="body">Approved direct path,</text><text x="477" y="233" text-anchor="middle" class="small">VPN or Tor Browser</text>
  <rect x="655" y="125" width="255" height="150" class="box" fill="#e9e5f7" stroke="#9286c2"/>
  <text x="782" y="169" text-anchor="middle" class="label">3. Choose identity</text><text x="782" y="205" text-anchor="middle" class="body">No login or permitted</text><text x="782" y="233" text-anchor="middle" class="small">approved account only</text>
  <rect x="960" y="125" width="240" height="150" class="box" fill="#e7f5ec" stroke="#62a878"/>
  <text x="1080" y="169" text-anchor="middle" class="label">4. Respect limits</text><text x="1080" y="205" text-anchor="middle" class="body">Follow rate limits</text><text x="1080" y="233" text-anchor="middle" class="small">and access controls</text>
  <path d="M300 200 H343" class="line"/><path d="M605 200 H648" class="line"/><path d="M910 200 H953" class="line"/>
  <rect x="205" y="350" width="360" height="118" class="box" fill="#e7f5ec" stroke="#62a878"/>
  <text x="385" y="393" text-anchor="middle" class="label">Proceed within scope</text><text x="385" y="428" text-anchor="middle" class="body">Minimize data and record collection context</text>
  <rect x="675" y="350" width="360" height="118" class="box" fill="#fde8e7" stroke="#d66b63"/>
  <text x="855" y="393" text-anchor="middle" class="label">Stop or clarify</text><text x="855" y="428" text-anchor="middle" class="body">Do not evade a block, challenge or limit</text>
  <path d="M1080 275 V315 H855 V343" class="line"/>
  <path d="M1080 315 H385 V343" class="line"/>
  <text x="620" y="526" text-anchor="middle" class="small">A VPN shifts trust to its provider. Tor only covers configured apps; neither makes out-of-scope activity acceptable.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 560" role="img" aria-labelledby="title desc"><title id="title">Safe security-script execution</title><desc id="desc">An approval and rollback gate for scripts used in client and laboratory work Inspect: Review source: Dependencies: Privilege demands. Authorize: Written scope: Target list: Change window. Prepare: Backup state: Test in lab: Verify checksums. Execute: Least privilege: Log actions: Stop on anomaly. Recover: Validate changes: Rollback if needed: Document result. Never run an unreviewed script against client systems or out-of-scope assets.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#d7e6f4"/></marker></defs><rect width="1240" height="560" rx="20" fill="#0b1223"/><g font-family="Arial,Helvetica,sans-serif"><text x="35" y="56" font-size="31" font-weight="700" fill="#ffffff">Safe security-script execution</text><text x="35" y="89" font-size="17" fill="#b8cbe0">An approval and rollback gate for scripts used in client and laboratory work</text><rect x="35" y="157" width="221.2" height="254" rx="14" fill="#172a40" stroke="#fbbf24" stroke-width="2"/><circle cx="63" cy="190" r="18" fill="#fbbf24"/><text x="63" y="196" font-size="17" fill="#071321" font-weight="700" text-anchor="middle">1</text><text x="50" y="242" font-size="19" font-weight="700" fill="white">Inspect</text><text x="50" y="282" font-size="17" fill="#d7e6f4">Review source</text><text x="50" y="313" font-size="17" fill="#d7e6f4">Dependencies</text><text x="50" y="344" font-size="17" fill="#d7e6f4">Privilege demands</text><path d="M257.2 292h12" stroke="#d7e6f4" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="272.2" y="157" width="221.2" height="254" rx="14" fill="#172a40" stroke="#fbbf24" stroke-width="2"/><circle cx="300.2" cy="190" r="18" fill="#fbbf24"/><text x="300.2" y="196" font-size="17" fill="#071321" font-weight="700" text-anchor="middle">2</text><text x="287.2" y="242" font-size="19" font-weight="700" fill="white">Authorize</text><text x="287.2" y="282" font-size="17" fill="#d7e6f4">Written scope</text><text x="287.2" y="313" font-size="17" fill="#d7e6f4">Target list</text><text x="287.2" y="344" font-size="17" fill="#d7e6f4">Change window</text><path d="M494.4 292h12" stroke="#d7e6f4" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="509.4" y="157" width="221.2" height="254" rx="14" fill="#172a40" stroke="#fbbf24" stroke-width="2"/><circle cx="537.4" cy="190" r="18" fill="#fbbf24"/><text x="537.4" y="196" font-size="17" fill="#071321" font-weight="700" text-anchor="middle">3</text><text x="524.4" y="242" font-size="19" font-weight="700" fill="white">Prepare</text><text x="524.4" y="282" font-size="17" fill="#d7e6f4">Backup state</text><text x="524.4" y="313" font-size="17" fill="#d7e6f4">Test in lab</text><text x="524.4" y="344" font-size="17" fill="#d7e6f4">Verify checksums</text><path d="M731.5999999999999 292h12" stroke="#d7e6f4" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="746.5999999999999" y="157" width="221.2" height="254" rx="14" fill="#172a40" stroke="#fbbf24" stroke-width="2"/><circle cx="774.5999999999999" cy="190" r="18" fill="#fbbf24"/><text x="774.5999999999999" y="196" font-size="17" fill="#071321" font-weight="700" text-anchor="middle">4</text><text x="761.5999999999999" y="242" font-size="19" font-weight="700" fill="white">Execute</text><text x="761.5999999999999" y="282" font-size="17" fill="#d7e6f4">Least privilege</text><text x="761.5999999999999" y="313" font-size="17" fill="#d7e6f4">Log actions</text><text x="761.5999999999999" y="344" font-size="17" fill="#d7e6f4">Stop on anomaly</text><path d="M968.8 292h12" stroke="#d7e6f4" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="983.8" y="157" width="221.2" height="254" rx="14" fill="#172a40" stroke="#fbbf24" stroke-width="2"/><circle cx="1011.8" cy="190" r="18" fill="#fbbf24"/><text x="1011.8" y="196" font-size="17" fill="#071321" font-weight="700" text-anchor="middle">5</text><text x="998.8" y="242" font-size="19" font-weight="700" fill="white">Recover</text><text x="998.8" y="282" font-size="17" fill="#d7e6f4">Validate changes</text><text x="998.8" y="313" font-size="17" fill="#d7e6f4">Rollback if needed</text><text x="998.8" y="344" font-size="17" fill="#d7e6f4">Document result</text><rect x="35" y="450" width="1170" height="77" rx="12" fill="#20374b" stroke="#fbbf24"/><text x="55" y="480" font-size="19" fill="#fbbf24" font-weight="700">Validation</text><text x="55" y="506" font-size="16" fill="#e1edf6">Never run an unreviewed script against client systems or out-of-scope assets.</text></g></svg>
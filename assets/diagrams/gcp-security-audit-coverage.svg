<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Audit logging: generation, routing, and access differ</title>
<desc id="desc">Admin Activity logs are always written. Data Access logging is generally opt-in except for BigQuery. Routing and retention must be verified, and private log access requires appropriate permissions. Collection configuration is not proof that detection works.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
<path d="M0 0 L10 5 L0 10Z" fill="#337b98"/>
</marker>
</defs>
<rect width="1200" height="600" fill="#f4f7fa"/>
<text x="40" y="54" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#16354b">Audit logging: generation, routing, and access differ</text>
<text x="40" y="89" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Conceptual validation chain • no logs or cloud resources were accessed</text>
<rect x="40" y="160" width="250" height="216" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/>
<text x="58" y="194" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#16354b">Generation</text>
<text x="58" y="233" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#16354b">Admin Activity: always</text>
<text x="58" y="263" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#16354b">Data Access: verify</text>
<path d="M298 267 L319 267" stroke="#337b98" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="330" y="160" width="250" height="216" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/>
<text x="348" y="194" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#16354b">Routing / storage</text>
<text x="348" y="233" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#16354b">Sinks and filters</text>
<text x="348" y="263" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#16354b">Retention / destinations</text>
<path d="M588 267 L609 267" stroke="#337b98" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="620" y="160" width="250" height="216" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/>
<text x="638" y="194" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#16354b">Investigator access</text>
<text x="638" y="233" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#16354b">Required log permissions</text>
<text x="638" y="263" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#16354b">Scope and privacy</text>
<path d="M878 267 L899 267" stroke="#337b98" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="910" y="160" width="250" height="216" rx="16" fill="#fff3d7" stroke="#b5cbd7" stroke-width="2"/>
<text x="928" y="194" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#16354b">Validation</text>
<text x="928" y="233" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#16354b">Known benign events</text>
<text x="928" y="263" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#16354b">Delivery and coverage</text>
<rect x="40" y="480" width="1120" height="86" rx="12" fill="#e0ebf1"/>
<text x="58" y="510" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Data Access logs are not universally enabled; service coverage and configuration need inspection.</text>
<text x="58" y="539" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">A missing event can reflect generation, routing, retention, permissions, or ingestion problems.</text>
</svg>

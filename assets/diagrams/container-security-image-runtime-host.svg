<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
<title id="title">An image and a running container are different review targets</title>
<desc id="desc">An image supplies filesystem layers and configuration. A runtime adds mounts, identity, privileges and network settings to start processes. Ordinary Linux containers use a shared host kernel; a VM-backed environment adds another host layer.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
<path d="M0 0L10 5L0 10Z" fill="#337b98"/>
</marker>
</defs>
<rect width="1200" height="580" fill="#f4f7fa"/>
<text x="40" y="54" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#16354b">An image and a running container are different review targets</text>
<text x="40" y="89" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Conceptual Linux workload model • not a tested deployment or a VM boundary</text>
<rect x="40" y="155" width="250" height="215" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/>
<text x="58" y="189" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16354b">Image artifact</text>
<text x="58" y="228" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Layers and configuration</text>
<text x="58" y="257" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Digest / provenance</text>
<path d="M298 260L319 260" stroke="#337b98" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
<rect x="330" y="155" width="250" height="215" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/>
<text x="348" y="189" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16354b">Runtime settings</text>
<text x="348" y="228" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">User, mounts and devices</text>
<text x="348" y="257" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Capabilities / network</text>
<path d="M588 260L609 260" stroke="#337b98" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
<rect x="620" y="155" width="250" height="215" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/>
<text x="638" y="189" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16354b">Container processes</text>
<text x="638" y="228" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Application behavior</text>
<text x="638" y="257" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Writable state</text>
<path d="M878 260L899 260" stroke="#337b98" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
<rect x="910" y="155" width="250" height="215" rx="16" fill="#fff3d7" stroke="#b5cbd7" stroke-width="2"/>
<text x="928" y="189" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16354b">Kernel / host</text>
<text x="928" y="228" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Shared kernel services</text>
<text x="928" y="257" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Daemon and host trust</text>
<rect x="40" y="465" width="1120" height="85" rx="12" fill="#e0ebf1"/>
<text x="58" y="495" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">A clean scan or valid image signature does not validate the runtime configuration.</text>
<text x="58" y="524" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">OCI format compatibility does not certify that an artifact or deployment is secure.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" role="img" aria-labelledby="title desc"><title id="title">RAG: Two Pipelines, One Trust Boundary</title><desc id="desc">Ingestion and query time are separate permissioned flows. Retrieved documents are untrusted data, and a citation is a provenance pointer rather than proof that the response is correct.</desc><defs><marker id="next" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#86d6f5"/></marker></defs><rect width="1440" height="780" rx="19" fill="#0d1929"/><g font-family="Arial,Helvetica,sans-serif"><text x="37" y="58" font-size="29" font-weight="700" fill="#f8fbff">RAG: Two Pipelines, One Trust Boundary</text><text x="37" y="92" font-size="17.5" fill="#c0d5e6">Separate indexing from authenticated query-time access, citation verification and tool policy.</text><path d="M37 115H1403" stroke="#38506a" stroke-width="2"/><rect x="38" y="159" width="402" height="163" rx="14" fill="#1b3049" stroke="#88d3f3" stroke-width="2.3"/><rect x="38" y="159" width="7" height="163" rx="3" fill="#88d3f3"/><text x="55" y="198" font-size="20" font-weight="700" fill="#fafcff">Ingest approved sources</text><text x="55" y="239" font-size="17.5" fill="#dbe8f3">Provenance, classification</text><text x="55" y="272" font-size="17.5" fill="#dbe8f3">Parse / redact / version</text><rect x="518" y="159" width="403" height="163" rx="14" fill="#1b3049" stroke="#b6adfb" stroke-width="2.3"/><rect x="518" y="159" width="7" height="163" rx="3" fill="#b6adfb"/><text x="535" y="198" font-size="20" font-weight="700" fill="#fafcff">Build access-aware index</text><text x="535" y="239" font-size="17.5" fill="#dbe8f3">Chunks + keywords/vectors</text><text x="535" y="272" font-size="17.5" fill="#dbe8f3">Track document ACL &amp; deletion</text><rect x="999" y="159" width="403" height="163" rx="14" fill="#1b3049" stroke="#70dbb7" stroke-width="2.3"/><rect x="999" y="159" width="7" height="163" rx="3" fill="#70dbb7"/><text x="1016" y="198" font-size="20" font-weight="700" fill="#fafcff">Control query identity</text><text x="1016" y="239" font-size="17.5" fill="#dbe8f3">Authenticate caller</text><text x="1016" y="272" font-size="17.5" fill="#dbe8f3">Filter retrieval by permissions</text><path d="M441 239H508" stroke="#8bd8f6" stroke-width="3" fill="none" marker-end="url(#next)"/><path d="M922 239H989" stroke="#8bd8f6" stroke-width="3" fill="none" marker-end="url(#next)"/><rect x="280" y="402" width="404" height="175" rx="14" fill="#1b3049" stroke="#70dbb7" stroke-width="2.3"/><rect x="280" y="402" width="7" height="175" rx="3" fill="#70dbb7"/><text x="297" y="441" font-size="20" font-weight="700" fill="#fafcff">Retrieve + evidence pack</text><text x="297" y="482" font-size="17.5" fill="#dbe8f3">Search / rerank permitted text</text><text x="297" y="515" font-size="17.5" fill="#dbe8f3">Quote exact source and version</text><text x="297" y="548" font-size="17.5" fill="#dbe8f3">Log missing evidence</text><rect x="748" y="402" width="406" height="175" rx="14" fill="#1b3049" stroke="#f1cc85" stroke-width="2.3"/><rect x="748" y="402" width="7" height="175" rx="3" fill="#f1cc85"/><text x="765" y="441" font-size="20" font-weight="700" fill="#fafcff">Generate + independently check</text><text x="765" y="482" font-size="17.5" fill="#dbe8f3">Treat all excerpts as data</text><text x="765" y="515" font-size="17.5" fill="#dbe8f3">Validate claims and citations</text><text x="765" y="548" font-size="17.5" fill="#dbe8f3">Human approve side effects</text><path d="M1200 322V361H481V393" stroke="#8bd8f6" stroke-width="3" fill="none" marker-end="url(#next)"/><path d="M684 490H739" stroke="#8bd8f6" stroke-width="3" fill="none" marker-end="url(#next)"/><rect x="38" y="637" width="1364" height="83" rx="12" fill="#393227" stroke="#f1cf86" stroke-width="2"/><text x="58" y="669" font-size="20" font-weight="700" fill="#fff1c5">Prompt-injection and leakage warning</text><text x="58" y="700" font-size="17" fill="#f1e1c7">A retrieved instruction cannot grant tool privileges; search filters and model citations are not enforcement.</text></g></svg>
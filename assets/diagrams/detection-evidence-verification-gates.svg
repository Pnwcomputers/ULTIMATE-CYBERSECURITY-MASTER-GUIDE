<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="640" viewBox="0 0 1320 640" role="img" aria-labelledby="title desc"><title id="title">Detection evidence: what each test actually proves</title><desc id="desc">Three evidence classes, with additional live-lab verification gates. A fixture-only pass does not establish current SIEM, EDR, or hardware coverage.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#38bdf8"/></marker></defs><rect width="1320" height="640" rx="20" fill="#0b1223"/><g font-family="Arial,Helvetica,sans-serif"><text x="35" y="56" font-size="31" font-weight="700" fill="#f8fafc">Detection evidence: what each test actually proves</text><text x="35" y="89" font-size="17" fill="#b8cbe0">An alert requires independent source, ingestion, timing, rule and benign-control checks.</text><rect x="35" y="145" width="397" height="214" rx="15" fill="#172d41" stroke="#38bdf8" stroke-width="2"/><text x="52" y="186" font-size="23" font-weight="700" fill="#f8fafc">Fixture-only</text><text x="52" y="228" font-size="17" fill="#d1e1f0">Invented test IDs and events</text><text x="52" y="258" font-size="17" fill="#d1e1f0">Checks local validator logic</text><text x="52" y="288" font-size="17" fill="#d1e1f0">No real sensor or SIEM proven</text><text x="52" y="318" font-size="17" fill="#d1e1f0">Outcome: simulated only</text><rect x="465" y="145" width="397" height="214" rx="15" fill="#172d41" stroke="#e8b44b" stroke-width="2"/><text x="482" y="186" font-size="23" font-weight="700" fill="#f8fafc">Imported, unverified</text><text x="482" y="228" font-size="17" fill="#d1e1f0">Externally supplied event export</text><text x="482" y="258" font-size="17" fill="#d1e1f0">Provenance not yet checked</text><text x="482" y="288" font-size="17" fill="#d1e1f0">Can inspect declared records</text><text x="482" y="318" font-size="17" fill="#d1e1f0">Outcome: provisional only</text><rect x="895" y="145" width="397" height="214" rx="15" fill="#172d41" stroke="#58c69e" stroke-width="2"/><text x="912" y="186" font-size="23" font-weight="700" fill="#f8fafc">Verified live lab*</text><text x="912" y="228" font-size="17" fill="#d1e1f0">Authorized isolated system</text><text x="912" y="258" font-size="17" fill="#d1e1f0">Native rule and alert evidence</text><text x="912" y="288" font-size="17" fill="#d1e1f0">Benign-negative control</text><text x="912" y="318" font-size="17" fill="#d1e1f0">Independent evidence review</text><rect x="35" y="401" width="1250" height="179" rx="15" fill="#213248" stroke="#38bdf8" stroke-width="2"/><text x="58" y="441" font-size="22" font-weight="700" fill="#f8fafc">Live-lab verification gates (all required for a specific coverage claim)</text><rect x="58" y="464" width="224" height="54" rx="10" fill="#172d41" stroke="#7999ae"/><text x="170" y="497" font-size="15" text-anchor="middle" fill="#e3edf6">Sensor sees event</text><rect x="300" y="464" width="224" height="54" rx="10" fill="#172d41" stroke="#7999ae"/><text x="412" y="497" font-size="15" text-anchor="middle" fill="#e3edf6">Ingestion + fields</text><rect x="542" y="464" width="224" height="54" rx="10" fill="#172d41" stroke="#7999ae"/><text x="654" y="497" font-size="15" text-anchor="middle" fill="#e3edf6">Native rule matches</text><rect x="784" y="464" width="224" height="54" rx="10" fill="#172d41" stroke="#7999ae"/><text x="896" y="497" font-size="15" text-anchor="middle" fill="#e3edf6">Alert delivered</text><rect x="1026" y="464" width="224" height="54" rx="10" fill="#172d41" stroke="#7999ae"/><text x="1138" y="497" font-size="15" text-anchor="middle" fill="#e3edf6">Negative control</text><text x="58" y="551" font-size="15" fill="#b8cbe0">*Also retain versions, clock checks, source authenticity, hashes, rollback and human reviewer; report scope-specific results.</text><text x="35" y="613" font-size="15" fill="#b8cbe0">Missing visibility = unassessable, not a passing security control. The diagram reports no completed PNWC live tests.</text></g></svg>
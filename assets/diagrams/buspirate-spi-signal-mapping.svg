<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" role="img" aria-labelledby="title desc"><title id="title">Bus Pirate SPI signal mapping and optional target power</title><desc id="desc">Conceptual SPI mapping between a Bus Pirate and a flash chip: MOSI to DI, MISO from DO, CLK to CLK, chip select to CS, and common signal ground. VOUT is shown as a separate optional connection that requires checking voltage and current compatibility first; no board-level power connection is implied.</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#365672"/></marker></defs><rect width="980" height="500" rx="24" fill="#f5f8fc"/><text x="490" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#142b45">SPI Signal Mapping (Conceptual)</text><g font-family="Arial,sans-serif"><rect x="55" y="95" width="300" height="235" rx="18" fill="#e7eff9" stroke="#365672" stroke-width="3"/><text x="205" y="133" text-anchor="middle" font-size="23" font-weight="700" fill="#142b45">Bus Pirate</text><text x="85" y="178" font-size="18" fill="#20364e">MOSI / controller data out</text><text x="85" y="218" font-size="18" fill="#20364e">MISO / controller data in</text><text x="85" y="258" font-size="18" fill="#20364e">CLK · CS · GND</text><rect x="625" y="95" width="300" height="235" rx="18" fill="#e5f4f1" stroke="#287769" stroke-width="3"/><text x="775" y="133" text-anchor="middle" font-size="23" font-weight="700" fill="#143b36">SPI flash device</text><text x="660" y="178" font-size="18" fill="#143b36">DI / MOSI</text><text x="660" y="218" font-size="18" fill="#143b36">DO / MISO</text><text x="660" y="258" font-size="18" fill="#143b36">CLK · CS · GND</text><path d="M365 173 H605" stroke="#365672" stroke-width="4" marker-end="url(#arr)"/><text x="485" y="162" text-anchor="middle" font-size="14" fill="#365672">MOSI → DI</text><path d="M615 213 H375" stroke="#287769" stroke-width="4" marker-end="url(#arr)"/><text x="495" y="204" text-anchor="middle" font-size="14" fill="#287769">DO → MISO</text><path d="M365 253 H605" stroke="#365672" stroke-width="4" marker-end="url(#arr)"/><text x="485" y="245" text-anchor="middle" font-size="14" fill="#365672">CLK and CS to matching pins</text><path d="M365 292 H605" stroke="#365672" stroke-width="3" stroke-dasharray="8 6"/><text x="485" y="286" text-anchor="middle" font-size="14" fill="#365672">shared signal reference</text><rect x="55" y="370" width="870" height="82" rx="14" fill="#fff4e6" stroke="#c17b25" stroke-width="2"/><text x="490" y="402" text-anchor="middle" font-size="18" font-weight="700" fill="#5b3510">VOUT / target power is optional and separate from signal wiring.</text><text x="490" y="430" text-anchor="middle" font-size="16" fill="#5b3510">Use it only after confirming target voltage, current, ground, and no competing supply; check the exact model and adapter pinout.</text></g></svg>
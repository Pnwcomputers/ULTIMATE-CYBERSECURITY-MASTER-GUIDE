<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Sampling span and useful passband are different</title>
<desc id="desc">A nominal sample span can be wider than the useful analog passband. Capture rate, baseband filter and target occupied bandwidth must be chosen together. Software filtering must precede decimation.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
<path d="M0 0 L10 5 L0 10Z" fill="#337b98"/>
</marker>
</defs>
<rect width="1200" height="600" fill="#f4f7fa"/>
<text x="40" y="54" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#16354b">Sampling span and useful passband are different</text>
<text x="40" y="89" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Illustrative frequency layout • not a calibrated filter response</text>
<rect x="85" y="170" width="1030" height="220" rx="16" fill="#e0ebf1"/>
<text x="110" y="207" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16354b">Nominal sampled span</text>
<rect x="280" y="230" width="640" height="125" rx="12" fill="#c1d9e4"/>
<text x="303" y="265" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16354b">Selected useful filtered region</text>
<rect x="460" y="290" width="280" height="45" rx="8" fill="#fff3d7"/>
<text x="480" y="320" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#16354b">Target occupied signal</text>
<text x="80" y="439" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Lower frequency</text>
<text x="490" y="439" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Center frequency</text>
<text x="960" y="439" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Higher frequency</text>
<rect x="40" y="480" width="1120" height="86" rx="12" fill="#e0ebf1"/>
<text x="58" y="510" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">A wider sample rate does not guarantee a flat passband across every recorded frequency.</text>
<text x="58" y="539" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">For lower-rate analysis: capture appropriately → low-pass filter → decimate → preserve new metadata.</text>
</svg>

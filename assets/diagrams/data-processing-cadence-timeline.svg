<circle cx="580" cy="133" r="5" fill="#18478c" stroke="none" stroke-width="1.5"/>
<circle cx="672" cy="133" r="5" fill="#18478c" stroke="none" stroke-width="1.5"/>
<circle cx="724" cy="133" r="5" fill="#18478c" stroke="none" stroke-width="1.5"/>
<circle cx="788" cy="133" r="5" fill="#18478c" stroke="none" stroke-width="1.5"/>
<rect x="32" y="169" width="896" height="69" rx="12" fill="#ffffff" stroke="#c5d5e9"/>
<text x="51" y="196" fill="#14263e" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start">Batch</text>
<text x="51" y="220" fill="#40536d" font-family="Arial, sans-serif" font-size="16" font-weight="500" text-anchor="start">One larger run</text>
<path d="M273 217 L888 217" fill="none" stroke="#a5b8cc" stroke-width="2"/>
<rect x="280" y="185" width="532" height="22" rx="4" fill="#e1ebfc" stroke="#abc3eb"/>

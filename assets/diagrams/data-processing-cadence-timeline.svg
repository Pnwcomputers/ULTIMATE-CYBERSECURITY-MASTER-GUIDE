<svg xmlns="http://www.w3.org/2000/svg" width="960" height="502" viewBox="0 0 960 502" role="img" aria-labelledby="title desc">
<title id="title">Batch, micro-batch and record-at-a-time processing</title>
<desc id="desc">The same eight arrivals are handled as one large batch, three smaller batches or individually in a conceptual timeline. Processing schedule alone does not determine when results become visible.</desc>
<rect x="1" y="1" width="958" height="500" rx="12" fill="#f5f8fd" stroke="#c5d5e9"/>
<text x="32" y="48" fill="#14263e" font-family="Arial, sans-serif" font-size="31" font-weight="700" text-anchor="start">Batch, micro-batch and record-at-a-time processing</text>
<text x="32" y="80" fill="#40536d" font-family="Arial, sans-serif" font-size="19" font-weight="500" text-anchor="start">The same arrivals feed three processing schedules</text>
<text x="32" y="140" fill="#14263e" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start">Event arrivals</text>
<path d="M273 133 L903 133" fill="none" stroke="#40536d" stroke-width="2"/>
<text x="910" y="111" fill="#40536d" font-family="Arial, sans-serif" font-size="16" font-weight="500" text-anchor="end">Time</text>

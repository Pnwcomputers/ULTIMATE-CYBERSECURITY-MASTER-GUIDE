<text x="32" y="449" fill="#40536d" font-family="Arial, sans-serif" font-size="17" font-weight="500" text-anchor="start">Each dot on a lower row marks completion of the illustrated processing step.</text>
<text x="32" y="474" fill="#40536d" font-family="Arial, sans-serif" font-size="17" font-weight="500" text-anchor="start">Measure end-to-end freshness separately. Backlogs, windows and sink writes can add delay.</text>

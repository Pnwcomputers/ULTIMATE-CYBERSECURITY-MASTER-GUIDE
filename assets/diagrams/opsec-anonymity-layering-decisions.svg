<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 860" role="img" aria-labelledby="title desc">
<title id="title">Choose a network path for the task and understand its limits</title>
<desc id="desc">A conceptual decision map begins with task intent and routes ordinary authorized research to compartmentalized browsing, Tor Browser for compatible web browsing, a documented proxy only when permitted, or a client-approved VPS for active testing. A lower panel shows that each route changes which parties can observe connection metadata while identity disclosure, application routing mistakes, and provider or host risks remain.</desc>
<defs>
<style>.bg{fill:#f5f8fc}.panel{fill:#fff;stroke:#b8c7d8;stroke-width:2}.navy{fill:#12324b}.blue{fill:#e6f1fa;stroke:#5c91bc;stroke-width:2}.green{fill:#e8f5ed;stroke:#5e9f73;stroke-width:2}.amber{fill:#fff3dc;stroke:#c9963c;stroke-width:2}.txt{font:600 18px system-ui,Segoe UI,Arial,sans-serif;fill:#153047}.small{font:15px system-ui,Segoe UI,Arial,sans-serif;fill:#294459}.head{font:700 23px system-ui,Segoe UI,Arial,sans-serif;fill:#fff}.title{font:700 29px system-ui,Segoe UI,Arial,sans-serif;fill:#12324b}.arrow{stroke:#456a85;stroke-width:3;fill:none;marker-end:url(#arr)}</style>
<marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="#456a85"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="1320" height="860" rx="20"/>
<text class="title" x="48" y="54">Choose a route by task, then check who can observe it</text>
<rect class="navy" x="48" y="78" width="1224" height="54" rx="12"/><text class="head" x="76" y="113">1  Define the task, authorization, identity, and expected data exposure</text>
<rect class="panel" x="48" y="160" width="270" height="126" rx="14"/><text class="txt" x="72" y="194">Read-only research?</text><text class="small" x="72" y="222">Check access terms and whether</text><text class="small" x="72" y="246">source access is permitted.</text>
<rect class="panel" x="525" y="160" width="270" height="126" rx="14"/><text class="txt" x="549" y="194">Active testing?</text><text class="small" x="549" y="222">Written scope, test window,</text><text class="small" x="549" y="246">and approved source address.</text>
<rect class="panel" x="1002" y="160" width="270" height="126" rx="14"/><text class="txt" x="1026" y="194">Hostile or sensitive web?</text><text class="small" x="1026" y="222">Use a browser and environment</text><text class="small" x="1026" y="246">suited to that threat model.</text>
<path class="arrow" d="M183 286V320H230"/><path class="arrow" d="M660 286V320"/><path class="arrow" d="M1137 286V320H1090"/>
<rect class="green" x="48" y="330" width="360" height="145" rx="14"/><text class="txt" x="72" y="366">Profiles / VM + VPN if useful</text><text class="small" x="72" y="396">Profiles reduce cookie/history crossover.</text><text class="small" x="72" y="423">VPN changes observer visibility; neither</text><text class="small" x="72" y="449">hides a login or guarantees anonymity.</text>
<rect class="blue" x="480" y="330" width="360" height="145" rx="14"/><text class="txt" x="504" y="366">Client-approved VPS egress</text><text class="small" x="504" y="396">Makes the VPS address the declared</text><text class="small" x="504" y="423">test source. The host, provider, logs,</text><text class="small" x="504" y="449">and scope still matter.</text>
<rect class="amber" x="912" y="330" width="360" height="145" rx="14"/><text class="txt" x="936" y="366">Tor Browser or documented proxy</text><text class="small" x="936" y="396">Tor Browser routes its own browsing.</text><text class="small" x="936" y="423">Other apps may use another route;</text><text class="small" x="936" y="449">VPN + Tor is not an automatic upgrade.</text>
<rect class="navy" x="48" y="512" width="1224" height="52" rx="12"/><text class="head" x="76" y="547">2  Compare observers on the selected path</text>
<rect class="panel" x="48" y="584" width="292" height="180" rx="14"/><text class="txt" x="72" y="620">VPN path</text><text class="small" x="72" y="650">Network sees encrypted VPN traffic.</text><text class="small" x="72" y="678">Provider sees source and destination data;</text><text class="small" x="72" y="706">HTTPS helps protect content to sites.</text><text class="small" x="72" y="736">Accounts can still identify you.</text>
<rect class="panel" x="366" y="584" width="292" height="180" rx="14"/><text class="txt" x="390" y="620">Tor Browser</text><text class="small" x="390" y="650">Entry sees source network address;</text><text class="small" x="390" y="678">destination sees a Tor exit.</text><text class="small" x="390" y="706">HTTPS helps protect web content.</text><text class="small" x="390" y="736">Logins can identify you.</text>
<rect class="panel" x="684" y="584" width="292" height="180" rx="14"/><text class="txt" x="708" y="620">Approved VPS</text><text class="small" x="708" y="650">Target sees VPS egress; client can</text><text class="small" x="708" y="678">correlate activity with the test.</text><text class="small" x="708" y="706">VPS provider, host config, and logs</text><text class="small" x="708" y="736">remain part of the trust boundary.</text>
<rect class="panel" x="1002" y="584" width="270" height="180" rx="14"/><text class="txt" x="1026" y="620">Proxy path</text><text class="small" x="1026" y="650">Proxy operator can observe connection</text><text class="small" x="1026" y="678">and destination metadata; HTTPS helps</text><text class="small" x="1026" y="706">Confirm provenance, terms, protocol,</text><text class="small" x="1026" y="736">and app routing.</text>
<text class="small" x="48" y="812">No path guarantees anonymity. Verify application behavior and scope; do not infer privacy from the exit IP alone.</text>
</svg>
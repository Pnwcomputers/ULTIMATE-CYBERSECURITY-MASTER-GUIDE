<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">VPN trust boundaries and traffic visibility</title>
  <desc id="desc">A device sends encrypted tunnel traffic through a local network to a VPN provider and then to a destination. The ISP sees the VPN connection metadata, the VPN provider sees the subscriber address and destinations at the exit, and the destination sees the VPN exit address. HTTPS protects application content between the device and destination.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#315b7d"/></marker>
    <style>
      .bg{fill:#f4f7fb}.box{fill:#fff;stroke:#234b6b;stroke-width:3;rx:18}.t{font:700 24px system-ui,sans-serif;fill:#17324d}.s{font:18px system-ui,sans-serif;fill:#203449}.m{font:16px system-ui,sans-serif;fill:#38536a}.wire{stroke:#315b7d;stroke-width:4;fill:none;marker-end:url(#arrow)}.tunnel{stroke:#287c76;stroke-width:9;stroke-dasharray:14 10;fill:none;stroke-linecap:round}.tag{font:700 17px system-ui,sans-serif;fill:#17655f}.note{fill:#e6eff7;stroke:#91a9bd;stroke-width:2;rx:14}
    </style>
  </defs>
  <rect class="bg" width="1200" height="540" rx="24"/>
  <text x="600" y="48" text-anchor="middle" class="t" font-size="30">Who sees what changes at each hop</text>
  <rect class="box" x="42" y="118" width="210" height="148"/>
  <text class="t" x="147" y="158" text-anchor="middle">Your device</text>
  <text class="s" x="147" y="194" text-anchor="middle">App + browser</text>
  <text class="m" x="147" y="226" text-anchor="middle">Source address</text>
  <rect class="box" x="330" y="118" width="210" height="148"/>
  <text class="t" x="435" y="158" text-anchor="middle">Local network</text>
  <text class="s" x="435" y="194" text-anchor="middle">Wi-Fi / ISP</text>
  <text class="m" x="435" y="226" text-anchor="middle">VPN endpoint, timing</text>
  <rect class="box" x="650" y="118" width="230" height="148"/>
  <text class="t" x="765" y="158" text-anchor="middle">VPN provider</text>
  <text class="s" x="765" y="194" text-anchor="middle">Tunnel exit</text>
  <text class="m" x="765" y="226" text-anchor="middle">Source + destinations</text>
  <rect class="box" x="960" y="118" width="200" height="148"/>
  <text class="t" x="1060" y="158" text-anchor="middle">Destination</text>
  <text class="s" x="1060" y="194" text-anchor="middle">Website / service</text>
  <text class="m" x="1060" y="226" text-anchor="middle">VPN exit address</text>
  <path class="wire" d="M252 192H320"/><path class="wire" d="M540 192H640"/><path class="wire" d="M880 192H950"/>
  <path class="tunnel" d="M263 282C400 333 540 333 648 282"/>
  <text class="tag" x="455" y="326" text-anchor="middle">Encrypted VPN tunnel</text>
  <path d="M147 278V362H1060V278" stroke="#946b1b" stroke-width="3" stroke-dasharray="8 8" fill="none"/>
  <text x="604" y="386" class="tag" text-anchor="middle" style="fill:#79580f">HTTPS can protect application content end to end</text>
  <rect class="note" x="90" y="418" width="1020" height="82"/>
  <text class="s" x="600" y="451" text-anchor="middle">A VPN shifts trust from the local network to the VPN operator.</text>
  <text class="s" x="600" y="481" text-anchor="middle">It does not hide activity from the destination or make an identity anonymous.</text>
</svg>

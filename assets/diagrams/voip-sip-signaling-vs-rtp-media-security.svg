<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 805" width="1440" height="805" role="img" aria-labelledby="title desc"><title id="title">VoIP Security: SIP Signaling vs RTP Media</title><desc id="desc">A VoIP endpoint registers and establishes a call through SIP infrastructure, while media packets follow an independently configured RTP or SRTP path. Voice-VLAN isolation and privacy require separate tests.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#88d8f8"/></marker></defs><rect width="1440" height="805" rx="20" fill="#0b192b"/><g font-family="Arial,Helvetica,sans-serif"><text x="39" y="58" font-size="29" font-weight="700" fill="#f7fcff">VoIP Security: SIP Signaling vs RTP Media</text><text x="39" y="91" font-size="18" fill="#c2d7e7">SIP TLS does not make unencrypted RTP secure; routing may differ per PBX/SBC configuration.</text><path d="M39 119H1401" stroke="#344d67" stroke-width="2"/><rect x="37" y="165" width="330" height="176" rx="15" fill="#1a3049" stroke="#86d9f8" stroke-width="2.5"/><text x="56" y="205" font-size="21" font-weight="700" fill="#f9fdff">Endpoint / phone</text><text x="56" y="246" font-size="17" fill="#dce8f2">SIP UA and media endpoint</text><text x="56" y="280" font-size="17" fill="#dce8f2">Configuration and credentials</text><rect x="554" y="165" width="330" height="176" rx="15" fill="#1a3049" stroke="#b2a9fd" stroke-width="2.5"/><text x="573" y="205" font-size="21" font-weight="700" fill="#f9fdff">PBX / SIP proxy</text><text x="573" y="246" font-size="17" fill="#dce8f2">Registration &amp; call signaling</text><text x="573" y="280" font-size="17" fill="#dce8f2">Policy, toll fraud &amp; routing</text><rect x="1070" y="165" width="333" height="176" rx="15" fill="#1a3049" stroke="#75dfba" stroke-width="2.5"/><text x="1089" y="205" font-size="21" font-weight="700" fill="#f9fdff">SIP trunk / peer</text><text x="1089" y="246" font-size="17" fill="#dce8f2">Provider SBC or authorized peer</text><text x="1089" y="280" font-size="17" fill="#dce8f2">Authentication and call policies</text><path d="M368 249H545" fill="none" stroke="#88d8f8" stroke-width="3" marker-end="url(#arrow)"/><path d="M885 249H1061" fill="none" stroke="#88d8f8" stroke-width="3" marker-end="url(#arrow)"/><text x="394" y="213" font-size="16" fill="#d8e9f3">SIP / TLS if configured</text><text x="908" y="213" font-size="16" fill="#d8e9f3">SIP / TLS if configured</text><path d="M206 341V453H1234V341" fill="none" stroke="#e8c579" stroke-width="5" stroke-dasharray="13 10"/><text x="559" y="444" font-size="21" font-weight="700" fill="#ffdd9c">Media: RTP or SRTP</text><text x="558" y="479" font-size="17" fill="#ead4a7">May traverse media relay / SBC or use a negotiated direct path</text><rect x="179" y="514" width="1058" height="112" rx="15" fill="#1a3049" stroke="#75dfba" stroke-width="2.5"/><text x="198" y="554" font-size="21" font-weight="700" fill="#f9fdff">Independent review of call and media security</text><text x="198" y="595" font-size="17" fill="#dce8f2">Voice/data VLAN policy, PBX ACL, dial plan, TLS configuration, SRTP negotiation and log access</text><text x="198" y="629" font-size="17" fill="#dce8f2">Use synthetic calls only; do not intercept conversations without explicit consent</text><rect x="40" y="676" width="1360" height="85" rx="12" fill="#3c3327" stroke="#eac580" stroke-width="2"/><text x="60" y="709" font-size="21" font-weight="700" fill="#ffedc1">Protect both paths</text><text x="60" y="740" font-size="17" fill="#f4e3c7">Caller ID, encrypted signaling, media encryption and access-control tests answer different questions.</text><text x="40" y="782" font-size="15" fill="#b7ccdf">Conceptual SIP/RTP topology based on vendor protocol guidance; actual media anchoring and network layout vary.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Radio compliance preflight</title>
<desc id="desc">Before transmitting, identify the jurisdiction and regional plan, confirm the radio and antenna configuration, verify technical limits and interference obligations, then transmit only within authorized scope. Passive reception has separate privacy considerations.</desc>
<defs><style>.bg{fill:#f4f7fb}.card{fill:#fff;stroke:#24476b;stroke-width:3}.head{fill:#102a43}.title{font:700 34px system-ui,sans-serif;fill:#fff}.label{font:700 23px system-ui,sans-serif;fill:#102a43}.body{font:19px system-ui,sans-serif;fill:#243b53}.small{font:17px system-ui,sans-serif;fill:#334e68}.line{stroke:#486581;stroke-width:4;fill:none;marker-end:url(#arrow)}.blue{fill:#d9ecff}.green{fill:#d9f2e6}.amber{fill:#fff1cc}</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#486581"/></marker></defs>
<rect class="bg" width="1200" height="620" rx="24"/><rect class="head" width="1200" height="92" rx="24"/><path class="head" d="M0 68h1200v24H0z"/><text class="title" x="48" y="58">RF transmission preflight</text>
<rect class="card blue" x="45" y="145" width="245" height="150" rx="18"/><text class="label" x="68" y="184">1 · Location</text><text class="body" x="68" y="220"><tspan x="68">Identify jurisdiction</tspan><tspan x="68" dy="28">and regional frequency</tspan><tspan x="68" dy="28">plan.</tspan></text>
<rect class="card blue" x="350" y="145" width="245" height="150" rx="18"/><text class="label" x="373" y="184">2 · Device</text><text class="body" x="373" y="220"><tspan x="373">Check radio approval,</tspan><tspan x="373" dy="28">firmware, antenna,</tspan><tspan x="373" dy="28">channel and power.</tspan></text>
<rect class="card amber" x="655" y="145" width="245" height="150" rx="18"/><text class="label" x="678" y="184">3 · Limits</text><text class="body" x="678" y="220"><tspan x="678">Verify output, duty-cycle</tspan><tspan x="678" dy="28">and interference rules</tspan><tspan x="678" dy="28">that apply.</tspan></text>
<rect class="card green" x="960" y="145" width="195" height="150" rx="18"/><text class="label" x="980" y="184">4 · Scope</text><text class="body" x="980" y="220"><tspan x="980">Confirm lawful</tspan><tspan x="980" dy="28">purpose and test</tspan><tspan x="980" dy="28">authorization.</tspan></text>
<path class="line" d="M290 220h45"/><path class="line" d="M595 220h45"/><path class="line" d="M900 220h45"/>
<rect class="card" x="145" y="365" width="420" height="145" rx="18"/><text class="label" x="170" y="405">If any check is unknown</text><text class="body" x="170" y="443"><tspan x="170">Do not transmit yet. Check current regulator</tspan><tspan x="170" dy="28">and manufacturer guidance for this setup.</tspan></text>
<rect class="card" x="635" y="365" width="420" height="145" rx="18"/><text class="label" x="660" y="405">Passive reception is different</text><text class="body" x="660" y="443"><tspan x="660">Receiving does not transmit, but monitoring,</tspan><tspan x="660" dy="28">recording or sharing may raise privacy issues.</tspan></text>
<text class="small" x="48" y="565">Conceptual checklist only. Rules vary by jurisdiction, band, radio, antenna and actual operating configuration.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
<title id="title">Image reference, content and trust are different checks</title>
<desc id="desc">A tag is a potentially mutable reference. A digest identifies content, while author identity, signatures, provenance, vulnerabilities and runtime needs require additional validation. Local image IDs and repository digests are not interchangeable identifiers.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
<path d="M0 0 L10 5 L0 10Z" fill="#337b98"/>
</marker>
</defs>
<rect width="1200" height="570" fill="#f4f7fa"/>
<text x="40" y="54" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#16354b">Image reference, content and trust are different checks</text>
<text x="40" y="89" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Conceptual image-review workflow • no registry queried or artifact verified</text>
<rect x="40" y="162" width="300" height="232" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/>
<text x="58" y="196" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16354b">Reference</text>
<text x="58" y="234" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Repository / tag / digest</text>
<text x="58" y="264" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Target platform</text>
<text x="58" y="294" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Source and change record</text>
<rect x="450" y="162" width="300" height="232" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/>
<text x="468" y="196" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16354b">Content identity</text>
<text x="468" y="234" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Manifest / platform content</text>
<text x="468" y="264" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Local image ID differs</text>
<text x="468" y="294" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Compare like identifiers</text>
<rect x="860" y="162" width="300" height="232" rx="16" fill="#fff3d7" stroke="#b5cbd7" stroke-width="2"/>
<text x="878" y="196" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16354b">Trust and suitability</text>
<text x="878" y="234" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Signer / provenance policy</text>
<text x="878" y="264" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Vulnerability assessment</text>
<text x="878" y="294" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Runtime requirements</text>
<path d="M352 278 L438 278" stroke="#337b98" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
<path d="M762 278 L848 278" stroke="#337b98" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
<rect x="40" y="451" width="1120" height="86" rx="12" fill="#e0ebf1"/>
<text x="58" y="481" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Pinning a digest improves repeatability; it does not certify authorship, harmlessness or safe runtime settings.</text>
<text x="58" y="510" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">A healthy process, a signature and a passing scan answer different questions.</text>
</svg>
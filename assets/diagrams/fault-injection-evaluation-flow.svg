<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Fault-injection evaluation evidence flow</title><desc id="desc">A conceptual four-stage flow: define authorized scope and expected security property; record a disturbance category and setup; observe the target response; classify and preserve evidence. A disturbance alone does not prove a security failure.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#345477"/></marker></defs><rect width="1200" height="520" rx="24" fill="#f5f8fc"/><text x="600" y="54" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#142b45">Fault-Injection Evaluation: From Scope to Evidence</text><g font-family="Arial,sans-serif"><rect x="42" y="115" width="245" height="230" rx="16" fill="#e7eff9" stroke="#345477" stroke-width="3"/><circle cx="78" cy="151" r="22" fill="#23476c"/><text x="78" y="159" text-anchor="middle" font-size="22" font-weight="700" fill="white">1</text><text x="164" y="155" text-anchor="middle" font-size="21" font-weight="700" fill="#142b45">Define scope</text><text x="68" y="203" font-size="17" fill="#20364e"><tspan x="68" dy="0">Authorized target</tspan><tspan x="68" dy="30">Expected property</tspan><tspan x="68" dy="30">Limits and stop rules</tspan><tspan x="68" dy="30">Baseline behavior</tspan></text><rect x="342" y="115" width="245" height="230" rx="16" fill="#fff3d6" stroke="#9b7015" stroke-width="3"/><circle cx="378" cy="151" r="22" fill="#8b6211"/><text x="378" y="159" text-anchor="middle" font-size="22" font-weight="700" fill="white">2</text><text x="464" y="155" text-anchor="middle" font-size="21" font-weight="700" fill="#3f310c">Record stimulus</text><text x="368" y="203" font-size="17" fill="#3f310c"><tspan x="368" dy="0">Clock or supply change</tspan><tspan x="368" dy="30">EM or optical method</tspan><tspan x="368" dy="30">Instrument configuration</tspan><tspan x="368" dy="30">Timing reference</tspan></text><rect x="642" y="115" width="245" height="230" rx="16" fill="#e5f4f1" stroke="#287769" stroke-width="3"/><circle cx="678" cy="151" r="22" fill="#21695f"/><text x="678" y="159" text-anchor="middle" font-size="22" font-weight="700" fill="white">3</text><text x="764" y="155" text-anchor="middle" font-size="21" font-weight="700" fill="#143b36">Observe response</text><text x="668" y="203" font-size="17" fill="#143b36"><tspan x="668" dy="0">Expected output</tspan><tspan x="668" dy="30">Reset or detection</tspan><tspan x="668" dy="30">Unexpected behavior</tspan><tspan x="668" dy="30">Recovery and logs</tspan></text><rect x="942" y="115" width="216" height="230" rx="16" fill="#eee9f8" stroke="#67508d" stroke-width="3"/><circle cx="978" cy="151" r="22" fill="#5d4682"/><text x="978" y="159" text-anchor="middle" font-size="22" font-weight="700" fill="white">4</text><text x="1062" y="155" text-anchor="middle" font-size="21" font-weight="700" fill="#30234a">Assess evidence</text><text x="966" y="203" font-size="17" fill="#30234a"><tspan x="966" dy="0">Repeat trials</tspan><tspan x="966" dy="30">Verify property</tspan><tspan x="966" dy="30">Preserve records</tspan><tspan x="966" dy="30">Report findings</tspan></text><path d="M294 230 H332" stroke="#345477" stroke-width="4" marker-end="url(#arrow)"/><path d="M594 230 H632" stroke="#345477" stroke-width="4" marker-end="url(#arrow)"/><path d="M894 230 H932" stroke="#345477" stroke-width="4" marker-end="url(#arrow)"/><rect x="134" y="398" width="932" height="72" rx="14" fill="#fff" stroke="#a4b2c2" stroke-width="2"/><text x="600" y="429" text-anchor="middle" font-size="19" font-weight="700" fill="#142b45">A disturbance, crash, or unusual output alone does not prove a security property failed.</text><text x="600" y="454" text-anchor="middle" font-size="16" fill="#354b63">Independently verify the outcome against the authorized test objective and record its repeatability.</text></g></svg>
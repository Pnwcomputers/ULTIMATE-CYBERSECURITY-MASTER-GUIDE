<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc"><title id="title">Hardware Bench: Evidence Before Stress &amp; Writes</title><desc id="desc">A safer diagnostic sequence separates non-invasive inventory, thermal baseline, bounded compute tests and explicitly authorized storage writes. A passing burn-in is a sample, not proof of lifetime stability.</desc><rect x="0" y="0" width="1440" height="800" rx="18" fill="#0d1a2c"/><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#83d9f7"/></marker></defs><g font-family="Arial,Helvetica,sans-serif"><text x="38" y="55" font-size="29" font-weight="700" fill="#f7faff">Hardware Bench: Evidence Before Stress &amp; Writes</text><text x="38" y="90" font-size="18" fill="#bdd4e5">Identify target disks and preserve client data before any write-heavy or destructive benchmark.</text><path d="M38 116H1402" stroke="#36516a" stroke-width="2"/><rect x="38" y="157" width="314" height="225" rx="13" fill="#1b3047" stroke="#80d9f7" stroke-width="2.3"/><text x="57" y="198" font-size="21" font-weight="700" fill="#f9fcff">01  Inventory</text><text x="57" y="239" font-size="17" fill="#dae9f3">Serial/model, BIOS/microcode</text><text x="57" y="273" font-size="17" fill="#dae9f3">SMART &amp; previous errors</text><path d="M353 273H379" fill="none" stroke="#83d9f7" stroke-width="3" marker-end="url(#arr)"/><rect x="388" y="157" width="314" height="225" rx="13" fill="#1b3047" stroke="#b2abff" stroke-width="2.3"/><text x="407" y="198" font-size="21" font-weight="700" fill="#f9fcff">02  Monitor</text><text x="407" y="239" font-size="17" fill="#dae9f3">Idle temps / fan / power</text><text x="407" y="273" font-size="17" fill="#dae9f3">Check sensor calibration</text><path d="M703 273H729" fill="none" stroke="#83d9f7" stroke-width="3" marker-end="url(#arr)"/><rect x="738" y="157" width="314" height="225" rx="13" fill="#1b3047" stroke="#73dbb9" stroke-width="2.3"/><text x="757" y="198" font-size="21" font-weight="700" fill="#f9fcff">03  Bounded load</text><text x="757" y="239" font-size="17" fill="#dae9f3">CPU / RAM / GPU stepwise</text><text x="757" y="273" font-size="17" fill="#dae9f3">Stop at thermal/error signs</text><path d="M1053 273H1079" fill="none" stroke="#83d9f7" stroke-width="3" marker-end="url(#arr)"/><rect x="1088" y="157" width="314" height="225" rx="13" fill="#1b3047" stroke="#edc985" stroke-width="2.3"/><text x="1107" y="198" font-size="21" font-weight="700" fill="#f9fcff">04  Storage review</text><text x="1107" y="239" font-size="17" fill="#dae9f3">Select exact target safely</text><text x="1107" y="273" font-size="17" fill="#dae9f3">Avoid unapproved fio writes</text><rect x="210" y="449" width="1019" height="147" rx="13" fill="#1b3047" stroke="#73dbb9" stroke-width="2.3"/><text x="229" y="490" font-size="21" font-weight="700" fill="#f9fcff">Review and document</text><text x="229" y="531" font-size="17" fill="#dae9f3">Collect timed readings, journal/MCE/AER errors, test conditions and before/after SMART details</text><text x="229" y="565" font-size="17" fill="#dae9f3">Report pass, failure, inconclusive and retest needs independently</text><rect x="40" y="649" width="1360" height="91" rx="12" fill="#3c3228" stroke="#edc985" stroke-width="2"/><text x="62" y="683" font-size="21" font-weight="700" fill="#ffedc2">Storage write tests can overwrite or destroy customer data</text><text x="62" y="716" font-size="17" fill="#f3e2ca">Use non-destructive reads where sufficient; back up and obtain separate approval before fio/badblocks write modes.</text><text x="40" y="780" font-size="15" fill="#b8cede">Conceptual test-bench flow; device-specific electrical and thermal limits govern safe stress duration.</text></g></svg>
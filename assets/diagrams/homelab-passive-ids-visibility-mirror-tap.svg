<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="770" viewBox="0 0 1440 770" role="img" aria-labelledby="title desc"><title id="title">Passive IDS: Where Does the Sensor Get Packets?</title><desc id="desc">A sensor plugged into an ordinary switched Ethernet port does not normally receive unrelated unicast flows; a correctly configured mirror source or inline network TAP provides defined observation paths.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#7DE0F8"/></marker></defs><rect width="1440" height="770" rx="22" fill="#0B1829"/><g font-family="Arial,Helvetica,sans-serif"><text x="38" y="54" font-size="31" font-weight="700" fill="#F8FBFF">Passive IDS: Where Does the Sensor Get Packets?</text><text x="38" y="87" font-size="18" fill="#BED2E2">Traffic visibility is a network topology fact, not a Snort or EDR configuration checkbox.</text><path d="M38 111H1402" stroke="#36516A" stroke-width="2"/><rect x="35" y="143" width="665" height="489" rx="16" fill="#19263A" stroke="#F1AEAA" stroke-width="2.5"/><rect x="740" y="143" width="665" height="489" rx="16" fill="#19263A" stroke="#70DDB5" stroke-width="2.5"/><text x="55" y="181" font-size="23" font-weight="700" fill="#FFD0CC">No configured mirror (unmanaged switch)</text><text x="760" y="181" font-size="23" font-weight="700" fill="#C4F6DA">Managed SPAN (or a separate inline TAP)</text><rect x="89" y="212" width="263" height="108" rx="13" fill="#172C45" stroke="#7DDCF5" stroke-width="2.5"/><text x="107" y="253" font-weight="700" font-size="20" fill="#F7FAFF">Host A</text><text x="107" y="296" font-size="17" fill="#D6E6F2">Traffic to Host B</text><rect x="401" y="212" width="263" height="108" rx="13" fill="#172C45" stroke="#7DDCF5" stroke-width="2.5"/><text x="419" y="253" font-weight="700" font-size="20" fill="#F7FAFF">Host B</text><text x="419" y="296" font-size="17" fill="#D6E6F2">Receives Host A traffic</text><rect x="795" y="212" width="263" height="108" rx="13" fill="#172C45" stroke="#7DDCF5" stroke-width="2.5"/><text x="813" y="253" font-weight="700" font-size="20" fill="#F7FAFF">Source device</text><text x="813" y="296" font-size="17" fill="#D6E6F2">Sends approved test flow</text><rect x="1094" y="212" width="263" height="108" rx="13" fill="#172C45" stroke="#7DDCF5" stroke-width="2.5"/><text x="1112" y="253" font-weight="700" font-size="20" fill="#F7FAFF">Destination</text><text x="1112" y="296" font-size="17" fill="#D6E6F2">Receives the flow</text><rect x="188" y="366" width="367" height="105" rx="13" fill="#172C45" stroke="#F1AEAA" stroke-width="2.5"/><text x="206" y="407" font-weight="700" font-size="20" fill="#F7FAFF">Ordinary switch</text><text x="206" y="450" font-size="17" fill="#D6E6F2">Forwards traffic by destination</text><rect x="892" y="366" width="367" height="105" rx="13" fill="#172C45" stroke="#70DDB5" stroke-width="2.5"/><text x="910" y="407" font-weight="700" font-size="20" fill="#F7FAFF">Managed switch with SPAN</text><text x="910" y="450" font-size="17" fill="#D6E6F2">Mirror selected traffic to sensor</text><rect x="188" y="516" width="367" height="91" rx="13" fill="#172C45" stroke="#F1AEAA" stroke-width="2.5"/><text x="206" y="557" font-weight="700" font-size="20" fill="#F7FAFF">Passive sensor</text><text x="206" y="600" font-size="17" fill="#D6E6F2">Its own port; limited vantage</text><rect x="892" y="516" width="367" height="91" rx="13" fill="#172C45" stroke="#70DDB5" stroke-width="2.5"/><text x="910" y="557" font-weight="700" font-size="20" fill="#F7FAFF">Passive sensor</text><text x="910" y="600" font-size="17" fill="#D6E6F2">Selected packet feed present</text><path d="M220 320V355" fill="none" stroke="#7DE0F8" stroke-width="3" marker-end="url(#arr)"/><path d="M529 320V355" fill="none" stroke="#7DE0F8" stroke-width="3" marker-end="url(#arr)"/><path d="M370 471V508" fill="none" stroke="#7DE0F8" stroke-width="3" marker-end="url(#arr)"/><path d="M925 320V355" fill="none" stroke="#7DE0F8" stroke-width="3" marker-end="url(#arr)"/><path d="M1220 320V355" fill="none" stroke="#7DE0F8" stroke-width="3" marker-end="url(#arr)"/><path d="M1075 471V508" fill="none" stroke="#7DE0F8" stroke-width="3" marker-end="url(#arr)"/><text x="61" y="647" font-size="16" fill="#DDB9B4">Unrelated host unicast is not automatically copied to the IDS port.</text><text x="759" y="647" font-size="16" fill="#B7EDCB">Confirm source, direction, drops.</text><rect x="35" y="675" width="1370" height="57" rx="11" fill="#393127" stroke="#F1CF83" stroke-width="2"/><text x="53" y="710" font-size="18" fill="#FFE7AD">A firewall only sees traffic on its path; an inline TAP needs its own physical placement.</text></g></svg>
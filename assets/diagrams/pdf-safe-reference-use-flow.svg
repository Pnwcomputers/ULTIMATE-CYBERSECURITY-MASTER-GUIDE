<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
<title id="title">Safe use of archived PDF security references</title>
<desc id="desc">A reader records the source and date, verifies the exact file and any supplied digest, opens it in a suitable isolated viewer, treats embedded commands as untrusted, checks claims against current primary documentation, and cites findings with dates and limitations. If provenance or integrity is unclear, quarantine the file and do not run embedded material.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#9fb5d0"/></marker></defs>
<rect width="1200" height="570" rx="24" fill="#101827"/>
<text x="600" y="48" text-anchor="middle" fill="#f3f6fb" font-family="system-ui,sans-serif" font-size="28" font-weight="700">Treat offline PDFs as historical, untrusted references</text>
<g font-family="system-ui,sans-serif">
<g transform="translate(38 112)"><rect width="205" height="180" rx="16" fill="#182538" stroke="#3b536f" stroke-width="2"/><circle cx="28" cy="28" r="18" fill="#2563eb"/><text x="28" y="35" text-anchor="middle" fill="white" font-size="17" font-weight="700">1</text><text x="56" y="35" fill="#eaf1fb" font-size="19" font-weight="700">Record provenance</text><text x="18" y="78" fill="#cbd5e1" font-size="15">Publisher, title, version,</text><text x="18" y="103" fill="#cbd5e1" font-size="15">date, download path.</text><text x="18" y="145" fill="#94a3b8" font-size="14">Unknown source?</text><text x="18" y="166" fill="#fca5a5" font-size="14">Do not rely on it.</text></g>
<path d="M248 202h20" stroke="#9fb5d0" stroke-width="4" marker-end="url(#arrow)"/>
<g transform="translate(276 112)"><rect width="205" height="180" rx="16" fill="#182538" stroke="#3b536f" stroke-width="2"/><circle cx="28" cy="28" r="18" fill="#2563eb"/><text x="28" y="35" text-anchor="middle" fill="white" font-size="17" font-weight="700">2</text><text x="56" y="35" fill="#eaf1fb" font-size="19" font-weight="700">Check integrity</text><text x="18" y="78" fill="#cbd5e1" font-size="15">Compare exact file and</text><text x="18" y="103" fill="#cbd5e1" font-size="15">publisher-provided digest.</text><text x="18" y="145" fill="#94a3b8" font-size="14">A hash proves equality</text><text x="18" y="166" fill="#94a3b8" font-size="14">to a reference only.</text></g>
<path d="M486 202h20" stroke="#9fb5d0" stroke-width="4" marker-end="url(#arrow)"/>
<g transform="translate(514 112)"><rect width="205" height="180" rx="16" fill="#182538" stroke="#3b536f" stroke-width="2"/><circle cx="28" cy="28" r="18" fill="#2563eb"/><text x="28" y="35" text-anchor="middle" fill="white" font-size="17" font-weight="700">3</text><text x="56" y="35" fill="#eaf1fb" font-size="19" font-weight="700">Inspect safely</text><text x="18" y="78" fill="#cbd5e1" font-size="15">Use a patched, suitable</text><text x="18" y="103" fill="#cbd5e1" font-size="15">viewer; limit active content.</text><text x="18" y="145" fill="#94a3b8" font-size="14">Embedded commands</text><text x="18" y="166" fill="#fca5a5" font-size="14">are not instructions to run.</text></g>
<path d="M724 202h20" stroke="#9fb5d0" stroke-width="4" marker-end="url(#arrow)"/>
<g transform="translate(752 112)"><rect width="205" height="180" rx="16" fill="#182538" stroke="#3b536f" stroke-width="2"/><circle cx="28" cy="28" r="18" fill="#047857"/><text x="28" y="35" text-anchor="middle" fill="white" font-size="17" font-weight="700">4</text><text x="56" y="35" fill="#eaf1fb" font-size="19" font-weight="700">Cross-check claims</text><text x="18" y="78" fill="#cbd5e1" font-size="15">Verify important commands,</text><text x="18" y="103" fill="#cbd5e1" font-size="15">versions and legal guidance</text><text x="18" y="128" fill="#cbd5e1" font-size="15">against current primary sources.</text><text x="18" y="166" fill="#94a3b8" font-size="14">No test on production.</text></g>
<path d="M962 202h20" stroke="#9fb5d0" stroke-width="4" marker-end="url(#arrow)"/>
<g transform="translate(990 112)"><rect width="172" height="180" rx="16" fill="#182538" stroke="#3b536f" stroke-width="2"/><circle cx="28" cy="28" r="18" fill="#047857"/><text x="28" y="35" text-anchor="middle" fill="white" font-size="17" font-weight="700">5</text><text x="56" y="35" fill="#eaf1fb" font-size="19" font-weight="700">Cite carefully</text><text x="16" y="78" fill="#cbd5e1" font-size="15">State date, source,</text><text x="16" y="103" fill="#cbd5e1" font-size="15">limitations and any</text><text x="16" y="128" fill="#cbd5e1" font-size="15">independent verification.</text><text x="16" y="166" fill="#94a3b8" font-size="14">Keep useful context.</text></g>
</g>
<rect x="38" y="350" width="1124" height="102" rx="15" fill="#351d28" stroke="#f87171" stroke-width="2"/>
<text x="64" y="390" fill="#fecaca" font-family="system-ui,sans-serif" font-size="20" font-weight="700">If provenance or integrity is uncertain</text>
<text x="64" y="423" fill="#f1d4d4" font-family="system-ui,sans-serif" font-size="17">Quarantine the file, do not execute embedded commands, and locate a canonical publisher source before relying on claims.</text>
<text x="600" y="510" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="16">A local copy is useful for offline study; age and authenticity still need context.</text>
</svg>
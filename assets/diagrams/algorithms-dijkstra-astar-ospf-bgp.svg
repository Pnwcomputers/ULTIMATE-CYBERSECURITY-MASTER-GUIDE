<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc"><title id="title">Dijkstra &amp; A*: Weighted Pathfinding</title><desc id="desc">Synthetic directed graph • shortest A → D path is A → B → C → D with total cost 5.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#80cfff"/></marker><marker id="gold" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#f9bd59"/></marker></defs><rect width="1200" height="670" rx="20" fill="#0c1425"/><g font-family="Arial,Helvetica,sans-serif"><text x="42" y="56" font-size="31" font-weight="700" fill="#f8fafc">Dijkstra &amp; A*: Weighted Pathfinding</text><text x="42" y="89" font-size="17" fill="#b9cee0">Synthetic directed graph • shortest A → D path is A → B → C → D with total cost 5.</text><path d="M176 296 L385 204" stroke="#f9bd59" stroke-width="4" marker-end="url(#gold)"/><path d="M439 221 L645 301" stroke="#f9bd59" stroke-width="4" marker-end="url(#gold)"/><path d="M703 313 L948 273" stroke="#f9bd59" stroke-width="4" marker-end="url(#gold)"/><path d="M180 339 Q474 474 645 348" stroke="#80cfff" stroke-width="2.8" fill="none" marker-end="url(#arrow)"/><path d="M437 173 Q722 94 946 229" stroke="#80cfff" stroke-width="2.8" fill="none" marker-end="url(#arrow)"/><text x="273" y="237" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#ffd488" text-anchor="start">2</text><text x="553" y="265" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#ffd488" text-anchor="start">1</text><text x="819" y="276" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#ffd488" text-anchor="start">2</text><text x="405" y="433" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#b1defb" text-anchor="start">5</text><text x="717" y="134" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#b1defb" text-anchor="start">4</text><circle cx="148" cy="316" r="31" fill="#183e57" stroke="#8bd1fa" stroke-width="2.5"/><text x="148" y="323" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#f8fafc" text-anchor="middle">A</text><circle cx="410" cy="194" r="31" fill="#183e57" stroke="#8bd1fa" stroke-width="2.5"/><text x="410" y="201" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#f8fafc" text-anchor="middle">B</text><circle cx="676" cy="317" r="31" fill="#183e57" stroke="#8bd1fa" stroke-width="2.5"/><text x="676" y="324" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#f8fafc" text-anchor="middle">C</text><circle cx="977" cy="267" r="31" fill="#183e57" stroke="#8bd1fa" stroke-width="2.5"/><text x="977" y="274" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#f8fafc" text-anchor="middle">D</text><rect x="42" y="466" width="538" height="111" rx="15" fill="#14283d" stroke="#4c90b1" stroke-width="1.8"/><text x="63" y="496" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#f7fafc" text-anchor="start">Dijkstra / OSPF SPF</text><text x="63" y="526" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#dcebf5" text-anchor="start">Minimize the sum of valid nonnegative link costs</text><text x="63" y="553" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#9ac7dd" text-anchor="start">OSPF routing metric ≠ measured latency</text><rect x="601" y="466" width="557" height="111" rx="15" fill="#14283d" stroke="#4c90b1" stroke-width="1.8"/><text x="622" y="496" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#f7fafc" text-anchor="start">A* / Heuristic Search</text><text x="622" y="526" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#dcebf5" text-anchor="start">Choose by f(n) = g(n) + h(n)</text><text x="622" y="553" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#9ac7dd" text-anchor="start">Optimality needs admissibility &amp; sound graph logic</text><rect x="40" y="592" width="1120" height="51" rx="15" fill="#172e43" stroke="#476982" stroke-width="1.8"/><text x="60" y="623" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#d5e9f7" text-anchor="start">BGP is policy-driven path vector routing; it does NOT run Dijkstra across the Internet.</text></g></svg>
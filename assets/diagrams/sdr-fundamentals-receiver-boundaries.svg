<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
<title id="title">SDR flexibility begins after the hardware boundary</title>
<desc id="desc">An antenna and analog frontend select and condition RF before digitization. Software can process only the samples the hardware captured.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
<path d="M0 0L10 5L0 10Z" fill="#337b98"/>
</marker>
</defs>
<rect width="1200" height="580" fill="#f4f7fa"/>
<text x="40" y="54" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#16354b">SDR flexibility begins after the hardware boundary</text>
<text x="40" y="89" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Conceptual receiver chain • no tested device or deployment implied</text>
<rect x="40" y="155" width="250" height="215" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/>
<text x="58" y="189" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16354b">Antenna / RF</text>
<text x="58" y="228" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Band and polarization</text>
<text x="58" y="257" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Filter / gain / input limits</text>
<path d="M298 260L319 260" stroke="#337b98" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
<rect x="330" y="155" width="250" height="215" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/>
<text x="348" y="189" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16354b">Digitization</text>
<text x="348" y="228" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Converter and clock</text>
<text x="348" y="257" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Sample representation</text>
<path d="M588 260L609 260" stroke="#337b98" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
<rect x="620" y="155" width="250" height="215" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/>
<text x="638" y="189" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16354b">Transport</text>
<text x="638" y="228" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">USB / Ethernet / storage</text>
<text x="638" y="257" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Rate and dropped samples</text>
<path d="M878 260L899 260" stroke="#337b98" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
<rect x="910" y="155" width="250" height="215" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/>
<text x="928" y="189" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16354b">Software</text>
<text x="928" y="228" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Filter → demodulate</text>
<text x="928" y="257" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Decode → evaluate</text>
<rect x="40" y="465" width="1120" height="85" rx="12" fill="#e0ebf1"/>
<text x="58" y="495" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Software cannot recover a band the frontend never received or samples lost before recording.</text>
<text x="58" y="524" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Tuning range, usable bandwidth, sample format and protocol support are separate requirements.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc"><title id="title">Live Response: Collect By Risk, Value &amp; Volatility</title><desc id="desc">Triage sequence prioritizes written authorization, incident safety, time-sensitive evidence, preservation of originals and an independent interpretation. The specific collection order is case-dependent.</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#76D6F9"/></marker></defs><rect width="1440" height="820" rx="18" fill="#0C192B"/><g font-family="Arial,Helvetica,sans-serif"><text x="35" y="55" font-size="31" font-weight="700" fill="#FAFCFF">Live Response: Collect By Risk, Value &amp; Volatility</text><text x="35" y="90" font-size="18" fill="#C0D6E8">Acquisition itself changes a live system. Plan the smallest justified intervention and record it.</text><path d="M35 111H1405" stroke="#38516A" stroke-width="2"/><rect x="37" y="157" width="419" height="192" rx="13" fill="#172D46" stroke="#F0CB82" stroke-width="2.3"/><text x="55" y="198" font-size="21" font-weight="700" fill="#F6FAFF">1  Authorize &amp; assess</text><text x="55" y="238" font-size="18" fill="#D6E7F3">Incident impact / business safety</text><text x="55" y="273" font-size="18" fill="#D6E7F3">Owner, scope and collection plan</text><text x="55" y="308" font-size="18" fill="#D6E7F3">Clock offset &amp; tool provenance</text><rect x="511" y="157" width="419" height="192" rx="13" fill="#172D46" stroke="#76D6F9" stroke-width="2.3"/><text x="529" y="198" font-size="21" font-weight="700" fill="#F6FAFF">2  Choose volatile sources</text><text x="529" y="238" font-size="18" fill="#D6E7F3">RAM, processes, connections</text><text x="529" y="273" font-size="18" fill="#D6E7F3">Sessions, keys and transient state</text><text x="529" y="308" font-size="18" fill="#D6E7F3">Priority varies by case</text><rect x="984" y="157" width="419" height="192" rx="13" fill="#172D46" stroke="#76DBB3" stroke-width="2.3"/><text x="1002" y="198" font-size="21" font-weight="700" fill="#F6FAFF">3  Preserve defensibly</text><text x="1002" y="238" font-size="18" fill="#D6E7F3">Write to trusted destination</text><text x="1002" y="273" font-size="18" fill="#D6E7F3">Record command and output</text><text x="1002" y="308" font-size="18" fill="#D6E7F3">Hash acquisition and copies</text><path d="M456 254H503" fill="none" stroke="#76D6F9" stroke-width="3" marker-end="url(#arr)"/><path d="M930 254H976" fill="none" stroke="#76D6F9" stroke-width="3" marker-end="url(#arr)"/><rect x="37" y="437" width="666" height="161" rx="13" fill="#172D46" stroke="#AFA9FF" stroke-width="2.3"/><text x="55" y="478" font-size="21" font-weight="700" fill="#F6FAFF">LIVE PATH</text><text x="55" y="518" font-size="18" fill="#D6E7F3">Collect only approved artifacts while running</text><text x="55" y="553" font-size="18" fill="#D6E7F3">Record unavoidable state changes and errors</text><rect x="740" y="437" width="663" height="161" rx="13" fill="#172D46" stroke="#76DBB3" stroke-width="2.3"/><text x="758" y="478" font-size="21" font-weight="700" fill="#F6FAFF">OFFLINE / CENTRAL PATH</text><text x="758" y="518" font-size="18" fill="#D6E7F3">Retain disk images, logs and remote records</text><text x="758" y="553" font-size="18" fill="#D6E7F3">Document time and acquisition differences</text><path d="M720 349V388H358V429" fill="none" stroke="#76D6F9" stroke-width="3" marker-end="url(#arr)"/><path d="M720 349V388H1072V429" fill="none" stroke="#76D6F9" stroke-width="3" marker-end="url(#arr)"/><rect x="37" y="644" width="1366" height="115" rx="13" fill="#3B3225" stroke="#F0CB82" stroke-width="2.5"/><text x="59" y="684" font-size="21" font-weight="700" fill="#FFE7B3">Before reporting: validate completeness and custody limits</text><text x="59" y="720" font-size="18" fill="#F3E2C5">A checksum supports byte integrity, but not authorship, lawful collection, correct timing or a complete incident reconstruction.</text><text x="37" y="798" font-size="15" fill="#B8CCDE">Conceptual order, not a record that a specific tool, device, RAM image or forensic collection was tested.</text></g></svg>
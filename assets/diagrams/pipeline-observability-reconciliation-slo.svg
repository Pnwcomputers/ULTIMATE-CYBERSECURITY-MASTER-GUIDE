<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" role="img" aria-labelledby="title desc"><title id="title">Pipeline Observability: Prove The Consumer Received Good Data</title><desc id="desc">A successful task run does not show that records are complete, correct or fresh. Independent reconciliation and consumer-centered SLOs complement logs and metrics.</desc><defs><marker id="next" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#86d6f5"/></marker></defs><rect width="1440" height="780" rx="19" fill="#0d1929"/><g font-family="Arial,Helvetica,sans-serif"><text x="37" y="58" font-size="29" font-weight="700" fill="#f8fbff">Pipeline Observability: Prove The Consumer Received Good Data</text><text x="37" y="92" font-size="17.5" fill="#c0d5e6">Instrument source, processing and sink boundaries; distinguish missing telemetry from healthy operation.</text><path d="M37 115H1403" stroke="#38506a" stroke-width="2"/><rect x="37" y="156" width="414" height="169" rx="14" fill="#1b3049" stroke="#8ad7f7" stroke-width="2.3"/><rect x="37" y="156" width="7" height="169" rx="3" fill="#8ad7f7"/><text x="54" y="195" font-size="20" font-weight="700" fill="#fafcff">Producer &amp; source</text><text x="54" y="236" font-size="17.5" fill="#dbe8f3">Source count and event time</text><text x="54" y="269" font-size="17.5" fill="#dbe8f3">Schema + completeness checks</text><rect x="512" y="156" width="416" height="169" rx="14" fill="#1b3049" stroke="#b6adfb" stroke-width="2.3"/><rect x="512" y="156" width="7" height="169" rx="3" fill="#b6adfb"/><text x="529" y="195" font-size="20" font-weight="700" fill="#fafcff">Pipeline processing</text><text x="529" y="236" font-size="17.5" fill="#dbe8f3">Latency, failures and retries</text><text x="529" y="269" font-size="17.5" fill="#dbe8f3">Trace or run identifiers</text><rect x="987" y="156" width="416" height="169" rx="14" fill="#1b3049" stroke="#70dbb7" stroke-width="2.3"/><rect x="987" y="156" width="7" height="169" rx="3" fill="#70dbb7"/><text x="1004" y="195" font-size="20" font-weight="700" fill="#fafcff">Consumer dataset</text><text x="1004" y="236" font-size="17.5" fill="#dbe8f3">Freshness &amp; query results</text><text x="1004" y="269" font-size="17.5" fill="#dbe8f3">Actual data availability</text><path d="M452 241H502" stroke="#8bd8f6" stroke-width="3" fill="none" marker-end="url(#next)"/><path d="M929 241H977" stroke="#8bd8f6" stroke-width="3" fill="none" marker-end="url(#next)"/><rect x="159" y="419" width="491" height="160" rx="14" fill="#1b3049" stroke="#f1cc85" stroke-width="2.3"/><rect x="159" y="419" width="7" height="160" rx="3" fill="#f1cc85"/><text x="176" y="458" font-size="20" font-weight="700" fill="#fafcff">Telemetry &amp; alerts</text><text x="176" y="499" font-size="17.5" fill="#dbe8f3">Metrics, structured logs, traces</text><text x="176" y="532" font-size="17.5" fill="#dbe8f3">Monitor coverage and alert noise</text><rect x="785" y="419" width="495" height="160" rx="14" fill="#1b3049" stroke="#70dbb7" stroke-width="2.3"/><rect x="785" y="419" width="7" height="160" rx="3" fill="#70dbb7"/><text x="802" y="458" font-size="20" font-weight="700" fill="#fafcff">Reconciliation &amp; SLO</text><text x="802" y="499" font-size="17.5" fill="#dbe8f3">Compare source with sink facts</text><text x="802" y="532" font-size="17.5" fill="#dbe8f3">Track error-budget burn</text><path d="M720 325V365H410V411" stroke="#8bd8f6" stroke-width="3" fill="none" marker-end="url(#next)"/><path d="M720 325V365H1032V411" stroke="#8bd8f6" stroke-width="3" fill="none" marker-end="url(#next)"/><path d="M650 500H776" stroke="#8bd8f6" stroke-width="3" fill="none" marker-end="url(#next)"/><rect x="38" y="641" width="1364" height="83" rx="12" fill="#393227" stroke="#f1cf86" stroke-width="2"/><text x="58" y="673" font-size="20" font-weight="700" fill="#fff1c5">A green dashboard is not a data-integrity guarantee</text><text x="58" y="704" font-size="17" fill="#f1e1c7">Investigate monitor failure, silent truncation, duplicate keys and consumer-facing stale data.</text></g></svg>
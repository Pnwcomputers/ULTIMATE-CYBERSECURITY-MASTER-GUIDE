<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="775" viewBox="0 0 1440 775" role="img" aria-labelledby="title desc"><title id="title">Authorization Tests: Subject × Object × Action</title><desc id="desc">Horizontal and vertical access-control checks use separate approved test identities, expected object ownership and explicit server-side decisions.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#8fd7ef"/></marker></defs><rect width="1440" height="775" fill="#0e1927" rx="20"/><g font-family="Arial,Helvetica,sans-serif"><text x="40" y="58" font-size="30" font-weight="700" fill="#f4faff">Authorization Tests: Subject × Object × Action</text><text x="40" y="93" font-size="18" fill="#bed2e2">A valid login or hidden button is not proof of object-level authorization.</text><line x1="40" y1="119" x2="1400" y2="119" stroke="#385066" stroke-width="2"/><rect x="40" y="160" width="403" height="180" fill="#193047" stroke="#80d0f7" stroke-width="2.5" rx="14"/><rect x="40" y="160" width="8" height="180" rx="4" fill="#80d0f7"/><text x="59" y="199" font-size="21" font-weight="700" fill="#f5faff">Identity A: regular user</text><text x="59" y="241" font-size="17" fill="#d7e6f2">Owns Record A</text><text x="59" y="275" font-size="17" fill="#d7e6f2">Must not read Record B</text><rect x="518" y="160" width="402" height="180" fill="#193047" stroke="#b0a8fd" stroke-width="2.5" rx="14"/><rect x="518" y="160" width="8" height="180" rx="4" fill="#b0a8fd"/><text x="537" y="199" font-size="21" font-weight="700" fill="#f5faff">Identity B: regular user</text><text x="537" y="241" font-size="17" fill="#d7e6f2">Owns Record B</text><text x="537" y="275" font-size="17" fill="#d7e6f2">Must not read Record A</text><rect x="995" y="160" width="405" height="180" fill="#193047" stroke="#efca86" stroke-width="2.5" rx="14"/><rect x="995" y="160" width="8" height="180" rx="4" fill="#efca86"/><text x="1014" y="199" font-size="21" font-weight="700" fill="#f5faff">Identity C: privileged</text><text x="1014" y="241" font-size="17" fill="#d7e6f2">Can perform scoped admin tasks</text><text x="1014" y="275" font-size="17" fill="#d7e6f2">Confirm role and tenant scope</text><path d="M237 340V400H710V451" stroke="#8fd7ef" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M718 340V451" stroke="#8fd7ef" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M1197 340V400H729V451" stroke="#8fd7ef" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="285" y="458" width="870" height="154" fill="#193047" stroke="#77dcbc" stroke-width="2.5" rx="14"/><rect x="285" y="458" width="8" height="154" rx="4" fill="#77dcbc"/><text x="304" y="497" font-size="21" font-weight="700" fill="#f5faff">Server-side policy decision (every request)</text><text x="304" y="539" font-size="17" fill="#d7e6f2">Authenticate caller → authorize action on target object and tenant</text><text x="304" y="573" font-size="17" fill="#d7e6f2">Log allow/deny and confirm no cross-account data leakage</text><rect x="40" y="645" width="1360" height="90" rx="13" fill="#3b3228" stroke="#ecc981" stroke-width="2"/><text x="58" y="680" font-size="21" fill="#ffe7b9" font-weight="700">Test two kinds of denial with safe, synthetic accounts</text><text x="58" y="713" font-size="17" fill="#f4e4cb">Horizontal: A cannot access B's record. Vertical: non-admin cannot execute admin-only action.</text></g></svg>
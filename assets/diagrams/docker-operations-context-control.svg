<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
<title id="title">A local Docker command can control a remote host</title>
<desc id="desc">Context configuration, environment variables and explicit flags select a daemon endpoint. The daemon then acts on its host resources. Running the CLI locally does not mean that containers or data are local.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
<path d="M0 0 L10 5 L0 10Z" fill="#337b98"/>
</marker>
</defs>
<rect width="1200" height="570" fill="#f4f7fa"/>
<text x="40" y="54" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#16354b">A local Docker command can control a remote host</text>
<text x="40" y="89" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Conceptual CLI-to-daemon path • no daemon contacted or command executed</text>
<rect x="40" y="158" width="250" height="210" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/>
<text x="58" y="192" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16354b">Review selection</text>
<text x="58" y="230" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Context metadata</text>
<text x="58" y="260" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Environment / flags</text>
<path d="M298 260 L319 260" stroke="#337b98" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
<rect x="330" y="158" width="250" height="210" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/>
<text x="348" y="192" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16354b">Confirm endpoint</text>
<text x="348" y="230" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Local or remote daemon</text>
<text x="348" y="260" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Connection and identity</text>
<path d="M588 260 L609 260" stroke="#337b98" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
<rect x="620" y="158" width="250" height="210" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/>
<text x="638" y="192" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16354b">Inspect state</text>
<text x="638" y="230" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Host / resource state</text>
<text x="638" y="260" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Read operations</text>
<path d="M878 260 L899 260" stroke="#337b98" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
<rect x="910" y="158" width="250" height="210" rx="16" fill="#fff3d7" stroke="#b5cbd7" stroke-width="2"/>
<text x="928" y="192" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16354b">Plan any change</text>
<text x="928" y="230" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Resource and impact</text>
<text x="928" y="260" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Recovery and verification</text>
<rect x="40" y="451" width="1120" height="86" rx="12" fill="#e0ebf1"/>
<text x="58" y="481" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">The context-list asterisk is useful context, not a substitute for reviewing the actual invocation.</text>
<text x="58" y="510" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Daemon authorization is a powerful boundary; encrypted transport does not reduce granted authority.</text>
</svg>
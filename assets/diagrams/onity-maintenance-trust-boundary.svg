<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
<title id="title">Onity: a maintenance interface crosses the boundary</title>
<desc id="desc">An externally reachable maintenance interface crosses from the untrusted exterior into lock maintenance functions and the door authorization decision. Defensive review must separate servicing authority from room access.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#337b98"/>
</marker>
</defs>
<rect width="1200" height="590" fill="#f4f7fa"/>
<text x="40" y="54" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#16354b">Onity: a maintenance interface crosses the boundary</text>
<text x="40" y="89" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Historical 2012 research • conceptual architecture • no connector or protocol details</text>
<rect x="441" y="129" width="719" height="270" rx="20" fill="#e6eef3" stroke="#7395aa" stroke-dasharray="8 6" stroke-width="2"/>
<text x="464" y="160" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#16354b">LOCK CONTROLLER TRUST BOUNDARY</text>
<rect x="40" y="195" width="300" height="160" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/>
<text x="58" y="229" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16354b">Exterior access</text>
<text x="58" y="265" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Physically reachable</text>
<text x="58" y="294" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Does not confer authority</text>
<rect x="478" y="195" width="288" height="160" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/>
<text x="496" y="229" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16354b">Maintenance functions</text>
<text x="496" y="265" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Sensitive service operations</text>
<text x="496" y="294" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Require authorization</text>
<rect x="837" y="195" width="288" height="160" rx="16" fill="#fff3d7" stroke="#d3ac53" stroke-width="2"/>
<text x="855" y="229" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16354b">Door authorization</text>
<text x="855" y="265" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Protected access decision</text>
<text x="855" y="294" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Separate trust requirement</text>
<path d="M 352 275 L 466 275" stroke="#337b98" stroke-width="3" fill="none" marker-end="url(#arrow)" />
<path d="M 778 275 L 825 275" stroke="#337b98" stroke-width="3" fill="none" marker-end="url(#arrow)" />
<rect x="40" y="470" width="1120" height="87" rx="12" fill="#e0ebf1"/>
<text x="58" y="499" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Failure illustrated: physical access to a servicing interface can undermine an access decision.</text>
<text x="58" y="528" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Review: authenticated servicing, restricted interfaces, tamper resistance, and fleet remediation.</text>
</svg>
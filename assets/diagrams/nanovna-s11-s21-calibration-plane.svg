<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="790" viewBox="0 0 1440 790" role="img" aria-labelledby="title desc"><title id="title">NanoVNA Calibration: The Plane Matters</title><desc id="desc">S11 one-port calibration uses OPEN, SHORT and LOAD at the connector plane where the device under test will attach. S21 transmission requires additional appropriate calibration with both ports and fixture paths.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#8adbf6"/></marker></defs><rect width="1440" height="790" rx="20" fill="#0d192a"/><g font-family="Arial,Helvetica,sans-serif"><text x="40" y="58" font-size="30" font-weight="700" fill="#fbfdff">NanoVNA Calibration: The Plane Matters</text><text x="40" y="92" font-size="18" fill="#c0d4e5">Move or swap the test cable after calibration and the correction no longer describes the same system.</text><path d="M40 119H1400" stroke="#354f68" stroke-width="2"/><rect x="40" y="165" width="309" height="185" rx="15" fill="#1a304a" stroke="#8bd6fa" stroke-width="2.5"/><rect x="40" y="165" width="8" height="185" rx="4" fill="#8bd6fa"/><text x="58" y="207" font-size="21" font-weight="700" fill="#f4fcff">NanoVNA CH0</text><text x="58" y="250" font-size="18" fill="#dceaf3">Select sweep span</text><text x="58" y="286" font-size="18" fill="#dceaf3">Attach intended test lead</text><text x="58" y="322" font-size="18" fill="#dceaf3">Reset prior calibration</text><rect x="407" y="165" width="361" height="185" rx="15" fill="#1a304a" stroke="#71dcb8" stroke-width="2.5"/><rect x="407" y="165" width="8" height="185" rx="4" fill="#71dcb8"/><text x="425" y="207" font-size="21" font-weight="700" fill="#f4fcff">Connector reference plane</text><text x="425" y="250" font-size="18" fill="#dceaf3">OPEN → SHORT → LOAD</text><text x="425" y="286" font-size="18" fill="#dceaf3">Each standard at cable end</text><text x="425" y="322" font-size="18" fill="#dceaf3">Save and verify known load</text><rect x="832" y="165" width="568" height="185" rx="15" fill="#1a304a" stroke="#b7abff" stroke-width="2.5"/><rect x="832" y="165" width="8" height="185" rx="4" fill="#b7abff"/><text x="850" y="207" font-size="21" font-weight="700" fill="#f4fcff">Antenna / DUT</text><text x="850" y="250" font-size="18" fill="#dceaf3">Replace standard with actual target</text><text x="850" y="286" font-size="18" fill="#dceaf3">Inspect calibrated S11 and Smith</text><text x="850" y="322" font-size="18" fill="#dceaf3">Recheck cable / adapters</text><path d="M350 254H399" fill="none" stroke="#8adbf6" stroke-width="3" marker-end="url(#arr)"/><path d="M769 254H824" fill="none" stroke="#8adbf6" stroke-width="3" marker-end="url(#arr)"/><path d="M810 143V386" stroke="#f0c882" stroke-width="4" stroke-dasharray="9 8"/><text x="702" y="409" font-size="17" fill="#f5d59e">Calibration plane at cable end</text><rect x="232" y="457" width="975" height="132" rx="15" fill="#1a304a" stroke="#efc982" stroke-width="2.5"/><rect x="232" y="457" width="8" height="132" rx="4" fill="#efc982"/><text x="250" y="499" font-size="21" font-weight="700" fill="#f4fcff">Separate measurement: S21</text><text x="250" y="542" font-size="18" fill="#dceaf3">CH0 → device under test → CH1. Use instrument-specific THRU and isolation calibration</text><text x="250" y="578" font-size="18" fill="#dceaf3">Do not apply reflection-only calibration as proof of calibrated transmission or deep stopband rejection</text><rect x="40" y="645" width="1360" height="91" rx="13" fill="#393126" stroke="#f1c77b" stroke-width="2"/><text x="62" y="680" font-size="21" font-weight="700" fill="#fff0c8">A good-looking trace is not verification</text><text x="62" y="712" font-size="17" fill="#f3e0bc">Confirm known LOAD/OPEN behavior and record span, calibration kit, adapters and instrument firmware.</text><text x="42" y="765" font-size="15" fill="#b8d0e2">Illustrative calibration path. Follow the installed NanoVNA generation's actual calibration menu and standard model.</text></g></svg>
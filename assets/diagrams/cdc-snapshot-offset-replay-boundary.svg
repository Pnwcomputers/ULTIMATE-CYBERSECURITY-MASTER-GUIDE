<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc"><title id="title">CDC Snapshot Handoff: Preserve Position &amp; State</title><desc id="desc">Source-aligned snapshot and streamed change events require a coordinated source position. A consumer protects keyed state against duplicates, stale updates and delayed deletes.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#8fd7ef"/></marker></defs><rect width="1440" height="800" fill="#0e1927" rx="20"/><g font-family="Arial,Helvetica,sans-serif"><text x="40" y="58" font-size="30" font-weight="700" fill="#f4faff">CDC Snapshot Handoff: Preserve Position &amp; State</text><text x="40" y="93" font-size="18" fill="#bed2e2">One synthetic SQLite test is not proof of a distributed connector's delivery guarantees.</text><line x1="40" y1="119" x2="1400" y2="119" stroke="#385066" stroke-width="2"/><rect x="40" y="160" width="416" height="179" fill="#193047" stroke="#77dcbc" stroke-width="2.5" rx="14"/><rect x="40" y="160" width="8" height="179" rx="4" fill="#77dcbc"/><text x="59" y="199" font-size="21" font-weight="700" fill="#f5faff">Source database</text><text x="59" y="241" font-size="18" fill="#d7e6f2">Initial rows and transaction log</text><text x="59" y="275" font-size="18" fill="#d7e6f2">Connector owns consistent boundary</text><rect x="505" y="160" width="415" height="179" fill="#193047" stroke="#80d0f7" stroke-width="2.5" rx="14"/><rect x="505" y="160" width="8" height="179" rx="4" fill="#80d0f7"/><text x="524" y="199" font-size="21" font-weight="700" fill="#f5faff">Snapshot / source offset</text><text x="524" y="241" font-size="18" fill="#d7e6f2">Capture baseline at known position</text><text x="524" y="275" font-size="18" fill="#d7e6f2">Resolve concurrent event collisions</text><rect x="968" y="160" width="432" height="179" fill="#193047" stroke="#b0a8fd" stroke-width="2.5" rx="14"/><rect x="968" y="160" width="8" height="179" rx="4" fill="#b0a8fd"/><text x="987" y="199" font-size="21" font-weight="700" fill="#f5faff">Continuous change stream</text><text x="987" y="241" font-size="18" fill="#d7e6f2">Records may repeat after restart</text><text x="987" y="275" font-size="18" fill="#d7e6f2">Source positions and versions matter</text><path d="M457 247H495" stroke="#8fd7ef" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M921 247H958" stroke="#8fd7ef" stroke-width="3" fill="none" marker-end="url(#arr)"/><line x1="60" y1="400" x2="1380" y2="400" stroke="#74d0ef" stroke-width="3"/><circle cx="277" cy="400" r="12" fill="#77dcbc"/><circle cx="722" cy="400" r="12" fill="#efca86"/><circle cx="1156" cy="400" r="12" fill="#b0a8fd"/><text x="152" y="381" font-size="17" fill="#d5e5f2">Baseline snapshot</text><text x="630" y="381" font-size="17" fill="#d5e5f2">Handoff position</text><text x="1081" y="381" font-size="17" fill="#d5e5f2">Replay / resume</text><rect x="40" y="459" width="657" height="154" fill="#193047" stroke="#77dcbc" stroke-width="2.5" rx="14"/><rect x="40" y="459" width="8" height="154" rx="4" fill="#77dcbc"/><text x="59" y="498" font-size="21" font-weight="700" fill="#f5faff">State projector</text><text x="59" y="540" font-size="17" fill="#d7e6f2">Apply keyed versions consistently</text><text x="59" y="574" font-size="17" fill="#d7e6f2">Retain delete markers for replay horizon</text><rect x="743" y="459" width="657" height="154" fill="#193047" stroke="#efca86" stroke-width="2.5" rx="14"/><rect x="743" y="459" width="8" height="154" rx="4" fill="#efca86"/><text x="762" y="498" font-size="21" font-weight="700" fill="#f5faff">Commit + failure recovery</text><text x="762" y="540" font-size="17" fill="#d7e6f2">Store state &amp; progress atomically if supported</text><text x="762" y="574" font-size="17" fill="#d7e6f2">Otherwise use idempotency and deduplication</text><rect x="40" y="660" width="1360" height="90" rx="13" fill="#3b3228" stroke="#ecc981" stroke-width="2"/><text x="58" y="695" font-size="21" fill="#ffe7b9" font-weight="700">Guaranteed exactly once? Only within documented boundaries</text><text x="58" y="728" font-size="17" fill="#f4e4cb">Broker offsets alone do not make an arbitrary external API or SQL side effect execute once.</text></g></svg>
<text x="348" y="215" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Card data protection</text>
<text x="348" y="244" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">MIFARE Classic context</text>
<path d="M 588 235 L 609 235" stroke="#337b98" stroke-width="3" fill="none" marker-end="url(#arrow)" />
<rect x="620" y="145" width="250" height="180" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/>
<text x="638" y="179" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16354b">Key handling</text>
<text x="638" y="215" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Manufacturer-specific</text>
<text x="638" y="244" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Trust assumptions</text>
<path d="M 878 235 L 899 235" stroke="#337b98" stroke-width="3" fill="none" marker-end="url(#arrow)" />
<rect x="910" y="145" width="250" height="180" rx="16" fill="#fff3d7" stroke="#d3ac53" stroke-width="2"/>
<text x="928" y="179" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16354b">Lock authorization</text>
<text x="928" y="215" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Room access decision</text>
<text x="928" y="244" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Affected configurations</text>
<text x="40" y="378" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#16354b">REMEDIATION MUST COVER THE WHOLE DEPLOYMENT</text>
<rect x="40" y="410" width="1120" height="87" rx="12" fill="#e0ebf1"/>
<text x="58" y="439" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Management and integrations → credential reissuance → reader / lock update or replacement.</text>
<text x="58" y="468" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">A lock’s exterior appearance does not establish upgrade status. Verify vendor deployment records.</text>

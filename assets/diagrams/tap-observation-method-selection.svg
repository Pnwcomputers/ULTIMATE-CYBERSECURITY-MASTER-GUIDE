<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
  <title id="title">Choose a network traffic observation method</title>
  <desc id="desc">A conceptual decision aid routes switch-visible traffic to SPAN, point-to-point physical link traffic to a correctly rated network TAP, and virtual machine traffic to a virtual switch mirror. All methods require checking scope, direction, output capacity, and packet-drop counters.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#8aa4c3"/>
    </marker>
    <style>
      .title { font: 700 28px sans-serif; fill: #f8fafc; }
      .subtitle { font: 16px sans-serif; fill: #cbd5e1; }
      .head { font: 700 20px sans-serif; fill: #f8fafc; }
      .body { font: 16px sans-serif; fill: #dbeafe; }
      .label { font: 700 15px sans-serif; fill: #93c5fd; }
      .foot { font: 15px sans-serif; fill: #cbd5e1; }
      .line { stroke: #8aa4c3; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1000" height="650" rx="20" fill="#0b1223"/>
  <text class="title" x="36" y="48">Choose a network traffic observation method</text>
  <text class="subtitle" x="36" y="76">Conceptual guide · confirm authorization, scope and change window first</text>

  <rect x="300" y="105" width="400" height="78" rx="13" fill="#172a40" stroke="#64748b" stroke-width="2"/>
  <text class="head" x="500" y="137" text-anchor="middle">Where does the traffic cross?</text>
  <text class="body" x="500" y="163" text-anchor="middle">Choose the point that can actually see it.</text>

  <path class="line" d="M500 183V214H170V245"/>
  <path class="line" d="M500 183V245"/>
  <path class="line" d="M500 214H830V245"/>

  <rect x="30" y="245" width="280" height="195" rx="14" fill="#132c45" stroke="#38bdf8" stroke-width="2"/>
  <text class="label" x="52" y="278">SWITCH PORTS OR VLANs</text>
  <text class="head" x="52" y="310">SPAN / port mirror</text>
  <text class="body" x="52" y="342">Use the managed switch's</text>
  <text class="body" x="52" y="365">mirror feature when it sees</text>
  <text class="body" x="52" y="388">the required paths.</text>
  <text class="body" x="52" y="419">Check source, direction, drops.</text>

  <rect x="360" y="245" width="280" height="195" rx="14" fill="#172a40" stroke="#a5b4fc" stroke-width="2"/>
  <text class="label" x="382" y="278">POINT-TO-POINT LINK</text>
  <text class="head" x="382" y="310">Physical network TAP</text>
  <text class="body" x="382" y="342">Match media, connectors,</text>
  <text class="body" x="382" y="365">speed and optical budget.</text>
  <text class="body" x="382" y="388">Choose passive or active</text>
  <text class="body" x="382" y="411">by design and failure needs.</text>

  <rect x="690" y="245" width="280" height="195" rx="14" fill="#203047" stroke="#fbbf24" stroke-width="2"/>
  <text class="label" x="712" y="278">VM-TO-VM / HYPERVISOR</text>
  <text class="head" x="712" y="310">Virtual switch mirror</text>
  <text class="body" x="712" y="342">Use the hypervisor's mirror</text>
  <text class="body" x="712" y="365">or virtual TAP facilities.</text>
  <text class="body" x="712" y="388">It sees only traffic on that</text>
  <text class="body" x="712" y="411">virtual switching plane.</text>

  <path class="line" d="M170 440V475H500"/>
  <path class="line" d="M500 440V475"/>
  <path class="line" d="M830 440V475H500V475"/>
  <rect x="155" y="475" width="690" height="112" rx="14" fill="#1b293b" stroke="#64748b" stroke-width="2"/>
  <text class="head" x="500" y="509" text-anchor="middle">Validate the capture path</text>
  <text class="body" x="500" y="538" text-anchor="middle">Both directions · breakout vs aggregation · monitor-port capacity</text>
  <text class="body" x="500" y="563" text-anchor="middle">Sensor drops and timestamps · confirm scope with authorized test traffic</text>

  <text class="foot" x="36" y="620">A healthy production link does not prove the monitoring feed captured every packet.</text>
</svg>

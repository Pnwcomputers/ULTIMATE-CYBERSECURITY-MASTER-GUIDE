exes, PageRank, Timsort</text><path d="M445 239h311" stroke="#35576c" stroke-width="1"/><text x="447" y="270" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#dcebf5" text-anchor="start">Threat hunts · event timelines</text><rect x="808" y="138" width="351" height="166" rx="15" fill="#14283d" stroke="#4c90b1" stroke-width="1.8"/><text x="830" y="175" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#f8fafc" text-anchor="start">Data Representation</text><text x="830" y="214" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" fill="#88d5fc" text-anchor="start">Huffman, LZ77, DEFLATE</text><path d="M828 239h311" stroke="#35576c" stroke-width="1"/><text x="830" y="270" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#dcebf5" text-anchor="start">Log storage · bomb limits</text><rect x="42" y="334" width="351" height="166" rx="15" fill="#14283d" stroke="#4c90b1" stroke-width="1.8"/><text x="64" y="371" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#f8fafc" text-anchor="start">Cryptographic Protection</text><text x="64" y="410" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" fill="#88d5fc" text-anchor="start">SHA-256, KDFs, AEAD</text><path d="M62 435h311" stroke="#35576c" stroke-width="1"/><text x="64" y="466" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#dcebf5" text-anchor="start">Integrity · identity · privacy</text><rect x="425" y="334" width="351" height="166" rx="15" fill="#14283d" stroke="#4c90b1" stroke-width="1.8"/><text x="447" y="371" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#f8fafc" text-anchor="start">Detection &amp; Decisions</text><text x="447" y="410" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" fill="#88d5fc" text-anchor="start">Pattern match, EWMA, windows</text><path d="M445 43
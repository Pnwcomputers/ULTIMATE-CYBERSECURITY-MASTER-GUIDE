<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="mvt-coverage-title mvt-coverage-desc"><title id="mvt-coverage-title">What was collected limits what can be concluded</title><desc id="mvt-coverage-desc">Conceptual MVT coverage map. iOS backup, filesystem and sysdiagnose inputs differ; AndroidQF acquisition and optional intrusion logs supply different Android artifacts. Available artifacts, enabled modules and indicator scope determine what analysis can establish; no-match cannot certify a clean device.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#347e99"/></marker></defs><rect width="1200" height="660" fill="#f4f7fa"/><g font-family="Arial, Helvetica, sans-serif" fill="#16364b"><text x="40" y="54" font-size="32" font-weight="700">What was collected limits what can be concluded</text><text x="40" y="91" font-size="20">Original conceptual coverage map • no device data acquired or analyzed</text><rect x="40" y="150" width="345" height="335" rx="17" fill="#ffffff" stroke="#b3ccdc" stroke-width="2"/><text x="60" y="186" font-size="23">iOS artifacts</text><text x="60" y="228" font-size="20">Backup: subset of device data</text><text x="60" y="259" font-size="20">Encrypted copy: decryption step</text><text x="60" y="290" font-size="20">Filesystem: acquisition tradeoffs</text><text x="60" y="321" font-size="20">Sysdiagnose: check plugins</text><rect x="425" y="150" width="345" height="335" rx="17" fill="#fff3d6" stroke="#b3ccdc" stroke-width="2"/><text x="445" y="186" font-size="23">Android artifacts</text><text x="445" y="228" font-size="20">AndroidQF acquisition output</text><text x="445" y="259" font-size="20">Vendor and OS differences</text><text x="445" y="290" font-size="20">Optional intrusion-log history</text><text x="445" y="321" font-size="20">No direct MVT ADB extraction</text><rect x="810" y="150" width="350" height="335" rx="17" fill="#fff3d6" stroke="#b3ccdc" stroke-width="2"/><text x="830" y="186" font-size="23">Interpretation limits</text><text x="830" y="228" font-size="20">Actual modules and indicators</text><text x="830" y="259" font-size="20">Known errors and missing data</text><text x="830" y="290" font-size="20">Corroboration and alternatives</text><text x="830" y="321" font-size="20">No-match is not a clean bill</text><rect x="40" y="535" width="1120" height="86" rx="13" fill="#dfebf1"/><text x="58" y="564" font-size="20">More access does not guarantee complete history; preserve acquisition method and known gaps.</text><text x="58" y="595" font-size="20">Indicator matches require context; public indicators cannot rule out every spyware campaign.</text></g></svg>

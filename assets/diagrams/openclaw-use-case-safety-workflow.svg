<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 650" role="img" aria-labelledby="title desc">
<title id="title">OpenClaw safe request and tool-use workflow</title>
<desc id="desc">Classify the request and data sensitivity, confirm the channel sender and authorized scope, minimize supplied context, use the configured model and least-privilege tools, draft with sources and uncertainty, verify the result, and require human approval for external messages or system changes. Untrusted files, logs, email, and web results can contain prompt injection.</desc>
<defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#17324d}.title{font-size:30px;font-weight:700}.sub{font-size:18px;fill:#435a72}.input{fill:#eef5ff;stroke:#4e78a3;stroke-width:2}.gate{fill:#fff7e8;stroke:#c39339;stroke-width:2}.tools{fill:#f3f0ff;stroke:#7763a5;stroke-width:2}.draft{fill:#eaf7f0;stroke:#548d68;stroke-width:2}.human{fill:#eff5fa;stroke:#496982;stroke-width:2}.step{font-size:13px;font-weight:700;letter-spacing:1px;fill:#5d7083}.head{font-size:18px;font-weight:700}.body{font-size:14px}.arrow{stroke:#486883;stroke-width:3;fill:none;marker-end:url(#arrow)}.foot{font-size:16px;font-weight:700;fill:#fff}</style><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#486883"/></marker></defs>
<rect width="1450" height="650" fill="#f5f8fc"/>
<text x="725" y="48" text-anchor="middle" class="title">OpenClaw use cases: bound the request, verify the result</text>
<text x="725" y="78" text-anchor="middle" class="sub">Channel access, data handling, model choice, tools, and human review are separate controls.</text>
<rect x="28" y="145" width="210" height="265" rx="16" class="input"/><text x="48" y="177" class="step">1 · CLASSIFY</text><text x="48" y="215" class="head">Request and data</text><text x="48" y="250" class="body"><tspan x="48">Is it personal, client,</tspan><tspan x="48" dy="21">security or public data?</tspan><tspan x="48" dy="31">Minimize secrets, PII</tspan><tspan x="48" dy="21">and raw evidence.</tspan></text>
<path d="M238 278H266" class="arrow"/>
<rect x="274" y="145" width="210" height="265" rx="16" class="gate"/><text x="294" y="177" class="step">2 · AUTHORITY</text><text x="294" y="215" class="head">Check access and scope</text><text x="294" y="250" class="body"><tspan x="294">Trusted sender/channel;</tspan><tspan x="294" dy="21">authorized system or task.</tspan><tspan x="294" dy="31">Untrusted text may contain</tspan><tspan x="294" dy="21">prompt injection.</tspan></text>
<path d="M484 278H512" class="arrow"/>
<rect x="520" y="145" width="210" height="265" rx="16" class="tools"/><text x="540" y="177" class="step">3 · CONFIGURE</text><text x="540" y="215" class="head">Model and tools</text><text x="540" y="250" class="body"><tspan x="540">Use the configured model</tspan><tspan x="540" dy="21">for the data policy.</tspan><tspan x="540" dy="31">Grant minimum tools;</tspan><tspan x="540" dy="21">keep writes restricted.</tspan></text>
<path d="M730 278H758" class="arrow"/>
<rect x="766" y="145" width="210" height="265" rx="16" class="draft"/><text x="786" y="177" class="step">4 · DRAFT</text><text x="786" y="215" class="head">Ask for a bounded result</text><text x="786" y="250" class="body"><tspan x="786">Request sources, gaps and</tspan><tspan x="786" dy="21">confidence limits.</tspan><tspan x="786" dy="31">No unsupported claims</tspan><tspan x="786" dy="21">or hidden actions.</tspan></text>
<path d="M976 278H1004" class="arrow"/>
<rect x="1012" y="145" width="210" height="265" rx="16" class="gate"/><text x="1032" y="177" class="step">5 · VERIFY</text><text x="1032" y="215" class="head">Review before use</text><text x="1032" y="250" class="body"><tspan x="1032">Check facts, commands,</tspan><tspan x="1032" dy="21">permissions and evidence.</tspan><tspan x="1032" dy="31">Test only in approved</tspan><tspan x="1032" dy="21">scope and environment.</tspan></text>
<path d="M1222 278H1250" class="arrow"/>
<rect x="1258" y="145" width="164" height="265" rx="16" class="human"/><text x="1278" y="177" class="step">6 · APPROVE</text><text x="1278" y="215" class="head">Human decides</text><text x="1278" y="250" class="body"><tspan x="1278">Approve external</tspan><tspan x="1278" dy="21">messages and changes.</tspan><tspan x="1278" dy="31">Inspect tool receipts</tspan><tspan x="1278" dy="21">and final outcome.</tspan></text>
<rect x="28" y="465" width="1394" height="92" rx="15" fill="#16324d"/><text x="725" y="504" text-anchor="middle" class="foot">A local model does not make external tools, channels, logs, memory or backups local.</text><text x="725" y="533" text-anchor="middle" class="foot">Never let a prompt alone authorize a scan, credential test, client message or system change.</text>
</svg>
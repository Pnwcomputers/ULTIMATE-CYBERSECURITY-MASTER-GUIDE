<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc"><title id="title">From paper to a supported finding</title><desc id="desc">Four stages: preserve the original paper and images, observe a complete repeated pattern, decode a matching format and check parity, corroborate device metadata with independent records. Machine correlation does not itself establish who printed the page.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#15334b}.title{font-size:32px;font-weight:700}.sub{font-size:19px}.small{font-size:17px}.label{font-size:20px;font-weight:700}</style><rect width="1200" height="390" fill="#f4f7fa"/><text x="40" y="52" class="title" >From paper to a supported finding</text><text x="40" y="86" class="sub" >Conceptual evidence workflow • decoding and attribution are separate tasks</text><rect x="40" y="125" width="250" height="150" rx="15" fill="#fff" stroke="#b9cbd7" stroke-width="2"/><text x="58" y="163" class="label" >1  PRESERVE</text><text x="58" y="201" class="sub" >Original paper</text><text x="58" y="239" class="sub" >Unedited image</text><path d="M 300 198 h 18 m -7 -7 l 7 7 -7 7" fill="none" stroke="#15334b" stroke-width="3"/><rect x="330" y="125" width="250" height="150" rx="15" fill="#fff" stroke="#b9cbd7" stroke-width="2"/><text x="348" y="163" class="label" >2  OBSERVE</text><text x="348" y="201" class="sub" >Complete repetitions</text><text x="348" y="239" class="sub" >Correct orientation</text><path d="M 590 198 h 18 m -7 -7 l 7 7 -7 7" fill="none" stroke="#15334b" stroke-width="3"/><rect x="620" y="125" width="250" height="150" rx="15" fill="#fff" stroke="#b9cbd7" stroke-width="2"/><text x="638" y="163" class="label" >3  DECODE</text><text x="638" y="201" class="sub" >Matching format</text><text x="638" y="239" class="sub" >Parity and fields</text><path d="M 880 198 h 18 m -7 -7 l 7 7 -7 7" fill="none" stroke="#15334b" stroke-width="3"/><rect x="910" y="125" width="250" height="150" rx="15" fill="#fff" stroke="#b9cbd7" stroke-width="2"/><text x="928" y="163" class="label" >4  CORROBORATE</text><text x="928" y="201" class="sub" >Independent records</text><text x="928" y="239" class="sub" >Clock discrepancies</text><rect x="40" y="306" width="1120" height="48" rx="10" fill="#e0eaf1"/><text x="60" y="337" class="sub" >Machine correlation ≠ proof of author or operator. A decoded timestamp is the printer’s reported time.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc"><title id="title">Classical Ciphers: Substitution, Transposition and OTP</title><desc id="desc">Historical methods change symbols, positions or both; a one-time pad needs a unique random key. Tap code shares C/K at one grid cell; the K row must match C, not J. OTP secrecy assumes correct key generation, distribution, single use and length handling.</desc><defs><marker id="arr" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#68d4ff"/></marker></defs><rect width="1400" height="720" rx="26" fill="#0e1b2b"/><g font-family="Arial,Helvetica,sans-serif"><text x="34" y="58" fill="#f1f7fe" font-size="29" font-weight="700">Classical Ciphers: Substitution, Transposition and OTP</text><text x="34" y="90" fill="#c2d4e4" font-size="17">Historical methods change symbols, positions or both; a one-time pad needs a unique random key.</text><path d="M34 117H1366" stroke="#345570" stroke-width="2"/><rect x="34" y="170" width="304" height="318" rx="18" fill="#1a3047" stroke="#72c6ec" stroke-width="2"/><rect x="52" y="192" width="49" height="42" rx="11" fill="#72c6ec" opacity=".23"/><text x="62" y="220" font-weight="700" font-size="23" fill="#72c6ec">01</text><text x="52" y="275" font-size="22" font-weight="700" fill="#fff">Substitution</text><text x="52" y="321" font-size="17" fill="#d8e8f4">• Replaces alphabet symbols</text><text x="52" y="366" font-size="17" fill="#d8e8f4">• Caesar, Atbash, Playfair</text><text x="52" y="411" font-size="17" fill="#d8e8f4">• Frequency clues may remain</text><path d="M345 327H370" stroke="#68d4ff" stroke-width="3" marker-end="url(#arr)"/><rect x="377" y="170" width="304" height="318" rx="18" fill="#1a3047" stroke="#baa1f2" stroke-width="2"/><rect x="395" y="192" width="49" height="42" rx="11" fill="#baa1f2" opacity=".23"/><text x="405" y="220" font-weight="700" font-size="23" fill="#baa1f2">02</text><text x="395" y="275" font-size="22" font-weight="700" fill="#fff">Transposition</text><text x="395" y="321" font-size="17" fill="#d8e8f4">• Reorders plaintext letters</text><text x="395" y="366" font-size="17" fill="#d8e8f4">• Rail fence and columns</text><text x="395" y="411" font-size="17" fill="#d8e8f4">• Symbol counts preserved</text><path d="M688 327H713" stroke="#68d4ff" stroke-width="3" marker-end="url(#arr)"/><rect x="720" y="170" width="304" height="318" rx="18" fill="#1a3047" stroke="#9fd8b6" stroke-width="2"/><rect x="738" y="192" width="49" height="42" rx="11" fill="#9fd8b6" opacity=".23"/><text x="748" y="220" font-weight="700" font-size="23" fill="#9fd8b6">03</text><text x="738" y="275" font-size="22" font-weight="700" fill="#fff">Repeating key</text><text x="738" y="321" font-size="17" fill="#d8e8f4">• Vigenere periodic shifts</text><text x="738" y="366" font-size="17" fill="#d8e8f4">• Key-period attacks possible</text><text x="738" y="411" font-size="17" fill="#d8e8f4">• No modern data security</text><path d="M1031 327H1056" stroke="#68d4ff" stroke-width="3" marker-end="url(#arr)"/><rect x="1063" y="170" width="304" height="318" rx="18" fill="#1a3047" stroke="#f0c17b" stroke-width="2"/><rect x="1081" y="192" width="49" height="42" rx="11" fill="#f0c17b" opacity=".23"/><text x="1091" y="220" font-weight="700" font-size="23" fill="#f0c17b">04</text><text x="1081" y="275" font-size="22" font-weight="700" fill="#fff">One-time pad</text><text x="1081" y="321" font-size="17" fill="#d8e8f4">• Uniform independent key</text><text x="1081" y="366" font-size="17" fill="#d8e8f4">• Secret and never reused</text><text x="1081" y="411" font-size="17" fill="#d8e8f4">• No message authentication</text><rect x="34" y="533" width="1332" height="134" rx="16" fill="#182c40" stroke="#335a76"/><text x="54" y="570" fill="#f0c780" font-size="18" font-weight="700">EVIDENCE AND ASSUMPTION BOUNDARIES</text><text x="54" y="604" fill="#e4edf5" font-size="18">Tap code shares C/K at one grid cell; the K row must match C, not J.</text><text x="54" y="633" fill="#e4edf5" font-size="18">OTP secrecy assumes correct key generation, distribution, single use and length handling.</text></g></svg>

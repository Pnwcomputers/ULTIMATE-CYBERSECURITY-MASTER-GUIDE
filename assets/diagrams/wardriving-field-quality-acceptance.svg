<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 755" width="1440" height="755" role="img" aria-labelledby="title desc"><title id="title">Wireless Survey: Quality Gates Before Sharing</title><desc id="desc">Five-stage authorized receive-focused field procedure: scope, preflight and calibration, safe route collection, evidence preservation and individual acceptance tests.</desc><defs><marker id="end-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#78D9FB"/></marker></defs><rect width="1440" height="755" rx="20" fill="#0C1829"/><g font-family="Arial,Helvetica,sans-serif"><text x="34" y="54" font-size="30" font-weight="700" fill="#F8FBFF">Wireless Survey: Quality Gates Before Sharing</text><text x="34" y="86" font-size="18" fill="#B9D2E4">Keep collection, device operations, location accuracy and publication approval as separate decisions.</text><path d="M34 110H1406" stroke="#385067" stroke-width="2"/><rect x="27" y="153" width="252" height="235" rx="14" fill="#172C45" stroke="#79D8FA" stroke-width="2.4"/><rect x="27" y="153" width="7" height="235" rx="3" fill="#79D8FA"/><text x="46" y="195" font-size="21" font-weight="700" fill="#F9FBFF">01  Authorize</text><text x="46" y="240" font-size="16.3" fill="#DAE9F3">Route &amp; time limits,Modes and RF scope</text><text x="46" y="274" font-size="16.3" fill="#DAE9F3">#78D9FB</text><path d="M280 267H300" stroke="#78D9FB" stroke-width="3" fill="none" marker-end="url(#end-arrow)"/><rect x="311" y="153" width="252" height="235" rx="14" fill="#172C45" stroke="#79D8FA" stroke-width="2.4"/><rect x="311" y="153" width="7" height="235" rx="3" fill="#79D8FA"/><text x="330" y="195" font-size="21" font-weight="700" fill="#F9FBFF">02  Calibrate</text><text x="330" y="240" font-size="16.3" fill="#DAE9F3">Known owned AP,GPS fix and storage</text><text x="330" y="274" font-size="16.3" fill="#DAE9F3">#B5ADFF</text><path d="M564 267H584" stroke="#78D9FB" stroke-width="3" fill="none" marker-end="url(#end-arrow)"/><rect x="595" y="153" width="252" height="235" rx="14" fill="#172C45" stroke="#79D8FA" stroke-width="2.4"/><rect x="595" y="153" width="7" height="235" rx="3" fill="#79D8FA"/><text x="614" y="195" font-size="21" font-weight="700" fill="#F9FBFF">03  Observe</text><text x="614" y="240" font-size="16.3" fill="#DAE9F3">Passenger operates UI,Log source and gaps</text><text x="614" y="274" font-size="16.3" fill="#DAE9F3">#70DEB7</text><path d="M848 267H868" stroke="#78D9FB" stroke-width="3" fill="none" marker-end="url(#end-arrow)"/><rect x="879" y="153" width="252" height="235" rx="14" fill="#172C45" stroke="#79D8FA" stroke-width="2.4"/><rect x="879" y="153" width="7" height="235" rx="3" fill="#79D8FA"/><text x="898" y="195" font-size="21" font-weight="700" fill="#F9FBFF">04  Preserve</text><text x="898" y="240" font-size="16.3" fill="#DAE9F3">Explicit STOP &amp; flush,Hash original export</text><text x="898" y="274" font-size="16.3" fill="#DAE9F3">#F0CB81</text><path d="M1132 267H1152" stroke="#78D9FB" stroke-width="3" fill="none" marker-end="url(#end-arrow)"/><rect x="1163" y="153" width="252" height="235" rx="14" fill="#172C45" stroke="#79D8FA" stroke-width="2.4"/><rect x="1163" y="153" width="7" height="235" rx="3" fill="#79D8FA"/><text x="1182" y="195" font-size="21" font-weight="700" fill="#F9FBFF">05  Accept</text><text x="1182" y="240" font-size="16.3" fill="#DAE9F3">A01–A09 per test,Share only if approved</text><text x="1182" y="274" font-size="16.3" fill="#DAE9F3">#78D9FB</text><rect x="37" y="448" width="658" height="132" rx="14" fill="#172C45" stroke="#F6A4A4" stroke-width="2.4"/><rect x="37" y="448" width="7" height="132" rx="3" fill="#F6A4A4"/><text x="56" y="490" font-size="21" font-weight="700" fill="#F9FBFF">STOP &amp; CORRECT</text><text x="56" y="535" font-size="17" fill="#DAE9F3">Unknown transmit behavior, no GPS, resets, or</text><text x="56" y="569" font-size="17" fill="#DAE9F3">unapproved observation require a review</text><rect x="746" y="448" width="658" height="132" rx="14" fill="#172C45" stroke="#F0CB81" stroke-width="2.4"/><rect x="746" y="448" width="7" height="132" rx="3" fill="#F0CB81"/><text x="765" y="490" font-size="21" font-weight="700" fill="#F9FBFF">EVIDENCE RULE</text><text x="765" y="535" font-size="17" fill="#DAE9F3">A skipped or failed test never becomes a pass.</text><text x="765" y="569" font-size="17" fill="#DAE9F3">Do not infer exact AP location from receiver GPS.</text><text x="35" y="690" font-size="15.5" fill="#B5CCDE">Device-specific radio and firmware behavior must be tested on owned/approved equipment.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 780" width="1440" height="780" role="img" aria-labelledby="title desc"><title id="title">Cyberdeck Field Devices: Controller, Radio &amp; Evidence Paths</title><desc id="desc">Four device classes have distinct control planes, RF hardware and export paths. The Cyberdeck is an operator-managed evidence destination, not an automatic universal controller.</desc><defs><marker id="next" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#78D7FC"/></marker></defs><rect width="1440" height="780" rx="20" fill="#0B1728"/><g font-family="Arial,Helvetica,sans-serif"><text x="34" y="54" font-size="31" font-weight="700" fill="#F7FAFF">Cyberdeck Field Devices: Controller, Radio &amp; Evidence Paths</text><text x="34" y="88" font-size="18" fill="#B9D0E3">Validate each accessory, installed firmware, radio band and export route before a field session.</text><path d="M34 111H1406" stroke="#375168" stroke-width="2"/><rect x="35" y="160" width="306" height="254" rx="14" fill="#172B44" stroke="#78D7FC" stroke-width="2.5"/><rect x="35" y="160" width="7" height="254" rx="4" fill="#78D7FC"/><text x="55" y="203" font-size="21" font-weight="700" fill="#F7FAFF">Flipper + Marauder</text><text x="55" y="245" font-size="17" fill="#D8E5F0">Flipper FAP = controller</text><text x="55" y="280" font-size="17" fill="#D8E5F0">Separate ESP32 = Wi-Fi radio</text><text x="55" y="315" font-size="17" fill="#D8E5F0">UART/accessory compatibility</text><rect x="389" y="160" width="306" height="254" rx="14" fill="#172B44" stroke="#B9B2FF" stroke-width="2.5"/><rect x="389" y="160" width="7" height="254" rx="4" fill="#B9B2FF"/><text x="409" y="203" font-size="21" font-weight="700" fill="#F7FAFF">Standalone ESP32</text><text x="409" y="245" font-size="17" fill="#D8E5F0">Firmware runs on the board</text><text x="409" y="280" font-size="17" fill="#D8E5F0">Own display / serial interface</text><text x="409" y="315" font-size="17" fill="#D8E5F0">Board-specific SD or export</text><rect x="743" y="160" width="306" height="254" rx="14" fill="#172B44" stroke="#70DEB4" stroke-width="2.5"/><rect x="743" y="160" width="7" height="254" rx="4" fill="#70DEB4"/><text x="763" y="203" font-size="21" font-weight="700" fill="#F7FAFF">M5StickC Plus2</text><text x="763" y="245" font-size="17" fill="#D8E5F0">Built-in 2.4 GHz Wi-Fi/BLE</text><text x="763" y="280" font-size="17" fill="#D8E5F0">Bruce / Marauder / NEMO</text><text x="763" y="315" font-size="17" fill="#D8E5F0">Alternatives, not simultaneous</text><rect x="1097" y="160" width="306" height="254" rx="14" fill="#172B44" stroke="#F0CC80" stroke-width="2.5"/><rect x="1097" y="160" width="7" height="254" rx="4" fill="#F0CC80"/><text x="1117" y="203" font-size="21" font-weight="700" fill="#F7FAFF">Pineapple family</text><text x="1117" y="245" font-size="17" fill="#D8E5F0">Separate appliance &amp; UI</text><text x="1117" y="280" font-size="17" fill="#D8E5F0">Model-specific safe features</text><text x="1117" y="315" font-size="17" fill="#D8E5F0">Manually review own logs</text><path d="M188 414V472" fill="none" stroke="#78D7FC" stroke-width="3" marker-end="url(#next)"/><path d="M542 414V472" fill="none" stroke="#78D7FC" stroke-width="3" marker-end="url(#next)"/><path d="M896 414V472" fill="none" stroke="#78D7FC" stroke-width="3" marker-end="url(#next)"/><path d="M1250 414V472" fill="none" stroke="#78D7FC" stroke-width="3" marker-end="url(#next)"/><rect x="137" y="476" width="1165" height="104" rx="14" fill="#193C48" stroke="#70DEB4" stroke-width="3"/><text x="161" y="516" font-size="23" font-weight="700" fill="#EAFFF4">Local review and controlled export</text><text x="161" y="553" font-size="18" fill="#D7EEF0">Confirm where each file or event lives, then transfer only in-scope, sanitized records.</text><rect x="36" y="625" width="1367" height="95" rx="12" fill="#3A3226" stroke="#F0CC80" stroke-width="2"/><text x="56" y="662" font-size="21" font-weight="700" fill="#FFE7B3">No automatic control is implied</text><text x="56" y="694" font-size="17" fill="#F1DDBD">The private portal is not represented; shared names or connectors do not establish shared storage or interchangeable firmware.</text></g></svg>
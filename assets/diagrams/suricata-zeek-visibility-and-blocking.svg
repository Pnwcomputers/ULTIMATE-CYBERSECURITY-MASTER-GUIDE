<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
<title id="title">Suricata and Zeek observe traffic through different paths</title>
<desc id="desc">A passive tap or mirror sends a traffic copy to the sensor. Suricata produces rule alerts and EVE events, while Zeek produces protocol logs. Capture loss, encryption, rules and analyzers limit what each can see. An inline Suricata path can allow or block traffic and has platform-specific failure behavior.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#286585"/></marker></defs>
<rect width="1200" height="580" fill="#f6f9fc"/>
<g font-family="Arial,sans-serif" fill="#16354b">
<text x="40" y="45" font-size="30" font-weight="700">Separate observation from enforcement</text>
<text x="40" y="75" font-size="17">A conceptual deployment map; sensor coverage and inline behavior must be tested on the selected platform.</text>
<rect x="40" y="115" width="270" height="105" rx="12" fill="#e4f0f5" stroke="#8faebb" stroke-width="2"/>
<text x="60" y="150" font-size="21" font-weight="700">Traffic source</text><text x="60" y="181" font-size="17">Endpoints and network flows</text>
<path d="M310 167H390" stroke="#286585" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="410" y="115" width="290" height="105" rx="12" fill="#e4f0f5" stroke="#8faebb" stroke-width="2"/>
<text x="430" y="150" font-size="21" font-weight="700">Tap / SPAN copy</text><text x="430" y="181" font-size="17">Direction, VLAN and capacity matter</text>
<path d="M700 167H780M780 167V120M780 167V215" fill="none" stroke="#286585" stroke-width="2"/>
<path d="M780 120H815M780 215H815" fill="none" stroke="#286585" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="835" y="90" width="315" height="105" rx="12" fill="#eaf4e6" stroke="#91b48a" stroke-width="2"/>
<text x="855" y="125" font-size="21" font-weight="700">Suricata observer</text><text x="855" y="153" font-size="17">Rules → alerts / EVE events</text><text x="855" y="177" font-size="15">Rule and packet coverage vary</text>
<rect x="835" y="205" width="315" height="105" rx="12" fill="#eaf4e6" stroke="#91b48a" stroke-width="2"/>
<text x="855" y="240" font-size="21" font-weight="700">Zeek observer</text><text x="855" y="268" font-size="17">Protocol analyzers → structured logs</text><text x="855" y="292" font-size="15">Fields depend on visible traffic</text>
<rect x="40" y="360" width="510" height="155" rx="12" fill="#fff3d8" stroke="#c2a66f" stroke-width="2"/>
<text x="62" y="396" font-size="21" font-weight="700">Inline Suricata path</text><text x="62" y="428" font-size="17">Traffic passes through the inspection point.</text><text x="62" y="456" font-size="17">Configured rules may allow, drop or reject.</text><text x="62" y="484" font-size="17">Forwarding, bypass and outage behavior depend on platform.</text>
<rect x="590" y="360" width="560" height="155" rx="12" fill="#e9edf2" stroke="#9aa9b8" stroke-width="2"/>
<text x="612" y="396" font-size="21" font-weight="700">Validate the evidence path</text><text x="612" y="428" font-size="17">Compare authorized test flows with sensor events and loss counters.</text><text x="612" y="456" font-size="17">Check encrypted-flow limits, rule/analyzer versions and log delivery.</text><text x="612" y="484" font-size="17">Stage blocking with tested rollback and failure behavior.</text>
<text x="40" y="550" font-size="16">No alert or log record alone proves complete visibility; an alert-only sensor does not enforce inline policy.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="557" viewBox="0 0 1420 557" role="img" aria-labelledby="title desc"><title id="title">Wireshark: capture visibility and filter boundaries</title><desc id="desc">Shows that interface placement determines what packets can be observed, capture filters act before packet storage, while display filters select views after capture.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#38bdf8"/></marker></defs><rect width="1420" height="557" rx="20" fill="#0b1223"/><g font-family="Arial,Helvetica,sans-serif"><text x="35" y="56" font-size="31" font-weight="700" fill="#f8fafc">Wireshark: capture visibility and filter boundaries</text><text x="35" y="89" font-size="17" fill="#b8cbe0">The diagram distinguishes optional capture filters from non-destructive display filters.</text><rect x="30" y="155" width="251" height="225" rx="15" fill="#172d41" stroke="#38bdf8" stroke-width="2"/><text x="47" y="196" font-size="19" font-weight="700" fill="#f8fafc">1. Select vantage</text><text x="47" y="238" font-size="16" fill="#d1e1f0">Host NIC, router</text><text x="47" y="268" font-size="16" fill="#d1e1f0">or approved TAP/SPAN</text><text x="47" y="298" font-size="16" fill="#d1e1f0">No universal visibility</text><path d="M283 267L307 267" stroke="#38bdf8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="310" y="155" width="251" height="225" rx="15" fill="#172d41" stroke="#e8b44b" stroke-width="2"/><text x="327" y="196" font-size="19" font-weight="700" fill="#f8fafc">2. Optional BPF</text><text x="327" y="238" font-size="16" fill="#d1e1f0">Capture-filter syntax</text><text x="327" y="268" font-size="16" fill="#d1e1f0">Limits retained traffic</text><text x="327" y="298" font-size="16" fill="#d1e1f0">Dropped data unavailable</text><path d="M563 267L587 267" stroke="#38bdf8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="590" y="155" width="251" height="225" rx="15" fill="#172d41" stroke="#38bdf8" stroke-width="2"/><text x="607" y="196" font-size="19" font-weight="700" fill="#f8fafc">3. Capture + save</text><text x="607" y="238" font-size="16" fill="#d1e1f0">Timestamp packets</text><text x="607" y="268" font-size="16" fill="#d1e1f0">Preserve source .pcapng</text><text x="607" y="298" font-size="16" fill="#d1e1f0">Note interface / clock</text><path d="M843 267L867 267" stroke="#38bdf8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="870" y="155" width="251" height="225" rx="15" fill="#172d41" stroke="#38bdf8" stroke-width="2"/><text x="887" y="196" font-size="19" font-weight="700" fill="#f8fafc">4. Display filter</text><text x="887" y="238" font-size="16" fill="#d1e1f0">Wireshark syntax</text><text x="887" y="268" font-size="16" fill="#d1e1f0">Changes visible subset</text><text x="887" y="298" font-size="16" fill="#d1e1f0">Does not edit file</text><path d="M1123 267L1147 267" stroke="#38bdf8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="1150" y="155" width="251" height="225" rx="15" fill="#172d41" stroke="#38bdf8" stroke-width="2"/><text x="1167" y="196" font-size="19" font-weight="700" fill="#f8fafc">5. Triage + report</text><text x="1167" y="238" font-size="16" fill="#d1e1f0">Correlate context</text><text x="1167" y="268" font-size="16" fill="#d1e1f0">Preserve raw evidence</text><text x="1167" y="298" font-size="16" fill="#d1e1f0">Match ≠ confirmed attack</text><rect x="30" y="416" width="1360" height="103" rx="14" fill="#26364c" stroke="#7999ae"/><text x="52" y="450" font-size="20" fill="#f8fafc" font-weight="700">Visibility is established before filtering</text><text x="52" y="477" font-size="17" fill="#d1e1f0">An ordinary switched port or VM does not automatically see every LAN packet. Confirm feed and authorization.</text><text x="52" y="502" font-size="16" fill="#b8cbe0">Prefer unfiltered capture when permitted and practical; redact shared exports without overwriting originals.</text></g></svg>
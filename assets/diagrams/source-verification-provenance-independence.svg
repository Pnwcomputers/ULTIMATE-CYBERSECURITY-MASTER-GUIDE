<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Count underlying origins, not repeated posts</title>
<desc id="desc">Two reposts derived from source A do not establish two independent origins. A separate observation B can provide corroboration only after its provenance and relevance are assessed; agreement alone is not proof of independence.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
<path d="M0 0 L10 5 L0 10Z" fill="#337b98"/>
</marker>
</defs>
<rect width="1200" height="600" fill="#f4f7fa"/>
<text x="40" y="54" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#16354b">Count underlying origins, not repeated posts</text>
<text x="40" y="89" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Fictional provenance relationships • arrows mean derived from • no actual accounts or events</text>
<rect x="40" y="145" width="535" height="290" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/>
<text x="58" y="179" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#16354b">Several posts, one origin</text>
<rect x="70" y="205" width="470" height="92" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/>
<text x="88" y="239" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#16354b">Original item A</text>
<text x="88" y="278" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#16354b">Origin / context still needs checking</text>
<rect x="70" y="335" width="205" height="74" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/>
<text x="88" y="369" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#16354b">Repost A1</text>
<rect x="325" y="335" width="215" height="74" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/>
<text x="343" y="369" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#16354b">Repost A2</text>
<path d="M160 323 L215 307" stroke="#337b98" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M430 323 L375 307" stroke="#337b98" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="625" y="145" width="535" height="290" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/>
<text x="643" y="179" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#16354b">Potential independent support</text>
<rect x="655" y="205" width="470" height="92" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/>
<text x="673" y="239" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#16354b">Observation B</text>
<text x="673" y="278" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#16354b">Check origin, timing, relevance</text>
<rect x="655" y="335" width="470" height="74" rx="16" fill="#fff3d7" stroke="#b5cbd7" stroke-width="2"/>
<text x="673" y="369" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#16354b">Claim under review</text>
<path d="M890 323 L890 309" stroke="#337b98" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="40" y="480" width="1120" height="86" rx="12" fill="#e0ebf1"/>
<text x="58" y="510" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Reposts and syndications can preserve useful context without adding an independent observation.</text>
<text x="58" y="539" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Seek contradictory evidence too; unresolved provenance should remain an explicit limitation.</text>
</svg>

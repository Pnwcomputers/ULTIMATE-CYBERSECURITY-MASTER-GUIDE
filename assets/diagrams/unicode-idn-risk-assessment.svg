<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="530" viewBox="0 0 1240 530" role="img" aria-labelledby="title desc">
  <title id="title">Unicode IDN risk assessment flow</title>
  <desc id="desc">Keep the original Unicode label and derive its canonical ASCII A-label. Assess script restrictions, mixed-script and whole-script confusables, then compare a Unicode skeleton as a risk signal against contextual policy and allowlists. Accept or review; never use a skeleton to route or authorize.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#294862"/></marker><style>
    .title{font:700 27px system-ui,sans-serif;fill:#102a43}.label{font:700 17px system-ui,sans-serif;fill:#102a43}.body{font:15px system-ui,sans-serif;fill:#243b53}.small{font:14px system-ui,sans-serif;fill:#334e68}.box{rx:14;stroke-width:2}.line{stroke:#294862;stroke-width:3.5;fill:none;marker-end:url(#arrow)}
  </style></defs>
  <rect width="1240" height="530" rx="22" fill="#f5f8fb"/>
  <text x="42" y="48" class="title">Assess the name; preserve what the user actually supplied</text>
  <rect x="35" y="115" width="205" height="135" class="box" fill="#e6f0fa" stroke="#7aa7d3"/>
  <text x="137" y="158" text-anchor="middle" class="label">Input hostname</text><text x="137" y="192" text-anchor="middle" class="body">Original Unicode label</text><text x="137" y="220" text-anchor="middle" class="small">Keep for audit</text>
  <rect x="285" y="115" width="205" height="135" class="box" fill="#e6f0fa" stroke="#7aa7d3"/>
  <text x="387" y="158" text-anchor="middle" class="label">IDNA processing</text><text x="387" y="192" text-anchor="middle" class="body">Canonical ASCII</text><text x="387" y="220" text-anchor="middle" class="small">A-label / Punycode</text>
  <rect x="535" y="115" width="205" height="135" class="box" fill="#fff3cd" stroke="#d6a638"/>
  <text x="637" y="158" text-anchor="middle" class="label">Script policy</text><text x="637" y="192" text-anchor="middle" class="body">Restrictions, mixed-</text><text x="637" y="220" text-anchor="middle" class="small">and whole-script checks</text>
  <rect x="785" y="115" width="205" height="135" class="box" fill="#fff3cd" stroke="#d6a638"/>
  <text x="887" y="158" text-anchor="middle" class="label">Confusable check</text><text x="887" y="192" text-anchor="middle" class="body">UTS #39 skeleton</text><text x="887" y="220" text-anchor="middle" class="small">Risk signal, not verdict</text>
  <rect x="1035" y="115" width="170" height="135" class="box" fill="#e9e5f7" stroke="#9286c2"/>
  <text x="1120" y="158" text-anchor="middle" class="label">Context</text><text x="1120" y="192" text-anchor="middle" class="body">TLD, allowlist,</text><text x="1120" y="220" text-anchor="middle" class="small">app policy</text>
  <path d="M240 182 H278" class="line"/><path d="M490 182 H528" class="line"/><path d="M740 182 H778" class="line"/><path d="M990 182 H1028" class="line"/>
  <path d="M1120 250 V320 H430" class="line"/>
  <rect x="275" y="337" width="310" height="93" class="box" fill="#e7f5ec" stroke="#62a878"/>
  <text x="430" y="374" text-anchor="middle" class="label">Accept under policy</text><text x="430" y="404" text-anchor="middle" class="small">Continue with original/canonical name</text>
  <rect x="655" y="337" width="310" height="93" class="box" fill="#fde8e7" stroke="#d66b63"/>
  <text x="810" y="374" text-anchor="middle" class="label">Flag for human review</text><text x="810" y="404" text-anchor="middle" class="small">Check ownership and evidence</text>
  <text x="620" y="485" text-anchor="middle" class="small">Never route, authenticate or authorize using a confusable skeleton or lossy normalized value.</text>
</svg>
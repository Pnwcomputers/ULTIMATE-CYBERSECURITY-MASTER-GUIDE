<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" role="img" aria-labelledby="title desc"><title id="title">Side-channel evidence analysis flow</title><desc id="desc">A conceptual process separates physical observation, a testable leakage hypothesis, statistical comparison, and independent validation. Measurement noise and alternative explanations are shown as cross-checks.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#365672"/></marker></defs><rect width="1120" height="470" rx="24" fill="#f5f8fc"/><text x="560" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#142b45">Side-Channel Analysis: Observation ≠ Conclusion</text><g font-family="Arial,sans-serif"><rect x="42" y="116" width="230" height="192" rx="15" fill="#e7eff9" stroke="#365672" stroke-width="3"/><text x="157" y="156" text-anchor="middle" font-size="21" font-weight="700" fill="#142b45">1 · Observe</text><text x="65" y="197" font-size="17" fill="#20364e"><tspan x="65" dy="0">Timing, power, EM,</tspan><tspan x="65" dy="28">or another physical</tspan><tspan x="65" dy="28">observable plus metadata</tspan></text><rect x="322" y="116" width="230" height="192" rx="15" fill="#fff3d6" stroke="#9b7015" stroke-width="3"/><text x="437" y="156" text-anchor="middle" font-size="21" font-weight="700" fill="#3f310c">2 · Model</text><text x="345" y="197" font-size="17" fill="#3f310c"><tspan x="345" dy="0">State a leakage</tspan><tspan x="345" dy="28">hypothesis and test</tspan><tspan x="345" dy="28">assumptions explicitly</tspan></text><rect x="602" y="116" width="230" height="192" rx="15" fill="#e5f4f1" stroke="#287769" stroke-width="3"/><text x="717" y="156" text-anchor="middle" font-size="21" font-weight="700" fill="#143b36">3 · Analyze</text><text x="625" y="197" font-size="17" fill="#143b36"><tspan x="625" dy="0">Use suitable statistics;</tspan><tspan x="625" dy="28">account for noise,</tspan><tspan x="625" dy="28">alignment, and bias</tspan></text><rect x="882" y="116" width="196" height="192" rx="15" fill="#eee9f8" stroke="#67508d" stroke-width="3"/><text x="980" y="156" text-anchor="middle" font-size="21" font-weight="700" fill="#30234a">4 · Validate</text><text x="902" y="197" font-size="17" fill="#30234a"><tspan x="902" dy="0">Repeat independently;</tspan><tspan x="902" dy="28">check conclusions and</tspan><tspan x="902" dy="28">defensive controls</tspan></text><path d="M278 212 H312" stroke="#365672" stroke-width="4" marker-end="url(#arr)"/><path d="M558 212 H592" stroke="#365672" stroke-width="4" marker-end="url(#arr)"/><path d="M838 212 H872" stroke="#365672" stroke-width="4" marker-end="url(#arr)"/><rect x="90" y="356" width="940" height="72" rx="14" fill="#fff" stroke="#a4b2c2" stroke-width="2"/><text x="560" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#142b45">A visible pattern or statistical peak is evidence to investigate, not proof of key recovery.</text><text x="560" y="410" text-anchor="middle" font-size="16" fill="#354b63">Record provenance, controls, uncertainty, and repeatability; test the claim against alternatives.</text></g></svg>
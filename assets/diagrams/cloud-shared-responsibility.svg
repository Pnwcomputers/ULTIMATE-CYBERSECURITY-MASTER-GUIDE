<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 690" role="img" aria-labelledby="title desc">
<title id="title">Cloud shared responsibility by service model</title>
<desc id="desc">A conceptual matrix showing typical responsibilities for physical infrastructure, platform, operating systems, application code, network controls, and customer data and identity across IaaS, PaaS, and SaaS. Exact responsibility depends on the product and configuration.</desc>
<rect width="1440" height="690" rx="22" fill="#0b1223"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="42" y="54" fill="#f8fafc" font-size="32" font-weight="700">Cloud shared responsibility</text>
<text x="42" y="86" fill="#b8cbe0" font-size="18">Typical allocation only — validate the exact service and configuration</text>
<rect x="32" y="116" width="1376" height="64" rx="10" fill="#172d41"/>
<text x="54" y="156" fill="#d8e5f2" font-size="18" font-weight="700">CONTROL AREA</text>
<text x="640" y="156" fill="#93c5fd" font-size="20" font-weight="700" text-anchor="middle">IaaS</text>
<text x="930" y="156" fill="#93c5fd" font-size="20" font-weight="700" text-anchor="middle">PaaS</text>
<text x="1220" y="156" fill="#93c5fd" font-size="20" font-weight="700" text-anchor="middle">SaaS</text><rect x="32" y="188" width="1376" height="56" rx="8" fill="#15263a" stroke="#31445c"/>
<text x="54" y="223" fill="#e2e8f0" font-size="17">Physical datacenter, hosts, network</text><text x="640" y="223" fill="#86efac" font-size="17" text-anchor="middle">Provider</text><text x="930" y="223" fill="#86efac" font-size="17" text-anchor="middle">Provider</text><text x="1220" y="223" fill="#86efac" font-size="17" text-anchor="middle">Provider</text><rect x="32" y="250" width="1376" height="56" rx="8" fill="#111d30" stroke="#31445c"/>
<text x="54" y="285" fill="#e2e8f0" font-size="17">Underlying cloud service platform</text><text x="640" y="285" fill="#86efac" font-size="17" text-anchor="middle">Provider</text><text x="930" y="285" fill="#86efac" font-size="17" text-anchor="middle">Provider</text><text x="1220" y="285" fill="#86efac" font-size="17" text-anchor="middle">Provider</text><rect x="32" y="312" width="1376" height="56" rx="8" fill="#15263a" stroke="#31445c"/>
<text x="54" y="347" fill="#e2e8f0" font-size="17">Guest OS and patching</text><text x="640" y="347" fill="#fcd34d" font-size="17" text-anchor="middle">Customer</text><text x="930" y="347" fill="#86efac" font-size="17" text-anchor="middle">Provider</text><text x="1220" y="347" fill="#86efac" font-size="17" text-anchor="middle">Provider</text><rect x="32" y="374" width="1376" height="56" rx="8" fill="#111d30" stroke="#31445c"/>
<text x="54" y="409" fill="#e2e8f0" font-size="17">Application code / deployment</text><text x="640" y="409" fill="#fcd34d" font-size="17" text-anchor="middle">Customer</text><text x="930" y="409" fill="#c4b5fd" font-size="17" text-anchor="middle">Customer / shared</text><text x="1220" y="409" fill="#c4b5fd" font-size="17" text-anchor="middle">Provider / shared</text><rect x="32" y="436" width="1376" height="56" rx="8" fill="#15263a" stroke="#31445c"/>
<text x="54" y="471" fill="#e2e8f0" font-size="17">Virtual network and firewall rules</text><text x="640" y="471" fill="#fcd34d" font-size="17" text-anchor="middle">Customer</text><text x="930" y="471" fill="#c4b5fd" font-size="17" text-anchor="middle">Service-specific</text><text x="1220" y="471" fill="#c4b5fd" font-size="17" text-anchor="middle">Provider controls</text><rect x="32" y="498" width="1376" height="56" rx="8" fill="#111d30" stroke="#31445c"/>
<text x="54" y="533" fill="#e2e8f0" font-size="17">Customer data, identities, access policy</text><text x="640" y="533" fill="#fcd34d" font-size="17" text-anchor="middle">Customer</text><text x="930" y="533" fill="#fcd34d" font-size="17" text-anchor="middle">Customer</text><text x="1220" y="533" fill="#fcd34d" font-size="17" text-anchor="middle">Customer</text><rect x="32" y="576" width="1376" height="80" rx="10" fill="#20374b" stroke="#60a5fa"/>
<text x="54" y="609" fill="#93c5fd" font-size="17" font-weight="700">Read this as a starting point</text>
<text x="54" y="636" fill="#e1edf6" font-size="15">Network has layers: provider physical network ≠ customer virtual network and firewall configuration. Product, feature, and contract can shift scope.</text>
</g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 565" role="img" aria-labelledby="title desc"><title id="title">Cloud shared responsibility</title><desc id="desc">Provider and customer obligations vary with service model, feature and contract. Provider: Facilities / hardware: Underlying services: Platform safeguards; Service model: IaaS / PaaS / SaaS: Scope differs: Check contracts; Customer: Identity / access: Data and keys: Tenant configuration; Assurance: Review exposure: Monitor and log: Restore backups. Cloud ownership is not binary: review the exact provider shared-responsibility matrix for each service.</desc><defs><marker id="arr" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#d6edfb"/></marker></defs><rect width="1240" height="565" rx="20" fill="#0b1223"/><g font-family="Arial,Helvetica,sans-serif"><text x="35" y="58" font-size="31" font-weight="700" fill="#f8fafc">Cloud shared responsibility</text><text x="35" y="92" font-size="17" fill="#b8cbe0">Provider and customer obligations vary with service model, feature and contract</text><rect x="35" y="158" width="279" height="258" rx="15" fill="#172d41" stroke="#60a5fa" stroke-opacity=".7" stroke-width="2"/><circle cx="64" cy="191" r="18" fill="#60a5fa"/><text x="64" y="197" font-size="18" font-weight="700" fill="#051320" text-anchor="middle">1</text><text x="51" y="240" font-size="21" font-weight="700" fill="#f8fafc">Provider</text><text x="51" y="280" font-size="18" fill="#d1e1f0">Facilities / hardware</text><text x="51" y="312" font-size="18" fill="#d1e1f0">Underlying services</text><text x="51" y="344" font-size="18" fill="#d1e1f0">Platform safeguards</text><path d="M315 292h13" stroke="#d6edfb" stroke-width="2.5" marker-end="url(#arr)"/><rect x="332" y="158" width="279" height="258" rx="15" fill="#172d41" stroke="#60a5fa" stroke-opacity=".7" stroke-width="2"/><circle cx="361" cy="191" r="18" fill="#60a5fa"/><text x="361" y="197" font-size="18" font-weight="700" fill="#051320" text-anchor="middle">2</text><text x="348" y="240" font-size="21" font-weight="700" fill="#f8fafc">Service model</text><text x="348" y="280" font-size="18" fill="#d1e1f0">IaaS / PaaS / SaaS</text><text x="348" y="312" font-size="18" fill="#d1e1f0">Scope differs</text><text x="348" y="344" font-size="18" fill="#d1e1f0">Check contracts</text><path d="M612 292h13" stroke="#d6edfb" stroke-width="2.5" marker-end="url(#arr)"/><rect x="629" y="158" width="279" height="258" rx="15" fill="#172d41" stroke="#60a5fa" stroke-opacity=".7" stroke-width="2"/><circle cx="658" cy="191" r="18" fill="#60a5fa"/><text x="658" y="197" font-size="18" font-weight="700" fill="#051320" text-anchor="middle">3</text><text x="645" y="240" font-size="21" font-weight="700" fill="#f8fafc">Customer</text><text x="645" y="280" font-size="18" fill="#d1e1f0">Identity / access</text><text x="645" y="312" font-size="18" fill="#d1e1f0">Data and keys</text><text x="645" y="344" font-size="18" fill="#d1e1f0">Tenant configuration</text><path d="M909 292h13" stroke="#d6edfb" stroke-width="2.5" marker-end="url(#arr)"/><rect x="926" y="158" width="279" height="258" rx="15" fill="#172d41" stroke="#60a5fa" stroke-opacity=".7" stroke-width="2"/><circle cx="955" cy="191" r="18" fill="#60a5fa"/><text x="955" y="197" font-size="18" font-weight="700" fill="#051320" text-anchor="middle">4</text><text x="942" y="240" font-size="21" font-weight="700" fill="#f8fafc">Assurance</text><text x="942" y="280" font-size="18" fill="#d1e1f0">Review exposure</text><text x="942" y="312" font-size="18" fill="#d1e1f0">Monitor and log</text><text x="942" y="344" font-size="18" fill="#d1e1f0">Restore backups</text><rect x="35" y="452" width="1170" height="83" rx="12" fill="#20374b" stroke="#60a5fa"/><text x="55" y="485" fill="#60a5fa" font-size="20" font-weight="700">Security boundary / validation</text><text x="55" y="510" fill="#e1edf6" font-size="16">Cloud ownership is not binary: review the exact provider shared-responsibility matrix for each service.</text></g></svg>
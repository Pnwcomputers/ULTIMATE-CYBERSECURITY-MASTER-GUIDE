<text x="58" y="510" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Shared sweep timestamps do not make frequency segments simultaneous.</text>
<text x="58" y="539" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Choose focused IQ when the question depends on short bursts, event timing, or repeated packet structure.</text>

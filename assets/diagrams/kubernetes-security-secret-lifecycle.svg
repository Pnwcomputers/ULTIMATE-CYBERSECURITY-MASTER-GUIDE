<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
<title id="title">Secret protection spans storage, access and use</title>
<desc id="desc">Encryption at rest protects stored API data. API authorization restricts retrieval and workload access. Once a secret is delivered to an authorized workload, the process and node form additional exposure boundaries. Base64 is serialization, not encryption.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
<path d="M0 0 L10 5 L0 10Z" fill="#337b98"/>
</marker>
</defs>
<rect width="1200" height="570" fill="#f4f7fa"/>
<text x="40" y="54" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#16354b">Secret protection spans storage, access and use</text>
<text x="40" y="89" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Conceptual Secret lifecycle • not a verified cluster configuration</text>
<rect x="40" y="166" width="300" height="235" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/>
<text x="58" y="200" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16354b">Stored API data</text>
<text x="58" y="238" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Encryption at rest</text>
<text x="58" y="268" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Key and backup protection</text>
<rect x="450" y="166" width="300" height="235" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/>
<text x="468" y="200" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16354b">API / workload access</text>
<text x="468" y="238" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">RBAC and Pod permissions</text>
<text x="468" y="268" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Delivery configuration</text>
<rect x="860" y="166" width="300" height="235" rx="16" fill="#fff3d7" stroke="#b5cbd7" stroke-width="2"/>
<text x="878" y="200" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16354b">Running workload</text>
<text x="878" y="238" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Process and node access</text>
<text x="878" y="268" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Rotation and audit</text>
<path d="M352 282 L438 282" stroke="#337b98" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
<path d="M762 282 L848 282" stroke="#337b98" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
<rect x="40" y="451" width="1120" height="86" rx="12" fill="#e0ebf1"/>
<text x="58" y="481" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Protecting etcd does not prevent an authorized API reader or compromised workload from seeing a secret.</text>
<text x="58" y="510" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">External secret integration still needs access controls and a review of where values are materialized.</text>
</svg>
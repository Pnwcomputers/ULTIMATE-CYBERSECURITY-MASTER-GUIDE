<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" role="img" aria-labelledby="title desc"><title id="title">Agent Reliability: Resolve Ambiguous Writes Before Retry</title><desc id="desc">An uncertain write outcome is not a failed write. Reconcile the target state using a stable key before retrying or creating compensating work.</desc><defs><marker id="next" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#86d6f5"/></marker></defs><rect width="1440" height="780" rx="19" fill="#0d1929"/><g font-family="Arial,Helvetica,sans-serif"><text x="37" y="58" font-size="29" font-weight="700" fill="#f8fbff">Agent Reliability: Resolve Ambiguous Writes Before Retry</text><text x="37" y="92" font-size="17.5" fill="#c0d5e6">Operational state belongs in a durable store outside the model's transient conversation.</text><path d="M37 115H1403" stroke="#38506a" stroke-width="2"/><rect x="37" y="155" width="403" height="153" rx="14" fill="#1b3049" stroke="#8ad7f7" stroke-width="2.3"/><rect x="37" y="155" width="7" height="153" rx="3" fill="#8ad7f7"/><text x="54" y="194" font-size="20" font-weight="700" fill="#fafcff">Pending → authorized</text><text x="54" y="235" font-size="17.5" fill="#dbe8f3">Scope, credentials, approval</text><text x="54" y="268" font-size="17.5" fill="#dbe8f3">Stable operation/idempotency key</text><rect x="517" y="155" width="402" height="153" rx="14" fill="#1b3049" stroke="#b6adfb" stroke-width="2.3"/><rect x="517" y="155" width="7" height="153" rx="3" fill="#b6adfb"/><text x="534" y="194" font-size="20" font-weight="700" fill="#fafcff">Execute one step</text><text x="534" y="235" font-size="17.5" fill="#dbe8f3">Bounded request / deadline</text><text x="534" y="268" font-size="17.5" fill="#dbe8f3">Record request and timestamp</text><rect x="1000" y="155" width="402" height="153" rx="14" fill="#1b3049" stroke="#f1cc85" stroke-width="2.3"/><rect x="1000" y="155" width="7" height="153" rx="3" fill="#f1cc85"/><text x="1017" y="194" font-size="20" font-weight="700" fill="#fafcff">Inspect response</text><text x="1017" y="235" font-size="17.5" fill="#dbe8f3">Verified / failed / uncertain</text><text x="1017" y="268" font-size="17.5" fill="#dbe8f3">Never infer success from prose</text><path d="M440 232H508" stroke="#8bd8f6" stroke-width="3" fill="none" marker-end="url(#next)"/><path d="M919 232H991" stroke="#8bd8f6" stroke-width="3" fill="none" marker-end="url(#next)"/><rect x="38" y="406" width="410" height="166" rx="14" fill="#1b3049" stroke="#70dbb7" stroke-width="2.3"/><rect x="38" y="406" width="7" height="166" rx="3" fill="#70dbb7"/><text x="55" y="445" font-size="20" font-weight="700" fill="#fafcff">Verified outcome</text><text x="55" y="486" font-size="17.5" fill="#dbe8f3">Confirm actual external state</text><text x="55" y="519" font-size="17.5" fill="#dbe8f3">Durable checkpoint / continue</text><rect x="516" y="406" width="411" height="166" rx="14" fill="#1b3049" stroke="#f1cc85" stroke-width="2.3"/><rect x="516" y="406" width="7" height="166" rx="3" fill="#f1cc85"/><text x="533" y="445" font-size="20" font-weight="700" fill="#fafcff">Uncertain side effect</text><text x="533" y="486" font-size="17.5" fill="#dbe8f3">Read external state by key</text><text x="533" y="519" font-size="17.5" fill="#dbe8f3">Do not blindly resend</text><rect x="997" y="406" width="406" height="166" rx="14" fill="#1b3049" stroke="#f6a9a2" stroke-width="2.3"/><rect x="997" y="406" width="7" height="166" rx="3" fill="#f6a9a2"/><text x="1014" y="445" font-size="20" font-weight="700" fill="#fafcff">Failed / blocked</text><text x="1014" y="486" font-size="17.5" fill="#dbe8f3">Retry only safe operations</text><text x="1014" y="519" font-size="17.5" fill="#dbe8f3">Escalate or compensating action</text><path d="M1200 308V353H245V398" stroke="#8bd8f6" stroke-width="3" fill="none" marker-end="url(#next)"/><path d="M1200 308V353H722V398" stroke="#8bd8f6" stroke-width="3" fill="none" marker-end="url(#next)"/><path d="M1200 308V398" stroke="#8bd8f6" stroke-width="3" fill="none" marker-end="url(#next)"/><rect x="38" y="638" width="1364" height="83" rx="12" fill="#393227" stroke="#f1cf86" stroke-width="2"/><text x="58" y="670" font-size="20" font-weight="700" fill="#fff1c5">Exactly-once requires more than a retry loop</text><text x="58" y="701" font-size="17" fill="#f1e1c7">Idempotency protections, durable status, target receipts and re-read checks need explicit design.</text></g></svg>
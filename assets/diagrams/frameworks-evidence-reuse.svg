<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc"><title id="title">Reuse evidence without assuming equivalence</title><desc id="desc">A scoped control can produce reusable evidence. Each framework separately checks coverage, time period, criteria and assessment method.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#286585"/></marker></defs><rect width="1200" height="440" fill="#f6f9fc"/><g font-family="Arial, sans-serif" fill="#16354b"><text x="40" y="48" font-size="30" font-weight="700">Reuse evidence without assuming equivalence</text><rect x="40" y="85" width="350" height="120" rx="12" fill="#e4f0f5" stroke="#8faebb"/><text x="56" y="114" font-size="21" font-weight="700">Define the control</text><text x="56" y="143" font-size="18">Scope, owner and objective</text><text x="56" y="166" font-size="18">Specify applicable versions</text><path d="M393 145h27" stroke="#286585" stroke-width="2" marker-end="url(#arrow)"/><rect x="425" y="85" width="350" height="120" rx="12" fill="#e4f0f5" stroke="#8faebb"/><text x="441" y="114" font-size="21" font-weight="700">Implement and test</text><text x="441" y="143" font-size="18">Capture configuration and logs</text><text x="441" y="166" font-size="18">Record test results and gaps</text><path d="M778 145h27" stroke="#286585" stroke-width="2" marker-end="url(#arrow)"/><rect x="810" y="85" width="350" height="120" rx="12" fill="#e4f0f5" stroke="#8faebb"/><text x="826" y="114" font-size="21" font-weight="700">Maintain evidence</text><text x="826" y="143" font-size="18">System, date and test method</text><text x="826" y="166" font-size="18">Protect access and retention</text><rect x="40" y="230" width="350" height="120" rx="12" fill="#fff3d8" stroke="#8faebb"/><text x="56" y="259" font-size="21" font-weight="700">CSF outcomes</text><text x="56" y="288" font-size="18">Map to risk priorities</text><text x="56" y="311" font-size="18">No NIST CSF certification</text><rect x="425" y="230" width="350" height="120" rx="12" fill="#fff3d8" stroke="#8faebb"/><text x="441" y="259" font-size="21" font-weight="700">ISO / SOC / PCI</text><text x="441" y="288" font-size="18">Different assessment methods</text><text x="441" y="311" font-size="18">Check scope and review period</text><rect x="810" y="230" width="350" height="120" rx="12" fill="#fff3d8" stroke="#8faebb"/><text x="826" y="259" font-size="21" font-weight="700">Assessment decision</text><text x="826" y="288" font-size="18">Resolve coverage differences</text><text x="826" y="311" font-size="18">Mapping alone is insufficient</text><text x="40" y="420" font-size="17">Conceptual evidence workflow; no control mapping automatically establishes compliance.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="940" height="346" viewBox="0 0 940 346" role="img" aria-labelledby="title desc">
<title id="title">ALPR privacy review</title><desc id="desc">Follow the evidence from collection through use and retention.</desc>
<rect width="940" height="346" rx="18" fill="#101e2f"/>
<text x="32" y="48" font-family="sans-serif" font-size="25" font-weight="bold" fill="#eef6ff">ALPR privacy review</text>
<rect x="30" y="74" width="880" height="64" rx="9" fill="#1d3347"/>
<text x="48" y="112" font-family="sans-serif" font-size="18" font-weight="bold" fill="#87e3d5">Collection</text>
<text x="311" y="112" font-family="sans-serif" font-size="16" fill="#eef6ff">Confirm the operator, system model, purpose and data fields</text>
<rect x="30" y="156" width="880" height="64" rx="9" fill="#243c50"/>
<text x="48" y="194" font-family="sans-serif" font-size="18" font-weight="bold" fill="#87e3d5">Access and sharing</text>
<text x="311" y="194" font-family="sans-serif" font-size="16" fill="#eef6ff">Review roles, sharing agreements, audit logs and account controls</text>
<rect x="30" y="238" width="880" height="64" rx="9" fill="#1d3347"/>
<text x="48" y="276" font-family="sans-serif" font-size="18" font-weight="bold" fill="#87e3d5">Retention and review</text>
<text x="311" y="276" font-family="sans-serif" font-size="16" fill="#eef6ff">Compare local policy and contract, then verify deletion and exceptions</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 565" role="img" aria-labelledby="title desc"><title id="title">Digital forensic evidence lifecycle</title><desc id="desc">From authorized acquisition to analysis and accountable preservation. Authorize: Define scope: Log consent / hold: Prepare clean kit; Acquire: Preserve context: Collect volatile first?: Image as appropriate; Verify: Cryptographic hashes: Clock and tool notes: Check completeness; Analyze: Work on copies: Correlate timeline: Record uncertainty; Preserve: Restricted archive: Chain of custody: Retention policy. Acquisition order depends on volatility and risk. Use write blocking where appropriate and preserve originals.</desc><defs><marker id="arr" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#d6edfb"/></marker></defs><rect width="1240" height="565" rx="20" fill="#0b1223"/><g font-family="Arial,Helvetica,sans-serif"><text x="35" y="58" font-size="31" font-weight="700" fill="#f8fafc">Digital forensic evidence lifecycle</text><text x="35" y="92" font-size="17" fill="#b8cbe0">From authorized acquisition to analysis and accountable preservation</text><rect x="35" y="158" width="219.6" height="258" rx="15" fill="#172d41" stroke="#fbbf24" stroke-opacity=".7" stroke-width="2"/><circle cx="64" cy="191" r="18" fill="#fbbf24"/><text x="64" y="197" font-size="18" font-weight="700" fill="#051320" text-anchor="middle">1</text><text x="51" y="240" font-size="18" font-weight="700" fill="#f8fafc">Authorize</text><text x="51" y="280" font-size="15" fill="#d1e1f0">Define scope</text><text x="51" y="312" font-size="15" fill="#d1e1f0">Log consent / hold</text><text x="51" y="344" font-size="15" fill="#d1e1f0">Prepare clean kit</text><path d="M255.6 292h13" stroke="#d6edfb" stroke-width="2.5" marker-end="url(#arr)"/><rect x="272.6" y="158" width="219.6" height="258" rx="15" fill="#172d41" stroke="#fbbf24" stroke-opacity=".7" stroke-width="2"/><circle cx="301.6" cy="191" r="18" fill="#fbbf24"/><text x="301.6" y="197" font-size="18" font-weight="700" fill="#051320" text-anchor="middle">2</text><text x="288.6" y="240" font-size="18" font-weight="700" fill="#f8fafc">Acquire</text><text x="288.6" y="280" font-size="15" fill="#d1e1f0">Preserve context</text><text x="288.6" y="312" font-size="15" fill="#d1e1f0">Collect volatile first?</text><text x="288.6" y="344" font-size="15" fill="#d1e1f0">Image as appropriate</text><path d="M493.20000000000005 292h13" stroke="#d6edfb" stroke-width="2.5" marker-end="url(#arr)"/><rect x="510.2" y="158" width="219.6" height="258" rx="15" fill="#172d41" stroke="#fbbf24" stroke-opacity=".7" stroke-width="2"/><circle cx="539.2" cy="191" r="18" fill="#fbbf24"/><text x="539.2" y="197" font-size="18" font-weight="700" fill="#051320" text-anchor="middle">3</text><text x="526.2" y="240" font-size="18" font-weight="700" fill="#f8fafc">Verify</text><text x="526.2" y="280" font-size="15" fill="#d1e1f0">Cryptographic hashes</text><text x="526.2" y="312" font-size="15" fill="#d1e1f0">Clock and tool notes</text><text x="526.2" y="344" font-size="15" fill="#d1e1f0">Check completeness</text><path d="M730.8 292h13" stroke="#d6edfb" stroke-width="2.5" marker-end="url(#arr)"/><rect x="747.8" y="158" width="219.6" height="258" rx="15" fill="#172d41" stroke="#fbbf24" stroke-opacity=".7" stroke-width="2"/><circle cx="776.8" cy="191" r="18" fill="#fbbf24"/><text x="776.8" y="197" font-size="18" font-weight="700" fill="#051320" text-anchor="middle">4</text><text x="763.8" y="240" font-size="18" font-weight="700" fill="#f8fafc">Analyze</text><text x="763.8" y="280" font-size="15" fill="#d1e1f0">Work on copies</text><text x="763.8" y="312" font-size="15" fill="#d1e1f0">Correlate timeline</text><text x="763.8" y="344" font-size="15" fill="#d1e1f0">Record uncertainty</text><path d="M968.4 292h13" stroke="#d6edfb" stroke-width="2.5" marker-end="url(#arr)"/><rect x="985.4" y="158" width="219.6" height="258" rx="15" fill="#172d41" stroke="#fbbf24" stroke-opacity=".7" stroke-width="2"/><circle cx="1014.4" cy="191" r="18" fill="#fbbf24"/><text x="1014.4" y="197" font-size="18" font-weight="700" fill="#051320" text-anchor="middle">5</text><text x="1001.4" y="240" font-size="18" font-weight="700" fill="#f8fafc">Preserve</text><text x="1001.4" y="280" font-size="15" fill="#d1e1f0">Restricted archive</text><text x="1001.4" y="312" font-size="15" fill="#d1e1f0">Chain of custody</text><text x="1001.4" y="344" font-size="15" fill="#d1e1f0">Retention policy</text><rect x="35" y="452" width="1170" height="83" rx="12" fill="#20374b" stroke="#fbbf24"/><text x="55" y="485" fill="#fbbf24" font-size="20" font-weight="700">Security boundary / validation</text><text x="55" y="510" fill="#e1edf6" font-size="16">Acquisition order depends on volatility and risk. Use write blocking where appropriate and preserve originals.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="740" viewBox="0 0 1440 740" role="img" aria-labelledby="title desc"><title id="title">Pin Tumbler Lock: Why the Shear Line Matters</title><desc id="desc">Two side-by-side schematic sections show a conventional pin tumbler with springs, driver pins and key pins. Locked stacks cross the shear line. With a properly cut key, the driver/key boundaries align with the shear line so the plug can turn.</desc><rect x="0" y="0" width="1440" height="740" rx="18" fill="#0d1a2c"/><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#83d9f7"/></marker></defs><g font-family="Arial,Helvetica,sans-serif"><text x="38" y="55" font-size="29" font-weight="700" fill="#f7faff">Pin Tumbler Lock: Why the Shear Line Matters</text><text x="38" y="90" font-size="18" fill="#bdd4e5">Simplified teaching cutaway, not a specification or picking diagram.</text><path d="M38 116H1402" stroke="#36516a" stroke-width="2"/><rect x="45" y="155" width="645" height="432" rx="16" fill="#172d45" stroke="#efaaa5" stroke-width="3"/><text x="69" y="196" fill="#f7fbff" font-size="23" font-weight="700">Without matching key</text><rect x="87" y="224" width="564" height="325" rx="12" fill="#3a4d62" stroke="#8daac2" stroke-width="2"/><rect x="87" y="414" width="564" height="135" rx="7" fill="#596e85"/><path d="M87 414H651" stroke="#fee0a6" stroke-width="4" stroke-dasharray="11 8"/><text x="87" y="576" font-size="16" fill="#ffe0a5">Shear line: shell / rotating plug</text><rect x="174" y="292" width="46" height="127" fill="#e6b869" stroke="#503c25" stroke-width="2"/><rect x="174" y="419" width="46" height="84" fill="#79c4ec" stroke="#173e55" stroke-width="2"/><path d="M197 243l-11 8 22 8 -22 8 22 8 -22 8 11 8" stroke="#f0d8a0" stroke-width="3" fill="none"/><text x="155" y="527" font-size="14" fill="#eef6ff">Key 1</text><rect x="338" y="292" width="46" height="110" fill="#e6b869" stroke="#503c25" stroke-width="2"/><rect x="338" y="402" width="46" height="101" fill="#79c4ec" stroke="#173e55" stroke-width="2"/><path d="M361 243l-11 8 22 8 -22 8 22 8 -22 8 11 8" stroke="#f0d8a0" stroke-width="3" fill="none"/><text x="319" y="527" font-size="14" fill="#eef6ff">Key 2</text><rect x="502" y="292" width="46" height="129" fill="#e6b869" stroke="#503c25" stroke-width="2"/><rect x="502" y="421" width="46" height="82" fill="#79c4ec" stroke="#173e55" stroke-width="2"/><path d="M525 243l-11 8 22 8 -22 8 22 8 -22 8 11 8" stroke="#f0d8a0" stroke-width="3" fill="none"/><text x="483" y="527" font-size="14" fill="#eef6ff">Key 3</text><text x="93" y="278" font-size="16" fill="#f7ebc7">Springs + driver pins</text><rect x="750" y="155" width="645" height="432" rx="16" fill="#172d45" stroke="#71dfbc" stroke-width="3"/><text x="774" y="196" fill="#f7fbff" font-size="23" font-weight="700">With matching key</text><rect x="792" y="224" width="564" height="325" rx="12" fill="#3a4d62" stroke="#8daac2" stroke-width="2"/><rect x="792" y="414" width="564" height="135" rx="7" fill="#596e85"/><path d="M792 414H1356" stroke="#fee0a6" stroke-width="4" stroke-dasharray="11 8"/><text x="792" y="576" font-size="16" fill="#ffe0a5">Shear line: shell / rotating plug</text><rect x="879" y="292" width="46" height="122" fill="#e6b869" stroke="#503c25" stroke-width="2"/><rect x="879" y="414" width="46" height="89" fill="#79c4ec" stroke="#173e55" stroke-width="2"/><path d="M902 243l-11 8 22 8 -22 8 22 8 -22 8 11 8" stroke="#f0d8a0" stroke-width="3" fill="none"/><text x="860" y="527" font-size="14" fill="#eef6ff">Key 1</text><rect x="1043" y="292" width="46" height="122" fill="#e6b869" stroke="#503c25" stroke-width="2"/><rect x="1043" y="414" width="46" height="89" fill="#79c4ec" stroke="#173e55" stroke-width="2"/><path d="M1066 243l-11 8 22 8 -22 8 22 8 -22 8 11 8" stroke="#f0d8a0" stroke-width="3" fill="none"/><text x="1024" y="527" font-size="14" fill="#eef6ff">Key 2</text><rect x="1207" y="292" width="46" height="122" fill="#e6b869" stroke="#503c25" stroke-width="2"/><rect x="1207" y="414" width="46" height="89" fill="#79c4ec" stroke="#173e55" stroke-width="2"/><path d="M1230 243l-11 8 22 8 -22 8 22 8 -22 8 11 8" stroke="#f0d8a0" stroke-width="3" fill="none"/><text x="1188" y="527" font-size="14" fill="#eef6ff">Key 3</text><text x="798" y="278" font-size="16" fill="#f7ebc7">Springs + driver pins</text><rect x="45" y="619" width="1340" height="73" rx="12" fill="#3a3228" stroke="#efca81" stroke-width="2"/><text x="63" y="650" font-size="19" fill="#ffebc1" font-weight="700">Teaching simplification</text><text x="63" y="677" font-size="17" fill="#f3e4ce">Pin count, tolerances, key profiles, security pins and lock designs vary; a matching key is not itself a security guarantee.</text></g></svg>
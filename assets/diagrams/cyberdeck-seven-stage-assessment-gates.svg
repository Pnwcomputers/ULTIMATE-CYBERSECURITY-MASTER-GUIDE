<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 640" role="img" aria-labelledby="title desc"><title id="title">Cyberdeck: Seven Assessment Gates</title><desc id="desc">Seven operator-controlled assessment stages: intake, external and internal observation, approved resilience, qualified specialist hardware, evidence validation, reporting and closure. These are grouped into four checkpoints.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#6AD5FF"/></marker></defs><rect width="1440" height="640" rx="18" fill="#0D182A"/><g font-family="Arial,Helvetica,sans-serif"><text x="34" y="57" font-size="32" font-weight="700" fill="#FFFFFF">Cyberdeck: Seven Assessment Gates</text><text x="34" y="91" font-size="18" fill="#C4D7E7">Approve the method and evidence requirements before selecting any device or payload.</text><path d="M34 115H1406" stroke="#344B64" stroke-width="2"/><rect x="34" y="162" width="305" height="270" rx="14" fill="#192D47" stroke="#6AD5FF" stroke-width="2.5"/><rect x="34" y="162" width="7" height="270" rx="3" fill="#6AD5FF"/><text x="53" y="205" font-size="21" font-weight="700" fill="#FFFFFF">1  Intake &amp; scope</text><text x="53" y="265" font-size="18" fill="#D5E4F1">Signed rules &amp; asset list</text><text x="53" y="303" font-size="18" fill="#D5E4F1">Allowed method/time</text><text x="53" y="341" font-size="18" fill="#D5E4F1">Stop contacts</text><path d="M342 297H376" fill="none" stroke="#6AD5FF" stroke-width="3" marker-end="url(#arrow)"/><rect x="389" y="162" width="305" height="270" rx="14" fill="#192D47" stroke="#B6ABFF" stroke-width="2.5"/><rect x="389" y="162" width="7" height="270" rx="3" fill="#B6ABFF"/><text x="408" y="205" font-size="21" font-weight="700" fill="#FFFFFF">2  Network vantage</text><text x="408" y="265" font-size="18" fill="#D5E4F1">External vs internal</text><text x="408" y="303" font-size="18" fill="#D5E4F1">Prove source &amp; VLAN</text><text x="408" y="341" font-size="18" fill="#D5E4F1">Respect excluded systems</text><path d="M697 297H731" fill="none" stroke="#6AD5FF" stroke-width="3" marker-end="url(#arrow)"/><rect x="744" y="162" width="305" height="270" rx="14" fill="#192D47" stroke="#70DEB6" stroke-width="2.5"/><rect x="744" y="162" width="7" height="270" rx="3" fill="#70DEB6"/><text x="763" y="205" font-size="21" font-weight="700" fill="#FFFFFF">3  Controlled review</text><text x="763" y="265" font-size="18" fill="#D5E4F1">Resilience: separate OK</text><text x="763" y="303" font-size="18" fill="#D5E4F1">Specialist radio approval</text><text x="763" y="341" font-size="18" fill="#D5E4F1">Record actual telemetry</text><path d="M1052 297H1086" fill="none" stroke="#6AD5FF" stroke-width="3" marker-end="url(#arrow)"/><rect x="1099" y="162" width="305" height="270" rx="14" fill="#192D47" stroke="#F1CD84" stroke-width="2.5"/><rect x="1099" y="162" width="7" height="270" rx="3" fill="#F1CD84"/><text x="1118" y="205" font-size="21" font-weight="700" fill="#FFFFFF">4  Evidence &amp; close</text><text x="1118" y="265" font-size="18" fill="#D5E4F1">Hash originals</text><text x="1118" y="303" font-size="18" fill="#D5E4F1">Verify findings</text><text x="1118" y="341" font-size="18" fill="#D5E4F1">Redact, report, retain</text><rect x="34" y="481" width="1372" height="98" rx="12" fill="#353226" stroke="#F1CD84" stroke-width="2"/><text x="53" y="519" font-size="21" font-weight="700" fill="#FFF1C9">Safety / interpretation boundary</text><text x="53" y="551" font-size="17" fill="#F2E4CA">The seven-stage guide remains manual; no test, capture or detection is implied to have run.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Bind authority to the concrete action</title><desc id="desc">The proposed target and arguments are checked against schema, caller authorization and policy. Changes require renewed checks. Execution is verified independently; a receipt or model refusal is insufficient.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#337b98"/></marker></defs><rect width="1200" height="620" fill="#f4f7fa"/><text x="40" y="54" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#16354b">Bind authority to the concrete action</text><text x="40" y="90" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Conceptual decision flow • the target service also enforces access</text><rect x="40" y="155" width="245" height="210" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/><text x="60" y="193" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#16354b">Propose</text><text x="60" y="235" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Tool + exact target</text><text x="60" y="264" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Material arguments</text><text x="60" y="293" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Caller + tenant</text><rect x="330" y="155" width="255" height="210" rx="16" fill="#e8f3ef" stroke="#b5cbd7" stroke-width="2"/><text x="350" y="193" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#16354b">Check</text><text x="350" y="235" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Schema / resource ACL</text><text x="350" y="264" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Policy + current state</text><text x="350" y="293" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Approval if required</text><rect x="630" y="155" width="250" height="210" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/><text x="650" y="193" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#16354b">Execute</text><text x="650" y="235" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Scoped service identity</text><text x="650" y="264" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Bounded retry policy</text><text x="650" y="293" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Handle uncertain result</text><rect x="925" y="155" width="235" height="210" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/><text x="945" y="193" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#16354b">Verify</text><text x="945" y="235" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Independent readback</text><text x="945" y="264" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Service audit evidence</text><text x="945" y="293" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Sanitized records</text><path d="M293 260 L320 260" stroke="#337b98" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M593 260 L620 260" stroke="#337b98" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M888 260 L915 260" stroke="#337b98" stroke-width="3" marker-end="url(#arrow)" fill="none"/><rect x="40" y="405" width="1120" height="140" rx="16" fill="#fff4dc"/><text x="64" y="445" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#16354b">Reject or pause when a required check fails</text><text x="64" y="483" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#16354b">Changed recipient, payload, resource or tool definition can invalidate an approval.</text><text x="64" y="517" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#16354b">A retry must not silently duplicate an irreversible side effect.</text><text x="40" y="593" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#16354b">Original conceptual diagram • approval is one policy condition, not a substitute for authorization</text></svg>
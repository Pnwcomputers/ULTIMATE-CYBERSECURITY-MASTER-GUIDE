<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" role="img" aria-labelledby="title desc">
  <title id="title">Model routing and fallback</title>
  <desc id="desc">Classify the task and its data, choose an approved route that meets quality and budget, and recheck those constraints before fallback. Stop when no eligible route remains.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#44728a"/>
    </marker>
  </defs>
  <rect width="900" height="410" rx="18" fill="#eef4fa"/>
  <g font-family="system-ui, sans-serif" fill="#17334a">
    <text x="35" y="54" font-size="31" font-weight="700">Model routing and fallback</text>
    <g transform="translate(35 108)">
      <rect width="250" height="232" rx="14" fill="#fff" stroke="#a6becd"/>
      <text x="16" y="39" font-size="20" font-weight="700">Classify the task</text>
      <text x="16" y="78" font-size="17">Identify sensitive data</text>
      <text x="16" y="110" font-size="17">List required tools</text>
      <text x="16" y="142" font-size="17">Set quality and budget</text>
    </g>
    <g transform="translate(325 108)">
      <rect width="250" height="232" rx="14" fill="#fff" stroke="#a6becd"/>
      <text x="16" y="39" font-size="20" font-weight="700">Choose an eligible route</text>
      <text x="16" y="78" font-size="17">Check data destinations</text>
      <text x="16" y="110" font-size="17">Select a tested model</text>
      <text x="16" y="142" font-size="17">Validate the outcome</text>
    </g>
    <g transform="translate(615 108)">
      <rect width="250" height="232" rx="14" fill="#fff" stroke="#a6becd"/>
      <text x="16" y="39" font-size="20" font-weight="700">Handle a failed attempt</text>
      <text x="16" y="78" font-size="17">Recheck approval and</text>
      <text x="16" y="110" font-size="17">remaining retry budget</text>
      <text x="16" y="142" font-size="17">Retry an eligible route</text>
      <text x="16" y="174" font-size="17">or stop and escalate</text>
    </g>
  </g>
  <g fill="none" stroke="#44728a" stroke-width="3" marker-end="url(#arrow)">
    <path d="M288 222H321"/>
    <path d="M578 222H611"/>
  </g>
</svg>

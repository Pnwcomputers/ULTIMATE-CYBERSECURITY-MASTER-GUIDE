<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Changing bytes do not prove rolling-code protection</title>
<desc id="desc">A static message can be replayable if the verifier accepts it again. A rolling-code receiver considers cryptographic validity and state. Different bytes alone can also come from telemetry, timestamps or noise.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
<path d="M0 0 L10 5 L0 10Z" fill="#337b98"/>
</marker>
</defs>
<rect width="1200" height="600" fill="#f4f7fa"/>
<text x="40" y="54" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#16354b">Changing bytes do not prove rolling-code protection</text>
<text x="40" y="89" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Synthetic message labels • conceptual receiver state • not captured credentials</text>
<rect x="40" y="145" width="535" height="292" rx="16" fill="#fff" stroke="#b5cbd7" stroke-width="2"/>
<text x="58" y="179" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16354b">Static-message model</text>
<text x="58" y="217" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Press 1: message A</text>
<text x="58" y="247" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Press 2: message A</text>
<text x="58" y="277" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Acceptance depends on verifier policy</text>
<rect x="625" y="145" width="535" height="292" rx="16" fill="#fff3d7" stroke="#b5cbd7" stroke-width="2"/>
<text x="643" y="179" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#16354b">Stateful rolling-code model</text>
<text x="643" y="217" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Press 1: protected value for state n</text>
<text x="643" y="247" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Press 2: protected value for state n + 1</text>
<text x="643" y="277" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Receiver checks validity and freshness</text>
<text x="60" y="384" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#16354b">Identical ≠ guaranteed acceptance</text>
<text x="645" y="384" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#16354b">Different ≠ proven cryptography</text>
<rect x="40" y="480" width="1120" height="86" rx="12" fill="#e0ebf1"/>
<text x="58" y="510" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Compare complete, aligned frames from several controlled events; keep alternative explanations.</text>
<text x="58" y="539" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#16354b">Only a separately authorized receiver test can establish acceptance under the tested conditions.</text>
</svg>
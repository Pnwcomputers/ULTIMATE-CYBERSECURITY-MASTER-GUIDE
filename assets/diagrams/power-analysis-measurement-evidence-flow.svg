<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 490" role="img" aria-labelledby="title desc"><title id="title">Power-analysis measurement and evidence workflow</title><desc id="desc">A conceptual workflow from authorized objective and baseline, through a target-specific measurement path and controlled trace collection, to documented analysis and independent validation. The note says more traces do not compensate for incorrect setup or analysis.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#365672"/></marker></defs><rect width="1180" height="490" rx="24" fill="#f5f8fc"/><text x="590" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#142b45">Power Analysis: Measurement to Defensible Evidence</text><g font-family="Arial,sans-serif"><rect x="32" y="118" width="205" height="208" rx="15" fill="#e7eff9" stroke="#365672" stroke-width="3"/><text x="134" y="157" text-anchor="middle" font-size="20" font-weight="700" fill="#142b45">1 · Scope</text><text x="54" y="198" font-size="16" fill="#20364e"><tspan x="54" dy="0">Authorized target</tspan><tspan x="54" dy="26">Security property</tspan><tspan x="54" dy="26">Baseline and limits</tspan><tspan x="54" dy="26">Stop conditions</tspan></text><rect x="267" y="118" width="205" height="208" rx="15" fill="#fff3d6" stroke="#9b7015" stroke-width="3"/><text x="369" y="157" text-anchor="middle" font-size="20" font-weight="700" fill="#3f310c">2 · Configure</text><text x="289" y="198" font-size="16" fill="#3f310c"><tspan x="289" dy="0">Shunt / probe path</tspan><tspan x="289" dy="26">Limits and loading</tspan><tspan x="289" dy="26">Trigger and sample</tspan><tspan x="289" dy="26">Record configuration</tspan></text><rect x="502" y="118" width="205" height="208" rx="15" fill="#e5f4f1" stroke="#287769" stroke-width="3"/><text x="604" y="157" text-anchor="middle" font-size="20" font-weight="700" fill="#143b36">3 · Collect</text><text x="524" y="198" font-size="16" fill="#143b36"><tspan x="524" dy="0">Controlled inputs</tspan><tspan x="524" dy="26">Trace + metadata</tspan><tspan x="524" dy="26">Raw copies preserved</tspan><tspan x="524" dy="26">Repeatability checks</tspan></text><rect x="737" y="118" width="205" height="208" rx="15" fill="#eee9f8" stroke="#67508d" stroke-width="3"/><text x="839" y="157" text-anchor="middle" font-size="20" font-weight="700" fill="#30234a">4 · Analyze</text><text x="759" y="198" font-size="16" fill="#30234a"><tspan x="759" dy="0">State the model</tspan><tspan x="759" dy="26">Review preprocessing</tspan><tspan x="759" dy="26">Assess uncertainty</tspan><tspan x="759" dy="26">Avoid fixed trace counts</tspan></text><rect x="972" y="118" width="176" height="208" rx="15" fill="#fbe9e8" stroke="#9b4c49" stroke-width="3"/><text x="1060" y="157" text-anchor="middle" font-size="20" font-weight="700" fill="#4e2220">5 · Validate</text><text x="991" y="198" font-size="16" fill="#4e2220"><tspan x="991" dy="0">Independent check</tspan><tspan x="991" dy="26">Defensive review</tspan><tspan x="991" dy="26">Evidence limits</tspan><tspan x="991" dy="26">Report and protect</tspan></text><path d="M243 220 H257" stroke="#365672" stroke-width="4" marker-end="url(#arrow)"/><path d="M478 220 H492" stroke="#365672" stroke-width="4" marker-end="url(#arrow)"/><path d="M713 220 H727" stroke="#365672" stroke-width="4" marker-end="url(#arrow)"/><path d="M948 220 H962" stroke="#365672" stroke-width="4" marker-end="url(#arrow)"/><rect x="104" y="372" width="972" height="70" rx="14" fill="#fff" stroke="#a4b2c2" stroke-width="2"/><text x="590" y="402" text-anchor="middle" font-size="18" font-weight="700" fill="#142b45">Trace volume cannot compensate for an unsafe measurement path or a flawed analysis.</text><text x="590" y="425" text-anchor="middle" font-size="15" fill="#354b63">Preserve raw evidence and treat positive and negative results within the experiment's limits.</text></g></svg>
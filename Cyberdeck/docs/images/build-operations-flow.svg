<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="350" viewBox="0 0 1080 350" role="img" aria-labelledby="title desc">
<title id="title">Cyberdeck build and operations sequence</title>
<desc id="desc">Five stages: define scope and inventory equipment; map zones and permitted paths; bring up one segment at a time and verify allowed and denied traffic; rehearse evidence handling with synthetic data; begin field attachment only after scope gates pass, then disconnect, verify transfer, and close out.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#506a80"/></marker></defs>
<rect width="1080" height="350" rx="18" fill="#f4f7fb"/>
<text x="34" y="42" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#14324b">Build and verify in gates · conceptual runbook flow</text>
<g font-family="Arial,sans-serif">
<g transform="translate(24 82)"><rect width="186" height="170" rx="15" fill="#fff" stroke="#abc1d2" stroke-width="2"/><circle cx="30" cy="30" r="18" fill="#236c96"/><text x="30" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">1</text><text x="57" y="36" font-size="18" font-weight="700" fill="#17364e">Scope &amp; inventory</text><path d="M32 75h118M32 99h98M32 123h112" stroke="#7692a8" stroke-width="7" stroke-linecap="round"/><text x="93" y="151" text-anchor="middle" font-size="14" fill="#435c70">Record real hardware,</text><text x="93" y="169" text-anchor="middle" font-size="14" fill="#435c70">ports and recovery.</text></g>
<path d="M216 167h28" stroke="#506a80" stroke-width="3" marker-end="url(#arrow)"/>
<g transform="translate(250 82)"><rect width="186" height="170" rx="15" fill="#fff" stroke="#abc1d2" stroke-width="2"/><circle cx="30" cy="30" r="18" fill="#236c96"/><text x="30" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">2</text><text x="57" y="36" font-size="18" font-weight="700" fill="#17364e">Map zones</text><rect x="30" y="70" width="50" height="28" rx="5" fill="#d8e8f2" stroke="#54748b"/><rect x="106" y="70" width="50" height="28" rx="5" fill="#e2eee8" stroke="#54748b"/><rect x="30" y="112" width="50" height="28" rx="5" fill="#f6e9d5" stroke="#54748b"/><path d="M80 84h26M55 98v14M106 126H83" fill="none" stroke="#506a80" stroke-width="2" marker-end="url(#arrow)"/><text x="93" y="160" text-anchor="middle" font-size="14" fill="#435c70">Write explicit allow</text><text x="93" y="178" text-anchor="middle" font-size="14" fill="#435c70">and deny paths.</text></g>
<path d="M442 167h28" stroke="#506a80" stroke-width="3" marker-end="url(#arrow)"/>
<g transform="translate(476 82)"><rect width="186" height="170" rx="15" fill="#fff" stroke="#abc1d2" stroke-width="2"/><circle cx="30" cy="30" r="18" fill="#236c96"/><text x="30" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">3</text><text x="57" y="36" font-size="18" font-weight="700" fill="#17364e">Bench bring-up</text><path d="M47 75l20 20 40-42" fill="none" stroke="#31845c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="93" y="127" text-anchor="middle" font-size="14" fill="#435c70">Test one segment at a</text><text x="93" y="145" text-anchor="middle" font-size="14" fill="#435c70">time, including blocks.</text><rect x="33" y="153" width="120" height="7" rx="4" fill="#e8b155"/></g>
<path d="M668 167h28" stroke="#506a80" stroke-width="3" marker-end="url(#arrow)"/>
<g transform="translate(702 82)"><rect width="186" height="170" rx="15" fill="#fff" stroke="#abc1d2" stroke-width="2"/><circle cx="30" cy="30" r="18" fill="#236c96"/><text x="30" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">4</text><text x="57" y="36" font-size="18" font-weight="700" fill="#17364e">Evidence rehearsal</text><path d="M60 71h68v61H60z" fill="#edf2f6" stroke="#54748b" stroke-width="2"/><path d="M70 85h48M70 97h48M70 109h30" stroke="#8aa0b2" stroke-width="4" stroke-linecap="round"/><circle cx="131" cy="126" r="16" fill="#dcefe3" stroke="#31845c" stroke-width="3"/><path d="M123 126l6 6 11-14" fill="none" stroke="#31845c" stroke-width="3"/><text x="93" y="157" text-anchor="middle" font-size="14" fill="#435c70">Use synthetic data;</text><text x="93" y="175" text-anchor="middle" font-size="14" fill="#435c70">verify protected restore.</text></g>
<path d="M894 167h28" stroke="#506a80" stroke-width="3" marker-end="url(#arrow)"/>
<g transform="translate(928 82)"><rect width="128" height="170" rx="15" fill="#fff" stroke="#abc1d2" stroke-width="2"/><circle cx="30" cy="30" r="18" fill="#236c96"/><text x="30" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">5</text><text x="58" y="36" font-size="18" font-weight="700" fill="#17364e">Field gate</text><path d="M36 78h56" stroke="#55758c" stroke-width="5" stroke-linecap="round"/><path d="M64 65v26" stroke="#55758c" stroke-width="4"/><path d="M42 110h48" stroke="#d18133" stroke-width="4" marker-end="url(#arrow)"/><text x="64" y="142" text-anchor="middle" font-size="14" fill="#435c70">Attach only with</text><text x="64" y="160" text-anchor="middle" font-size="14" fill="#435c70">scope gates met;</text><text x="64" y="178" text-anchor="middle" font-size="14" fill="#435c70">verify &amp; close out.</text></g>
</g>
<rect x="153" y="283" width="774" height="42" rx="12" fill="#fff2de" stroke="#e0a64e" stroke-width="2"/>
<text x="540" y="310" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#754b12">If a required gate fails or is not tested, pause; do not treat it as a pass.</text>
</svg>
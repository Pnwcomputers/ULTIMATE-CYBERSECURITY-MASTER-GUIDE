# Sends an HTTP request. Use only against targets in written assessment scope.
id: exposed-git-head

info:
  name: Exposed Git Repository Metadata
  author: Repository maintainers
  severity: info
  description: Detects a readable Git HEAD file at the web root.
  tags: git,misconfig,exposure

http:
  - method: GET
    path:
      - "{{BaseURL}}/.git/HEAD"
    matchers:
      - type: word
        words:
          - "ref: refs/heads/"
        part: body
